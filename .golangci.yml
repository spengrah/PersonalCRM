# golangci-lint configuration for Personal CRM
version: "2"

run:
  # 10m (not 5m): the pre-push hook runs lint CONCURRENTLY with the -p 8 GO lane,
  # starving golangci-lint's package-load phase past a 5m budget under load.
  # Standalone lint finishes in ~1-2m; 10m is a real backstop, not a hang mask.
  timeout: 10m

linters:
  enable:
    - forbidigo  # Forbid specific function calls
    - govet      # Go vet
    - errcheck   # Check error handling
    - errorlint  # Forbid err == SentinelErr; require errors.Is/As
  settings:
    errorlint:
      # Comparison-only: enforce errors.Is over `err == ErrFoo`. We intentionally
      # do NOT enable errorf (%w) or asserts here — those would force an unrelated
      # codebase-wide sweep. Scope is exactly the "compare errors with ==" gotcha.
      errorf: false
      asserts: false
      comparison: true
    forbidigo:
      forbid:
        - pattern: 'time\.Now'
          msg: 'use accelerated.GetCurrentTime() instead of time.Now() for time acceleration support'
      # Legitimate exceptions use inline //nolint:forbidigo comments:
      # - backend/internal/accelerated/time.go (wrapper implementation)
      # - backend/internal/api/middleware.go (latency measurement)
      # - backend/internal/synthetic/replay/replay.go (Stopwatch: seed/settle
      #   duration measurement — infrastructure timing, not domain time)
