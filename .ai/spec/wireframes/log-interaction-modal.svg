<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Log Interaction modal wireframe</title>
  <desc id="desc">Desktop and mobile wireframes for a Log Interaction modal with direction segmented control, date input, and footer actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .page { fill: #f5f5f5; stroke: #d4d4d4; stroke-width: 1; }
      .overlay { fill: #111111; opacity: 0.18; }
      .modal { fill: #ffffff; stroke: #525252; stroke-width: 1.25; }
      .panel { fill: #fafafa; stroke: #d4d4d4; stroke-width: 1; }
      .field { fill: #ffffff; stroke: #737373; stroke-width: 1.25; }
      .selected { fill: #d4d4d4; }
      .button { fill: #ffffff; stroke: #737373; stroke-width: 1.2; }
      .primary { fill: #262626; stroke: #262626; stroke-width: 1.2; }
      .rule { stroke: #d4d4d4; stroke-width: 1; }
      .line { stroke: #737373; stroke-width: 1.2; fill: none; }
      .hintLine { stroke: #9ca3af; stroke-width: 1; fill: none; marker-end: url(#arrow); }
      .label { font: 600 18px system-ui, sans-serif; fill: #171717; }
      .title { font: 600 20px system-ui, sans-serif; fill: #171717; }
      .smallTitle { font: 600 16px system-ui, sans-serif; fill: #171717; }
      .text { font: 14px system-ui, sans-serif; fill: #262626; }
      .muted { font: 13px system-ui, sans-serif; fill: #737373; }
      .buttonText { font: 600 14px system-ui, sans-serif; fill: #262626; }
      .primaryText { font: 600 14px system-ui, sans-serif; fill: #ffffff; }
      .annotation { font: italic 13px system-ui, sans-serif; fill: #9ca3af; }
      .sectionLabel { font: 700 14px system-ui, sans-serif; letter-spacing: 0; fill: #525252; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="sectionLabel" x="60" y="54">DESKTOP / TABLET</text>
  <text class="sectionLabel" x="990" y="54">MOBILE</text>

  <!-- Desktop dimmed page context -->
  <rect class="page" x="60" y="82" width="840" height="730" rx="8"/>
  <rect x="100" y="124" width="250" height="20" rx="4" fill="#e5e5e5"/>
  <rect x="100" y="170" width="720" height="88" rx="7" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="126" y="198" width="210" height="14" rx="3" fill="#d4d4d4"/>
  <rect x="126" y="224" width="500" height="12" rx="3" fill="#e5e5e5"/>
  <rect x="100" y="288" width="720" height="92" rx="7" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="126" y="318" width="180" height="14" rx="3" fill="#d4d4d4"/>
  <rect x="126" y="344" width="420" height="12" rx="3" fill="#e5e5e5"/>
  <rect x="60" y="82" width="840" height="730" rx="8" class="overlay"/>

  <!-- Desktop modal -->
  <rect class="modal" x="205" y="166" width="550" height="500" rx="8"/>
  <line class="rule" x1="205" y1="230" x2="755" y2="230"/>
  <line class="rule" x1="205" y1="582" x2="755" y2="582"/>
  <text class="title" x="229" y="204">Log Interaction for Contact A</text>
  <line class="line" x1="720" y1="190" x2="734" y2="204"/>
  <line class="line" x1="734" y1="190" x2="720" y2="204"/>

  <text class="smallTitle" x="229" y="282">Direction</text>
  <rect class="field" x="229" y="300" width="478" height="54" rx="7"/>
  <rect class="selected" x="230" y="301" width="160" height="52" rx="6"/>
  <line class="rule" x1="390" y1="300" x2="390" y2="354"/>
  <line class="rule" x1="549" y1="300" x2="549" y2="354"/>
  <text class="buttonText" x="272" y="333">↔ Mutual</text>
  <text class="buttonText" x="426" y="333">↗ Outbound</text>
  <text class="buttonText" x="585" y="333">↙ Inbound</text>
  <text class="muted" x="229" y="377">All choices visible; Mutual selected by default</text>

  <text class="smallTitle" x="229" y="426">Date</text>
  <rect class="field" x="229" y="444" width="478" height="48" rx="7"/>
  <text class="text" x="247" y="474">Apr 28, 2026</text>
  <text class="muted" x="229" y="515">Date-only input; no notes, topic, or time field</text>

  <text class="muted" x="229" y="552">Error text appears here only on submit failure</text>

  <rect class="button" x="548" y="604" width="80" height="38" rx="7"/>
  <text class="buttonText" x="566" y="628">Cancel</text>
  <rect class="primary" x="640" y="604" width="67" height="38" rx="7"/>
  <text class="primaryText" x="662" y="628">Log</text>

  <!-- Desktop annotations -->
  <path class="hintLine" d="M840 194 C812 194 780 196 736 196"/>
  <text class="annotation" x="855" y="184">Header mirrors AddTaskModal</text>
  <text class="annotation" x="855" y="202">with close icon at right</text>

  <path class="hintLine" d="M836 323 C804 323 752 326 707 327"/>
  <text class="annotation" x="855" y="315">Segmented control, not a dropdown</text>
  <text class="annotation" x="855" y="333">Initial focus lands on selected Mutual</text>

  <path class="hintLine" d="M838 464 C802 464 748 466 707 468"/>
  <text class="annotation" x="855" y="458">Default date is today</text>
  <text class="annotation" x="855" y="476">Date precision only</text>

  <path class="hintLine" d="M838 623 C798 623 744 623 707 623"/>
  <text class="annotation" x="855" y="617">Footer actions are right-aligned</text>
  <text class="annotation" x="855" y="635">Submit uses filled primary style</text>

  <!-- Mobile modal context -->
  <rect class="page" x="985" y="82" width="350" height="730" rx="8"/>
  <rect x="1009" y="118" width="165" height="18" rx="4" fill="#e5e5e5"/>
  <rect x="1009" y="160" width="296" height="78" rx="7" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="1031" y="187" width="180" height="12" rx="3" fill="#d4d4d4"/>
  <rect x="1031" y="211" width="226" height="10" rx="3" fill="#e5e5e5"/>
  <rect x="985" y="82" width="350" height="730" rx="8" class="overlay"/>

  <rect class="modal" x="1012" y="177" width="296" height="446" rx="8"/>
  <line class="rule" x1="1012" y1="232" x2="1308" y2="232"/>
  <line class="rule" x1="1012" y1="552" x2="1308" y2="552"/>
  <text class="smallTitle" x="1030" y="211">Log Interaction</text>
  <line class="line" x1="1271" y1="197" x2="1283" y2="209"/>
  <line class="line" x1="1283" y1="197" x2="1271" y2="209"/>

  <text class="smallTitle" x="1030" y="278">Direction</text>
  <rect class="field" x="1030" y="296" width="260" height="52" rx="7"/>
  <rect class="selected" x="1031" y="297" width="87" height="50" rx="6"/>
  <line class="rule" x1="1118" y1="296" x2="1118" y2="348"/>
  <line class="rule" x1="1205" y1="296" x2="1205" y2="348"/>
  <text class="buttonText" x="1044" y="328">↔ Mutual</text>
  <text class="buttonText" x="1132" y="328">↗ Out</text>
  <text class="buttonText" x="1220" y="328">↙ In</text>
  <text class="muted" x="1030" y="371">Short labels prevent wrap</text>

  <text class="smallTitle" x="1030" y="421">Date</text>
  <rect class="field" x="1030" y="439" width="260" height="48" rx="7"/>
  <text class="text" x="1048" y="469">Apr 28, 2026</text>

  <rect class="button" x="1112" y="575" width="82" height="36" rx="7"/>
  <text class="buttonText" x="1130" y="598">Cancel</text>
  <rect class="primary" x="1205" y="575" width="67" height="36" rx="7"/>
  <text class="primaryText" x="1227" y="598">Log</text>

  <!-- Mobile annotations -->
  <path class="hintLine" d="M986 323 C958 323 942 323 918 323"/>
  <text class="annotation" x="795" y="317">Same hierarchy, stacked</text>
  <text class="annotation" x="795" y="335">for narrow screens</text>
  <path class="hintLine" d="M986 592 C955 592 936 592 918 592"/>
  <text class="annotation" x="774" y="586">Cancel and Log remain</text>
  <text class="annotation" x="774" y="604">right-aligned</text>
</svg>
