type: architecture
summary: Project uses pre-commit hooks for formatting staged files
detail: |
  The repository has pre-commit hooks that automatically format Go files with gofmt when committing. The output shows 'Pre-commit: Formatting staged files...' and 'Go files formatted' messages. Agents should expect this and not be surprised by the additional output during git commits. The hooks run automatically and don't require manual intervention.
