type: gotcha
summary: Serena MCP tools can return results too large for Read tool
detail: |
  When using `mcp__serena__read_file` on large test files, the result may be saved to a temp file that itself exceeds Read tool's token limit (25000 tokens). The workaround is to read directly from the workspace using the standard Read tool on the actual source file path instead of trying to read the MCP tool's output file. This happened when reading `backend/internal/google/calendar_test.go` - the MCP tool saved 72,358 characters to a temp file that was then too large to read.
actionable: true

