summary: Local tests passing doesn't guarantee CI passes - API wrapper parsing can differ
detail: |
  Tests that pass locally can fail in CI if they make assumptions about response structure. In this session, contact_ids_test.go passed locally but failed in CI because the test was parsing responses incorrectly. The api.APIResponse wrapper pattern wasn't being handled properly. Always verify CI passes, don't trust local test runs alone.
