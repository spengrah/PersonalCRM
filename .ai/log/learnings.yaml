  settings.local.json (gitignored) has higher precedence than settings.json (tracked), BUT hooks are special: PreToolUse hooks from ALL scopes (user, project, local) are merged and all execute. This means duplicate hooks in both files would run twice. Best practice: keep team hooks in settings.json, remove from settings.local.json to avoid duplication.
