timestamp: "2026-01-20T05:17:53.006717"
session_id: 47651f8d-6109-489c-bc66-7da35aa6d815
type: gotcha
summary: All API responses are wrapped in api.APIResponse - never unmarshal directly to response types
detail: |
  When writing tests for API endpoints, responses must be unmarshaled in two steps: first into api.APIResponse (which has success and data fields), then extract the actual data from the Data field by type-asserting to map[string]interface{}. Direct unmarshaling into response structs will fail. Example: var apiResp api.APIResponse; json.Unmarshal(body, &apiResp); data := apiResp.Data.(map[string]interface{})
actionable: true

