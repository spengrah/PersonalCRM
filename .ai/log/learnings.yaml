type: rule
summary: E2E tests should navigate directly with params, not rely on list page state
detail: |
  When testing features that depend on URL params (like navigation context), E2E tests should navigate directly to the target URL with params (e.g., page.goto(`/contacts/${id}?sort=name&order=asc`)) rather than visiting the list page and clicking. This makes tests more reliable by avoiding state synchronization issues and ensures the feature being tested (URL param handling) is exercised directly.
