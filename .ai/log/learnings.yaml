type: rule
summary: Use conventional branch names matching commit type
detail: |
  Branch names should follow conventional commit prefixes: feat/, fix/, refactor/, docs/, test/, chore/. The project uses `feat/reduce-calendar-sync-interval` for a feature that will have a `feat:` commit message. This is documented in `.ai/rules/core.md` but worth reinforcing as a pattern to follow automatically.
actionable: true

