session_id: e60e0813-23c0-49ff-8989-3230a4ba3985
type: rule
summary: Extracted helper functions need descriptive JSDoc explaining WHY
detail: |
  When code review requested extracting duplicate UTC date logic to a helper, the helper needed comprehensive documentation explaining the non-obvious reason it exists: formatDateOnly extracts UTC date portion, so tests using toLocaleDateString() fail late at night when UTC has rolled to next day. Good helper docs explain the gotcha/pitfall the abstraction prevents, not just what the code does.
actionable: true

