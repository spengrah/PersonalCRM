type: gotcha
summary: Navigation bar selector must use text content not class names
detail: |
  The ContactNavigationBar component uses standard Tailwind classes without distinctive class names like 'navigation'. E2E tests should locate navigation elements by visible text content (e.g., 'of' pattern for position indicator) or ARIA roles (e.g., getByRole('button', { name: 'Next contact' })), not by CSS class selectors. Searching for [class*='navigation'] will fail.
actionable: true

