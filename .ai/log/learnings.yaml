type: gotcha
summary: ".gitignore order matters: exceptions must come after the ignoring rule"
detail: |
  When trying to allow `.ai/log/.gitkeep` while ignoring `.ai/log/*`, the global `log/` pattern (line 227) was matching `.ai/log/` and preventing the file from being tracked. Adding `!.ai/log/` as an exception AFTER the `log/` rule fixed it. Git processes .gitignore rules sequentially - you can't un-ignore something that was ignored by a later rule.
