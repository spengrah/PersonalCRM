type: gotcha
summary: Vitest config requires explicit invocation with bunx vitest
detail: |
  Running tests with `bun test` doesn't respect the vitest.config.ts settings (like jsdom environment), causing 'document is not defined' errors for React hook tests. Must use `bunx vitest run` instead to properly load the config with jsdom environment. This is a bun-specific quirk where the test runner doesn't automatically pick up vitest configuration.
actionable: true

