type: gotcha
summary: E2E navigation tests must wait for IDs list to load before testing buttons
detail: |
  Contact navigation bar buttons require the full IDs list to be fetched from the server before they can navigate. E2E tests that click navigation buttons immediately after page load will fail because the IDs array is still empty, making navigation impossible. Always use await page.waitForLoadState('networkidle') and wait for buttons to be enabled before clicking in tests.
