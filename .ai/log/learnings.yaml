summary: Custom agents must be manually installed and won't appear in predefined lists
detail: |
  When users install custom agents (like ui-visual-analyzer, ux-interaction-tester), these won't appear in the Task tool's documentation but can still be invoked by specifying their names as the subagent_type parameter. Don't assume an agent doesn't exist just because it's not in the predefined list. When a user says they've installed agents, acknowledge them and use them via Task tool with the exact names provided.
actionable: false

