type: gotcha
summary: sqlc regeneration changes Go types requiring repository layer updates
detail: |
  When running `make sqlc` to regenerate database code, sqlc may change plain Go types (like `bool`) to pgtype wrapper types (like `pgtype.Bool`). This breaks existing repository code that passes plain values. After sqlc regeneration, always check for compilation errors in repository files and update them to use the wrapper types with `.Bool` field and `.Valid = true`. Example: `IsPrimary: pgtype.Bool{Bool: isPrimary, Valid: true}` instead of `IsPrimary: isPrimary`. The pgtype import is typically already present in repository files.
actionable: true

