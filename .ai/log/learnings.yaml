session_id: 47651f8d-6109-489c-bc66-7da35aa6d815
type: gotcha
summary: URL search params must be passed through Link hrefs for context preservation
detail: |
  In Next.js 15, when navigating from a list page to a detail page and wanting to preserve context (sort, filter, search), you must build URLs that include these params as query strings. Create a helper function that builds the URL: `const buildUrl = (id) => { const params = new URLSearchParams(); if (sort) params.set('sort', sort); ...; return `/items/${id}?${params}`; }`. Use this in both Link hrefs AND router.push() calls. The detail page reads these with `useSearchParams()`. Don't rely on client-side state - URL is the source of truth.
actionable: true

