type: gotcha
summary: git check-ignore showing a negation rule means the file is NOT ignored
detail: |
  When debugging `.ai/log/.gitkeep`, `git check-ignore -v` showed `.gitignore:354:!.ai/log/.gitkeep` and the output said 'Still ignored'. This was confusing - the `!` prefix is a negation rule, which means the file is actually ALLOWED (not ignored). The tool shows which rule matched, and negation rules mean 'do not ignore'. Verify by attempting `git add` - if it succeeds, the file isn't ignored despite what the output implies.
actionable: true
