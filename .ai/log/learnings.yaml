timestamp: "2026-01-20T04:22:17.881808"
session_id: 47651f8d-6109-489c-bc66-7da35aa6d815
type: gotcha
summary: Background git push with pre-push hooks can be interrupted causing repeated failures
detail: |
  When running 'git push' with pre-push hooks that run linters/tests, the command can take significant time. Running it in the background (run_in_background: true) makes it susceptible to user interruption (exit code 137), leaving the push incomplete. Each retry attempt restarts the entire hook sequence. Better approach: (1) Run pre-push checks manually first (make lint, make test), (2) Then push without background flag, or (3) Use --no-verify if checks already passed manually (but only with user permission). The hooks in this project run 'make lint' which includes backend and frontend linting.
actionable: true

