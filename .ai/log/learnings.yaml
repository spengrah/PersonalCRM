type: gotcha
summary: Global Enter keydown handlers must check event.target type before preventDefault
detail: |
  Global keyboard handlers that call preventDefault() on Enter key will break native button/link activation if not scoped properly. The handler excluded inputs/textareas but not buttons/links, so pressing Enter on 'Delete' or 'Cancel' buttons triggered edit mode instead of clicking the button. Required check: 'if (target.tagName === BUTTON || target.tagName === A || target.closest(button, a)) return' before preventDefault. Critical for keyboard accessibility.
actionable: true

