type: rule
summary: Always verify backend compilation after adding new sqlc queries
detail: |
  After adding SQL queries and running `make sqlc`, immediately verify backend compilation with `cd backend && go build ./cmd/crm-api`. Pre-existing type errors in the codebase may surface after regeneration due to sqlc version changes or configuration differences. Fix these before proceeding with frontend work to avoid discovering compilation issues later. If lint fails with pre-existing errors, build directly to isolate your changes.
actionable: true

