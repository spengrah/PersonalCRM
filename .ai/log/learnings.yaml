type: gotcha
summary: Serena MCP has think_about_* tools that prompt for reflection
detail: |
  The Serena MCP includes metacognitive tools like `mcp__serena__think_about_collected_information` and `mcp__serena__think_about_task_adherence` that return prompts asking the agent to reflect on whether it has enough information or is staying on task. These don't provide data - they're prompts for the agent to self-assess. The agent correctly used them to verify it had sufficient context before proceeding.
