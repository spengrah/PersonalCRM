type: architecture
summary: Feature development should use parallel exploration agents before implementation
detail: |
  The feature-dev workflow launches 2-3 parallel code-explorer agents to understand different aspects of the codebase (similar features, architecture patterns, UI conventions). Each agent is asked to return a list of 5-10 key files. After agents complete, the implementing agent should read all identified files to build deep understanding before proceeding to implementation. This prevents making changes without understanding existing patterns. The parallel approach is faster than sequential exploration.
