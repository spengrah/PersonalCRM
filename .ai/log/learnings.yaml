summary: Helper functions in integration tests should follow the same API response parsing pattern
detail: |
  When creating helper functions like createContact() in integration tests, they must also parse the wrapped api.APIResponse structure. This pattern should be consistent across all test helpers that make API calls. Don't parse responses directly - always unwrap from api.APIResponse first, even in helper functions.
