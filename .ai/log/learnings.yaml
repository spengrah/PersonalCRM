  When contact list page has no explicit sort parameters in state (initialized as {page: 1, limit: 20}), the detail page defaults to sort=last_contacted&order=desc. This mismatch caused navigation order bugs - arrow keys navigated in different order than displayed list. Fix requires always including explicit sort/order params in URLs even when showing default view, preventing implicit vs explicit default conflicts.
