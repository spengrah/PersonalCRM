timestamp: "2026-01-19T22:28:03.108868"
session_id: e60e0813-23c0-49ff-8989-3230a4ba3985
type: gotcha
summary: E2E tests fail late at night due to UTC/local timezone mismatch
detail: |
  When E2E tests run late at night (e.g., 10pm PST on Jan 19), they fail because the backend stores timestamps in UTC (which is Jan 20), and formatDateOnly extracts the UTC date portion ('2026-01-20'), displaying '1/20/2026' while tests expect the local date '1/19/2026'. Tests must use UTC date components (getUTCMonth(), getUTCDate(), getUTCFullYear()) for comparison, not local date methods (toLocaleDateString()). This is a common gotcha when testing date-related functionality across timezones.
actionable: true

---
timestamp: "2026-01-19T22:28:03.108868"
session_id: e60e0813-23c0-49ff-8989-3230a4ba3985
type: architecture
summary: formatDateOnly extracts UTC date portion, not local date
detail: |
  The frontend's formatDateOnly utility (in lib/utils.ts) is designed to avoid timezone conversion issues by extracting just the date part from ISO strings (e.g., '2026-01-20T06:00:00Z' → '2026-01-20'). This means displayed dates show the UTC date portion, not the local date. This is intentional to avoid off-by-one-day bugs, but it means the UI will show tomorrow's date when local time is late at night and UTC has already rolled over. Tests and code expecting 'today's date' must account for this by using UTC date components.
actionable: true

