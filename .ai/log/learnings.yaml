type: distinction
summary: Simple changes don't need full feature-dev workflow
detail: |
  The feature-dev skill includes phases for exploration, clarification, architecture design, and code review with multiple parallel agents. For a trivial change (updating a constant from 24 hours to 15 minutes), the agent correctly skipped the heavy exploration and architecture phases. The full workflow is overkill when the issue is well-specified and the change is a simple constant update with no architectural implications.
actionable: true

