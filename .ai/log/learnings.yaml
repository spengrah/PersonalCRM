  The matcher field in PreToolUse hooks matches tool NAMES (like 'Bash', 'Edit|Write', 'Notebook.*') using regex syntax, NOT command content. To validate command content, the hook command must parse the JSON input using jq. The pattern 'Bash(git push*--no-verify*)' is completely wrong - the correct approach is matcher: 'Bash' with a validation script that reads tool_input.command from stdin JSON.
