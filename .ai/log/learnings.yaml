timestamp: "2026-01-19T18:08:50.325474"
session_id: 537ed02e-5e98-432c-854e-82bbd6c146a1
type: gotcha
summary: Serena MCP requires gopls in PATH, not just installed in ~/go/bin
detail: |
  When Serena MCP starts via Claude Code, it inherits the environment's PATH. Having gopls installed via `go install` places it in ~/go/bin, but this directory is often not in the PATH that MCP servers inherit. The agent initially tried hardcoding PATH in the MCP config's `env` field, but the correct solution is simpler: ensure ~/go/bin is in the user's shell profile (.zprofile) so all processes inherit it. Avoid hardcoding user-specific paths in source-controlled config files.
actionable: true
suggested_location: .ai/guides/mcp-setup.md

---
timestamp: "2026-01-19T18:08:50.325474"
session_id: 537ed02e-5e98-432c-854e-82bbd6c146a1
type: gotcha
summary: MCP config `env` field replacing PATH causes uvx to be unfindable
detail: |
  When the agent tried to fix the gopls PATH issue by adding an `env` field to .mcp.json with a hardcoded PATH, it replaced the entire PATH environment variable, making `uvx` (the command that starts Serena) unfindable since uvx is in a non-standard location (/Users/spencer/Library/Application Support/enchanted/bin). Setting env.PATH in MCP config is fragile and requires including every directory needed. Better to fix the user's system PATH instead.
actionable: true
suggested_location: .ai/guides/mcp-setup.md

