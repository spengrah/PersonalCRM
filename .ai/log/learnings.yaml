type: distinction
summary: GitHub CLI project access requires different permissions than issue access
detail: |
  The GitHub CLI requires the 'project' scope to access GitHub Projects v2 data via `gh project` commands, but can access issues via `gh issue` commands without this scope. When a user wants to work with GitHub Projects, they need to run `gh auth refresh --hostname github.com -s project` (note: --hostname is required in non-interactive mode). Issues can be accessed as a fallback using `gh issue list` with labels like 'agent-ready' to identify work items.
actionable: false

