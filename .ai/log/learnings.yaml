detail: |
  The agent initially tried to solve PATH issues by hardcoding absolute paths like /Users/spencer/go/bin in .mcp.json. The user correctly rejected this because it makes the config non-portable. When encountering environment-dependent tool dependencies, the correct approach is: 1) Document the requirement (e.g., 'gopls must be in PATH'), 2) Modify the user's environment setup (shell profile), not the project config. Project configs should remain portable across different users and machines.
