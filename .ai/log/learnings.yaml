type: gotcha
summary: Custom agents defined in ~/.claude/agents/ aren't automatically available to Task tool
detail: |
  User created custom agent definitions (ui-visual-analyzer.md, ux-interaction-tester.md) in ~/.claude/agents/ directory with proper YAML frontmatter (name, description, tools, skills, model). However, these agents don't appear in the Task tool's available agents list. The Task tool only recognizes built-in agents like 'Bash', 'general-purpose', 'Explore', 'Plan', etc. Custom agents may require: (1) session restart, (2) a specific plugin to load them, or (3) they're meant to be used differently than via Task tool. The agent definitions reference 'skills' (e.g., agent-browser) which are separate from agents. This is a non-obvious limitation that wastes time when trying to use custom agents.
actionable: false

