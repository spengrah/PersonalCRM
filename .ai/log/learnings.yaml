type: gotcha
summary: git commit --amend during pre-push hooks requires --no-edit flag
detail: |
  When amending a commit after test failures during pre-push, always use --no-edit flag: git commit --amend --no-edit -S. Without it, the editor will open which can't work in automated/agent contexts. The pre-commit hooks (formatting) will still run automatically and don't need manual triggering.
actionable: true

