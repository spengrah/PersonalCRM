type: gotcha
summary: E2E tests fail when clicking contact name Link vs table row
detail: |
  When testing navigation from the contacts list page, clicking on the contact name text (which is a Link) may not preserve URL context params the same way as clicking the table row (which uses handleRowClick with router.push). Both should use buildContactUrl(), but timing/state issues can cause test flakiness. Best practice: In E2E tests, either click directly on the row element or navigate directly to detail pages with params in the URL rather than relying on list page clicks.
actionable: true

