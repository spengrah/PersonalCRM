timestamp: "2026-01-20T08:38:48.085531"
session_id: e60e0813-23c0-49ff-8989-3230a4ba3985
type: gotcha
summary: GitHub PR checks continue in background after agent completes work
detail: |
  After pushing code, the agent watched CI checks with 'gh pr checks --watch' but one check (Claude Code Review) took significantly longer than tests (2m12s vs immediate for unit tests). The agent waited multiple times (60s, 90s, 120s delays) before the review completed. When reviewing PRs, agents should expect code review checks to take 2-3+ minutes and should check once after all tests pass rather than polling repeatedly.
actionable: true

