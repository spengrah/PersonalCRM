summary: Git operations require full absolute paths from project root
detail: |
  When the working directory context is unclear, git commands with relative paths like 'git add frontend/...' fail with 'pathspec did not match'. Always use 'cd /home/dev/workspace/PersonalCRM && git ...' pattern to ensure commands run from the correct directory. This is especially important when switching between different command contexts (frontend, backend, root).
