session_id: 47651f8d-6109-489c-bc66-7da35aa6d815
type: architecture
summary: Frontend keyboard navigation requires IDs-only backend endpoint for performance
detail: |
  For keyboard navigation between items (contacts, etc.), create a lightweight backend endpoint that returns only IDs rather than full objects. Add `ids_only=true` query parameter to existing list endpoints. In the backend: add ID-only SQL queries (e.g., `SELECT id FROM contact`), add repository methods accepting same filter/sort params as full queries, modify handler to return `{ids: [...], total: n}` format when ids_only=true. Frontend uses these IDs with existing detail endpoints. This pattern keeps navigation fast while reusing filter/sort logic.
actionable: true

