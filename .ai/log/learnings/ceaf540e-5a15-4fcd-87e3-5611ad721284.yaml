timestamp: "2026-01-21T15:20:47.960920"
type: architecture
summary: "UX pattern: single-view scrollable modals over multi-step wizards"
detail: |
  The project established a pattern of using single-view scrollable modals (like ImportLinkModal) instead of multi-step wizard modals with next/back buttons. All steps should be visible in one scrollable view rather than hidden behind pagination. This is already documented in Common Gotchas but the merge modal followed this pattern successfully - the session didn't violate this, reinforcing it's a good pattern to maintain.
actionable: false

