timestamp: "2026-01-21T15:20:47.960920"
type: gotcha
summary: Local branch can diverge from remote PR branch
detail: |
  When working on a PR, commits may exist on the remote branch (origin/feat/branch-name) but not in the local branch. This happens when another agent or the user pushes commits directly. Always check `git log origin/branch-name` vs `git log HEAD` to verify sync. Use `git fetch origin branch-name` and check `git log HEAD..origin/branch-name` to see commits that exist on remote but not locally. The user may test against the remote branch while the local is behind, causing confusion about whether a fix 'works'.
actionable: true

---
timestamp: "2026-01-21T15:20:47.960920"
type: gotcha
summary: Two parallel notes systems exist in the codebase
detail: |
  The codebase has BOTH a `note` table (migration 001, with full-text search, categories, embeddings support) AND a `contact.notes` text field (migration 018). The `note` table queries exist but are completely unused - no handlers, no API routes, no frontend integration. The `contact.notes` field is what's actually in use. This creates confusion when implementing features like merge preview that query the wrong table. Always verify which notes system a feature should use by checking what's actually wired up in handlers and frontend.
actionable: true

---
timestamp: "2026-01-21T15:20:47.960920"
type: architecture
summary: Merge preview counts from unused note table
detail: |
  The GetMergePreview service queries the `note` table to count notes, but the actual merge operation combines the `contact.notes` text field. This means the preview shows 'Notes: None' even when contacts have notes in contact.notes. The merge preview should either be removed (since note table is unused) or updated to check the contact.notes field instead. This architectural mismatch between preview and actual merge behavior creates misleading UX.
actionable: true

