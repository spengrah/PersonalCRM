timestamp: "2026-01-21T15:20:47.960920"
type: rule
summary: Always fetch remote branch state before investigating 'still broken' reports
detail: |
  When a user reports a feature is 'still broken' despite a recent fix commit, always check if local is synced with remote before investigating the code. Pattern: 1) `git fetch origin branch-name`, 2) `git log HEAD..origin/branch-name` to see remote-only commits, 3) inform user their local is behind. This prevents wasted effort analyzing code that's already fixed but just needs to be pulled locally.
actionable: true

