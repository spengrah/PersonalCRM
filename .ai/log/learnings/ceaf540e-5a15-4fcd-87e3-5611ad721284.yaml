timestamp: "2026-01-21T15:20:47.960920"
type: documentation_gap
summary: Common Gotchas table missing git divergence scenarios
detail: |
  The Common Gotchas table in core.md doesn't mention the scenario where local and remote branches diverge, leading to confusion when 'the fix was already committed' but isn't present locally. Agents waste time investigating code that's already fixed on remote. Should add: 'Fix exists in PR but not locally | Run `git fetch origin branch && git log HEAD..origin/branch` to see remote-only commits, then pull/merge'
actionable: true

