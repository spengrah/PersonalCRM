timestamp: "2026-04-15T15:21:52.536889"
type: rule
summary: Publish-before-append pattern prevents interaction stranding on event publish failures
detail: |
  When a handler both modifies entity state (e.g., appends contact ID to calendar event's `matched_contact_ids` JSONB array) AND publishes an event derived from that state, publish BEFORE the state mutation in the same transaction. If the mutation happens first and the publish fails (e.g., event table constraint violation), the transaction rolls back, but retrying the handler sees the mutation already committed from a prior attempt and skips the publish, stranding the interaction. This was identified during PR 6 planning for calendar rematch flows. **Pattern:** `tx.Begin() → bus.PublishTx(ctx, tx, event) → mutate state → tx.Commit()`. The publish-first order ensures that if the publish fails, the state mutation also rolls back, preserving idempotency on retry.
actionable: true

