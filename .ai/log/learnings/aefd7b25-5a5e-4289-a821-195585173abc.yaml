timestamp: "2026-04-15T15:21:52.536889"
type: documentation_gap
summary: Test isolation with shared DB requires hard DELETE for upsert-ed tables, not soft-delete
detail: |
  Integration tests running against a shared PostgreSQL instance discovered phantom data corruption when using soft-delete cleanup on tables with UPSERT semantics. Example: `external_contact` rows soft-deleted (`deleted_at = NOW()`) in prior test runs were resurrected by subsequent tests' UPSERT queries (which usually don't clear `deleted_at`), appearing as active rows and polluting candidate pools for matching/filtering. The `.ai/rules/core.md` "Common Gotchas" table warns about soft-delete not cascading FK constraints but does NOT mention the upsert resurrection issue. **How to strengthen:** Add explicit guidance: 'Integration test cleanup: use hard DELETE (or targeted `DeleteExternalContactsBySourceIDPrefix`-style queries) for tables with upsert semantics. Soft-delete leaves `deleted_at` set, which upserts usually ignore, resurrecting phantom rows from prior runs.'
actionable: true

