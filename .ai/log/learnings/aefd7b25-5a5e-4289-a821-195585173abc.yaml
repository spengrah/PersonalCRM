timestamp: "2026-04-15T16:22:36.349301"
type: gotcha
summary: Test cleanup for event-keyed tables must hard-delete, not rely on soft-delete or simple WHERE filters
detail: |
  PR 6 uncovered test-isolation bugs in aggregation + rematch-telegram tests. Event rows with fixed chat IDs accumulated across test runs in the `event` table, causing subsequent publishes to silently no-op due to `(source, source_ref)` uniqueness constraints. Soft-delete (UPDATE deleted_at) or simple cleanup (DELETE WHERE created_at > test_start) failed because event tables use natural keys from external systems. Fix: test cleanup now hard-deletes keyed event rows (`DELETE FROM event WHERE source_ref LIKE 'test-prefix-%'`) to ensure idempotent test execution. Also applies to other upsert-heavy tables like `external_contact` in Telegram integration tests.
actionable: true

