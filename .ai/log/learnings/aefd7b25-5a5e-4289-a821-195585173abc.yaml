timestamp: "2026-04-15T16:22:36.349301"
type: distinction
summary: Test failures in full suite vs isolation indicate DB pollution, not implementation bugs
detail: |
  PR 6 completion: `TestRematch_TelegramRematchPlusPostImportHook_NoDuplicateInteraction` flaked in full `make test` (shared DB, test-ordering pollution) but passed cleanly when run in isolation with correct DATABASE_URL. Session verified on PR 5 branch that same failures existed pre-PR-6, confirming not a regression. Distinction: isolation pass + full-suite flake = DB pollution issue (fix test cleanup or add test-level DB isolation). Isolation fail = real implementation bug. Several cadence/followup filter tests exhibit same pattern. When triaging test failures, always re-run suspect test in isolation before treating as implementation bug.
actionable: true

