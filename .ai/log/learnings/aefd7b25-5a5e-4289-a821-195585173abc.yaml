timestamp: "2026-04-15T16:22:36.349301"
type: gotcha
summary: Telegram dialog discovery on service restart surfaces previously-missed import candidates (expected behavior, not a bug)
detail: |
  Session investigation: post-SIGKILL restart at 12:08:53 triggered Telegram dialog discovery sweep, which upserted 29 new `external_contact` candidates at 17:09:25. User was alarmed (no recent Telegram activity explained them). Root cause: service has 7 group chats with `backfill_complete=false` (stuck due to FLOOD_WAIT pacing). Every restart triggers `maybeStartBackfill` → dialog discovery → `UpdateDiscoveryCandidates`, which scans all `telegram_message` rows and upserts external_contact for any peer with ≥ TELEGRAM_DISCOVERY_MIN_MESSAGES (env override = 1) that lacks a candidate row. These 29 peers had messages ingested during prior partial backfill runs but had never been surfaced as candidates until this sweep. Not a regression; expected incremental discovery behavior. Implication: until stuck chats complete backfill, every restart will surface more candidates (diminishing over time).
