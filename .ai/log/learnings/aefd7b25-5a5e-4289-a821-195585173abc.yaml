type: distinction
summary: E2E test regressions after merges can indicate performance changes, not logic bugs
detail: |
  A test passing on branch A but failing after merging branch B suggests relative timing changes. In this session, PR 5 slowed PUT /contacts/:id enough to flip the order of parallel requests, exposing a latent race in an overly-broad response matcher. The functional behavior was correct (page showed 'Past (1)' meetings), but timing-dependent test code broke. When investigating post-merge E2E failures: (1) check if the test passed on prior CI runs, (2) measure request latencies before/after, (3) look for timing assumptions in waitForResponse matchers or visibility assertions.
actionable: true

