type: gotcha
summary: Playwright waitForResponse with parallel API calls requires exact URL + status matching
detail: |
  When forms save multiple resources in parallel (e.g., Promise.all saving contact + notes), broad URL matchers like .includes('/api/v1/contacts/:id') create ambiguous matches. PUT /contacts/:id/notes returns 204 (no body), PUT /contacts/:id returns 200 JSON. If relative latency shifts, waitForResponse can capture the wrong response, causing .json() to fail on 204 responses. Always match exact pathname (e.g., new URL(res.url()).pathname === '/api/v1/contacts/:id'), method, AND status code when parallel requests share URL prefixes.
actionable: true

