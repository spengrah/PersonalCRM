timestamp: "2026-04-15T16:22:36.349301"
type: rule
summary: Never echo API keys in bash commands or tool descriptions — read inline from .env without output
detail: |
  Session initially passed API key as literal string in ssh command (`-H 'X-API-Key: c2c...'`), exposing it in transcript. Corrected approach for kill #2: `API_KEY=$(sudo grep -oP '^API_KEY=\K.*' /srv/personalcrm/.env)` on the Pi side, then use `$API_KEY` in curl without echoing. The key in the transcript should be rotated. Rule applies to all secrets: database passwords, OAuth tokens, etc. Always read from env/file on the remote side, never pass as CLI args or echo to logs.
actionable: true

