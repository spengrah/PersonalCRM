timestamp: "2026-04-15T15:21:52.536889"
type: rule
summary: Consumer transactions with external side effects need post-commit closures
detail: |
  When a river worker consumer needs to call external APIs (e.g., Todoist HTTP client) as a side effect of processing an event, do NOT hold the `pgx.Tx` open during the HTTP call—this blocks the connection pool and risks deadlocks. Instead, complete all DB writes in the transaction, then use a defer/post-commit closure to call the external API after `tx.Commit()`. This was implemented in PR 6's `InteractionRecorder` for the `FollowUpManager.OnInteractionRecorded(contactID)` call. **Pattern:** `tx.Begin() → write DB → tx.Commit() → if commitErr == nil { externalAPI.Call(...) }`.
actionable: true

