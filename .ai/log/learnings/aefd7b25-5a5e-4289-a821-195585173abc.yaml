timestamp: "2026-04-15T14:38:39.583091"
type: distinction
summary: Stale LSP diagnostics vs actual build errors — verify with `go build`
detail: |
  During PR #279 implementation, the orchestrator detected 'working-tree code changes with compile errors across ~25 test files' from LSP diagnostics. However, `go build ./...` and `go vet ./...` both passed cleanly (exit 0). The diagnostics were stale LSP state from refactored RunMigrations signature, not current errors. **Why this matters:** Agents can get stuck or make wrong decisions based on stale diagnostics that don't reflect actual compiler state. **How to apply:** When diagnostics show compile errors, always verify with `go build ./...` before treating them as real. LSP state can lag behind actual code, especially after signature changes. If build passes, the errors are stale — proceed.
actionable: true

