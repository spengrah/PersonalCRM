type: documentation_gap
summary: Plan specified 'inline worker in package main' but implementer created separate file
detail: |
  The plan for PR #279 explicitly stated 'inline no-op worker in package main' but the implementer initially created `cmd/crm-api/river.go` as a companion file, violating the single-file build convention. This suggests the single-file build pattern isn't clearly documented or emphasized. **What guidance existed:** The plan mentioned 'inline' but didn't explain WHY (CI constraint). **Why it was missed:** The constraint isn't in CLAUDE.md/AGENTS.md, and the phrase 'inline worker in package main' could be interpreted as 'define in package main' rather than 'define in main.go file'. **How to strengthen:** Add to Common Gotchas: 'Adding types to cmd/crm-api/ — CI builds with `go build cmd/crm-api/main.go` (single file). Types must be in main.go itself or ALL build commands changed to `./cmd/crm-api`.' Also add to 'When You Change X, Check Y': 'Adding worker types to cmd/crm-api → inline into main.go or verify ALL build points (Makefile, CI, playwright config) use package form'.
