timestamp: "2026-04-15T15:21:52.536889"
type: architecture
summary: Multi-entity events need per-entity SourceID to prevent silent deduplication data loss
detail: |
  When a single event affects multiple entities (e.g., calendar event with N attendees creating N interactions, one per contact), the event's `source_id` cannot be used directly as the `interaction.source_ref` for all N interactions. Doing so causes the 2nd-Nth interactions to silently deduplicate against the 1st because `(source='gcal', source_ref='event-123')` is unique. This was caught during PR 6 Codex review. **Solution:** Use per-entity `source_ref` like `gcal:event-123:contact-uuid-1`, `gcal:event-123:contact-uuid-2`. The `(source, source_id)` dedup on the `event` table still prevents duplicate event ingestion, but the per-contact `source_ref` on `interaction` allows all N interactions to be created. This pattern applies to any multi-entity event (calendar attendees, group chats, etc.).
actionable: true

