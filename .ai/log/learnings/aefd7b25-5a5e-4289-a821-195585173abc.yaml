timestamp: "2026-04-15T15:21:52.536889"
type: gotcha
summary: River client.Start(ctx) must receive outer context, not timeout-derived context
detail: |
  When starting a River client via `client.Start(ctx)`, the context must be the outer non-timeout-derived context. River silently stops fetching jobs when its internal fetch-loop context is cancelled. Passing a context.WithTimeout-derived context will cause the client to stop processing after the timeout expires, with no error logged. This was discovered during PR 6 integration test debugging when tests were timing out despite the river client appearing to start successfully. **Pattern:** Use the test's root context for `client.Start(ctx)`, not a per-test timeout context.
actionable: true

