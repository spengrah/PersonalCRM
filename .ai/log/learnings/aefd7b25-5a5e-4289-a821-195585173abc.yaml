timestamp: "2026-04-15T16:22:36.349301"
type: documentation_gap
summary: Soak testing guidance should emphasize active fault injection over passive time windows
detail: |
  PR 3 plan specified 72h soak with passive observation metrics. Session reframed this: 72h is a proxy for 'enough events to be confident,' but for crash-recovery validation (River JobRescuer, #208 stuck-syncing bug), active SIGKILL testing provides far stronger signal than waiting for natural failures. Deliberate kill mid-sync + verified recovery (2 kills minimum for independent validation) exercises the rescue path directly. 72h of clean runs proves nothing about rescue correctness. Session demonstrated pragmatic minimum: ~24h wall-clock + 2 deliberate mid-sync restarts + sample-size check (50-100 runs per provider for result parity). Documentation gap: soak evidence checklist should lead with 'deliberate fault injection' as primary validation, time-based observation as secondary (for time-correlated bugs like DST, midnight rollovers). Current plan DD framing was correct but buried the lede.
actionable: true

