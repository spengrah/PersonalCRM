timestamp: "2026-04-15T16:22:36.349301"
type: gotcha
summary: River JobRescuer default 1h delay requires active SIGKILL testing for validation
detail: |
  PR 3 soak testing revealed that River's default `RescueStuckJobsAfter=1h` means orphaned jobs won't be rescued for ~60 minutes. Passive observation (e.g., waiting 72h for natural crashes) provides minimal validation. Deliberate mid-sync SIGKILL testing (trigger sync → poll for running state → kill → verify rescue) is far more effective. The immediate signal to validate is `external_sync_state.status='syncing'` count = 0 (proves the #208 bug class doesn't reproduce). The 1h rescue cycle is secondary validation of the orphan-cleanup path. Session demonstrated: 2 deliberate kills + 66-min wait for rescue provides stronger confidence than 72h passive soak.
