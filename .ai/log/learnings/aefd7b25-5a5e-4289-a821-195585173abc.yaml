timestamp: "2026-04-15T15:21:52.536889"
type: architecture
summary: Shadow-to-cutover transitions can lose data carried only in direct-path function signatures
detail: |
  When migrating from shadow mode (dual write: direct function call + async event publish) to cutover (async-only), data that was passed as function parameters in the direct path must be explicitly added to event payloads, or it will be lost. PR 6 hit a P2 Codex finding: calendar event titles were populated in the direct `RecordInteraction(title, ...)` call but not included in the `calendar.attended` event payload, so after cutover, `interaction.description` became empty for all calendar interactions—a user-visible regression. The shadow mode tests passed because they only verified the interaction row was created, not that it had complete data. **Pattern:** During shadow-mode planning (e.g., PR 5), explicitly map every parameter of the direct-path function to a corresponding event payload field. During cutover review, grep for every field populated in the direct path and verify it's sourced from the event payload in the consumer.
actionable: true

