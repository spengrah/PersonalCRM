timestamp: "2026-04-15T17:02:17.628618"
type: distinction
summary: River supports both compile-time and runtime periodic job registration
detail: |
  River periodic jobs can be registered two ways: (1) compile-time via Config.PeriodicJobs slice passed to NewClient(), or (2) runtime via riverClient.PeriodicJobs().Add() after client construction. Runtime registration enables flexible construction order when periodic jobs depend on services that themselves depend on the river client, avoiding initialization deadlocks. Both registrations must happen before client.Start().
actionable: true

