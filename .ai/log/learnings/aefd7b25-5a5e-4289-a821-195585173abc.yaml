type: rule
summary: Codex delegation pattern for deterministic regressions with known context
detail: |
  When facing a deterministic test failure with clear before/after state (passed on PR 3 CI, fails on current branch), delegate to Codex with full context: test file path, failure mode (response.json error), timing observations (7.6s latency vs 3.6s baseline), and hypotheses. User instructed 'dispatch to codex to investigate and fix' and Codex diagnosed + fixed in one pass by tightening the Playwright matcher. Effective delegation requires: test name, CI run comparison, error symptoms, and performance delta.
actionable: true

