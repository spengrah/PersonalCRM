timestamp: "2026-04-15T15:21:52.536889"
type: gotcha
summary: Integration test harnesses need full event-bus wiring for cutover PRs
detail: |
  When cutover PRs remove direct-path function calls and replace them with async event publishing, integration tests cannot just update function signatures with nil event bus parameters. They need complete event-bus test harnesses: `*events.Bus`, registered consumers (e.g., `InteractionRecorder`), and a running River client with `client.Start()`. Attempting to pass nil for the event bus compiles but silently breaks the tests because the async path is never exercised. PR 6 hit unexpected scope expansion when 28 integration tests across rematch/aggregation/telegram files needed new `setupTestEventBus` harness wiring, causing two implementer crashes. **Pattern:** When planning cutover PRs, audit all integration test files that exercise the paths being cut over and budget time for test harness infrastructure, not just signature updates.
actionable: true

