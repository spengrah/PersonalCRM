summary: For PR updates with 14+ commits and spreading conflicts, prefer merge over rebase
detail: |
  When rebasing a long-running feature branch (14+ commits) onto updated main, if conflicts appear in early commits and spread across multiple files, abort the rebase and use merge instead. Rationale: GitHub squash-merges PRs anyway, so the merge commit won't pollute main's history, and merge requires only one conflict resolution pass versus potentially 14 separate resolution rounds during rebase. Saves significant time on multi-stage conflict resolution.
