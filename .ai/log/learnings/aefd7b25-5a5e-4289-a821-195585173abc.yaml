timestamp: "2026-04-15T15:21:52.536889"
type: distinction
summary: Implementer crashes on large mechanical refactors → orchestrator manual fallback
detail: |
  During PR 6, the implementer crashed twice (stream timeout + API 500) while attempting mechanical signature updates across 28 integration test files. The orchestrator took over and manually applied the signature fixes (adding nil eventBus parameters), then resumed the implementer for the semantic work (test harness wiring). This reveals a threshold: implementers handle ~10-15 similar edits reliably, but 25+ mechanical changes across many files increases crash probability. **When to apply:** If a plan includes >20 similar mechanical edits (signature updates, import additions, nil-checks), consider splitting: implementer does the first 5-10 as examples, orchestrator batches the rest with parallel Edit calls, then implementer resumes for semantic logic. Or brief the implementer explicitly: 'If you crash mid-refactor, the orchestrator will resume you—checkpoint progress by committing logical groups (e.g., all signature updates in one commit) before moving to the next phase.'
actionable: true

