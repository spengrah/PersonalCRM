timestamp: "2026-04-15T14:38:39.583091"
type: gotcha
summary: CI uses `go build cmd/crm-api/main.go` single-file pattern that breaks with companion files
detail: |
  The repo's CI (.github/workflows/ci.yml), Makefile, and other build points use `go build cmd/crm-api/main.go` (single-file form, not `./cmd/crm-api`). This means any types referenced in main.go must be defined in main.go itself — companion files like `river.go` won't be picked up by the build. During PR #279, the implementer created `cmd/crm-api/river.go` with `noopWorker`, causing CI failures with 'undefined: noopWorker'. The fix was inlining the types into main.go. **Why:** This isn't obvious from the code — most Go projects build packages, not single files. **How to apply:** When adding worker types, config helpers, or other types to cmd/crm-api, check if they're referenced in main.go. If yes, inline them into main.go itself, or change ALL build commands to use `./cmd/crm-api`.
actionable: true

---
timestamp: "2026-04-15T14:38:39.583091"
type: gotcha
summary: logger.Info() output from main.go missing from logs/backend-dev.log
detail: |
  `make dev` runs the backend via `nohup ... go run cmd/crm-api/main.go > logs/backend-dev.log 2>&1 &`. The log file captures gin's stdout (`[GIN-debug]`) and global zerolog output (from telegram package), but NOT the `backend/internal/logger` wrapper used in main.go. Lines like 'running database migrations', 'river client started', etc. never reach the file. **Suspected cause:** interaction between zerolog ConsoleWriter (dev mode) and nohup stdout redirection. **Why this matters:** Smoke tests relying on log verification will fail to find expected lines even when the code works correctly. **How to apply:** Don't treat 'logger.Info lines missing from logs/backend-dev.log' as broken code. Verify behaviors via DB state, /health endpoint, or run `go run cmd/crm-api/main.go` in foreground to see terminal output. If the observability gap becomes a pain point, fix at scripts/start-backend.sh or backend/internal/logger/logger.go.
actionable: true

