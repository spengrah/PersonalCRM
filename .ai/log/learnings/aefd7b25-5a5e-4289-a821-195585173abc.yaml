type: architecture
summary: Per-(event, contact) source_ref pattern required for multi-entity events to avoid silent data loss
detail: |
  PR 6 fixed a silent data loss bug: calendar events with N attendees were using shared `source_ref` (e.g., `gcal:event-123`) for all N interaction rows. The `(source, source_ref)` unique constraint on the event table caused rows 2-N to silently dedup against row 1. Fix: use per-entity source_ref like `gcal:event-123:contact-uuid-1`. The `(source, source_id)` dedup on the `event` table (for the calendar event itself) is separate and does NOT prevent this multi-contact issue. Rule: when one external event affects N CRM entities, each entity's derived row must have a unique source_ref that combines event ID + entity ID.
