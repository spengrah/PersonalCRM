timestamp: "2026-04-15T14:38:39.583091"
type: gotcha
summary: river_client table empty on running dev instance (River v0.34.0)
detail: |
  During PR #279 smoke test, a healthy running backend (verified via /health and active PID) showed `SELECT COUNT(*) FROM river_client` = 0. Expected ≥1 row based on typical River behavior. **Possible causes:** River may only populate river_client via heartbeat once jobs are active or leader election fires, or may require running longer than a few-minute smoke window, or may be version-specific behavior (v0.34.0 in backend/go.mod). **Why this matters:** PR 2+ in event-bus-foundation adds consumer services that may rely on river_client/river_leader for leader election. **How to apply:** Don't treat empty river_client as proof of broken wiring. The integration test TestRiverClient_StartStopInsert_Integration proves Start/Stop/Insert/Worker all function end-to-end. Before relying on river_client rows for observability/health checks, confirm table populates under realistic conditions (enqueue a job or run >5min).
actionable: true

