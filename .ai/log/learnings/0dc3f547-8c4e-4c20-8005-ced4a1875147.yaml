timestamp: "2026-04-16T16:35:40.674362"
type: distinction
summary: Mode=off consumers still enqueue jobs but short-circuit in HandleEvent
detail: |
  For event consumers with runtime mode flags (EVENT_BUS_*_MODE=off/shadow/sole), the mode check should happen inside the worker's HandleEvent, NOT at job insertion time. Jobs still enqueue and complete, but HandleEvent returns nil after a DEBUG log when mode=off. This keeps the pipeline exercised and avoids mode-flag-related routing complexity in publishers. Different from PR 5 InteractionRecorder which had mode=off skip both enqueue AND handle. Codex Finding 2 caught this inconsistency.
actionable: true

