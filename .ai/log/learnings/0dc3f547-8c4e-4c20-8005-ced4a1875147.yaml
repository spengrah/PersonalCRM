timestamp: "2026-04-16T16:35:40.674362"
type: rule
summary: Event-based shadow tables need UNIQUE constraint + ON CONFLICT DO NOTHING
detail: |
  Shadow observation tables for event consumers must have UNIQUE(event_id, writer) + ON CONFLICT DO NOTHING to handle River job retries. Without the constraint, consumer retries create duplicate observation rows, breaking divergence queries. Pattern: every shadow table needs retry idempotency at the DB layer, not just application-layer checks. Codex Finding 4 caught the missing UNIQUE constraint in event_shadow_cadence_observation schema.
actionable: true

