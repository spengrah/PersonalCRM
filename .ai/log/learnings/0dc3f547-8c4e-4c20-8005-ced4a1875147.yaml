timestamp: "2026-04-16T16:35:40.674362"
type: gotcha
summary: Codex iterative review catches progressively subtle issues
detail: |
  Complex plans benefit from multiple Codex review rounds with explicit re-review after each fix batch. This session: Round 1 = substantive design issues (tx boundaries, race conditions, schema constraints). Round 2 = inconsistencies introduced by Round 1 fixes (publish ownership clarifications, test naming). Round 3-5 = stale section cleanup (finding sections that weren't updated during earlier fixes). Pattern: after applying Codex findings, always run 'codex exec resume --last' with a summary of fixes applied, don't assume PASS on first attempt.
actionable: true

