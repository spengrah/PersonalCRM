timestamp: "2026-04-16T16:35:40.674362"
type: architecture
summary: Version enforcement split for graceful degradation
detail: |
  HTTP ingestion boundaries should remain version-permissive (accept both V1 and V2 payloads) while individual consumers enforce their version requirements (skip/log V1 if they need V2 fields). This allows external producers to stay on V1 while internal producers upgrade to V2, avoiding a flag-day cutover. Pattern emerged from PR 7 CadenceUpdater requiring V2 (with PrevCadenceSnapshot) while HTTP ingest endpoint continues accepting V1 interaction.recorded events from external daemons.
actionable: true

