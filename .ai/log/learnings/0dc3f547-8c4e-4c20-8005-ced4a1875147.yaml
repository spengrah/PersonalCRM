timestamp: "2026-04-16T16:35:40.674362"
type: architecture
summary: Post-commit closure pattern for shadow-mode observations
detail: |
  Shadow observations must use post-commit closures with their own tx (via pool.Begin), NOT the authoritative tx. Holding the authoritative tx open for shadow work risks stalling the connection pool and extends the critical path. Pattern: (1) commit authoritative tx, (2) run post-commit closure that opens own short-lived tx for shadow observation, (3) failure of shadow write only affects monitoring, not data integrity. Applied in PR 5 (InteractionRecorder) and PR 7 (CadenceUpdater) shadow modes. Codex Finding 1 caught the plan initially using the wrong tx boundary.
actionable: true

---
timestamp: "2026-04-16T16:35:40.674362"
type: architecture
summary: "Async consumer race prevention: embed pre-state in event payload"
detail: |
  When async consumers need 'before' state to compute deltas, embed it in the event payload at publish time (inside the same tx as the mutation). Do NOT query for previous state at consume time - the row may have changed or been deleted between publish and consume. Example: InteractionRecordedPayload V2 added PrevCadenceSnapshot so CadenceUpdater can compute cadence diffs without racing against the contact row. Codex Findings 3 & 5 caught the original plan's race condition where consumer would snapshot post-commit.
actionable: true

---
timestamp: "2026-04-16T16:35:40.674362"
type: gotcha
summary: Plan-code sync discipline for multi-PR epics
detail: |
  Plans must be reconciled against merged code from prior PRs before implementation starts. This session's plan went through 5 Codex rounds, with rounds 2-4 primarily catching stale references to patterns abandoned in earlier PRs: (1) RecordInteractionTx signature changes from PR 6, (2) publish ownership staying in InteractionRecorder vs moving to post-commit, (3) snapshot-based consumer approach replaced by payload-based, (4) helper function renames (UnmarshalPayload→ValidatePayload). Each stale reference would have caused implementation confusion. Pattern: after Codex finding triggers a design change, grep the entire plan for related terms to catch duplicated/inconsistent sections.
actionable: true

