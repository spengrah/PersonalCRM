timestamp: "2026-01-20T05:06:41.761762"
type: gotcha
summary: Backend integration test responses use api.APIResponse wrapper with .Data field
detail: |
  When creating contacts in backend integration tests, the HTTP response is wrapped in an api.APIResponse structure where the actual contact data is in the .Data field (which is map[string]interface{}). To extract the ID, use: `resp.Data.(map[string]interface{})["id"].(string)`. Direct access to `resp["id"]` will panic with 'interface conversion: interface {} is nil, not string'. This is different from the test seed endpoints which may return unwrapped data.
  
actionable: true

