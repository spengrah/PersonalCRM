timestamp: "2026-01-20T04:01:52.031612"
type: gotcha
summary: sqlc regeneration changes Go types requiring repository layer updates
detail: |
  When running `make sqlc` to regenerate database code, sqlc may change plain Go types (like `bool`) to pgtype wrapper types (like `pgtype.Bool`). This breaks existing repository code that passes plain values. After sqlc regeneration, always check for compilation errors in repository files and update them to use the wrapper types with `.Bool` field and `.Valid = true`. Example: `IsPrimary: pgtype.Bool{Bool: isPrimary, Valid: true}` instead of `IsPrimary: isPrimary`. The pgtype import is typically already present in repository files.
  
actionable: true

---
timestamp: "2026-01-20T04:01:52.031612"
type: distinction
summary: GitHub CLI project access requires different permissions than issue access
detail: |
  The GitHub CLI requires the 'project' scope to access GitHub Projects v2 data via `gh project` commands, but can access issues via `gh issue` commands without this scope. When a user wants to work with GitHub Projects, they need to run `gh auth refresh --hostname github.com -s project` (note: --hostname is required in non-interactive mode). Issues can be accessed as a fallback using `gh issue list` with labels like 'agent-ready' to identify work items.
  
actionable: false

