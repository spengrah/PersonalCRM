timestamp: "2026-01-20T05:06:41.761762"
type: rule
summary: When extracting data from JSON responses in tests, check the response wrapper structure first
detail: |
  Before writing test helpers that extract data from API responses, examine how existing tests handle the same endpoint. The contact creation endpoint returns data wrapped in api.APIResponse{Success: bool, Data: interface{}, Error: *string}, not raw JSON. Writing test helpers without checking the actual response structure leads to runtime panics. Pattern to follow: 1) Look at existing tests for the same/similar endpoints, 2) Unmarshal into api.APIResponse, 3) Assert resp.Success, 4) Type assert resp.Data to map[string]interface{}, 5) Extract nested fields.
  
actionable: true

