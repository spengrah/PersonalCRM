timestamp: "2026-01-20T15:17:14.462519"
type: gotcha
summary: Loading flicker in navigation requires prefetching adjacent items
detail: |
  When implementing keyboard navigation between items (contacts, etc.), the first visit to each item will show a loading flicker unless adjacent items are prefetched. React Query's prefetchQuery should be called in a useEffect when navigation IDs are available to prefetch prev/next items. Pattern: 1) Create usePrefetchX hook returning a callback, 2) In detail page, useEffect with [navigationIds, currentIndex] deps, 3) Prefetch navigationIds[currentIndex-1] and navigationIds[currentIndex+1]. This prevents visual flicker and creates smooth navigation UX.
  
actionable: true

---
timestamp: "2026-01-20T15:17:14.462519"
type: architecture
summary: React Query caching persists within session but not across hard refreshes
detail: |
  React Query's cache is session-scoped - once data is fetched, it stays cached for the staleTime duration (e.g., 2 minutes) during the current browser session. However, hard refreshes clear the cache completely, causing all data to be refetched on first access. This is why prefetching is critical for navigation UX - the first navigation to each item in a session will always require a fetch unless prefetched. Don't rely on 'eventual caching' to solve flicker issues; implement explicit prefetching instead.
  
actionable: true

---
timestamp: "2026-01-20T15:17:14.462519"
type: rule
summary: Prefetching must match the query's staleTime to be effective
detail: |
  When implementing prefetchQuery for navigation, use the same staleTime as the main query (e.g., 1000 * 60 * 2 for 2 minutes). If prefetch staleTime is shorter, the data may become stale before the user navigates, defeating the purpose. If it's longer, it may serve outdated data. Keep prefetch and query staleTime synchronized to ensure prefetched data is still fresh when accessed.
  
actionable: true

---
timestamp: "2026-01-20T15:17:14.462519"
type: distinction
summary: Prefetching happens in background - no await needed
detail: |
  React Query's queryClient.prefetchQuery() fires asynchronously in the background and doesn't need to be awaited in the useEffect. The pattern is: call prefetchContact(nextId) and prefetchContact(prevId) without await, letting them populate the cache opportunistically. When navigation happens, if prefetch completed, data is instant; if not, normal loading occurs. Don't block the UI or add complexity waiting for prefetch completion.
  
actionable: true

---
timestamp: "2026-01-20T15:17:14.462519"
type: documentation_gap
summary: Feature development guide should mention prefetching for navigation UX
detail: |
  The .ai/guides/feature-development.md or similar docs don't explicitly call out the need to implement prefetching when adding keyboard or UI navigation between items. Developers implementing navigation features may not realize that basic useQuery implementations cause flicker. The guide should include: 'When implementing navigation between items, always add prefetching of adjacent items to prevent loading flicker. See use-contacts.ts usePrefetchContact pattern.' This would save agents from discovering the issue only after user testing reveals the flicker.
  
actionable: true

