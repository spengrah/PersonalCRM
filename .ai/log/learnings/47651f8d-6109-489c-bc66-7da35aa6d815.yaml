type: gotcha
summary: Local tests passing doesn't guarantee CI will pass - run tests locally before pushing
detail: |
  Tests can pass locally but fail in CI due to subtle differences in test setup or environment. The agent pushed code after local tests passed, but CI failed due to a type assertion panic in the test helper function. This caused unnecessary commit amendments and force pushes. Always run the full test suite locally (make test && make test-e2e) before pushing to avoid CI failures and wasted cycles.
  
actionable: true

