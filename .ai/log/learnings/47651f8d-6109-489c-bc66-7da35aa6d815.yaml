summary: IDs-only API endpoints pattern for efficient navigation
detail: |
  For keyboard navigation features, the pattern is to create a lightweight `ids_only=true` query parameter that returns just an array of IDs (not full objects). This enables the frontend to build navigation state efficiently without fetching full contact objects. The backend implements this by adding CASE statements to SELECT clauses that conditionally return either full columns or just the ID. This pattern can be reused for any list-based navigation feature (events, notes, etc.).
  
