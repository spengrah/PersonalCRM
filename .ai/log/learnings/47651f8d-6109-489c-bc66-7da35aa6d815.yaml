type: gotcha
summary: Pre-push hooks can trigger mid-push, requiring session continuation
detail: |
  The pre-push hook runs learning extraction and blocks the push if new learnings are found. This creates a workflow where: (1) push fails with exit code from hook, (2) agent must review extracted learnings, (3) commit the learnings file, (4) push again. Agents should expect this pattern and handle it smoothly rather than treating it as an error.
  
actionable: true

