detail: |
  When amending a commit that has already been pushed (e.g., to fix a lint error), use `git push --force-with-lease` instead of regular push. This safely overwrites the remote commit while protecting against overwriting others' changes. The session demonstrated this pattern: push failed → fix lint → amend commit → push --force-with-lease.
  
