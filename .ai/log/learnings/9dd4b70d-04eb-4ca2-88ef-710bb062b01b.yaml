timestamp: "2026-01-24T18:59:34.837838"
type: distinction
summary: set -o pipefail catches failed curl downloads that set -e alone misses
detail: |
  The Codex reviewer caught that the setup script used 'set -e' but not 'set -o pipefail'. Without pipefail, a failed curl command in a pipeline (e.g., 'curl ... | tar') would not cause the script to exit because only the rightmost command's exit status is checked. Adding 'set -o pipefail' ensures the script fails if ANY command in a pipeline fails, which is critical for catching download errors in setup scripts.
actionable: true

---
timestamp: "2026-01-24T18:59:34.837838"
type: gotcha
summary: Guard Go tool installations when Go itself might be missing
detail: |
  The Codex reviewer pointed out that the setup script tried to install sqlc (a Go tool) before verifying Go was installed. If Go is missing, the sqlc install would fail cryptically. The fix is to guard Go tool installations with 'command -v go >/dev/null 2>&1 || skip_with_warning'. This graceful degradation allows the setup script to continue and report what's missing rather than failing partway through.
actionable: true

