timestamp: "2026-01-24T17:52:59.684250"
type: gotcha
summary: sqlc binary may not be available in Claude Code environment
detail: |
  When removing database tables/queries, the agent tried to run `make sqlc` to regenerate code but sqlc was not found at ~/go/bin/sqlc. The agent adapted by manually editing the sqlc-generated files (models.go, querier.go, contact_merge.sql.go) to remove reminder-related code. This is a valid workaround when sqlc tooling is unavailable, but requires careful manual updates to maintain consistency with what sqlc would have generated.
actionable: true

---
timestamp: "2026-01-24T17:52:59.684250"
type: rule
summary: When removing a feature, systematically check for test file references beyond just source code
detail: |
  After implementing the removal of the reminders feature, the agent had to do a second pass to clean up test files that referenced reminders. E2E test files (reminders.spec.ts, reminder-lifecycle.spec.ts) needed deletion, and integration tests (scheduler_integration_test.go, contact_merge_test.go) needed updates to remove reminderRepo dependencies. Frontend test helpers (test-api.ts) also had reminder-related helper functions. A comprehensive initial grep for 'reminder' across all file types (not just source) would have caught these earlier.
actionable: true

---
timestamp: "2026-01-24T17:52:59.684250"
type: architecture
summary: Package rename during feature removal preserves semantic clarity
detail: |
  When removing the reminders feature, the cadence calculation utilities needed to be preserved but were in the `internal/reminder/` package. The agent correctly identified that keeping them in a package named 'reminder' would be misleading after removing reminders. Moving to `internal/cadence/` maintained semantic clarity about the package's purpose (cadence calculations for contacts) without the confusing reminder association. This same principle applies to any feature removal where utility code is preserved.
actionable: true

---
timestamp: "2026-01-24T17:52:59.684250"
type: gotcha
summary: Scheduler infrastructure should be preserved even when removing the only current job
detail: |
  When removing the reminders feature, the scheduler was only running reminder generation jobs. However, the user clarified to keep the scheduler infrastructure because future jobs (like Todoist integration) would be added. Agents should not assume that removing the last user of infrastructure means removing the infrastructure itself - check if it's planned for future use.
actionable: true

---
timestamp: "2026-01-24T17:52:59.684250"
type: rule
summary: When manually editing sqlc-generated files, maintain the exact structure sqlc would generate
detail: |
  When sqlc is unavailable and manual edits are necessary, preserve the exact structure, formatting, and patterns that sqlc uses. This includes: (1) removing entire const blocks with their associated functions, (2) removing interface methods from querier.go, (3) removing type definitions from models.go, (4) preserving the 'Code generated by sqlc. DO NOT EDIT.' header comment even though you're manually editing (to maintain compatibility when sqlc is available again). The agent correctly maintained this structure when manually removing reminder code.
actionable: true

---
timestamp: "2026-01-24T17:52:59.684250"
type: distinction
summary: E2E test deletion vs unit test preservation when removing features
detail: |
  When removing a feature, E2E tests that test the feature UI/flows should be deleted (e.g., reminders.spec.ts, reminder-lifecycle.spec.ts). However, unit tests for preserved utility code should be kept and updated (e.g., cadence_test.go tests were preserved after updating imports and removing only reminder-specific test cases like GenerateReminderTitle). The distinction: delete tests for removed functionality, preserve and update tests for preserved utilities.
actionable: true

