timestamp: "2026-01-24T18:08:04.239690"
type: gotcha
summary: Shell PATH not inherited from /etc/environment in Claude Code subprocess
detail: |
  When running Bash commands through Claude Code, the PATH from /etc/environment is not automatically sourced. Commands that work in a normal shell (like `go`, `golangci-lint`) fail with 'command not found' even though they exist in /etc/environment's PATH. This caused repeated failures when trying to run go/golangci-lint commands until the PATH was explicitly exported in each command.
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: gotcha
summary: golangci-lint version must match project Go version
detail: |
  Installing golangci-lint via `go install` builds it with the go version used for installation. If that version is lower than the project's go.mod version (e.g., golangci-lint built with go1.23 but project uses go1.24), golangci-lint will fail with 'Go version used to build is lower than targeted version'. Must install via the official install.sh script instead: `curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b ~/go/bin latest`
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: gotcha
summary: golangci-lint v1 vs v2 config format incompatibility
detail: |
  The project uses golangci-lint v2 config format (indicated by `version: "2"` in .golangci.yml). Installing golangci-lint v1.x will fail with 'you are using a configuration file for golangci-lint v2 with golangci-lint v1'. Must install v2.x using `latest` tag, not a specific v1.x version.
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: gotcha
summary: Integration/E2E tests require PostgreSQL running locally
detail: |
  The pre-push hook runs integration and E2E tests which require PostgreSQL to be running locally on port 5432. Without it, tests fail with 'dial tcp [::1]:5432: connect: connection refused'. Unlike other projects that might use Docker for tests, this project expects native PostgreSQL (via pg_ctlcluster on Debian/Ubuntu). The make setup target should ensure PostgreSQL 16 + pgvector is installed and running.
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: rule
summary: GOPATH/GOCACHE permissions must match user, not root
detail: |
  Attempting to run go commands failed with 'could not create module cache: mkdir /home/dev/go/pkg: permission denied' because /home/dev/go was owned by root. Go tools expect to write to GOPATH which should be owned by the development user. When permissions are wrong, either fix ownership or use temp directories (export GOPATH=/tmp/go GOCACHE=/tmp/go-cache).
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: architecture
summary: Dev environment requires specific directory structure and permissions
detail: |
  The project expects: (1) Go tools in ~/go/bin (golangci-lint, sqlc), (2) ~/go directory owned by dev user not root, (3) Native PostgreSQL 16 with pgvector installed (not Docker), (4) Environment variables properly set from /etc/environment. These are not automatically configured and cause multiple test/build failures if missing. A comprehensive `make setup` target is needed as the first command any developer runs.
actionable: true

---
timestamp: "2026-01-24T18:08:04.239690"
type: documentation_gap
summary: Project setup instructions inadequate for Claude Code environment
detail: |
  The .claude/CLAUDE.md mentions running `make setup` but doesn't warn about environment prerequisites (PATH sourcing, permissions, PostgreSQL installation). The agent spent significant time debugging why go/golangci-lint weren't found, permission errors, and missing PostgreSQL - all of which should be documented upfront or handled by a more robust setup script. The documentation should either: (1) Clearly state prerequisites before make setup, or (2) Make the setup script more defensive with better error messages about missing dependencies.
actionable: true

