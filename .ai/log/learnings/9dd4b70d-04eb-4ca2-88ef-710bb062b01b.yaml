timestamp: "2026-01-24T17:52:59.684250"
type: gotcha
summary: Contact merge tests may create repository dependencies that no longer exist
detail: |
  Integration tests like contact_merge_test.go created a reminderRepo with `repository.NewReminderRepository(database.Queries)` and passed it to `service.NewContactService()`. When removing the reminder feature, both the repository creation and the service parameter need to be removed. Test setup code often mirrors production dependency injection, so check test setup functions for removed dependencies.
