timestamp: "2026-01-21T22:33:02.082852"
type: gotcha
summary: Unique constraints on note table must be category-specific
detail: |
  The note table serves multiple purposes: notepad (one per contact) and general categorized notes (many per contact). A unique constraint on (contact_id, category) breaks existing tests that create multiple notes with categories like 'technical'. The constraint should be WHERE category = 'notepad' to only enforce uniqueness for the notepad use case, allowing multiple notes of other categories.
actionable: true

