timestamp: "2026-01-21T21:50:16.367987"
type: architecture
summary: Frontend API client needs explicit status-aware methods for 204 responses
detail: |
  When an API returns 204 No Content for empty/deleted resources (like GET /contacts/:id/notes returning 204 when no note exists), the frontend needs separate methods or explicit handling: (1) The fetch wrapper must not try to parse JSON on 204 responses, (2) React Query hooks should handle 204 as successful but map data to null/undefined, (3) Components should check for null data and render appropriate empty states. The lazy creation pattern (no DB record until content exists) requires this 204 handling throughout the stack.
actionable: true

---
timestamp: "2026-01-21T21:50:16.367987"
type: gotcha
summary: "Migration best practice: TRIM + nullability check prevents empty string pollution"
detail: |
  When migrating optional text fields to a new table with lazy creation semantics (no record until content exists), the migration SQL must filter with `WHERE field IS NOT NULL AND TRIM(field) != ''` to prevent creating records for empty strings. This is critical because: (1) Many forms submit empty strings instead of null for optional fields, (2) Whitespace-only content should not create DB records in the lazy creation pattern, (3) Without TRIM, empty/whitespace notes would be migrated and treated as having content. This also preserves the created_at timestamp from the original table for non-empty data.
actionable: true

---
timestamp: "2026-01-21T21:50:16.367987"
type: architecture
summary: Whitespace normalization belongs in service layer, not handler
detail: |
  When implementing lazy creation with whitespace deletion semantics (empty/whitespace body deletes record, returns 204), the normalization logic `if body == nil || strings.TrimSpace(*body) == ""` should be in the service layer (note.go) not the handler (note.go). This follows the layered architecture: handlers validate HTTP/JSON, services implement business logic. The trimming decision is business logic because it determines whether a record should exist. The handler should just validate the request structure and pass through to the service.
actionable: true

