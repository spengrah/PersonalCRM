timestamp: "2026-01-21T22:21:57.408460"
type: gotcha
summary: Integration tests require DATABASE_URL set manually or via make target setup
detail: |
  Backend integration tests in tests/api/*.go check for DATABASE_URL environment variable and skip if not set. The make test-integration target runs `cd backend && go test ./tests/... -v` WITHOUT setting DATABASE_URL, causing tests to be skipped silently. Tests only run when DATABASE_URL is explicitly exported (e.g., `export DATABASE_URL="postgres://crm_user:crm_password@localhost:5432/personal_crm_test?sslmode=disable"`) before running go test directly. The e2e-db target sets up the test database but isn't used by test-integration. This can lead to writing tests that appear to pass but are actually being skipped.
actionable: true

