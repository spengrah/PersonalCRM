timestamp: "2026-01-21T21:08:37.574856"
type: rule
summary: Always run `go build ./cmd/crm-api` after `make sqlc` to verify compilation
detail: |
  The make sqlc command regenerates Go code from SQL queries and changes struct types (CreateContactParams, UpdateContactParams). A successful sqlc generation doesn't mean the code compiles. Always run `go build ./cmd/crm-api` immediately after to catch struct field mismatches in repositories/handlers before proceeding.
actionable: true

