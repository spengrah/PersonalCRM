timestamp: "2026-01-21T21:08:37.574856"
type: gotcha
summary: Test database schema requires manual migration for E2E tests
detail: |
  When database migrations change the schema, E2E tests may fail with column errors if the test database hasn't been migrated. The error 'column "notes" does not exist' during E2E tests indicates the migration was applied to test DB but test seed helpers still reference old fields. Always check test helper files (like test-api.ts) when schema changes are made, not just production code.
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: gotcha
summary: Backend test files mirror production structure and must be updated in parallel
detail: |
  When removing fields from handler structs (CreateContactRequest, UpdateContactRequest), search ALL test files for struct literal usage. Test files like contact_validation_test.go and last_contacted_test.go directly instantiate these structs. Entire test functions may need removal if they test deprecated functionality (e.g., TestContactAPI_NotesField).
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: architecture
summary: Frontend API client needs explicit status-aware methods for 204 No Content patterns
detail: |
  The standard apiClient.get/put methods don't expose HTTP status codes. For endpoints using lazy creation patterns (204 = no content, 200 = content exists), add dedicated methods like getWithStatus/putWithStatus that return both data and status. This pattern is essential for distinguishing between 'empty response' and 'no resource exists'.
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: distinction
summary: Form data transformation must exclude fields saved via separate APIs
detail: |
  When migrating a field from one API to another (contact.notes → separate notes API), the form still collects the field but transformContactFormData should NOT include it in the returned object if the parent API no longer accepts it. The caller extracts and saves it separately. However, validation schema should keep the field since the form still validates it.
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: gotcha
summary: Frontend type changes cascade through Contact, CreateContactRequest, UpdateContactRequest, and form props
detail: |
  When removing a field from Contact type, it must be removed from: 1) Contact interface 2) CreateContactRequest 3) UpdateContactRequest 4) transformContactFormData return value 5) ContactForm props (add initialFieldName prop instead). Missing any of these causes TypeScript or runtime errors. The form component needs explicit props for fields fetched separately.
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: architecture
summary: Lazy creation pattern requires whitespace normalization at service layer, not handler
detail: |
  For lazy creation (no DB record until content exists), implement whitespace detection in the service layer using strings.TrimSpace(), not in the handler. Service should: 1) Trim whitespace 2) If empty and record exists → delete it 3) If empty and no record → return 204 4) If non-empty → upsert. Handler only validates and calls service.
actionable: true

