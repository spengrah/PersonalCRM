type: gotcha
summary: Pre-push hooks extract learnings and block push if new learnings found
detail: |
  The pre-push hook runs learning extraction automatically. When new learnings are detected, it blocks the push and requires the agent to: (1) review the new learnings in `.ai/log/learnings/`, (2) decide if/where to apply actionable learnings, (3) commit both applied changes and the learnings files, (4) push again. This two-phase workflow ensures learnings are captured and considered before code reaches remote.
