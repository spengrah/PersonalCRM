timestamp: "2026-01-21T22:21:57.408460"
type: architecture
summary: Backend API integration tests follow specific pattern with setup/cleanup helpers
detail: |
  Backend integration tests in tests/api/ use a standard pattern: (1) Check DATABASE_URL and skip if not set, (2) Create setupTestDB() helper that connects to DB, runs migrations from project-relative path, and returns test database handle, (3) Create setupNoteTestRouter() helper that initializes full dependency chain (db.Queries → repository → service → handler → gin router), (4) Use t.Cleanup() for automatic test database cleanup. Tests use httptest.NewRecorder() and perform actual HTTP requests through the router. This mirrors production architecture and catches integration issues that mocks would miss.
actionable: true

