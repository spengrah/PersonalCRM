timestamp: "2026-01-21T21:50:16.367987"
type: architecture
summary: Create/Update pages must handle separated API saves with Promise.all
detail: |
  When a form field is saved via a separate API endpoint (like notes via PUT /contacts/:id/notes), the page's onSubmit handler must: (1) Extract the separated field from form data via destructuring, (2) Call the main mutation to create/update the entity, (3) If the separated field has content, call its mutation with the new entity ID, (4) Use Promise.all when updating to run both saves in parallel and avoid race conditions. For create, the saves must be sequential (create contact first, then save notes with the new ID). The form's loading state should include both mutations: `loading={createMutation.isPending || separatedFieldMutation.isPending}`
actionable: true

