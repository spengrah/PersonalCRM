timestamp: "2026-01-21T22:14:47.724595"
type: gotcha
summary: E2E test seed helpers must stay in sync with backend schema changes
detail: |
  When migrating the notes field from contact table to a separate note table, the E2E test helper's seedContacts method still accepted a notes parameter, but the backend API silently ignored it. This caused test failures because tests expected seeded notes to appear but they never got created. The fix required: (1) removing notes from SeedContactInput type with a comment explaining the migration, and (2) adding a separate seedContactNote() method that calls the notes API. This is a common pattern when refactoring data models - seed helpers must be updated in lockstep.
actionable: true

