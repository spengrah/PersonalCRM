timestamp: "2026-01-21T21:50:16.367987"
type: gotcha
summary: E2E test helpers need updating when backend seed APIs change
detail: |
  When removing a field from the backend's seed endpoint (like SeedContactInput.Notes), the frontend E2E test helper at frontend/tests/e2e/helpers/test-api.ts must be updated to: (1) Add a deprecation comment to the SeedContactInput interface explaining the field is no longer supported and how to seed it instead, (2) Add a new method like seedContactNote(contactId, body) that calls the new API endpoint, (3) Update all E2E tests to seed the entity first, then call the new seed method with the returned ID. Without this, tests that pass the deprecated field will silently ignore it, causing test failures that are confusing to debug.
actionable: true

