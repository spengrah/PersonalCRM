type: gotcha
summary: CI may fail even when local tests pass due to test isolation issues
detail: |
  Tests that pass locally may fail in CI due to different execution order or parallel test execution exposing race conditions or incomplete cleanup. The session showed a test failing in CI with 'TestUpdateLastContacted_PreservesOtherContactData' even though all tests passed locally. This happens because CI runs tests in a fresh environment that may execute in different orders.
