timestamp: "2026-01-21T21:50:16.367987"
type: gotcha
summary: Always run go build after make sqlc to verify compilation
detail: |
  After running `make sqlc` to regenerate type-safe SQL code, immediately run `cd backend && go build ./cmd/crm-api` to verify the generated code compiles. Sqlc may change struct field types (e.g., adding pgtype wrappers) which breaks repository code that constructs these structs. The build failure is immediate and easy to fix if caught right away, but if not caught until later, it's confusing to debug because the SQL queries themselves look correct. This is already in core.md Common Gotcas but bears repeating as it was discovered during this session.
actionable: true

