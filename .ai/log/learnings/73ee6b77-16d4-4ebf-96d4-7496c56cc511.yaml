timestamp: "2026-01-21T21:08:37.574856"
type: gotcha
summary: Separate API endpoints require explicit save in handleUpdateContact with Promise.all
detail: |
  When a field moves to a separate API (notes to /contacts/:id/notes), the form submit handler must: 1) Extract the field from form data 2) Save contact via updateContactMutation 3) Save field via separate mutation using Promise.all for parallel execution. Don't forget to handle errors for both operations. Pattern: `await Promise.all([updateContactMutation.mutateAsync(...), saveFieldMutation.mutateAsync(...)])`
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: architecture
summary: "Migration best practices: TRIM + nullability check prevents empty data migration"
detail: |
  When copying text fields to new tables in migrations, always use `WHERE field IS NOT NULL AND TRIM(field) != ''` to skip whitespace-only content. This prevents creating records for logically empty data. Also use COALESCE for timestamps: `COALESCE(updated_at, created_at)` to preserve creation timestamp when update timestamp is null.
actionable: true

---
timestamp: "2026-01-21T21:08:37.574856"
type: gotcha
summary: Test helper APIs (SeedContacts) need comments explaining removed fields
detail: |
  When removing a field from the main API that was previously used by test helpers, don't silently remove the field from test input types. Add a clear comment explaining the field is now handled via a different endpoint and how tests should seed it. Example: 'Note: Notes are no longer stored on contact table. If tests need to seed notes, call POST /contacts/:id/notes separately.'
actionable: true

