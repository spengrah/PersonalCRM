type: gotcha
summary: Codex reviews may identify race conditions that don't fail in tests
detail: |
  The Codex automated review caught two critical race conditions: (1) form state initialized before async query resolves could delete data, and (2) concurrent database saves could create duplicates. Neither of these failures appeared in local tests, but both are valid production concerns. Future agents should take Codex P2 comments seriously even when tests pass - they often catch temporal and concurrency issues that deterministic tests miss.
