timestamp: "2026-01-21T22:33:02.082852"
type: gotcha
summary: ON CONFLICT clause must match the exact index definition
detail: |
  When using ON CONFLICT with a partial unique index, the WHERE clause in the query must exactly match the WHERE clause in the index definition. Changed from 'ON CONFLICT (contact_id, category) WHERE category IS NOT NULL' to 'ON CONFLICT (contact_id) WHERE category = 'notepad'' to match the new index. Mismatched WHERE clauses cause PostgreSQL to fail to recognize the index.
actionable: true

