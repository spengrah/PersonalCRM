timestamp: "2026-01-21T22:14:47.724595"
type: architecture
summary: ON CONFLICT requires partial unique index for nullable category columns
detail: |
  When adding a unique constraint on (contact_id, category) where category can be NULL, the constraint must be a partial index with 'WHERE category IS NOT NULL'. Otherwise, multiple NULL values would violate the constraint. The corresponding ON CONFLICT clause must also include the WHERE condition: 'ON CONFLICT (contact_id, category) WHERE category IS NOT NULL'. This is a PostgreSQL-specific gotcha when using upserts with nullable columns in unique constraints.
actionable: true

---
timestamp: "2026-01-21T22:14:47.724595"
type: gotcha
summary: React Hook Form defaultValues don't update when props change
detail: |
  When passing initialNotes prop to a form component using react-hook-form, the defaultValues only apply on mount. If the prop updates later (e.g., async query resolves), the form doesn't automatically sync. This creates a race condition where opening edit mode before the query completes initializes the form with empty string, which then overwrites real data on save. The fix is to add useEffect that calls setValue when the prop changes: 'useEffect(() => { setValue('notes', initialNotes, { shouldDirty: false }) }, [initialNotes, setValue])'
actionable: true

---
timestamp: "2026-01-21T22:14:47.724595"
type: rule
summary: Use upsert (INSERT...ON CONFLICT) instead of check-then-insert for concurrent safety
detail: |
  The service initially used a check-then-insert pattern: query for existing note, then either create or update. This has a race condition where two concurrent requests can both see no record, then both insert, creating duplicates. The correct pattern is to use PostgreSQL's INSERT...ON CONFLICT...DO UPDATE (upsert) which is atomic. This eliminates the race condition entirely. Always prefer upsert for create-or-update operations in concurrent environments.
actionable: true

