timestamp: "2026-01-21T21:08:37.574856"
type: distinction
summary: "Use feature-dev:code-explorer agents in PARALLEL for comprehensive codebase understanding"
detail: |
  When exploring codebase for a feature, launch 2-3 code-explorer agents in parallel with different focuses: one for similar features tracing implementation, one for high-level architecture/abstractions, one for user experience/UI patterns. Each agent should return 5-10 key files to read. This parallel exploration is faster and more comprehensive than sequential exploration.
actionable: true

