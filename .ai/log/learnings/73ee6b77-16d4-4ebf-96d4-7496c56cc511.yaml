timestamp: "2026-01-21T22:14:47.724595"
type: distinction
summary: Empty notes use HTTP 204 No Content, not 404 Not Found
detail: |
  For the notepad feature with lazy creation (no DB record until content exists), the backend returns HTTP 204 No Content when no note exists, not 404 Not Found. This distinction matters: 204 means 'success, but no content' (the note slot exists but is empty), while 404 means 'resource not found' (the contact doesn't exist). Frontend code handles 204 by treating it as empty string without showing an error. This pattern applies to any optional fields with lazy creation.
actionable: true

