type: documentation_gap
summary: Core rules lack guidance on integration test DATABASE_URL requirement
detail: |
  The .ai/rules/core.md file documents 'Run `make test && make test-e2e` to verify changes work' but doesn't mention that make test-integration silently skips tests without DATABASE_URL. This led to confusion when newly written tests appeared to pass (via make test-integration) but were actually being skipped. Documentation should clarify: (1) make test-integration requires manual DATABASE_URL setup OR (2) use `make test` which includes proper setup, OR (3) run tests via `cd backend && DATABASE_URL=... go test`. The existing instruction is incomplete - it tells developers to run tests but not how the test database gets configured.
