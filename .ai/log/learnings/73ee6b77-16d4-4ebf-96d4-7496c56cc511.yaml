timestamp: "2026-01-21T22:21:57.408460"
type: gotcha
summary: Code review tools may flag false positives on import usage
detail: |
  Automated code review comments about 'unused imports' can be incorrect when the import is used in struct field type declarations. In this session, a review flagged 'time package imported but never used' in note.go, but time.Time was used in NoteResponse struct fields (CreatedAt, UpdatedAt). Always verify automated review comments by checking actual usage before making changes. Type declarations in struct fields count as package usage.
actionable: true

