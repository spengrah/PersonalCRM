summary: Schema migrations require updating ALL test assertions, not just test data setup
detail: |
  When removing a field from the database schema (like `contact.notes`), search for and update not just struct literals in test setup but also assertions that verify response data. The session revealed a test that was creating contacts without notes (correctly updated) but still asserting `data["notes"]` should equal a value (missed assertion). Both setup AND verification code must be updated for schema changes.
