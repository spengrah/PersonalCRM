timestamp: "2026-01-21T21:50:16.367987"
type: documentation_gap
summary: core.md doesn't warn about form data transform vs API type mismatches
detail: |
  The core.md file documents the layered architecture and anti-patterns, but doesn't warn about the intentional type mismatch pattern where transformContactFormData includes fields (like notes) that are not in CreateContactRequest/UpdateContactRequest because they're saved via separate APIs. A future agent encountering this pattern will see TypeScript type errors and try to 'fix' them by removing the field from the transform, breaking the functionality. This should be documented in patterns/ or architecture.md with an example showing the destructuring pattern and explaining why the type mismatch is intentional.
actionable: true

