timestamp: "2026-04-27T16:25:44.352139"
type: rule
summary: Use CREATE FUNCTION (not OR REPLACE) in migrations for loud failures
detail: |
  In database migrations, use `CREATE FUNCTION` rather than `CREATE OR REPLACE FUNCTION` for new helper functions. If a future migration or manual change creates a function with the same name, `CREATE` will fail loudly (duplicate object error) instead of silently overwriting. This prevents accidental shadowing and makes migration conflicts explicit. Applies to all DDL in migrations: functions, types, etc. The exception is when you're genuinely fixing/updating an existing function in a later migration — then `OR REPLACE` is intentional.
actionable: true

