timestamp: "2026-04-27T16:25:44.352139"
type: gotcha
summary: Adding JSONB indexes may force query rewrites, not just migrations
detail: |
  When scoping work to "add a GIN index on JSONB column," don't assume it's migration-only. Existing query patterns like `EXISTS(SELECT 1 FROM jsonb_array_elements(...) WHERE LOWER(...) = LOWER($1))` are NOT GIN-rewritable — PostgreSQL cannot use a GIN index for predicates involving `LOWER()` on extracted values. The index requires a companion query rewrite to use an indexed helper function. Issue #277 was scoped as "single migration" but actually required query changes across 2 SQL files + sqlc regeneration + integration test updates to preserve behavior. Always grep for the query pattern before committing to "migration-only" scope.
actionable: true

