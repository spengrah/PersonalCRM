timestamp: "2026-04-27T16:25:44.352139"
type: distinction
summary: Honest EXPLAIN ANALYZE means no enable_seqscan cheats
detail: |
  When verifying that PostgreSQL will actually use a new index, measure with "honest" EXPLAIN ANALYZE: run the query without overriding planner settings like `SET enable_seqscan = off`. The cheat forces index usage even when the planner would naturally choose seq scan (e.g., on small tables where seq scan is genuinely faster). Honest measurement proves the index wins on actual data shape and row counts, not just in artificial conditions. If the planner ignores your index in honest mode, the index may be correctly deemed too expensive — investigate before shipping. Plan for #277 explicitly called out "no enable_seqscan cheats" in verification steps.
actionable: true

