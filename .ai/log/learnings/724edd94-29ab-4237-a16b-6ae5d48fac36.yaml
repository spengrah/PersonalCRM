timestamp: "2026-04-27T16:25:44.352139"
type: gotcha
summary: Plain GIN on JSONB arrays breaks case-insensitive matching
detail: |
  PostgreSQL GIN indexes on JSONB with `@>` operator (e.g., `WHERE col @> '[{"email": "foo@bar.com"}]'`) only match exact values. They do NOT support case-insensitive lookups like `LOWER(email)`. If existing queries use `LOWER()` for matching, switching to plain GIN + `@>` silently drops case-insensitivity and breaks on mixed-case data. Solution: functional GIN on a helper function that returns lowercased array values (e.g., `CREATE INDEX ON table USING GIN (jsonb_array_lower_values(col, 'email'))`). This issue surfaced in #277 where 17 external_contact rows had mixed-case emails that would have been silently unmatchable with plain GIN.
actionable: true

