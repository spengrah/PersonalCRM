timestamp: "2026-01-25T12:20:42.686406"
type: gotcha
summary: GitHub Actions artifacts don't include temp files unless explicitly uploaded
detail: |
  Temporary files created during GitHub Actions workflows (like /home/runner/work/_temp/claude-prompts/claude-prompt.txt) are ephemeral and deleted when the runner terminates. They are NOT automatically available as artifacts or in caches. To retrieve these files for debugging, you must add an explicit upload-artifact step in the workflow. However, you CAN retrieve the content if it was echoed to the job logs—use `gh run view <run_id> --log --job=<job_id>` and grep for the relevant content. In this session, the Claude Code Review prompt was found in the logs even though the temp file was gone.
actionable: false

