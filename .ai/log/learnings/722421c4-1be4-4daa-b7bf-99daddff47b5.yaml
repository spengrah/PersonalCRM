---
timestamp: "2026-01-24T19:28:18.053078"
type: gotcha
summary: AGENTS.md and .claude/CLAUDE.md are symlinked
detail: |
  .claude/CLAUDE.md is a symlink to AGENTS.md in the project root. Edits to either file modify AGENTS.md. When staging changes, use 'AGENTS.md' not '.claude/CLAUDE.md' since git tracks the actual file, not the symlink.
actionable: true

---
timestamp: "2026-01-24T19:28:18.053078"
type: architecture
summary: Dev-sandbox has persistent volume architecture for Go tools
detail: |
  The dev-sandbox container (Pi-based) uses persistent volumes: /home/dev/go (for GOPATH, modules, and go-installed binaries), /home/dev/workspace (for project files), and /home/dev/.cache (for Playwright). Setup scripts that use $GOPATH (defaulting to $HOME/go) correctly store to these volumes. The Go installation at /usr/local/go is baked into the Dockerfile, not a volume.
actionable: true

---
timestamp: "2026-01-24T19:28:18.053078"
type: gotcha
summary: Platform detection needed for PostgreSQL in setup scripts
detail: |
  PostgreSQL installation and detection differs significantly by platform: macOS uses Homebrew (brew install postgresql@16 pgvector, psql --version for detection), while Linux uses apt and pg_ctlcluster/pg_lsclusters. Setup scripts must use OSTYPE detection to provide platform-appropriate commands. The dev-sandbox is Linux-based, so Debian/Ubuntu detection applies there.
actionable: true

---
timestamp: "2026-01-24T19:28:18.053078"
type: gotcha
summary: imports.spec.ts dominates E2E runtime due to serial mode
detail: |
  The imports.spec.ts file contains 35 tests (37% of total E2E suite) and uses test.describe.configure({ mode: 'serial' }), forcing sequential execution. Even with 4 workers on high-CPU machines, parallelism is limited because this large test file cannot run tests concurrently. This is intentional (likely due to shared database state), but agents should understand that E2E runtime is dominated by this serial bottleneck.
actionable: false

---
timestamp: "2026-01-24T19:28:18.053078"
type: documentation_gap
summary: make setup was not prominently documented for first-time setup
detail: |
  Before this session, AGENTS.md/.claude/CLAUDE.md didn't list 'make setup' in the Commands section, and README.md Quick Start jumped straight to 'make docker-up' and 'make dev' without mentioning first-time setup. This could cause agents to miss installing Go tools, git hooks, and frontend dependencies. The documentation now correctly lists 'make setup' as the first command in both files, with explicit '(install deps, git hooks)' annotation.
actionable: false

---
timestamp: "2026-01-24T19:28:18.053078"
type: rule
summary: Go version references must match go.mod requirements
detail: |
  Documentation files (README.md, deployment guides) had outdated Go version references (1.22, 1.23) that didn't match go.mod's requirement for Go 1.24. When updating Go version requirements, search and update ALL references including: Prerequisites sections, installation examples (wget urls, brew install commands), and version verification examples. Use grep to find: 'go1\.2[0-9]\.' pattern.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: gotcha
summary: Notification assertions in parallel E2E tests match other workers' notifications
detail: |
  When running Playwright tests in parallel with multiple workers, generic notification patterns like `page.getByText(/imported successfully/i)` can match notifications from OTHER workers' operations. This causes false positives where a test thinks its operation succeeded because it saw another worker's success notification. Fix: Include the prefixed contact name in the notification pattern (e.g., `page.getByText(new RegExp(\`${displayName} imported successfully\`, 'i'))`) or wait for a more specific signal like the candidate card disappearing or modal closing.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: gotcha
summary: candidateCard locators can match modal content after modal opens
detail: |
  When using `page.locator('[class*="rounded-lg"]').filter({ hasText: displayName })` to target a candidate card, the locator can match BOTH the card in the list AND the modal content after the modal opens (since the modal also shows the contact name and may have rounded-lg classes). Using `candidateCard.getByRole('button', { name: /Import/i })` then matches multiple buttons (candidate card button + modal buttons), causing 'strict mode violation' errors. Fix: Wait for the modal to close by checking `expect(page.getByRole('button', { name: 'Import as New', exact: true })).not.toBeVisible()` instead of checking if the candidate card's button disappeared.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: gotcha
summary: domcontentloaded doesn't wait for API data to load in Next.js pages
detail: |
  Using `page.waitForLoadState('domcontentloaded')` in Playwright E2E tests only waits for the HTML DOM to render, NOT for React Query/API calls to complete. This causes race conditions where tests try to interact with data that hasn't loaded yet, especially on the /contacts page which shows 'Loading contacts...' while fetching. Fix: Use `page.waitForLoadState('networkidle')` or explicitly wait for loading indicators to disappear: `await expect(page.getByText('Loading contacts...')).not.toBeVisible({ timeout: 10000 })`
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: gotcha
summary: Shared beforeEach data can cause test interference in parallel execution
detail: |
  When multiple tests in a describe block use beforeEach to seed shared test data (e.g., Contact A, B, C), and one test IMPORTS one of those contacts, parallel execution can cause failures. Even though beforeEach runs per-test, if tests execute actions that consume shared data (importing removes the candidate), subsequent or parallel tests may not find the expected data. Fix: Either (1) have each test seed its own uniquely-named contact instead of relying on shared beforeEach data, or (2) move tests that consume/modify data to their own isolated describe blocks with separate beforeEach/afterEach.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: distinction
summary: Import notifications include contact name, but link notifications don't
detail: |
  The frontend shows different notification formats for import vs link actions: Import shows `${contactName} imported successfully!` (includes name), while Link shows generic `Contact linked successfully!` (no name). This means import tests can use name-specific notification patterns for parallel test isolation, but link tests cannot rely on the notification and must use other signals like waiting for the candidate to disappear or modal to close.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: rule
summary: Don't use `.first()` on candidate cards in parallel E2E tests
detail: |
  Using `.first()` to select candidate cards in imports tests (e.g., `page.getByRole('button', { name: /Import/i }).first().click()`) will click on whichever candidate appears first in the DOM, which could be another worker's seeded data when running in parallel. This causes tests to operate on the wrong data and fail assertions. Always target specific prefixed contact names: `page.locator('[class*="rounded-lg"]').filter({ hasText: displayName })` to ensure each test only interacts with its own data.
actionable: true

---
timestamp: "2026-01-25T10:23:57.883794"
type: gotcha
summary: Visibility waits needed before interacting with seeded E2E test data
detail: |
  After seeding test data via API, the data may not be immediately visible on the page even after page.goto() completes. Always add visibility waits before clicking: `await expect(candidateCard).toBeVisible({ timeout: 10000 })` before `candidateCard.click()`. Without this, tests can race against data loading and fail intermittently in parallel execution.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: gotcha
summary: E2E tests with parallel workers share the same database and see each other's test data
detail: |
  When running Playwright E2E tests in parallel with multiple workers, all workers seed data into the same database. Tests can see data from other workers' tests, causing issues like pagination (21+ contacts from one test pushing another test's contact to page 2). Tests must handle finding their prefixed contacts across pages or filtering UI to show only their data.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: gotcha
summary: ImportLinkModal only closes when candidates.length <= 1, not after every import
detail: |
  The modal is designed to stay open when multiple candidates exist, allowing batch processing. After importing one candidate, if others remain, the modal shows the next candidate instead of closing. Tests checking for modal closure (await expect(page.getByRole('button', { name: 'Import as New', exact: true })).not.toBeVisible()) will fail when other tests' candidates exist in the database. Tests should verify the specific candidate was removed from the list, not that the modal closed.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: rule
summary: E2E tests must handle pagination when searching for their seeded data
detail: |
  With parallel test execution, tests cannot assume their seeded contact appears on the first page. A pagination helper function is needed: async function findCandidateByName(page: Page, displayName: string, maxPages = 5) that iterates through pages clicking 'Next' until the contact is found. This must be called before interacting with any candidate card.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: gotcha
summary: Changing waitForLoadState from 'domcontentloaded' to 'networkidle' alone doesn't fix race conditions
detail: |
  While 'networkidle' waits for API calls to complete, it doesn't guarantee the UI has rendered the fetched data or that React Query has updated the component state. Tests still need explicit waits for specific elements (await expect(page.getByText(displayName)).toBeVisible({ timeout: 10000 })) or pagination handling to ensure the expected data is actually visible before interacting with it.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: architecture
summary: Parallel E2E test isolation requires per-test data scoping, not just cleanup
detail: |
  The TestAPI uses worker-scoped prefixes (w{workerIndex}-{timestamp}) for data isolation, but this only prevents collisions during seeding. Tests must actively filter/search for their prefixed data in the UI because other tests' data persists until their cleanup runs. Cleanup in afterEach only removes the current test's prefix, leaving other workers' data visible. Tests can't rely on having a clean database—they must be resilient to other tests' data being present.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: gotcha
summary: "Test isolation issues manifest as different failures: modal not opening vs. not closing"
detail: |
  When tests see data from other workers: (1) If test expects only its candidate but page shows 20+ from another test, the modal might open on the wrong contact. (2) If test imports its candidate but 19+ remain from other tests, modal stays open instead of closing. (3) If pagination test runs first, it seeds 21 contacts that push all other tests' contacts to page 2. Each failure mode requires understanding the multi-candidate modal behavior and pagination logic.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: distinction
summary: Flaky tests passing on retry vs tests that need pagination handling
detail: |
  Tests that pass on retry often indicate race conditions (data not loaded yet, modal state from previous test not cleared). Tests that consistently fail when pagination tests run indicate missing pagination handling. The fix differs: race conditions need better waits (networkidle + explicit element visibility), while pagination issues need findCandidateByName() helper. Both can manifest as 'flaky' in test output.
actionable: true

---
timestamp: "2026-01-25T10:34:53.538830"
type: rule
summary: Verify test assertions match actual modal behavior in batch-processing UIs
detail: |
  Don't assume modals close after every action. The ImportLinkModal is designed for batch processing: it only closes when candidates.length <= 1 (last candidate processed). Tests should verify the specific candidate's state changed (removed from list, status updated) rather than checking for modal closure. This pattern applies to any batch-processing UI component.
actionable: true

---
timestamp: "2026-01-25T12:20:42.686406"
type: gotcha
summary: React Query staleTime causes E2E tests to see cached data from previous tests
detail: |
  React Query is configured with a 5-minute staleTime in query-client.ts. When parallel E2E tests navigate to the same route (e.g., /imports), React Query serves cached data from previous tests instead of fetching fresh seeded data. This causes test flakiness where seeded data doesn't appear. The root cause is that React Query's cache key is based on the URL path, not the data version, so navigating to the same route retrieves stale cached responses. Solutions: (1) Use cache-busting query params like `page.goto("/imports?_t=${Date.now()}")`, (2) Wait for specific seeded elements with longer timeouts instead of relying on page load states, or (3) Avoid page.reload() which doubles page load time.
actionable: true

---
timestamp: "2026-01-25T12:20:42.686406"
type: architecture
summary: E2E performance optimization requires balancing parallelism with resource constraints
detail: |
  Different environments have vastly different performance profiles: MacBook M2 Max runs E2E suite in ~28s with 4 workers, GitHub Actions takes ~1.4min with 4 workers, and Raspberry Pi 5 takes 5min with 3 workers. The key bottleneck on resource-constrained devices (Pi) is not just CPU but also: (1) Memory pressure from multiple browser contexts causing swapping, (2) Database connection contention when all workers hit Postgres simultaneously, (3) Page load overhead that compounds with each reload. On Pi, reducing from 3 workers to 1-2 workers or eliminating unnecessary page.reload() calls can significantly improve total runtime despite reduced parallelism. The optimal architecture uses environment-aware worker counts and minimizes redundant operations (especially page reloads) that have outsized impact on slow hardware.
actionable: true

---
timestamp: "2026-01-25T12:20:42.686406"
type: rule
summary: Avoid page.reload() in E2E tests—use cache-busting or element-based waits instead
detail: |
  Using page.reload() to work around React Query caching doubles the page load time for each test. In this session, 13 page.reload() calls added ~30-40 seconds of overhead on Raspberry Pi (2-3s per reload). Better approaches: (1) Append timestamp query params to bust cache: `page.goto('/imports?_t=${Date.now()}')` - React Query sees different URL = cache miss = fresh fetch, (2) Wait for specific seeded element to appear with generous timeout: `await expect(page.getByText(displayName)).toBeVisible({ timeout: 10000 })`, (3) Replace arbitrary `waitForTimeout(150)` with element-based waits: `await expect(modalHeading).toBeVisible()`. These approaches are faster (1 page load vs 2) while maintaining reliability across all environments.
actionable: true

---
timestamp: "2026-01-25T12:20:42.686406"
type: distinction
summary: Test-map.json patterns must be updated when splitting spec files
detail: |
  The test-map.json file maps file paths to @area tags for diff-selected E2E testing via `make test-e2e-diff`. When a single spec file (e.g., imports.spec.ts) is split into multiple files (imports-actions.spec.ts, imports-features.spec.ts, etc.), the test-map.json pattern must be updated from exact match `^frontend/tests/e2e/imports\.spec\.ts$` to pattern match `^frontend/tests/e2e/imports(-[a-z]+)?\.spec\.ts$`. Otherwise, changes to the new split files won't trigger the @area:imports tag, causing `make test-e2e-diff` to fall back to @smoke and skip the imports suite—a regression in diff-selected E2E coverage. This must be checked whenever refactoring splits test files.
actionable: true

