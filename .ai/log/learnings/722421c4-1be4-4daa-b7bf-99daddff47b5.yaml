timestamp: "2026-01-24T19:28:18.053078"
type: rule
summary: Go version references must match go.mod requirements
detail: |
  Documentation files (README.md, deployment guides) had outdated Go version references (1.22, 1.23) that didn't match go.mod's requirement for Go 1.24. When updating Go version requirements, search and update ALL references including: Prerequisites sections, installation examples (wget urls, brew install commands), and version verification examples. Use grep to find: 'go1\.2[0-9]\.' pattern.
actionable: true

