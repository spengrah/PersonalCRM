timestamp: "2026-04-12T19:42:12.794638"
type: distinction
summary: Local integration test failures from DB pollution don't block pushing if feature tests pass
detail: |
  When integration tests fail locally due to DB pollution (leftover data from previous runs), but the actual feature-specific tests pass cleanly, it's acceptable to push and let CI be the source of truth. CI runs with a fresh database (no pollution), so local failures from shared DB state won't reproduce in CI. Before pushing: (1) verify your feature-specific tests pass (`go test ./internal/matching/... ./internal/service/...`), (2) confirm the failures are pre-existing or pollution-related (check if they fail on main too), (3) push with confidence that CI will validate correctly. Don't spend excessive time debugging local DB state issues when CI will have a clean environment.
actionable: true

