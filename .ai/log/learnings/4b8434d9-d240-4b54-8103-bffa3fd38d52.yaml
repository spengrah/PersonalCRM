timestamp: "2026-04-12T19:42:12.794638"
type: gotcha
summary: Integration test sub-tests must use unique data to avoid DB pollution
detail: |
  When writing integration tests with multiple sub-tests (via `t.Run`), each sub-test must create contacts/entities with unique names or IDs. Reusing the same name (e.g., "Alice Smith") across sub-tests causes pollution in the shared database — later sub-tests will find records created by earlier ones, breaking assertions. Use unique prefixes per sub-test (e.g., "ExactMatch Alice", "SeparatorNorm Bob") or generate random/UUID-based names. This is especially critical for fuzzy-matching tests where string similarity can match unintended records.
actionable: true

