timestamp: "2026-04-12T19:42:12.794638"
type: gotcha
summary: Map iteration for top-N selection requires stable sorting for determinism
detail: |
  Go map iteration order is randomized. When selecting the top N items from a map (e.g., finding the best-scoring match from a `map[string]*score`), iterating and comparing directly produces non-deterministic results — tie-scored items can swap positions across runs. To fix: collect all candidates into a slice, sort with `sort.Slice` using a stable comparator that includes tie-breakers (e.g., sort by score DESC, then by contactID ASC for determinism), then select top-N from the sorted slice. Never rely on map iteration order for ranking or selection logic.
actionable: true

