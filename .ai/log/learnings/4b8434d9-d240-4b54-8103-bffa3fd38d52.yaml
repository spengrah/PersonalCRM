timestamp: "2026-04-12T19:42:12.794638"
type: rule
summary: Codex review before push catches plan misinterpretations and non-determinism
detail: |
  Running local Codex review before pushing (`codex exec --json` with plan + code-review.md) successfully catches: (1) plan interpretation errors (e.g., misreading "< 4" as "<= 4"), (2) non-deterministic behavior from map iteration, (3) test coverage gaps for new code paths, (4) off-by-one errors in thresholds. In this session, Codex caught that the agent had kept 4-char handles despite the plan explicitly calling them "noise to suppress" — the agent had misinterpreted an ambiguous plan section. The automated review re-read the plan more carefully and found the correct intent. This pre-push review step reduces CI round-trips and catches subtle bugs that pass tests but violate requirements.
actionable: true

