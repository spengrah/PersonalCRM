summary: Gotchas table missing integration test cleanup and map iteration patterns
detail: |
  The `.ai/rules/core.md` Common Gotchas table doesn't warn about: (1) using soft-delete in test cleanup (should use hard DELETE), (2) upserts not clearing deleted_at (resurrects soft-deleted rows), (3) map iteration non-determinism when selecting top-N items. These are non-obvious patterns that tripped up the implementation and required Codex review to catch. **Why missed**: These are Go/testing-specific patterns that don't fit the existing gotchas categories (which focus on sqlc, time, paths, etc.). **How to strengthen**: Add new gotcha entries: "Integration test cleanup with soft-delete" → "Use hard DELETE in test cleanup, not SoftDeleteX methods — upserts resurrect soft-deleted rows", "Finding top-N from map" → "Collect to slice and sort with stable tie-breaker — map iteration is non-deterministic", "Upsert on soft-delete table" → "ON CONFLICT UPDATE must set deleted_at = NULL explicitly".
actionable: true

