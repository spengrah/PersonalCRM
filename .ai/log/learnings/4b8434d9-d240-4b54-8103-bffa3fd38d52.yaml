type: gotcha
summary: Integration test cleanup must use hard DELETE, not soft-delete
detail: |
  Test cleanup helpers that use soft-delete (e.g., `SoftDeleteTelegramMessages`) combined with upsert queries that don't clear `deleted_at` will cause test pollution — upserts resurrect soft-deleted rows from previous test runs. Integration tests in `backend/tests/` must use hard DELETE (direct SQL `DELETE FROM table WHERE ...`) for cleanup, not repository soft-delete methods. This prevents test data from leaking between runs when the local DB persists across test executions.
actionable: true

---
timestamp: "2026-04-12T19:42:12.794638"
type: gotcha
summary: Upsert queries must explicitly clear deleted_at to avoid resurrecting soft-deleted rows
detail: |
  SQL upsert patterns (INSERT ... ON CONFLICT DO UPDATE) that don't include `deleted_at = NULL` in the UPDATE clause will preserve the soft-delete state. This means upserting a previously soft-deleted row won't un-delete it. For any upsert query on a table with soft-delete support, the ON CONFLICT UPDATE clause must explicitly set `deleted_at = NULL` to ensure the record becomes active again. Without this, soft-deleted rows remain deleted even after being upserted with new data.
actionable: true

