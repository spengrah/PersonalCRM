timestamp: "2026-01-24T15:37:57.968644"
type: architecture
summary: Learnings skill routes to extract-skill for techniques
detail: |
  The updated learnings workflow includes a self-reflection step and routes different learning types to different destinations. Techniques should be routed to the `/extract-skill` skill rather than being manually added to documentation. This creates a systematic workflow: learnings → classification → route to extract-skill for techniques, or to .ai/rules/ for project rules.
actionable: true

