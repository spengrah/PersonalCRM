type: distinction
summary: "SKILL.md format evolved: name field and space-separated allowed-tools"
detail: |
  The new SKILL.md format requires a `name` field in the frontmatter, and `allowed-tools` changed from comma-separated to space-separated format. This is a breaking change that affects skill portability across different projects and requires updates when syncing skills.
actionable: true

