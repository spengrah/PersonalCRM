timestamp: "2026-01-24T15:37:57.968644"
type: rule
summary: Headless Claude execution needs --permission-mode bypassPermissions
detail: |
  When running headless Claude CLI commands (like in extract-learnings.py), add `--permission-mode bypassPermissions` to the command arguments to allow tools like Read to execute without user approval. This is essential for automated extraction scripts that run in hooks.
actionable: true

---
timestamp: "2026-01-24T15:46:36.922307"
type: gotcha
summary: git diff --quiet only detects tracked files, not new untracked files
detail: |
  When checking for new files in a directory with git diff --quiet, untracked files won't be detected. Use git ls-files --others --exclude-standard to check for untracked files in addition to git diff. Example: if git diff --quiet .ai/log/learnings/ 2>/dev/null && [[ -z "$(git ls-files --others --exclude-standard .ai/log/learnings/)" ]]; then
actionable: true

