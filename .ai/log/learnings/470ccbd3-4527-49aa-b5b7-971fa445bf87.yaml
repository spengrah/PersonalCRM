timestamp: "2026-01-24T15:37:57.968644"
type: gotcha
summary: find command with -exec may silently produce no output
detail: |
  When using `find` with `-exec` to read files, the command may silently fail without errors if there's a syntax issue or permission problem. Using a while-read loop with echo inside is more reliable: `find ... | while read f; do echo "=== $f ==="; cat "$f"; done`
actionable: true

