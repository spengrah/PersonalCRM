timestamp: "2026-01-25T15:22:57.644050"
type: architecture
summary: Code review feedback drives iterative PR improvements
detail: |
  Claude Code Review check in CI provides structured feedback on security, testing, and code quality. When review fails, extract specific issues from PR comments (gh pr view --comments), address each systematically, then push fixes. The review check will re-run automatically. Pattern: review fails → read comments → fix issues → commit → push → review re-runs.
actionable: true

