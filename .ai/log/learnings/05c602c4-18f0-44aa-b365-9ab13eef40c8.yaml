type: gotcha
summary: PLAYWRIGHT_GREP must be an environment variable, not a Make variable
detail: |
  When running filtered E2E tests locally, `make test-e2e-local GREP="pattern"` is ignored. The correct syntax is `PLAYWRIGHT_GREP="pattern" make test-e2e-local` because the Makefile expects an environment variable, not a Make variable. This gotcha is already documented in the Common Gotchas table but was still encountered, suggesting the documentation could be more prominent or the Makefile could be improved to accept both forms.
actionable: false

