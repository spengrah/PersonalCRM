timestamp: "2026-02-07T11:43:09.283157"
type: documentation_gap
summary: Common Gotchas entry for PLAYWRIGHT_GREP was insufficient
detail: |
  Despite having an entry in `.ai/rules/core.md` warning about `PLAYWRIGHT_GREP` patterns with spaces needing dot wildcards, the agent still attempted to use `make test-e2e-local GREP="..."` syntax. The gotcha exists but doesn't cover the primary issue: that GREP as a Make variable doesn't work at all. The entry should be strengthened to lead with the environment variable requirement: 'Use `PLAYWRIGHT_GREP="pattern" make test-e2e-local`, NOT `make test-e2e-local GREP="pattern"` - Makefile expects environment variable.'
actionable: true

