timestamp: "2026-02-07T11:43:09.283157"
type: architecture
summary: ARIA navigation landmarks require semantic role hierarchy
detail: |
  When creating pagination controls, the component should use `<nav aria-label="Pagination">` as the container (not a generic div) and include `aria-label` or `aria-labelledby` on the navigation landmark. Individual buttons need `aria-label` describing their action (e.g., 'Go to page 2', 'Previous page', 'Next page') and `aria-current="page"` on the active page button. This accessibility pattern wasn't initially implemented and was caught in code review.
actionable: true

