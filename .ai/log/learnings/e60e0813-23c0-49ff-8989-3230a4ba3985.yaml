timestamp: "2026-01-20T09:58:31.377962"
type: gotcha
summary: Git rebase updates the wrong branch when invoked from a different branch
detail: |
  When you run `git rebase origin/main` while on a different branch than your target branch, git will rebase the current branch instead of the intended branch. In the session, the agent was on `fix/keyboard-navigation-followup` when trying to rebase `refactor/per-session-learnings`, resulting in the wrong branch being rebased. The fix is to always ensure you've checked out the target branch before running `git rebase`.
actionable: true

---
timestamp: "2026-01-20T09:58:31.377962"
type: gotcha
summary: Learnings YAML file merge conflicts occur when parallel sessions append to monolithic file
detail: |
  When multiple feature branches are being worked on in parallel, they both append new learnings to the same `.ai/log/learnings.yaml` file. When these branches are merged, Git creates merge conflicts because both branches added content to the end of the file. The solution implemented was to split learnings into per-session files (`.ai/log/learnings/{session_id}.yaml`) so each session writes to its own file, eliminating merge conflicts entirely.
actionable: true

---
timestamp: "2026-01-20T09:58:31.377962"
type: architecture
summary: Per-session learnings files eliminate merge conflicts and improve organization
detail: |
  Migrated from a monolithic `.ai/log/learnings.yaml` file to per-session files at `.ai/log/learnings/{session_id}.yaml`. This architecture: (1) Prevents merge conflicts when parallel sessions extract learnings, (2) Makes it easy to see which learnings came from which session, (3) Allows pruning old session learnings without affecting others, (4) Removes the need for session_id field in each document since it's implicit in the filename. The migration script groups existing learnings by session_id and creates separate files.
actionable: false

---
timestamp: "2026-01-20T09:58:31.377962"
type: rule
summary: Test instructions should focus on verification during development, not before push
detail: |
  Pre-push hooks automatically run tests, so instructing agents to 'run tests before pushing' is redundant for the push action itself. However, running tests during development (before you're ready to push) catches issues earlier and saves context. Agent instructions should say 'Run tests to verify changes work' or 'Run tests during development' rather than 'Run tests before pushing'. Updated in `.ai/rules/core.md` and `.claude/CLAUDE.md`.
actionable: true

---
timestamp: "2026-01-20T09:58:31.377962"
type: rule
summary: Agents should be aware of pre-push hooks that may require action
detail: |
  Pre-push hooks can block push operations and require agent action before push succeeds. For example, the learnings extraction hook blocks push if new learnings are found and instructs the agent to review and apply them. Core rules should mention that 'Git pre-push hooks run automatically and may block push, requiring you to review learnings or fix test failures before pushing again.' This helps agents understand the workflow when their push is blocked.
actionable: true

