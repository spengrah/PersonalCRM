timestamp: "2026-01-20T09:58:31.377962"
type: distinction
summary: File path updates in documentation must be comprehensive across all references
detail: |
  When changing a file path structure (like moving from `.ai/log/learnings.yaml` to `.ai/log/learnings/{session_id}.yaml`), you must search and update ALL references across: agent instructions (CLAUDE.md, AGENTS.md), documentation (README.md, SKILL.md), rules (core.md), scripts (shell wrappers), and gitignore rules. Missing even one reference creates confusion. Use `grep -r "old-path" .ai/` to find all references before making the change.
actionable: true

---
timestamp: "2026-01-20T09:58:31.377962"
type: gotcha
summary: Gitignore requires both directory and contents patterns to unignore nested files
detail: |
  To unignore files within an ignored directory, you need TWO patterns: `!.ai/log/learnings/` to unignore the directory itself, AND `!.ai/log/learnings/*` to unignore its contents. Using only the directory pattern (`!.ai/log/learnings/`) is insufficient - Git still ignores the files inside. This is because Git's ignore rules apply hierarchically.
actionable: true

---
timestamp: "2026-01-20T09:58:31.377962"
type: architecture
summary: Learnings extraction uses directory hash instead of file hash for change detection
detail: |
  The shell wrapper checks if new learnings were extracted by comparing directory listing hashes before and after extraction: `ls -la .ai/log/learnings/ | md5sum`. This works for per-session files because any new or modified file changes the directory listing. The command includes `|| echo ""` fallback for when the directory doesn't exist yet. This is more robust than checking individual files when multiple sessions may create different files.
actionable: false

---
timestamp: "2026-01-20T09:58:31.377962"
type: gotcha
summary: Session data persists across branch switches if files are in working tree
detail: |
  When switching branches with `git checkout main`, files created in the working tree (like migrated learnings files) persist even though they're not committed to the new branch. This caused confusion when the agent ran migration, switched to main, and found the learnings directory still existed from the previous migration run. The fix is to either: (1) clean the working tree before migration, or (2) re-run migration after switching to the new base branch to ensure correct state.
actionable: true

