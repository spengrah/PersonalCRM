timestamp: "2026-01-20T09:58:31.377962"
type: documentation_gap
summary: Learnings skill README had outdated/inaccurate information about hook triggers
detail: |
  The README.md for the learnings skill claimed that PreCompact and SubagentStop hooks were implemented when they were actually planned future work. It also described pre-push as an 'agent rule' when it's actually programmatic. The documentation should clearly distinguish between 'Implemented' (git pre-push hook) and 'Planned' (PreCompact, SubagentStop) triggers, and accurately describe that extraction runs automatically via hooks rather than being an agent instruction. Fixed by updating the 'When extraction runs' and 'Hook Integration' sections to be accurate.
actionable: true

