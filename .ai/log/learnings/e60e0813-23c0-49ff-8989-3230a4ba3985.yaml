timestamp: "2026-01-20T08:38:48.085531"
type: architecture
summary: Code review bot requests changes via GitHub comments
detail: |
  The project uses an automated Claude code review bot that runs in CI and posts review comments requesting changes. The bot checks for documentation completeness, code duplication, and follows project conventions. Agents should expect review feedback and address it by reading PR comments with 'gh pr view <number> --comments'. The review is blocking - PR cannot merge until addressed.
  
actionable: true

---
timestamp: "2026-01-20T08:38:48.085531"
type: rule
summary: Extracted helper functions need descriptive JSDoc explaining WHY
detail: |
  When code review requested extracting duplicate UTC date logic to a helper, the helper needed comprehensive documentation explaining the non-obvious reason it exists: formatDateOnly extracts UTC date portion, so tests using toLocaleDateString() fail late at night when UTC has rolled to next day. Good helper docs explain the gotcha/pitfall the abstraction prevents, not just what the code does.
  
actionable: true

---
timestamp: "2026-01-20T08:38:48.085531"
type: gotcha
summary: GitHub PR checks continue in background after agent completes work
detail: |
  After pushing code, the agent watched CI checks with 'gh pr checks --watch' but one check (Claude Code Review) took significantly longer than tests (2m12s vs immediate for unit tests). The agent waited multiple times (60s, 90s, 120s delays) before the review completed. When reviewing PRs, agents should expect code review checks to take 2-3+ minutes and should check once after all tests pass rather than polling repeatedly.
  
actionable: true

---
timestamp: "2026-01-20T09:03:21.454665"
type: gotcha
summary: CI may not auto-trigger for all pushed commits
detail: |
  After addressing code review feedback and pushing commits 778cb0b and adcecb0 to the PR, GitHub CI did not automatically trigger for these new commits. The agent waited multiple times but no new CI runs appeared for the latest commit SHA. This is distinct from CI being slow - the workflow simply didn't start. Future agents should be aware that CI may not trigger automatically in all cases and should not indefinitely wait for runs that may never start.
  
actionable: true

---
timestamp: "2026-01-20T09:03:21.454665"
type: gotcha
summary: learnings.yaml merge conflicts need manual 'keep both' resolution
detail: |
  The learnings.yaml file is append-only and can have conflicts when parallel sessions both add learnings. The resolution is always to remove conflict markers and keep all learnings from both branches, since they come from different sessions with different session_ids. This happened when merging main after a parallel PR session added its own learnings. The file structure with '---' separators makes it straightforward to combine both sets.
  
actionable: true

---
timestamp: "2026-01-20T09:03:21.454665"
type: architecture
summary: Code review feedback can be outdated after rapid fixes
detail: |
  When a reviewer (like Claude Code Review) requests changes, and the agent immediately addresses them in new commits, the PR status will still show 'Changes requested' until the reviewer re-runs or CI picks up the new commits. The agent correctly pushed fixes (778cb0b and adcecb0) that addressed both review issues (API quota documentation and getTodayUTC helper), but the PR continued showing the old review status because CI hadn't re-run. Agents should understand that review status lags behind actual code state.
  
actionable: true

---
timestamp: "2026-01-20T09:03:21.454665"
type: documentation_gap
summary: No guidance on handling stalled CI workflows
detail: |
  The core rules and guides don't document what to do when GitHub CI doesn't trigger for new commits. The agent correctly waited and checked multiple times using 'gh run list' and 'gh pr checks', but there's no documented workflow for: (1) how long to wait before considering CI stalled, (2) whether/how to manually trigger workflows, (3) what causes CI to not auto-trigger. This led to uncertainty and repeated checks with no resolution. Documentation should cover CI troubleshooting patterns.
  
actionable: true

