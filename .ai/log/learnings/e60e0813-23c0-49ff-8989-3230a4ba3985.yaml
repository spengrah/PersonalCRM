timestamp: "2026-01-19T22:06:55.572429"
type: gotcha
summary: Serena MCP tools can return results too large for Read tool
detail: |
  When using `mcp__serena__read_file` on large test files, the result may be saved to a temp file that itself exceeds Read tool's token limit (25000 tokens). The workaround is to read directly from the workspace using the standard Read tool on the actual source file path instead of trying to read the MCP tool's output file. This happened when reading `backend/internal/google/calendar_test.go` - the MCP tool saved 72,358 characters to a temp file that was then too large to read.
  
actionable: true

---
timestamp: "2026-01-19T22:06:55.572429"
type: rule
summary: Use conventional branch names matching commit type
detail: |
  Branch names should follow conventional commit prefixes: feat/, fix/, refactor/, docs/, test/, chore/. The project uses `feat/reduce-calendar-sync-interval` for a feature that will have a `feat:` commit message. This is documented in `.ai/rules/core.md` but worth reinforcing as a pattern to follow automatically.
  
actionable: true

---
timestamp: "2026-01-19T22:06:55.572429"
type: architecture
summary: Project uses pre-commit hooks for formatting staged files
detail: |
  The repository has pre-commit hooks that automatically format Go files with gofmt when committing. The output shows 'Pre-commit: Formatting staged files...' and 'Go files formatted' messages. Agents should expect this and not be surprised by the additional output during git commits. The hooks run automatically and don't require manual intervention.
  
actionable: true

---
timestamp: "2026-01-19T22:06:55.572429"
type: gotcha
summary: Serena MCP has think_about_* tools that prompt for reflection
detail: |
  The Serena MCP includes metacognitive tools like `mcp__serena__think_about_collected_information` and `mcp__serena__think_about_task_adherence` that return prompts asking the agent to reflect on whether it has enough information or is staying on task. These don't provide data - they're prompts for the agent to self-assess. The agent correctly used them to verify it had sufficient context before proceeding.
  
actionable: true

---
timestamp: "2026-01-19T22:06:55.572429"
type: distinction
summary: Simple changes don't need full feature-dev workflow
detail: |
  The feature-dev skill includes phases for exploration, clarification, architecture design, and code review with multiple parallel agents. For a trivial change (updating a constant from 24 hours to 15 minutes), the agent correctly skipped the heavy exploration and architecture phases. The full workflow is overkill when the issue is well-specified and the change is a simple constant update with no architectural implications.
  
actionable: true

