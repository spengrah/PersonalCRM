type: documentation_gap
summary: Core rules don't warn about updated_at column availability
detail: |
  The core.md gotchas table warns about many sqlc pitfalls but doesn't mention that updated_at only exists on some tables. This led to writing queries that failed at runtime. The 'Common Gotchas' section should include: 'Assuming all tables have updated_at | Check schema - only contact, contact_method, note, time_entry, calendar_event have it'.
actionable: true

