timestamp: "2026-01-21T01:42:31.067617"
type: gotcha
summary: Fixing only one instance of a pattern when multiple exist
detail: |
  When a bug is identified in a test or codebase (e.g., GetMergePreview parameter order), search ALL occurrences of that pattern and fix them together. In this session, the agent fixed one GetMergePreview call (line 87) but missed another (line 136) in the same file, causing CI to fail even though local tests passed (likely because only one test ran locally). The core.md gotcha table already warns about this: 'Fixing only one instance of a pattern | Search entire codebase and fix ALL instances to maintain consistency'.
actionable: true

