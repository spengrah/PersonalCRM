timestamp: "2026-01-21T01:22:57.647191"
type: gotcha
summary: contact_method has TWO different unique constraints
detail: |
  The contact_method table has both a regular UNIQUE constraint on (contact_id, type) AND a partial unique index on (contact_id, type) WHERE is_primary = TRUE. This creates two separate constraint violations to handle: can't have duplicate method types per contact, and can't have multiple primary methods of same type. Both must be considered in merge logic.
actionable: true

