timestamp: "2026-01-21T01:54:10.187855"
type: documentation_gap
summary: Integration test execution not obvious in development workflow
detail: |
  The session revealed confusion about why tests passed locally but failed in CI. The root cause was DATABASE_URL not being set locally, causing integration tests to skip. The existing docs mention `make test` but don't emphasize: (1) that integration tests require DATABASE_URL to actually run, (2) how to set it for local integration test execution, or (3) that pre-push hooks may give false confidence if DATABASE_URL is unset. The .ai/rules/core.md mentions 'Run tests to verify changes work during development' but doesn't explain the DATABASE_URL requirement for integration tests.
actionable: true

