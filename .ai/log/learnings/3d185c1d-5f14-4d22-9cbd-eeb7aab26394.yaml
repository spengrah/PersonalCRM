timestamp: "2026-01-21T02:15:53.192589"
type: gotcha
summary: Integration tests skip silently without DATABASE_URL set
detail: |
  When DATABASE_URL environment variable is not set, Go integration tests skip themselves silently (t.Skip() pattern). This creates a false sense of security where `make test` shows PASS but integration tests never actually ran. The pre-push hook showed tests passing locally, but they failed in CI because CI sets DATABASE_URL. Solution: Always set DATABASE_URL in the test-integration make target to ensure tests actually run. Use personal_crm_test database for isolation from dev data.
actionable: true

---
timestamp: "2026-01-21T02:15:53.192589"
type: gotcha
summary: assert.Equal type mismatches cause CI-only failures
detail: |
  Using assert.Equal(t, 1, actualValue) fails when actualValue is int64, even though the values are numerically equal. This passed locally with tests skipped but failed in CI. Always match the exact type in test assertions - use int64(1) when comparing against int64 fields, especially for database-sourced values which are typically int64.
actionable: true

---
timestamp: "2026-01-21T02:15:53.192589"
type: distinction
summary: Notes field vs note table rows in merge preview
detail: |
  MergePreview.NotesToTransfer counts rows in the `note` table (separate entities), NOT the contact.notes text field (single text blob). This distinction was missed in testing - test expected NotesToTransfer=1 when contact.notes text was populated, but got 0 because no rows existed in the note table. Always verify whether 'notes' refers to the legacy text field or the note table.
actionable: true

