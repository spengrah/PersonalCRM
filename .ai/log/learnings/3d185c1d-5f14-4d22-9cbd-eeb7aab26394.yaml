type: rule
summary: Use personal_crm_test for all local integration tests
detail: |
  Integration tests should run against personal_crm_test database (same as E2E tests), not personal_crm. This provides: (1) Isolation from dev data, (2) Consistency with E2E test environment, (3) Safety - no risk of deleting real contacts, (4) Clean state for testing. The test-integration make target should set DATABASE_URL to postgres://crm_user:crm_password@localhost:5432/personal_crm_test?sslmode=disable
actionable: true

