timestamp: "2026-01-21T01:42:31.067617"
type: gotcha
summary: Local test success doesn't guarantee CI success for partial fixes
detail: |
  When fixing a bug in test code, running 'make test' locally may pass if it only executes the tests you've been working with, while CI runs the full suite and catches instances you missed. This creates a false sense of security. Always grep for all instances of the pattern being fixed before committing, especially when using 'replace_all' or similar tools that might not catch all variations (e.g., parameter order differences in different function calls).
actionable: true

