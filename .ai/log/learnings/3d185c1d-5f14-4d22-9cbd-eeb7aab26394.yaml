timestamp: "2026-01-21T01:22:57.647191"
type: architecture
summary: "E2E test debugging: intercept API responses for actual errors"
detail: |
  When Playwright E2E tests fail with vague UI errors, use page.waitForResponse() to intercept the actual API response and extract backend error messages. This pattern revealed all constraint violation root causes during merge testing. The UI may just show 'An error occurred' while the API response contains the actual database error.
actionable: true

---
timestamp: "2026-01-21T01:22:57.647191"
type: architecture
summary: Complex merge requires strict operation ordering for constraints
detail: |
  Multi-entity merge transactions require careful ordering to avoid constraint violations: (1) delete duplicate relationships, (2) demote conflicting unique values, (3) transfer child entities, (4) update parent entity, (5) soft-delete source. Getting this order wrong causes unique/FK constraint violations that are hard to debug.
actionable: true

