timestamp: "2026-01-21T01:32:39.693079"
type: architecture
summary: Contact merge requires defensive deduplication queries before transfers
detail: |
  When merging contacts with UPDATE queries that change foreign keys, partial unique indexes and unique constraints can be violated in non-obvious ways: (1) contact_method has partial unique index on (contact_id, type) WHERE is_primary=TRUE - must demote source's primaries before transfer, (2) connection has UNIQUE(contact_a_id, contact_b_id) - must delete source's connections to third parties that target already connects to. The pattern is: identify all unique constraints, add DELETE queries for would-be duplicates, add UPDATE queries to demote/nullify conflicting values, only then transfer.
actionable: true

