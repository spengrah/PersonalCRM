timestamp: "2026-01-21T01:32:39.693079"
type: gotcha
summary: GetMergePreview parameter order (sourceID, targetID) is counterintuitive
detail: |
  The GetMergePreview function signature is (ctx, sourceID, targetID) but the natural mental model is 'merge source INTO target', leading to calls with (ctx, target.ID, source.ID). This caused test failures where preview.TargetContact.ID didn't match the expected target because parameters were swapped. When designing merge APIs, consider using named parameters or request structs to avoid this confusion.
actionable: true

