timestamp: "2026-01-21T01:32:39.693079"
type: gotcha
summary: MCP Serena tool uses literal mode by default, requiring explicit mode parameter
detail: |
  When using mcp__serena__replace_content, the default matching behavior is regex. For literal string replacement (especially with special characters like parentheses, brackets, pipes in markdown tables), must explicitly set "mode": "literal". Without this, replacements with table rows containing pipes '|' or regex special chars will fail to match.
actionable: true

