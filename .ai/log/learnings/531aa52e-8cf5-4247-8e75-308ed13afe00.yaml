type: documentation_gap
summary: "Common Gotchas table missing: CRM markers are embedded in descriptions"
detail: |
  The .ai/rules/core.md Common Gotchas table lists many Todoist-related issues (QuickAdd note parameter, v9→v1 ID migration, etc.) but doesn't document that CRM markers in Todoist descriptions are embedded after markdown prefixes, not standalone JSON. This led to a full reimplementation of tryMatchByCRMMarker when the real issue was JSON extraction. The gotcha should be added: 'Parsing Todoist CRM markers | CRM markers are embedded after markdown prefix ([See context...]\n\n---\n{json}), not as entire description | Use strings.LastIndex to extract JSON block'
actionable: true

