timestamp: "2026-02-06T14:49:57.612612"
type: gotcha
summary: Todoist v9→v1 migration changed ID formats (numeric→alphanumeric)
detail: |
  When Todoist deprecated the v9 API (2026-02-04), task IDs changed from numeric format (e.g., 9962025942) to alphanumeric v1 format (e.g., 6fw9cQQ5JppCp7qX). Stored external_task_id values became stale, causing sync to silently skip all tasks because GetContactTaskByExternalID lookups failed. The sync appeared to succeed (processed:0) but wasn't matching any tasks. Solution: Add fallback matching via CRM marker in task description when external ID lookup fails, then migrate the stored ID.
actionable: true

---
timestamp: "2026-02-06T14:49:57.612612"
type: gotcha
summary: OAuth access tokens are encrypted in DB; migration scripts need app crypto
detail: |
  The oauth_credential table stores access_token_encrypted with encryption_nonce, not plaintext tokens. Simple Python/SQL scripts cannot call external APIs directly. Solutions: (1) Cross-compile Go binary using app's crypto, (2) Add temporary API endpoint, (3) Modify sync code to handle migration during normal operation. Cannot simply read token from DB for ad-hoc scripts.
actionable: true

---
timestamp: "2026-02-06T14:49:57.612612"
type: architecture
summary: Todoist sync processes 0 items when incremental cursor misses events
detail: |
  Incremental sync (sync_token != '*') only returns changes after the cursor. If completion/update events occurred during API migration window (when v9 was down and v1 had ID mismatches), those events were already in the cursor and won't appear in future syncs. Full sync (sync_token='*') only returns active items, not completed ones. For comprehensive migration, need fallback matching logic + full sync + manual handling of already-completed tasks.
actionable: true

---
timestamp: "2026-02-06T14:49:57.612612"
type: rule
summary: External API ID changes require fallback matching via stable identifiers
detail: |
  When external systems change ID formats, lookup by ID fails silently. Always embed a stable bidirectional reference (CRM marker with contact_id in Todoist description) that can match items even when IDs change. In processItem, when GetByExternalID returns ErrNotFound, parse stable identifier, lookup by that, and migrate the ID. This pattern applies to any external sync integration where the external system controls ID format.
actionable: true

---
timestamp: "2026-02-06T14:49:57.612612"
type: documentation_gap
summary: Production deployment blocked user before reviewing encrypted credentials approach
detail: |
  User said 'i don't want you to read the access token' and stopped SCP deployment before agent could explain the encrypted token situation. Agent should have explained the DB encryption and proposed approaches BEFORE attempting deployment. The guidance about checking with user before risky actions should explicitly cover credential handling - even reading encrypted credentials from production DB warrants user explanation first. Update core.md 'Executing actions with care' section to explicitly mention: 'When dealing with credentials/tokens (even encrypted), explain the approach and ask for approval before reading from production databases or deploying code that accesses them.'
actionable: true

