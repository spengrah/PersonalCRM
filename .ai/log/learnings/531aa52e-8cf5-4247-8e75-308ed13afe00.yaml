timestamp: "2026-02-06T14:49:57.612612"
type: distinction
summary: GetContactTaskByContact is single-task query, not safe for multi-action contacts
detail: |
  GetContactTaskByContact (contact_id + provider + kind) has :one annotation, meaning it expects exactly one result. Works for cadence tasks (one per contact) but unsafe for action tasks where multiple can exist per contact. The fallback matching logic defaults kind='cadence' when missing, which is correct for current use case (migration of cadence tasks created before multi-action support). If extending to action tasks, would need to match by additional stable identifier beyond contact_id+kind.
actionable: true

