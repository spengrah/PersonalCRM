timestamp: "2026-02-06T14:49:57.612612"
type: documentation_gap
summary: Production deployment blocked user before reviewing encrypted credentials approach
detail: |
  User said 'i don't want you to read the access token' and stopped SCP deployment before agent could explain the encrypted token situation. Agent should have explained the DB encryption and proposed approaches BEFORE attempting deployment. The guidance about checking with user before risky actions should explicitly cover credential handling - even reading encrypted credentials from production DB warrants user explanation first. Update core.md 'Executing actions with care' section to explicitly mention: 'When dealing with credentials/tokens (even encrypted), explain the approach and ask for approval before reading from production databases or deploying code that accesses them.'
actionable: true

