timestamp: "2026-02-06T14:49:57.612612"
type: distinction
summary: GetContactTaskByContact is single-task query, not safe for multi-action contacts
detail: |
  GetContactTaskByContact (contact_id + provider + kind) has :one annotation, meaning it expects exactly one result. Works for cadence tasks (one per contact) but unsafe for action tasks where multiple can exist per contact. The fallback matching logic defaults kind='cadence' when missing, which is correct for current use case (migration of cadence tasks created before multi-action support). If extending to action tasks, would need to match by additional stable identifier beyond contact_id+kind.
actionable: true

---
timestamp: "2026-02-06T14:49:57.612612"
type: gotcha
summary: Rikugan code review requires ripgrep binary, not just rg alias
detail: |
  The system had `rg` aliased to Claude Code's embedded ripgrep, but rikugan doctor failed because it needs the actual ripgrep binary in PATH. `which rg` showed the alias, hiding the issue. Had to `brew install ripgrep` to get the real binary for rikugan to work.
actionable: false

---
timestamp: "2026-02-06T15:05:42.069798"
type: gotcha
summary: Pre-push learnings hook blocks on new extractions, requires review and application
detail: |
  The pre-push hook runs learnings extraction and blocks if new learnings are found. Agent must: (1) Read the new learnings file, (2) For each actionable learning, decide if/where to apply it, (3) Commit applied changes plus the learnings files, (4) Push again. The push doesn't automatically succeed after committing learnings - the workflow requires conscious review and application. This is already documented in core.md but agents need to internalize it as part of the push workflow.
actionable: true

---
timestamp: "2026-02-06T15:05:42.069798"
type: rule
summary: Return matched data even if optional post-processing fails
detail: |
  When a function successfully finds/matches data but fails on a subsequent non-critical update (e.g., tryMatchByCRMMarker found the task via CRM marker but UpdateContactTaskExternalID failed), return the matched data anyway rather than nil. This allows the caller to proceed with the main operation rather than losing the successfully matched item due to an ancillary failure. Both code reviewers flagged this pattern - it's critical for graceful degradation.
actionable: true

---
timestamp: "2026-02-06T15:05:42.069798"
type: gotcha
summary: SQL queries with state-modifying side effects require guards when repurposed
detail: |
  UpdateContactTaskExternalID sets state='managed' because it was originally designed for temp_id→real_id flow during task creation. When repurposing it for v9→v1 ID migration, it creates a risk: migrating an unmanaged task would reactivate it. Solution: Add state guard to check task.State == repository.ContactTaskStateManaged before calling. More generally: when repurposing SQL queries for new use cases, audit all columns being SET, not just the target column.
actionable: true

---
timestamp: "2026-02-06T15:05:42.069798"
type: distinction
summary: Log warnings for non-NotFound repository errors, not just swallow them
detail: |
  When calling repository methods in fallback/optional code paths, distinguish between 'not found' (expected, no log needed) and other errors (unexpected, should warn). Pattern: if errors.Is(err, db.ErrNotFound) { return nil } else { p.logger.Warn('...', zap.Error(err)); return nil }. This prevents silent failures that make debugging harder while keeping expected 'not found' cases clean.
actionable: true

---
timestamp: "2026-02-06T17:45:01.558358"
type: gotcha
summary: Todoist CRM markers embedded in description, not entire description
detail: |
  When CRM markers are added to Todoist task descriptions, they're embedded after a markdown prefix: '[See context in CRM](...)
  
  ---
  {"contact_id":"...","crm":true,...}'. The JSON parsing must extract the last JSON object from the description using strings.LastIndex(description, "{") rather than assuming the entire description is JSON. This caused the v9→v1 ID migration fallback to fail silently—full sync returned 143KB of data but processed: 0 because json.Unmarshal failed on every description.
actionable: true

---
timestamp: "2026-02-06T17:45:01.558358"
type: gotcha
summary: Todoist full sync with '*' cursor returns data but requires correct parsing
detail: |
  When resetting Todoist sync cursor to '*' for full sync, the v1 Sync API correctly returns all items with response_keys: ["items", "labels", "projects", "sync_token", ...] and body_len: 143042. However, if item processing silently fails (e.g., CRM marker parsing fails), the sync reports 'processed: 0' even though items were returned. This creates a misleading debugging experience—the API endpoint works correctly, but data processing failures make it appear that no data came back. Always add debug logging for parsing failures within processItem loops.
actionable: true

---
timestamp: "2026-02-06T17:45:01.558358"
type: rule
summary: When adding fallback matching logic, test with actual production data format
detail: |
  The CRM marker fallback was implemented and tested with pure JSON descriptions in unit tests. Production Todoist descriptions contained markdown prefixes that weren't captured in test cases, causing silent failures at scale (117 tasks). When implementing fallback/migration logic for external integrations, extract real production samples via API debugging or logs to ensure test cases match actual data format. Unit tests with synthetic data are insufficient.
actionable: true

---
timestamp: "2026-02-06T17:45:01.558358"
type: architecture
summary: "Todoist incremental sync pattern: full sync → get cursor → incremental syncs"
detail: |
  Todoist v1 Sync API uses a two-phase pattern: (1) Full sync with cursor='*' returns all active items and a new sync_token. (2) Subsequent syncs with that token return only changed items since that token. The cursor remaining as '*' after a sync indicates either: the API returned '*' as the new token (empty response), or cursor update logic failed. In this codebase, sync at :00 with '*' → processed: 0 (parsing failed), sync at :10 with incremental token → processed: 4 (only recent changes). This pattern is important for debugging sync issues—check both API response and item processing separately.
actionable: false

