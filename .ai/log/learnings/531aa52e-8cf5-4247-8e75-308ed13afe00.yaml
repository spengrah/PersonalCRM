timestamp: "2026-02-06T17:45:01.558358"
type: gotcha
summary: journalctl --since with date strings may not work as expected across SSH
detail: |
  When debugging remote logs via SSH, 'journalctl --since "17:04"' or '--since "2026-02-06 17:05:00"' returned '-- No entries --' even though logs existed. Using '--since "1 minute ago"' or '-n 20' (recent N lines) worked reliably. Timezone mismatches or date parsing issues can cause --since filters to miss logs. For remote debugging, prefer relative time specs or fall back to -n with grep filtering.
actionable: false

