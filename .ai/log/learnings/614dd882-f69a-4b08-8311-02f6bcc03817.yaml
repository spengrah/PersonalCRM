timestamp: "2026-01-20T14:37:15.520705"
type: rule
summary: Only the icon should change color in nav state indicators, not the text label
detail: |
  When creating state indicators for navigation items, apply color/animation classes only to the icon SVG element, not the parent anchor or text label. The text should remain in its default state (text-gray-600). This maintains visual hierarchy and makes the indicator subtle. Example from prototype: icon gets `text-green-600 animate-sync-pulse` for syncing state, but the 'Imports' span stays `text-gray-600`.
actionable: true

---
timestamp: "2026-01-20T14:37:15.520705"
type: gotcha
summary: Prototype files should go in temp/ not repo root
detail: |
  When creating HTML prototypes for UI design work, place them in temp/ directory (which is git-ignored) rather than the repository root. These are meant to be attached to GitHub issues for reference, not committed to the repo. The user had to clarify this when the agent initially created the prototype in the wrong location.
actionable: true

