timestamp: "2026-01-20T14:37:15.520705"
type: gotcha
summary: Scheduler frequency doesn't match sync intervals
detail: |
  The cron scheduler checks for due syncs every hour (`0 0 * * * *`), but CalendarDefaultInterval is 15 minutes. This means calendar syncs actually run ~hourly instead of every 15 minutes as intended. When sync completes at 10:00, next_sync_at is set to 10:15, but the next scheduler check is at 11:00. This was discovered during UI design work for sync indicators when investigating what triggers should show 'syncing' state. Issue #197 was created to track this bug.
actionable: false

---
timestamp: "2026-01-20T14:37:15.520705"
type: distinction
summary: Sync state tracking is only for external API fetches, not internal processing
detail: |
  The `external_sync_state` table with status ('idle', 'syncing', 'error') only tracks external API fetches from Google Calendar/Contacts. Internal processes like EnrichmentService and ImportMatchService run synchronously within the sync pipeline, not as separate background jobs. They don't have their own sync state tracking. Future processes like RematchService (#182) would need to decide whether to reuse external_sync_state with a new source type or have separate tracking if they're long-running enough to warrant visibility.
actionable: false

---
timestamp: "2026-01-20T14:37:15.520705"
type: architecture
summary: Sync pipeline embeds matching and enrichment as synchronous steps
detail: |
  The sync flow is: RunDueSyncs() → performSync() → provider.Sync() which internally calls ImportMatchService.FindBestMatch() and EnrichmentService.EnrichContact() synchronously. These are not separate background jobs - they happen inline during the fetch from external APIs. This matters for UI indicators: if you want to show activity for 'matching' or 'enrichment', those don't exist as separate trackable states. The entire pipeline is tracked as a single 'syncing' state in external_sync_state.
actionable: false

