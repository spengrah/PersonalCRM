timestamp: "2026-01-20T14:37:15.520705"
type: rule
summary: "Aggregate sync status logic: syncing takes precedence over error"
detail: |
  When displaying aggregate sync status across multiple sources, use this precedence: (1) If ANY source is 'syncing', show syncing state; (2) Else if ANY source has 'error' status, show error state; (3) Else show synced state. This ensures users see active operations first, then problems, then normal state. Implemented as: hasSyncing = states.some(s => s.status === 'syncing'); hasError = states.some(s => s.status === 'error'); return hasSyncing ? 'syncing' : hasError ? 'error' : 'synced'.
actionable: true

