timestamp: "2026-01-26T14:28:12.007660"
type: rule
summary: PLAN.md files become outdated and should be removed after implementation
detail: |
  Project had a PLAN.md that outlined future sync architecture work but was never updated as features were implemented. This caused confusion as agents would read outdated plans that contradicted actual implementation. After completing planned work, either delete the PLAN.md or move completed items to actual documentation (architecture.md, patterns docs). Don't maintain parallel planning documents that duplicate or contradict current state documentation.
actionable: true

