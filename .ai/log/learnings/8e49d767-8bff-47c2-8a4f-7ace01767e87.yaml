timestamp: "2026-01-26T15:59:06.704897"
type: gotcha
summary: All sync providers use fetch_all strategy despite docs mentioning contact_driven
detail: |
  Documentation mentioned 'contact_driven' strategy for some providers (gcal, todoist), but code inspection revealed ALL providers (gcontacts, gcal, todoist) use `SyncStrategyFetchAll`. The 'contact_driven' strategy exists in the codebase but isn't actually used by any current provider. When documenting or implementing sync features, verify actual strategy usage in provider code rather than assuming from strategy names.
actionable: true

---
timestamp: "2026-01-26T15:59:06.704897"
type: distinction
summary: Todoist sync uses direct link table (contact_task), NOT identity matching
detail: |
  Critical distinction in sync data flow: gcontacts and gcal use identity matching (MatchOrCreate) to link external entities to contacts, but Todoist uses a pre-existing link table (contact_task) with external_task_id lookups. When working on sync features, understand which pattern applies: identity matching for discovery/unknown entities vs direct link lookup for explicitly linked entities. This affects how you handle unmatched entities and what database tables are involved.
actionable: true

