timestamp: "2026-01-26T14:28:12.007660"
type: distinction
summary: Project-scoped plugin installs still use global cache directory
detail: |
  When installing Claude Code plugins at project scope via /plugin command, the plugin files are cached at ~/.claude/plugins/cache/[org]/[plugin]/[hash]/ (global location), not in the project directory. The project's .claude/settings.json gets an enabledPlugins entry to reference it. This means project-scoped plugins are not truly isolated - they share the same cached plugin code. For true project-specific MCP server configuration, use .mcp.json in project root instead of the plugin marketplace.
actionable: false

