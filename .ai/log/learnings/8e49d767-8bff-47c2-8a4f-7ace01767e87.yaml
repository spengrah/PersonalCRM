timestamp: "2026-01-26T15:59:06.704897"
type: rule
summary: Verify actual implementation when documenting architecture, don't rely on variable names
detail: |
  Initial sync diagram incorrectly showed different strategies for different providers based on documentation text and strategy enum names. User questioned 'we do discovery sync for gcal as well, don't we?' which prompted code inspection revealing the truth: all providers use fetch_all. New rule: when creating architecture diagrams or documentation, grep for actual usage patterns in code (e.g., `grep -rn 'SyncStrategy' backend/internal/`) rather than inferring from enum definitions or existing docs which may be outdated.
actionable: true

