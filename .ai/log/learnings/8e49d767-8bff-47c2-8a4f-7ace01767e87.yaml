timestamp: "2026-01-26T14:28:12.007660"
type: gotcha
summary: Serena plugin marketplace version lacks --project-from-cwd flag
detail: |
  The official Serena plugin (serena@claude-plugins-official) does not include the --project-from-cwd flag that enables automatic project detection from working directory. This means installing via plugin marketplace may require manual project selection on each session. For single-project usage, maintaining a custom .mcp.json with the --project-from-cwd flag provides better UX than the marketplace plugin. The marketplace version is cached at ~/.claude/plugins/cache/claude-plugins-official/serena/[hash]/.mcp.json and edits may be overwritten on updates.
actionable: true

---
timestamp: "2026-01-26T14:28:12.007660"
type: architecture
summary: Serena --context claude-code flag reduces token usage for Claude Code environments
detail: |
  When running Serena MCP server in Claude Code environments, adding --context claude-code to the args disables tools that duplicate Claude Code's built-in capabilities, reducing token consumption. This is similar to how --context ide is used for VSCode/Cursor. The context flag should be set in .mcp.json args array. Single-project contexts (ide, claude-code) limit tools to project requirements when a project is specified at startup.
actionable: true

