timestamp: "2026-01-26T16:45:50.571463"
type: gotcha
summary: Gin ShouldBindJSON fails with 'invalid request' not 'EOF' for requests with no body and no Content-Type
detail: |
  When testing Gin handlers that use c.ShouldBindJSON(), sending http.NewRequest with nil body causes ShouldBindJSON to return error 'invalid request' rather than 'EOF'. The handler check `err.Error() != 'EOF'` won't catch this. Solution: In tests, always send proper Content-Type header and empty JSON body: `req.Header.Set('Content-Type', 'application/json')` with `strings.NewReader('{}')` as body, even for requests with no actual payload.
actionable: true

