timestamp: "2026-01-26T14:28:12.007660"
type: architecture
summary: Mermaid diagrams in markdown provide version-controlled architecture visualization
detail: |
  For developer documentation, Mermaid diagrams embedded in markdown files provide several advantages: renders natively in GitHub, version controlled as text (no binary files), easy to update alongside code changes, and no external tooling required. Useful for system architecture, data flow (sync processes), and request flow (layered architecture) diagrams. Place in .ai/guides/architecture.md and cross-reference from other docs.
actionable: true

