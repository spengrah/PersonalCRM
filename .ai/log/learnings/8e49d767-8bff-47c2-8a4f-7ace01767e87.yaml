summary: Mermaid diagrams improve understanding but create duplication with text-based diagrams
detail: |
  Core.md had text-based layered architecture diagram that duplicated the Mermaid sequence diagram added to architecture.md. When adding visual diagrams, search for existing text-based representations and replace with links to avoid maintaining duplicate content. This was caught during the session and fixed by replacing core.md's text diagram with a link to the visual diagram in architecture.md.
