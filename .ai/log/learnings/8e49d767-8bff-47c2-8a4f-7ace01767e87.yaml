timestamp: "2026-01-26T16:45:50.571463"
type: gotcha
summary: PostgreSQL DATE columns and timezone conversion can shift dates by one day
detail: |
  When comparing dates from Todoist (parsed as UTC midnight via time.Parse('2006-01-02', dateStr)) with PostgreSQL DATE values loaded as time.Time, applying timezone conversions like cadence.Today() can shift the date backward by one day. If contact_by is stored as 2026-01-28 (DATE in DB, loaded as UTC midnight) and converted to PST via DateOnly(), it becomes 2026-01-27 PST. Solution: Compare date components directly in UTC using year/month/day extraction: `tY, tM, tD := todoistDeadline.UTC().Date()` and `cY, cM, cD := contactBy.UTC().Date()`, then compare components.
actionable: true

---
timestamp: "2026-01-26T16:45:50.571463"
type: architecture
summary: Handler testability requires interface extraction for concrete service dependencies
detail: |
  Handlers in this codebase use concrete service types (e.g., *service.SyncService) which makes unit testing difficult without full database setup. To enable handler unit tests with mocks, define service interfaces in the handlers package (e.g., type SyncService interface { ... }) and use the interface type in the handler struct instead of the concrete type. The concrete service implementation automatically satisfies the interface. This allows tests to provide mock implementations without changing production code structure.
actionable: true

