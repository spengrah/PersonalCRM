timestamp: "2026-01-26T16:45:50.571463"
type: gotcha
summary: Todoist Sync API temp ID mappings lost if reconciliation command execution times out
detail: |
  When Todoist tasks are created via reconciliation commands with temp UUIDs, the Sync API returns a temp_id_mapping in the response. If the HTTP request times out before processing this mapping, the contact_task records retain temp UUIDs as external_task_id instead of real Todoist task IDs (numeric strings). This breaks all subsequent syncs because items from Todoist won't match the UUID-format IDs in the database. The sync will process 0 items indefinitely. Solution: Run syncs with background goroutines and adequate timeout (5+ minutes), or implement temp ID mapping persistence separately from the main sync response.
actionable: true

---
timestamp: "2026-01-26T16:45:50.571463"
type: architecture
summary: Background goroutines in HTTP handlers require explicit variable capture for loop/param variables
detail: |
  When spawning background goroutines in Gin handlers that reference request parameters or variables, those variables must be explicitly captured to avoid race conditions. The `source := c.Param('source')` variable used directly in a goroutine can be modified by subsequent requests. Pattern: `srcName := source // explicit capture for goroutine` then use `srcName` inside the goroutine. This applies to all request-scoped variables including parsed request bodies.
actionable: true

---
timestamp: "2026-01-26T16:45:50.571463"
type: gotcha
summary: React Query dynamic refetchInterval callback receives query object, not just data
detail: |
  When using a function for refetchInterval in useQuery, the callback receives the full query object, not the data directly. Access data via `query.state.data`. Example: `refetchInterval: query => { const states = query.state.data as SyncState[]; return states?.some(s => s.status === 'syncing') ? 3000 : 30000 }`. This allows polling frequency to adapt based on current query state.
actionable: true

