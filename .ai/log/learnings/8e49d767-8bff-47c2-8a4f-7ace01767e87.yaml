timestamp: "2026-01-26T14:28:12.007660"
type: documentation_gap
summary: Agent discovery requires explicit location tables and symbol search patterns
detail: |
  Documentation existed in .ai/guides/ and .ai/patterns/ but lacked quick-reference tables for finding code by role. Agents struggled to answer questions like 'where are all handlers?' or 'what sync providers exist?' without searching. Adding Quick Symbol Searches (patterns like `type *Handler struct`) and Key File Locations tables to AGENTS.md plus inventories (sync providers, React hooks, scheduler jobs, API routes) dramatically improves agent efficiency. Cross-cutting concerns tables ('When You Change X, Check Y') prevent agents from fixing only one instance of a pattern. This guidance should be in the top-level agent entry point (AGENTS.md) not buried in sub-guides.
actionable: true

