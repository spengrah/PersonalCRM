timestamp: "2026-01-26T15:59:06.704897"
type: gotcha
summary: Cross-file documentation links prevent duplication and maintain single source of truth
detail: |
  Session revealed opportunity to use markdown links instead of duplicating content across multiple doc files. When multiple docs reference the same architecture concept (like layered architecture or sync flow), maintain ONE detailed diagram/explanation and link to it from other docs using anchor links. This was applied by: (1) replacing core.md text diagram with link to architecture.md Mermaid diagram, (2) adding links from testing.md to request flow diagram, (3) planning to add link from sync.md to sync data flow diagram. Pattern to follow: detail in one place, links everywhere else.
actionable: true

