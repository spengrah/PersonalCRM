type: architecture
summary: "Sync diagram placement: implementation details belong in pattern docs, not architecture overview"
detail: |
  During session, sync data flow diagram was initially placed in architecture.md (high-level overview), but user correctly suggested moving it to .ai/patterns/sync.md since it shows implementation-specific details. Architecture.md should contain high-level system overview diagrams, while detailed flow diagrams belong in their respective pattern/guide files (.ai/patterns/sync.md for sync details). Keep architecture.md as the entry point with links to detailed diagrams elsewhere.
actionable: true

