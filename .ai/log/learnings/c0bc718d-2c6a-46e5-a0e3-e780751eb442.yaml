timestamp: "2026-01-20T13:13:57.698795"
type: distinction
summary: "Path escaping: use quotes for paths with brackets in bash commands"
detail: |
  When staging files like `frontend/src/app/contacts/[id]/page.tsx`, the command `git add frontend/src/app/contacts/[id]/page.tsx` fails with 'no matches found' because bash interprets brackets as glob patterns. Must use quotes: `git add "frontend/src/app/contacts/[id]/page.tsx"`. This applies to all CLI commands operating on Next.js dynamic route paths.
actionable: true

