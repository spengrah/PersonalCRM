timestamp: "2026-01-20T13:13:57.698795"
type: gotcha
summary: Pre-push learnings extraction can block even when no learnings are found
detail: |
  The pre-push hook ran learnings extraction which reported 'No significant learnings from this session' but still blocked the push with 'WARN New learnings extracted'. On retry, it passed. This appears to be a hook state management issue - the first run updates state even when no learnings are written. Working tree showed clean, no new files created. Solution: just retry the push - the second attempt will pass. This is a known false positive, not a real blocker.
actionable: false

