timestamp: "2026-01-20T13:13:57.698795"
type: gotcha
summary: Claude Code review checks require fixing ALL instances of a pattern, not just one
detail: |
  When fixing a UI bug (descender clipping from leading-7), the initial fix only updated one instance. The automated code review correctly flagged this as creating code style inconsistency - the same pattern existed in 6 other files and all needed to be updated. Future agents should: (1) search for all instances of the pattern being fixed across the entire codebase, (2) fix all instances in the same commit to maintain consistency. The reviewer specifically cited `.ai/rules/code-review.md` which requires consistent code style.
actionable: true

---
timestamp: "2026-01-20T13:13:57.698795"
type: rule
summary: Always add test coverage when implementing fixes, even for CSS/visual changes
detail: |
  The code review requested test coverage for a line-height CSS fix. While visual testing is complex, a simple E2E test verifying the CSS class is present (`.toHaveClass('leading-normal')`) is valuable and expected. Future agents should: (1) add at least basic assertion tests for CSS class changes, (2) use descriptive test names that explain WHY (e.g., 'should use leading-normal to prevent descender clipping'), (3) include names with descenders (g, y, p, q, j) in test data to make the purpose clear.
actionable: true

