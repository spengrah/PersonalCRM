timestamp: "2026-01-20T13:13:57.698795"
type: architecture
summary: "Leading-7 with sm:text-3xl creates descender clipping when combined with truncate"
detail: |
  The Tailwind pattern `className="leading-7 sm:text-3xl sm:truncate"` causes characters with descenders (y, g, j, p, q) to be clipped at the bottom. Leading-7 = 1.75rem line-height, but sm:text-3xl = 1.875rem font size, so the line-height is SMALLER than the font. Combined with `truncate` (which adds `overflow: hidden`), this clips the bottom of descenders. Solution: use `leading-normal` (1.5 line-height ratio) instead of `leading-7` for headings with truncate. This pattern affected 7 page headings across the codebase.
actionable: true

