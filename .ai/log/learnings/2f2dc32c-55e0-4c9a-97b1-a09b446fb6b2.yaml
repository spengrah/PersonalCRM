timestamp: "2026-01-25T20:44:46.910066"
type: distinction
summary: OAuth connection testing vs sync functionality are separate concerns
detail: |
  Testing OAuth connection (authorization flow, token storage, account display) is independent from testing sync functionality (provider registration, data fetching, sync state tracking). OAuth can work perfectly while sync functionality doesn't exist yet. The OAuth failure detection mechanism specifically detects auth token failures during sync operations, so it requires both OAuth AND sync to be implemented to test comprehensively.
actionable: true

