timestamp: "2026-02-06T23:55:42.350699"
type: gotcha
summary: Edit tool requires reading file first
detail: |
  The Edit tool returns error 'File has not been read yet. Read it first before writing to it.' if you attempt to edit a file without using Read tool first. Always call Read before Edit, even if you think you know the file contents.
actionable: true

