timestamp: "2026-02-06T23:55:42.350699"
type: rule
summary: Test file sharing types via same package, not imports
detail: |
  Backend API integration tests in tests/api/ package define local response types (like ContactIDsResponse) rather than importing from handlers package, even though the types are exported. Follow this pattern for consistency - define local types in test files.
actionable: true

