timestamp: "2026-02-07T00:49:38.262285"
type: documentation_gap
summary: Testing mode DATE precision implications not documented in testing rules
detail: |
  The .ai/rules/testing.md and testing-related patterns don't mention that accelerated cadences cause DATE columns to collapse to same-day values, breaking visual sort verification in E2E tests. This led to repeated attempts to verify visual row ordering (first with textContent, then with boundingBox) before discovering the root cause. Should document: 'E2E tests with DATE columns: verify sort via API params, not visual row order - accelerated cadences make same-day dates common.' Add to testing.md under E2E section.
actionable: true

