timestamp: "2026-02-06T23:55:42.350699"
type: gotcha
summary: gh API -f vs -F flag for integer parameters
detail: |
  GitHub CLI `gh api` requires `-F` (not `-f`) for integer parameters like sub_issue_id. Using `-f` sends the value as a string, causing 422 errors with message 'is not of type integer'. Example: `gh api --method POST /repos/{owner}/{repo}/issues/239/sub_issues -F sub_issue_id="$id"` (correct) vs `-f sub_issue_id="$id"` (wrong).
actionable: true

