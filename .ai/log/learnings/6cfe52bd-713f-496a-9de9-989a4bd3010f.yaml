timestamp: "2026-02-06T23:55:42.350699"
type: architecture
summary: SQL sort field additions require 4-query pattern
detail: |
  Adding a new sortable field (like contact_by) requires updating exactly 4 sorted queries: ListContactsSorted, SearchContactsSorted, ListContactIDsSorted, and SearchContactIDsSorted. The ID-only variants must match the full-data variants for navigation consistency. Each query uses CASE WHEN pattern with sqlc.arg(sort_field) and sqlc.arg(sort_order).
actionable: true

---
timestamp: "2026-02-06T23:55:42.350699"
type: architecture
summary: Sort field type updates span 3 files for consistency
detail: |
  When adding a new sortable field, update in exactly this order: (1) handler validation oneof tag in backend/internal/api/handlers/contact.go, (2) SortField type in frontend/src/app/contacts/page.tsx, (3) ContactListParams sort union in frontend/src/types/contact.ts. This ensures type consistency across API validation, UI state, and API client.
actionable: true

---
timestamp: "2026-02-06T23:55:42.350699"
type: gotcha
summary: NULLS FIRST vs NULLS LAST in PostgreSQL DESC sorts
detail: |
  PostgreSQL DESC sorts default to NULLS FIRST (NULLs appear at top), which is unintuitive for date fields where 'Never' contacts should appear last. Always explicitly specify NULLS LAST for DESC date sorts to keep NULL values at the end regardless of direction.
actionable: true

---
timestamp: "2026-02-06T23:55:42.350699"
type: architecture
summary: Frontend sort defaults use ternary in handleSort
detail: |
  Default sort direction for new fields is set in handleSort's ternary: `order: (field === 'cadence' || field === 'last_contacted') ? 'desc' : 'asc'`. Add field to the condition if it should default to descending (like most-recent-first), or rely on fallback 'asc' for earliest-first semantics.
actionable: true

