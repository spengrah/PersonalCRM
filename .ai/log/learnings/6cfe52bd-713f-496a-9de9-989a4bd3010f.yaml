type: gotcha
summary: make commands must run from project root
detail: |
  Commands like `make sqlc` and `make test` must be run from the project root directory (/home/dev/workspace/PersonalCRM), not from subdirectories like /backend. Running from wrong directory causes 'No rule to make target' errors.
actionable: true

