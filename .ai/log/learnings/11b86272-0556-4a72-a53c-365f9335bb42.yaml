timestamp: "2026-04-28T23:03:01.866776"
type: architecture
summary: ResizeObserver needed for layout measurements under parallel load
detail: |
  Overflow detection that relies on scrollHeight vs clientHeight in a mount-time useEffect can fail under parallel E2E load: the initial measurement reads dimensions before fonts/styles fully settle, and if deps (contactNote?.body, notesExpanded) don't change, the measurement never re-runs. Fix: wrap the measurement in a ResizeObserver that fires whenever the element's size changes, ensuring late-settling layout triggers remeasurement. This pattern applies to any UI feature that measures DOM dimensions for conditional rendering (show more buttons, truncation affordances, etc).
actionable: true

