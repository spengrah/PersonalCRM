timestamp: "2026-04-28T23:03:01.866776"
type: gotcha
summary: E2E parallel workers see each other's candidates in modal navigation
detail: |
  When E2E tests seed external contacts and open the import/link modal, parallel workers' seeded data can cause the modal to open showing a different worker's candidate (e.g., '2 of 4' pagination indicator). Tests that assert on modal content without first navigating to the correct candidate will fail intermittently. Solution: call `navigateModalToCandidate(page, handle)` after opening the modal and before making assertions, to ensure the test's own candidate is visible. The helper uses prev/next navigation to find the right candidate regardless of initial position.
actionable: true

