timestamp: "2026-04-28T23:03:01.866776"
type: gotcha
summary: test-e2e-diff missing e2e-db dependency causes pre-push failures
detail: |
  The Makefile target `test-e2e-diff` was missing the `e2e-db` prerequisite that `test-e2e` and `test-e2e-local` have. This caused the pre-push hook to run E2E tests against accumulated DB state instead of a clean DB, leading to flaky failures from test pollution. The fix is adding `e2e-db` as a dependency: `test-e2e-diff: e2e-db`. This was discovered after multiple push failures where tests passed in isolation but failed in the full pre-push suite.
actionable: true

