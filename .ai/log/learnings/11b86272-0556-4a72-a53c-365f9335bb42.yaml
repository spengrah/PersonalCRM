timestamp: "2026-04-28T22:36:23.136252"
type: architecture
summary: Dedup time-window queries must include all semantically-significant dimensions, not just entity + time
detail: |
  The interaction 30-min dedup FindInWindow query was initially using (contact_id, occurred_at ±30min, source) but missing direction. This caused false-positive dedup when a user logged an outbound interaction followed by an inbound interaction on the same contact within 30 minutes - the second call incorrectly returned the first interaction ID despite different directions. Root cause: PR-B added direction selection to manual interactions, but the dedup window wasn't updated to include it. Fix required: (1) Add direction param to FindInteractionInWindow SQL query, (2) Update repository method signatures (FindInWindow, FindInWindowTx), (3) Update all service-layer call sites, (4) Run make sqlc, (5) Add regression test. General principle: When two events can be semantically distinct despite same entity+time (like outbound vs inbound), the dedup window MUST include the distinguishing dimension. When adding semantic columns to tables with existing dedup logic, audit FindInWindow queries and unique constraints.
actionable: true

