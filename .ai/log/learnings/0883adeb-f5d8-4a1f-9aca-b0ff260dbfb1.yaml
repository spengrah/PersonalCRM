timestamp: "2026-01-28T09:56:25.652763"
type: gotcha
summary: E2E assertions on text values fail with multiple matches when DB contains existing data from previous runs
detail: |
  E2E test used `page.getByText('Weekly', { exact: true })` which failed in strict mode because multiple contacts had 'Weekly' cadence from previous test runs or seed data. Solution: Use `.first()` to check at least one exists, or scope queries to specific test-created rows. This is a common pattern when testing list/table displays that don't clean DB state between runs.
actionable: true

