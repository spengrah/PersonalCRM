timestamp: "2026-01-28T09:56:25.652763"
type: gotcha
summary: Makefile GREP parameter expects PLAYWRIGHT_GREP not GREP environment variable
detail: |
  Running `make test-e2e-local GREP="pattern"` silently ignores the GREP parameter because the Makefile looks for `PLAYWRIGHT_GREP` environment variable instead. Correct usage: `PLAYWRIGHT_GREP="pattern" make test-e2e-local` or use test-e2e-diff which auto-detects changed files.
actionable: true

---
timestamp: "2026-01-28T09:56:25.652763"
type: gotcha
summary: Running Playwright tests directly without make targets fails with 401 INVALID_API_KEY
detail: |
  Running `bunx playwright test` directly bypasses the Makefile's environment setup which sets API_KEY and creates frontend/.env.local. Tests fail with 401 errors because the test API endpoint requires authentication. Always use `make test-e2e-diff` or `make test-e2e-local` which properly configure the test environment with API keys and database URLs.
actionable: true

