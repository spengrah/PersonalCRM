type: documentation_gap
summary: Missing guidance on extracting shared utilities early
detail: |
  The code review caught duplicate formatCadence implementations across multiple files. The agent should have proactively extracted the utility function when the second usage appeared. Existing docs don't emphasize 'extract on second use' as a pattern. Strengthen .ai/rules/core.md 'Code Quality' section to explicitly state: 'Extract shared utilities immediately on second usage - don't wait for code review to catch duplication.'
actionable: true

