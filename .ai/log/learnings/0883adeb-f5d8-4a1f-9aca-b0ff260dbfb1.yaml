timestamp: "2026-01-28T09:44:42.428632"
type: gotcha
summary: Variable type inference lint errors with multi-assignment
detail: |
  When declaring multiple variables with the same initial value, staticcheck QF1011 requires using short variable declaration (:=) instead of explicit type: Use `posA, posB := -1, -1` not `var posA, posB int = -1, -1`. The type is inferred from the right-hand side values.
actionable: true

