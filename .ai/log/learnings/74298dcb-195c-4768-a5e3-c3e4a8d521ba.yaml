timestamp: "2026-04-16T18:27:26.649918"
type: architecture
summary: Event-driven coordination for multi-agent async work using Monitor on log completion markers
detail: |
  When waiting for id-agents workers to complete tasks, use Monitor with tail -F on agent log files, filtering for completion markers (✅ Query) instead of ScheduleWakeup polling. This provides push notifications on actual completion rather than guessing wait times. Pattern: `tail -F /tmp/{agent}.log | grep '✅ Query'` as persistent monitor. Avoids burning prompt cache on repeated polling and responds immediately when work completes.
actionable: true

