timestamp: "2026-04-17T08:47:58.859139"
type: gotcha
summary: Reviewer caught stale struct returns from two-phase updates
detail: |
  ContactService.UpdateContact did profile update → ApplyContactByOverride (second update) → return. The returned Contact had stale updated_at because the second update bumped the DB row's updated_at but the in-memory struct wasn't refreshed. Fix: refetch via contactRepo.GetContact(ctx, id) inside the same tx after the override, before returning. Also added test asserting returned.UpdatedAt == refetched.UpdatedAt. Pattern applies to any two-phase write where the second write touches columns included in the returned struct.
