timestamp: "2026-04-16T18:50:10.363506"
type: documentation_gap
summary: Core rule "Never write raw SQL" doesn't explicitly state it applies to integration tests
detail: |
  CI review (PR #285) caught raw SQL INSERT statements in integration tests at `backend/tests/consumer_cadence_updater_integration_test.go:4583-4594`. The core rule exists in `.ai/rules/core.md` ("Never write raw SQL in Go → Use sqlc-generated queries") but doesn't explicitly include test code in its scope. This ambiguity allowed the violation to pass through implementation and manual review before automated CI caught it. The rule should state explicitly: "This applies to ALL Go code: production code, integration tests, test fixtures, and helper scripts. Use `make sqlc` to generate queries even for test setup code that populates shadow tables or creates fixtures." Add to Common Gotchas: "Raw SQL in integration test setup → Use sqlc-generated queries for ALL inserts/updates, including test fixtures"
actionable: true

