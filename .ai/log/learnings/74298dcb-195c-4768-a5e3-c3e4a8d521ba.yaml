type: documentation_gap
summary: plan-and-ship skill doesn't explain foreground sub-agent suspension on tool return
detail: |
  The plan-and-ship skill (/.claude/skills/plan-and-ship/SKILL.md) describes spawning named sub-agents and using SendMessage to resume them, but doesn't clarify that foreground sub-agents (spawned without run_in_background: true) suspend when their turn ends (Agent tool call returns). SendMessage queues a message, but no runtime consumes it. The skill should document: (1) use run_in_background: true if you want asynchronous execution with notifications, or (2) foreground agents that return mid-work require re-spawn (not just SendMessage) to continue. The session shows the orchestrator guessing wrong ('it's running in background') because the skill implied SendMessage would resume.
actionable: true

