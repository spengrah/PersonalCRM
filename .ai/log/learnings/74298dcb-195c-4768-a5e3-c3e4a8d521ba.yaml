timestamp: "2026-04-17T08:47:58.859139"
type: architecture
summary: Inline-first dispatch + durable claims prevents event double-processing
detail: |
  When refactoring from async-only to inline-capable consumers: InteractionRecorder.HandleEvent synchronously calls CadenceUpdater.HandleEvent (inline-first), which claims (event_id, consumer='cadence_updater') in event_consumer_claim table before writing. River worker still fires after tx commit but sees the claim and no-ops. This avoids manual-path double-processing without special-casing manual events or removing bus publish (both rejected in plan review). The claim table needs (event_id uuid, consumer text, claimed_at timestamptz, PK (event_id, consumer)) with forward-pointer comment for future cleanup/TTL. Applies to any cutover where both inline and async paths must coexist.
actionable: true

