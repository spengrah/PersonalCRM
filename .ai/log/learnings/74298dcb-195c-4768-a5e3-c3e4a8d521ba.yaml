detail: |
  core.md § Code Quality prohibits inline comments referencing "the current task, fix, or callers", stating they "belong in the PR description and rot as the codebase evolves." PR 8 had pervasive violations across main.go, contact.go, cadence_updater.go, enrichment.go with comments like "PR 8 Step 10", "plan Decision 3". Root cause: (1) rule uses abstract terms, doesn't explicitly forbid "PR #N" or "Step N" patterns, (2) agents implementing detailed multi-step plans naturally reference step numbers for traceability, (3) rule buried in Code Quality section, not visible during active implementation. Strengthen by: adding to Common Gotchas table with concrete forbidden examples ("no 'PR #286'", "no 'Step 10'", "no 'Decision 3'"), or creating "Comment Hygiene During Implementation" subsection that explicitly addresses plan-reference tension.
