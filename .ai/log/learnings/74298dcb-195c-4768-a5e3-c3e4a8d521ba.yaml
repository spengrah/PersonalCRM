timestamp: "2026-04-16T18:27:26.649918"
type: architecture
summary: id-agents manager provides /remote endpoint for programmatic command dispatch from orchestrator
detail: |
  The id-agents manager (http://localhost:4100) exposes POST /remote endpoint accepting {command, from} to execute CLI commands like /deploy or /ask programmatically. Team context is passed via X-Team-Name header or ?team= query param. This allows orchestrator agents to dispatch work to specialist agents and poll for results via GET /agents/{name}/news. News feed contains query.received, query.progress, query.completed, and outbound.reply events with full message content.
actionable: true

