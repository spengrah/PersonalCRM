timestamp: "2026-04-16T18:27:26.649918"
type: distinction
summary: "ScheduleWakeup cache-aware delay selection: stay under 5 min or commit to 20+ min"
detail: |
  Anthropic prompt cache has 5-minute TTL. Delays under 300s keep cache warm; crossing 300s pays cache miss. Avoid 300s exactly (worst of both worlds). For active work expecting imminent completion: 60-270s. For truly idle waiting or long-running work: 1200-1800s (one cache miss buys long wait). Example: backend running 'make test' (5-10 min typical) → 420s (7 min) is better than 90s repeated polls or 300s boundary crossing. Think in cache windows, not round-number minutes.
actionable: true

