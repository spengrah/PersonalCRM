timestamp: "2026-04-17T08:47:58.859139"
type: gotcha
summary: Sole-writer AST guards need function-level allowlist, not file-level
detail: |
  Plan's AST guard regex matched function names like UpdateContactCadence* but missed *Tx variants (UpdateContactOutreachAtTx, UpdateContactLastContactedIfLaterTx). File-level allowlist (backend/internal/consumer/cadence_updater.go, backend/internal/repository/contact.go for sqlc definitions, backend/internal/todoist/provider.go for explicit carve-outs) plus grep -F on query names wasn't enough — reviewers wanted explicit function+line tuples in the allowlist to prevent drift. Final guard: allowedFunctions map[string][]int with {filename: [line1, line2]} so adding a new cadence write outside the map fails CI. Includes negative test (inject a banned query call, assert guard fails).
actionable: true

