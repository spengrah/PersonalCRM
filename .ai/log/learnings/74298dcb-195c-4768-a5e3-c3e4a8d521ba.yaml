timestamp: "2026-04-17T08:47:58.859139"
type: gotcha
summary: Long-running agent work can hit Anthropic auth 401 mid-task
detail: |
  Backend agent ran ~6 hours implementing PR 8 (Steps 1-10 of plan), hit Anthropic auth 401 error, left 2 commits but incomplete work. The agent had deleted PR 7 integration tests with a note 'Step 15 adds replacements' but failed before Step 15. When resuming, explicitly brief the agent on what's already committed vs what's incomplete, and list remaining steps by number. The gap between 'what I said I'd do' and 'what I actually committed' matters — trust git log, not agent summaries.
actionable: true

