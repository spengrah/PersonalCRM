timestamp: "2026-04-20T22:58:25.620219"
type: gotcha
summary: "Staged changes snapshot at commit time: git commit only captures what's in the index"
detail: |
  When `git rm --cached backend/main` was staged but `.gitignore` edit was not, `git commit` captured only the deletion — the gitignore edit stayed unstaged. The fix: `git add .gitignore && git commit --amend --no-edit` to add the missed file to the same logical commit. This is a Git 101 issue but the session shows user prefers amending over a follow-up commit when the two changes are logically one unit (untrack + ignore pattern), even though CLAUDE.md normally discourages --amend.
actionable: true

