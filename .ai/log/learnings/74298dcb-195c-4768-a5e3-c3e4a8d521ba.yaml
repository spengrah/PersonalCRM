timestamp: "2026-04-17T08:47:58.859139"
type: distinction
summary: Manual-source forward-only vs unconditional semantics differ from provider sources
detail: |
  Provider sources (gcal, todoist) use forward-only (max(existing, new)) for last_contacted/last_outreach_at to handle out-of-order sync. Manual source must ALWAYS update (unconditional branch), even if the new timestamp is older, because it represents user correction intent. Plan initially said manual flows inline-call CadenceUpdater.HandleEvent with source=manual, which routes to unconditional. This is correct. But the reviewer found that EnrichmentService (used by import/link) accepts explicit user-selected cadence overrides (enrichment.go:128, import.go:530) and must ALSO go through the unconditional branch when DTO includes cadence field. The rule: if user explicitly provided the field (not just system-inferred), treat as manual-source semantics.
actionable: true

