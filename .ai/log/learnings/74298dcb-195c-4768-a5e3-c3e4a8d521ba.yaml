timestamp: "2026-04-16T18:27:26.649918"
type: gotcha
summary: id-agents external repo installation triggers multiple security permission prompts by design
detail: |
  Installing id-agents from GitHub triggers three sequential permission prompts: (1) npm install in external repo (lifecycle scripts from untrusted code), (2) copying skills into .claude/skills/ (self-modification of agent config), (3) running background processes from external repo. This is security-by-design, not a bug. Each requires explicit user approval. When reinstalling or setting up id-agents, expect and plan for these prompts rather than treating them as blockers.
actionable: true

