timestamp: "2026-04-20T22:58:25.620219"
type: gotcha
summary: Sub-agents spawned without run_in_background don't resume on SendMessage
detail: |
  When Agent() is called without run_in_background: true and returns a result, the sub-agent's turn ends. SendMessage to that named agent queues a message but there's no active runtime consuming it — the agent is suspended, not running. To resume: either re-spawn the Agent with the same name (unclear if state persists) or provide a self-contained brief for a fresh spawn. The plan-and-ship skill documentation implies SendMessage resumes execution, but that only works if the agent is still running or was spawned with run_in_background.
actionable: true

