timestamp: "2026-04-20T22:58:25.620219"
type: rule
summary: Shadow mode bake verification requires checking divergence count, time range, and daily activity
detail: |
  When verifying a shadow mode bake (e.g., PR 7's event_shadow_cadence_observation), check: (1) paired event count (direct vs consumer must be 1:1), (2) divergent pairs query (must be 0 across all tracked columns), (3) time span (first_obs to last_obs must exceed gate threshold like 48h), (4) daily activity distribution (observations should appear on multiple days, proving shadow path is still actively writing, not stale). This four-part check catches both correctness and staleness issues.
actionable: true

