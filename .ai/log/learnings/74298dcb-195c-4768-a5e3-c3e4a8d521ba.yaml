timestamp: "2026-04-20T22:58:25.620219"
type: gotcha
summary: branch-cleanup script checks both tracked modifications and untracked files
detail: |
  The branch-cleanup.sh script uses `git status --porcelain` which fails on ANY dirty state — tracked modifications (like backend/main binary drift) AND untracked files (like .ai/skills/ from id-agents). Using .git/info/exclude (local-only) can unblock cleanup for untracked artifacts without polluting the repo .gitignore. For tracked files that shouldn't be tracked, the workflow is: stash → cleanup → pop → gitignore + git rm --cached → commit.
actionable: true

