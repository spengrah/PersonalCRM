timestamp: "2026-04-17T08:47:58.859139"
type: rule
summary: Never delete test files with 'Step N adds replacements' if Step N might not run
detail: |
  Backend deleted backend/tests/consumer_cadence_updater_integration_test.go and backend/tests/api/ingest_cadence_test.go in commit 5fc4d34 with message 'Step 15 of the plan adds cutover-targeted replacements', then hit auth 401 before Step 15. This left the branch in failing-tests state. Either: (a) delete tests in the SAME commit as their replacements, or (b) keep old tests until new tests land, then delete in a separate commit. Never commit a test-deletion with a promissory note about future work.
actionable: true

