timestamp: "2026-04-20T22:58:25.620219"
type: distinction
summary: "Git exclude vs gitignore for agent artifacts: use local exclude for single-machine workflows"
detail: |
  When id-agents worker workspaces (.ai/skills/*, **/.claude/) appear as untracked, there's a choice: (1) .git/info/exclude (local-only, just unblocks your machine) vs (2) repo .gitignore (shared, anyone running id-agents gets clean tree). For single-user repos where only one machine runs the agents, local exclude is cleaner — doesn't assume all contributors use the same tooling. Already-gitignored patterns like .claude/cache/ suggest some agent artifacts ARE in .gitignore, so consistency argues for adding new ones too, but user chose local exclude.
actionable: true

