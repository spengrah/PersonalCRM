timestamp: "2026-04-16T18:27:26.649918"
type: rule
summary: "Multi-agent orchestration: reviewer must run AFTER implementer completes, not in parallel"
detail: |
  When using id-agents team (architect/backend/reviewer), dispatch reviewer only after implementer returns with results. Running in parallel causes reviewer to review pre-change state, making findings either stale or missing new issues. Correct sequence: architect analyzes → implementer implements → reviewer reviews NEW code → implementer fixes findings → loop. Only parallelize truly independent work (e.g., backend API + frontend UI for different features). User explicitly corrected this mistake when Claude dispatched backend+reviewer simultaneously.
actionable: true

