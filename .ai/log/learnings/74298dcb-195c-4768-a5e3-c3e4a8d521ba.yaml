timestamp: "2026-04-20T22:58:25.620219"
type: architecture
summary: Event-bus foundation PRs follow shadow → cutover → next consumer pattern with 48h bake gates
detail: |
  The event-bus-foundation migration (#180) is a 12-PR sequence where each consumer follows a two-PR cadence: PR N (shadow mode — consumer observes, writes to event_shadow_*_observation, no side effects) → 48h prod bake to verify zero divergences → PR N+1 (cutover — consumer becomes sole writer, direct path removed). PR 7/8 (CadenceUpdater), PR 9a/9b (FollowUpManager), and likely later PRs all follow this. The 48h gate is in the spec (§5 line 1063 for PR 8). Bake verification is non-negotiable — CI can pass before the bake, but merge is blocked until divergence check clears.
actionable: true

