timestamp: "2026-04-17T08:47:58.859139"
type: gotcha
summary: Specs can omit columns even after thorough review — trust the code
detail: |
  Event-bus spec §3.4.2 listed 4 cadence columns (last_contacted, last_outreach_at, last_response_at, contact_by) but implementation needed a 5th: last_interaction_at. This wasn't in the spec's enumerated list but was tracked by existing code paths. When implementing a cutover that claims 'sole writer' semantics, grep for ALL columns written by the legacy path, not just the spec's list. Reviewer caught this in round 1 as a 'piggyback' issue — the SQL was piggybacking last_interaction_at on apply_last_contacted without an independent flag, making it impossible to control separately (e.g., on merge).
actionable: true

