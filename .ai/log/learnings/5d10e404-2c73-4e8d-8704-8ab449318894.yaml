timestamp: "2026-04-08T19:48:29.902328"
type: gotcha
summary: sqlc parameter struct changes break repository layer when adding query params
detail: |
  When adding new sqlc query parameters (e.g., adding `followup_filter` to 10+ contact listing queries), sqlc regenerates param structs from simple strings to compound structs. This breaks all repository method calls site-wide. Pattern: after `make sqlc`, always run `go build ./cmd/crm-api` to catch signature mismatches. Then systematically fix all call sites by wrapping params in the new struct (e.g., `CountContacts(filter)` → `CountContacts(CountContactsParams{CadenceFilter: filter, FollowupFilter: followupFilter})`). Most common in queries with multiple optional filters.
actionable: true

---
timestamp: "2026-04-08T19:48:29.902328"
type: architecture
summary: Follow-up task lifecycle requires completing old task BEFORE creating new one
detail: |
  When a follow-up task is completed and triggers a new outbound interaction, the service must mark the current task as completed FIRST, then call RecordInteraction (which calls CreateOrRefreshFollowUp). Otherwise, CreateOrRefreshFollowUp finds the dying task, refreshes it, then the caller marks it completed, leaving no pending follow-up. Sequence matters: (1) mark task completed, (2) RecordInteraction, (3) CreateOrRefreshFollowUp creates successor. This prevents accidentally refreshing the task being completed.
actionable: true

