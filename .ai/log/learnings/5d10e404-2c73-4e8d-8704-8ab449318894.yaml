timestamp: "2026-04-08T19:48:29.902328"
type: rule
summary: API test coverage must include new request/response fields and validations
detail: |
  When adding new API fields (direction in interaction requests, has_pending_followup in contact responses, followup_filter query params, follow_up kind validation), must write handler-level API tests that verify: (1) new request fields parse correctly, (2) new response fields serialize correctly, (3) new validations reject invalid input, (4) new query parameters filter as expected. Integration tests verify DB behavior; API tests verify HTTP contract. Both are required for complete coverage.
actionable: true

