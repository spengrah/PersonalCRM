timestamp: "2026-04-08T19:48:29.902328"
type: distinction
summary: "Direction-conditional timestamp updates: outbound vs inbound vs mutual"
detail: |
  The direction model creates three distinct update patterns: (1) outbound-only: updates ONLY last_outreach_at (does NOT reset cadence clock), (2) inbound-only: updates last_contacted, last_interaction_at, last_response_at, contact_by (resets cadence), (3) mutual: updates ALL five fields + contact_by. Critical: outbound interactions do NOT update last_contacted or contact_by. This prevents cadence reset when user reaches out first. The isManual flag overrides forward-only semantics for all three patterns (manual always updates, automated uses forward-only).
actionable: true

