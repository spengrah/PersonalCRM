timestamp: "2026-04-08T19:48:29.902328"
type: rule
summary: Date-based deadline calculations must use date arithmetic not time.Duration
detail: |
  Todoist deadlines and cadence calculations are date-based ("N days later"), not timestamp-based. Using `time.Duration` (e.g., `24 * time.Hour * N`) introduces DST drift and time-of-day leakage. Correct pattern: use `cadence.Today(t).AddDate(0, 0, days)` for date arithmetic. Store watchdog windows as `int` (day counts) in config, not `time.Duration`. This matches existing cadence calculation patterns and prevents subtle date drift bugs.
actionable: true

