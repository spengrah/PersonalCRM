timestamp: "2026-04-09T09:55:05.357506"
type: gotcha
summary: Telegram OffsetDate parameter is backwards — fetches messages BEFORE the date
detail: |
  When implementing Telegram backfill, using `OffsetDate` to specify a "since" date fails because Telegram's `offset_date` means "return messages BEFORE this date", which is the opposite of the expected behavior. Fresh backfills should start from newest messages (no OffsetDate) and stop when hitting the backfill horizon in the iteration loop. This was discovered in commit 726d3b3 when backfill was returning the wrong messages.
actionable: true

---
timestamp: "2026-04-09T09:55:05.357506"
type: gotcha
summary: Telegram InputPeerUser requires access hash — lost in two-pass discovery/backfill
detail: |
  Telegram's API requires an access hash to fetch message history for InputPeerUser. A two-pass approach (discover dialogs → store chat IDs → reconstruct peers for backfill) loses the access hashes from the dialog iterator, causing backfill to fail. The fix merges discovery and backfill into one pass, using the InputPeerClass from the dialog iterator which includes the access hash. This was discovered in commit 008aa89 when message history fetching was failing for private chats.
actionable: true

---
timestamp: "2026-04-09T09:55:05.357506"
type: gotcha
summary: Frontend polling must bridge fresh-connect-to-backfill-start window
detail: |
  After a Telegram connection succeeds, there's a timing window where `connected=true` but `backfill_in_progress` is still false and `last_sync_at` is null. The UI needs to poll during this window, not just when backfill_in_progress is true. The fix adds a condition: poll if `(connected && !last_sync_at)` or `backfill_in_progress`. Discovered in commit 4fdbbf3 when fresh connections weren't showing backfill progress immediately.
actionable: true

---
timestamp: "2026-04-09T09:55:05.357506"
type: gotcha
summary: E2E route mocks need ** wildcard suffix to match query params
detail: |
  Playwright route mocking with `page.route('**/api/v1/path')` only matches exact paths, not paths with query parameters. For endpoints that accept query params, use `page.route('**/api/v1/path**')` with double asterisk at the end. Discovered in commit e9270a3 when chat list mocking wasn't matching paginated requests.
actionable: true

