timestamp: "2026-04-08T19:48:29.902328"
type: gotcha
summary: Adding repository dependency to service requires updating all test constructors
detail: |
  When adding contactTaskRepo parameter to NewContactService(), must update not just main.go but ALL test files that construct the service (contact_ids_test.go, contact_merge_test.go, interaction_test.go, etc.). Pattern: grep for all NewContactService calls, add `contactTaskRepo := repository.NewContactTaskRepository(database.Queries)` before service creation, then pass it. Batch edit with sed or manual updates. Compilation won't catch test files until you run `make test`.
actionable: true

