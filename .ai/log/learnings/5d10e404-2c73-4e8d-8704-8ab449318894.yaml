type: documentation_gap
summary: Plan review feedback revealed missing wiring, observability, and test coverage specs
detail: |
  Initial plan omitted: (1) constructor signature changes for NewContactService (adding contactTaskRepo parameter), (2) observability requirements from spec Section 11.8 (log follow-up created/refreshed/completed with contact/task IDs and due dates), (3) API-level test coverage for new fields/validations. These were all required by the spec or architectural patterns but weren't in the initial plan. Plan phase should explicitly include: constructor wiring changes, logging/observability for new paths, and test coverage matrix (unit/integration/API) for all changes. The spec's own review rubric provides the checklist.
actionable: true

