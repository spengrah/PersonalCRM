type: rule
summary: Automated code review feedback must be verified against actual codebase patterns
detail: |
  The Claude Code Review bot flagged 'Critical Issue #1 & #2' about missing URL state synchronization for the cadence filter. However, this was incorrect - the contacts list page uses React useState for ALL parameters (sort, order, search, page, cadence_filter) with no URL sync on the list page itself. URL params are only used for navigation context when going to detail pages. The review misunderstood the existing architectural pattern. Future agents should verify automated review feedback against the actual codebase implementation patterns before making changes.
