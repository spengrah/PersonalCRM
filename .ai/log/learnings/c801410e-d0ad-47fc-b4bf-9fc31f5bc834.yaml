timestamp: "2026-02-07T14:29:53.553957"
type: gotcha
summary: Empty string cadence values require explicit handling in filter logic
detail: |
  The cadence field can have three states: NULL (no value), empty string '' (cleared/legacy), and valid enum values. When filtering for 'no_cadence', must check both IS NULL OR cadence = ''. When filtering for 'has_cadence', must check IS NOT NULL AND cadence != ''. Only checking IS NULL/IS NOT NULL misclassifies empty strings. This pattern exists throughout the codebase (e.g., contact_by computation at contact.sql:353, migration 027).
actionable: true

