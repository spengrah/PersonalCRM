timestamp: "2026-02-07T14:08:43.015484"
type: architecture
summary: Filter state lives in URL params, not React state
detail: |
  The cadence filter is stored in URL searchParams and synchronized via useEffect, not maintained as independent React state. Pattern: read from URL → setParams updates URL → useEffect syncs params → triggers query refetch. This ensures filter state survives page refresh and enables shareable filtered URLs. Contrast with sort/search which follow same pattern.
actionable: false

