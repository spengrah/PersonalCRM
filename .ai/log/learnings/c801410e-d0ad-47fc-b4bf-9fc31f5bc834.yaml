timestamp: "2026-02-07T14:08:43.015484"
type: documentation_gap
summary: CLAUDE.md missing guidance on sqlc param migration strategy
detail: |
  When adding params to existing queries, the choice between positional vs named params has cascading effects. The gotchas section warns about sqlc type changes but doesn't explain: 1) when to convert positional→named (answer: when adding params), 2) that ALL params must use same style (can't mix $1 with sqlc.arg), 3) that unsorted queries need explicit names (page_offset not $2). Add to gotchas: 'Adding params to queries → convert all positional to named sqlc.arg() → regenerate → expect field name changes'.
actionable: true

