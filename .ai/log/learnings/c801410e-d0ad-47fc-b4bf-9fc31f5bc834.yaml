timestamp: "2026-02-07T14:29:53.553957"
type: documentation_gap
summary: Contact list filter addition checklist needs empty string handling reminder
detail: |
  The existing gotcha 'Adding new contact list filter | Must update all 10 SQL queries...' correctly lists all the places to update but doesn't mention that nullable string fields require explicit empty string checks alongside NULL checks. This pattern was missed during initial implementation and caught only during code review. The documentation should explicitly warn about three-state nullable string fields (NULL, '', valid_value) requiring compound conditions.
actionable: true

