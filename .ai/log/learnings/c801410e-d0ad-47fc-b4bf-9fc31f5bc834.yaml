timestamp: "2026-02-07T14:17:45.313554"
type: documentation_gap
summary: Integration test template not documented, leading to missing migrations
detail: |
  The session shows an agent creating an integration test without the required `db.RunMigrations()` call, which worked locally but failed in CI with "relation 'contact' does not exist". The agent had to reverse-engineer the pattern by reading other integration test files. This reveals a documentation gap: there's no template or guide for writing integration tests. Should add to `.ai/patterns/testing.md` or create `.ai/templates/integration-test.go` showing the required setup: DATABASE_URL check → getMigrationsPath() → db.RunMigrations() → db.NewDatabase().
actionable: true

