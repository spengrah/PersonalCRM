timestamp: "2026-02-07T14:08:43.015484"
type: architecture
summary: Cadence filter requires 10 SQL query modifications for completeness
detail: |
  Adding a filter to contact listing requires updating all 10 queries: 8 listing queries (list/search × sorted/unsorted × full/IDs-only matrix) PLUS 2 count queries (CountContacts, CountSearchContacts). Forgetting count queries breaks pagination totals. Pattern: `AND (sqlc.arg(filter) = '' OR (sqlc.arg(filter) = 'value' AND condition))` for optional filters.
actionable: true

