timestamp: "2026-02-07T14:08:43.015484"
type: gotcha
summary: sqlc regeneration changes param struct field names unpredictably
detail: |
  When converting SQL queries from positional params ($1, $2) to named params (sqlc.arg(name)), sqlc regeneration changes generated Go struct field names. E.g., ListContacts changed `Limit`/`Offset` to `PageLimit`/`PageOffset`, SearchContacts changed `PlaintoTsquery` to `SearchQuery`. This breaks compilation and requires updating all repository calls. Always run `go build ./cmd/crm-api` after `make sqlc` to catch these before writing repository code.
actionable: true

---
timestamp: "2026-02-07T14:08:43.015484"
type: gotcha
summary: E2E waitForResponse can miss already-fired responses
detail: |
  When testing URL param changes (e.g., filter reset to All), `page.waitForResponse()` can timeout if the response fires before the listener is set up. For reset-to-default cases where the param is removed from URL, prefer visibility assertions with timeout over response waiting: `await expect(...).toBeVisible({ timeout: 10000 })` instead of `await page.waitForResponse(!resp.url().includes('param'))`.
actionable: true

