timestamp: "2026-02-07T14:08:43.015484"
type: distinction
summary: Empty string vs undefined for optional filter query params
detail: |
  Backend uses empty string `''` as 'no filter' sentinel in SQL (sqlc.arg(cadence_filter) = '' means skip filtering). Frontend uses `undefined` to omit param from URL entirely. API client spreads with `...(params.cadence_filter && { cadence_filter: params.cadence_filter })` to only send when defined. Never send empty string from frontend - it's a backend-only implementation detail.
actionable: true

