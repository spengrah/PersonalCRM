timestamp: "2026-02-07T14:08:43.015484"
type: architecture
summary: Cadence filter requires 10 SQL query modifications for completeness
detail: |
  Adding a filter to contact listing requires updating all 10 queries: 8 listing queries (list/search × sorted/unsorted × full/IDs-only matrix) PLUS 2 count queries (CountContacts, CountSearchContacts). Forgetting count queries breaks pagination totals. Pattern: `AND (sqlc.arg(filter) = '' OR (sqlc.arg(filter) = 'value' AND condition))` for optional filters.
actionable: true

---
timestamp: "2026-02-07T14:08:43.015484"
type: rule
summary: Navigation context params must flow through detail page listContext
detail: |
  When adding new list filter params (like cadence_filter), they must be: 1) extracted from URL searchParams in detail page's listContext object, 2) passed to useContactIDs hook, 3) preserved in buildNavigationUrl for prev/next navigation. Missing any of these breaks list→detail→list navigation consistency.
actionable: true

---
timestamp: "2026-02-07T14:08:43.015484"
type: distinction
summary: Empty string vs undefined for optional filter query params
detail: |
  Backend uses empty string `''` as 'no filter' sentinel in SQL (sqlc.arg(cadence_filter) = '' means skip filtering). Frontend uses `undefined` to omit param from URL entirely. API client spreads with `...(params.cadence_filter && { cadence_filter: params.cadence_filter })` to only send when defined. Never send empty string from frontend - it's a backend-only implementation detail.
actionable: true

