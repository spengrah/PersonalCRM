timestamp: "2026-02-07T14:17:45.313554"
type: gotcha
summary: Integration tests in CI require explicit db.RunMigrations() call
detail: |
  CI runs integration tests against a bare PostgreSQL service (pgvector/pgvector:pg16) without pre-existing schema. Unlike local dev where migrations run automatically via docker-compose, CI integration tests must call `db.RunMigrations(databaseURL, getMigrationsPath())` before `db.NewDatabase()`. Missing this causes "relation does not exist" errors in CI even when tests pass locally. Pattern: check DATABASE_URL, run migrations, then connect - used by all integration tests in backend/tests package.
actionable: true

