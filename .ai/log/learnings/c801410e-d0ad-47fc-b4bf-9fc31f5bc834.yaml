timestamp: "2026-02-07T14:08:43.015484"
type: rule
summary: Navigation context params must flow through detail page listContext
detail: |
  When adding new list filter params (like cadence_filter), they must be: 1) extracted from URL searchParams in detail page's listContext object, 2) passed to useContactIDs hook, 3) preserved in buildNavigationUrl for prev/next navigation. Missing any of these breaks list→detail→list navigation consistency.
actionable: true

