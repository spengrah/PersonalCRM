timestamp: "2026-02-07T14:17:45.313554"
type: architecture
summary: CI test database is bare PostgreSQL without pre-run migrations
detail: |
  The GitHub Actions workflow for backend tests creates a PostgreSQL service container (pgvector/pgvector:pg16) with empty database 'personal_crm_test', then immediately runs `go test -v ./tests/...` without any migration step. This differs from local dev environment where docker-compose runs migrations on startup. Integration tests are responsible for their own schema setup via `db.RunMigrations()`. This design allows tests to run against a clean schema every time but requires explicit migration calls in each test's setup.
actionable: false

