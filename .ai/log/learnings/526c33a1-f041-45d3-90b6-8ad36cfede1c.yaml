timestamp: "2026-04-27T13:51:58.917977"
type: distinction
summary: Variable names in test fixtures must update with bulk-replaced PII placeholders
detail: |
  During PII scrubbing of `calendar_test.go`, replacing `"Eugene"` → `"Bob"` in DisplayName fields left stale references like `var eugene *repository.Attendee` and comments mentioning "Eugene (organizer who was added)". After bulk string replacement of PII (names, emails), also update: (1) variable names that reference those entities, (2) comments that mention them by name. Otherwise tests remain correct but confusing (variable `eugene` holding a `Bob` struct). Use case-sensitive search after bulk replace to catch variable/comment references.
actionable: true

