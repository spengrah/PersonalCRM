timestamp: "2026-04-27T13:51:58.917977"
type: gotcha
summary: Replace-all on entity names in tests requires multi-pass to catch email/displayName/variable mismatches
detail: |
  When scrubbing `calendar_test.go`, replacing `"eugene@golem.foundation"` → `"bob@example.com"` came before replacing `DisplayName: "Eugene"` → `DisplayName: "Bob"`, creating intermediate state where email and display name mismatched. After the display name replacement, stale variable `var eugene` still referenced the now-Bob struct. For test fixture PII scrubbing: (1) replace all instance forms together (email, DisplayName, event title), (2) grep for variable names/comments mentioning the old name, (3) verify tests still pass. Alternative: do a single replace-all of the base name across the whole test file (harder to verify each context is appropriate).
actionable: false

