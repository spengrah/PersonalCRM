type: documentation_gap
summary: Privacy rule in AGENTS.md doesn't explicitly mention learnings YAML files
detail: |
  The privacy rule added in this session says "no PII in code, comments, commits, PR descriptions, issues, plan docs, or learnings" but doesn't emphasize that `.ai/log/learnings/*.yaml` files are tracked. An agent seeing `.ai/log/*` in `.gitignore` might assume learnings are safe for PII. The gap: learnings appear to be in an ignored directory but are actually tracked via explicit override. Strengthen the rule by adding a parenthetical: "learnings (tracked in git despite `.ai/log/*` gitignore)" or add a bullet in the Session Hints section: "Learnings YAML in `.ai/log/learnings/` are tracked — apply PII rule there too."
