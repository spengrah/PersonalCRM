timestamp: "2026-04-27T13:51:58.917977"
type: architecture
summary: "Kill switch smoke test pattern: verify emergency config overrides survive refactoring"
detail: |
  PR 292 deleted shadow-mode infrastructure, which touched the same config validation code that guards the cadence kill switch (`EVENT_BUS_CADENCE_MODE=off` + `EVENT_BUS_CADENCE_UNSAFE_ALLOW_OFF=true`). Broad refactoring can accidentally tighten validation and break emergency escape hatches. The smoke test pattern: build binary with merged changes, run with kill-switch env vars, verify process stays alive >8s (proves validation accepts the combo), check logs for expected emergency warnings. This catches validation regressions that would only surface during an incident (worst time to discover the kill switch is broken). Applies to any emergency override/escape hatch that could be accidentally broken by refactoring its surrounding code.
actionable: true

