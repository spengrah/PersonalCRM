type: gotcha
summary: E2E test wait strategy changed from 'networkidle' to 'domcontentloaded'
detail: |
  During rebase, discovered upstream changed E2E test wait strategy from `page.waitForLoadState('networkidle')` to `page.waitForLoadState('domcontentloaded')`. This was a recent codebase change that would have caused merge conflicts. When writing new E2E tests, check recent commits for wait strategy patterns to avoid immediate conflicts.
actionable: true

