detail: |
  When committing the ui-components.pen file with sync indicator designs, initially attempted to use 'chore:' prefix. User questioned if that was correct. Since Pencil designs are specifications/mockups that document what features should look like (not maintenance tasks or build config), they should use 'docs:' prefix. The designs directory contains design documentation that guides implementation, making 'docs:' the appropriate conventional commit type.
