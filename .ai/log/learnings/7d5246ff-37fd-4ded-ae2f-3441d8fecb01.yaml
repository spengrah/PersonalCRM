timestamp: "2026-01-22T16:55:11.314231"
type: gotcha
summary: Pencil design colors should match existing UI styling, not literal spec
detail: |
  When creating Pencil designs for the sync indicator, the issue specified `text-gray-600` for the synced state, but the existing navigation icons use `text-gray-500`. The designs initially used `$--gray-500` to match the UI, which created a discrepancy with the issue spec. The user confirmed to 'match existing styling' over the literal spec. Lesson: When design specs conflict with existing UI patterns, prefer consistency with the existing codebase.
actionable: true

