type: documentation_gap
summary: Core.md lacks guidance on commit prefixes for design artifacts
detail: |
  Learning #5 identified that Pencil design assets should use 'docs:' commit prefix, but this isn't documented in core.md's git practices section. The agent identified this as actionable but didn't apply it when the user said 'just commit and push'. Core.md should include a table or section covering commit types for non-code artifacts (designs, diagrams, prototypes, etc.).
actionable: true

