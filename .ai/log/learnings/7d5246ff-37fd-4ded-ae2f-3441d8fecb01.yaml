timestamp: "2026-01-22T17:10:41.845367"
type: gotcha
summary: Pre-push learnings extraction should be reviewed before blind commit
detail: |
  When the pre-push hook extracts new learnings and blocks the push, agents should read and assess whether to apply them to documentation rather than immediately committing. In this session, the agent first tried to blindly commit learnings without reviewing, then on second attempt reviewed them and identified actionable items (#5 about Pencil commit prefix, #9 about query key centralization). The user intervention led to documenting the onMutate vs onSuccess guidance in FRONTEND_STATE.md, which would have been missed otherwise.
actionable: true

---
timestamp: "2026-01-22T17:10:41.845367"
type: rule
summary: When learnings are extracted, always read and identify actionable items first
detail: |
  The workflow should be: (1) Read new learnings file, (2) Identify which are already addressed vs actionable, (3) Ask user which to apply if unclear, (4) Apply actionable learnings to documentation, (5) Commit both learnings and doc updates together. This prevents valuable insights from being filed away without being codified into project documentation. In this session, learning #11 about onMutate vs onSuccess was nearly missed until the user specifically requested it be documented.
actionable: true

