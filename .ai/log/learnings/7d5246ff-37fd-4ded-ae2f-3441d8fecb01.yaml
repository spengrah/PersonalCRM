type: gotcha
summary: Always check git status before creating feature branch
detail: |
  Started implementation work while on main branch that was 2 commits behind origin/main. This required mid-implementation stash-pull-rebase which caused a merge conflict in navigation.spec.ts. Should have checked branch status and pulled/rebased BEFORE starting work. The conflict resolution was successful but could have been avoided entirely by syncing with origin first.
