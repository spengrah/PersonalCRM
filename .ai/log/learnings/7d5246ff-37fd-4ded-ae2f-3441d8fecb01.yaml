timestamp: "2026-01-22T16:55:11.314231"
type: architecture
summary: Test tagging inherits from outer describe block - no need for nested tags
detail: |
  When adding sync indicator E2E tests to navigation.spec.ts, the tests were nested inside `test.describe('Sync Status Indicator', ...)` which was itself inside `test.describe('Navigation @area:navigation', ...)`. The nested tests automatically inherit the `@area:navigation` tag from the outer describe - no need to add tags to nested describes. The test-map.json maps file paths to tags, not individual test blocks.
actionable: true

