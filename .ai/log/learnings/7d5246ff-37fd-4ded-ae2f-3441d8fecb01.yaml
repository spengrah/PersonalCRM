type: documentation_gap
summary: E2E test tagging documentation is insufficient
detail: |
  The `.ai/rules/testing.md` has minimal coverage of test tagging (lines 80-91) that mentions tags exist and where the test-map.json lives, but doesn't explain: (1) the structure/format of test-map.json, (2) how to determine which tags to use, (3) when to add new entries vs use existing tags, (4) how the path-to-tag mapping actually works. During this session, the user had to explicitly ask 'do we have a @navigation tag' and 'did we use it correctly', suggesting this should be more discoverable. The brief mention of 'Add area tags to new specs' and 'Update the map when adding new pages/areas' is too vague for agents to apply correctly without examining existing patterns.
