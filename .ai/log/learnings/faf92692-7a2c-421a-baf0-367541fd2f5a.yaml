timestamp: "2026-01-20T16:29:47.532670"
type: distinction
summary: Premature abstraction vs copy-paste for similar logic
detail: |
  When implementing Merge feature that shares logic with existing Linking feature (method deduplication, conflict resolution), the architecture review recommended NOT extracting shared code immediately. Instead: implement merge-specific logic first, then refactor to shared utilities only if duplication becomes painful. This avoids premature abstraction that might not fit both use cases cleanly. Copy-paste is acceptable for initial implementation - generalize only when patterns are proven.
actionable: true

