timestamp: "2026-01-20T16:29:47.532670"
type: rule
summary: Prototype UI in temp/ directory using raw HTML, not React components
detail: |
  For rapid UI iteration, create HTML prototypes in temp/ directory (git-ignored) using CDN Tailwind, not React components in the source tree. This allows faster iteration without module resolution, build steps, or polluting the component tree. Once design is finalized, translate to React. This is documented in project gotchas but was critical for this session - initial React prototype was rejected for being harder to iterate on.
actionable: true

