timestamp: "2026-01-20T16:29:47.532670"
type: gotcha
summary: Soft-delete does NOT trigger FK cascade for contact methods
detail: |
  When soft-deleting a contact (UPDATE contact SET deleted_at = NOW()), related contact_methods are NOT automatically deleted despite FK constraints. The FK constraint exists but soft-delete is just a field update, not a DELETE, so ON DELETE CASCADE doesn't fire. Source contact methods must be explicitly deleted in the merge operation BEFORE soft-deleting the contact. This is a critical data integrity issue that's easy to miss when designing merge/delete operations.
actionable: true

---
timestamp: "2026-01-20T16:29:47.532670"
type: architecture
summary: Import/Link and Merge flows share identical UI patterns
detail: |
  The Import/Link modal (ImportLinkModal) and Contact Merge feature have structurally identical flows: select source, resolve field conflicts, handle contact methods with deduplication, execute merge. The key difference is just the source type (external contact vs CRM contact) and final action (enrich vs soft-delete). Future implementation should extend ImportLinkModal to support merge as a third mode rather than building a separate component. This maximizes code reuse and maintains UX consistency.
actionable: true

---
timestamp: "2026-01-20T16:29:47.532670"
type: rule
summary: Match repository method names by reading code, not assuming
detail: |
  Repository method names don't always match obvious patterns - e.g., the contact repository uses `SoftDeleteContact` not `DeleteContact`. Before calling repository methods in new code, always read the repository file first to verify actual method names. This prevents compilation errors and wasted time. This gotcha already exists in core.md but was reinforced during this session as a critical workflow step.
actionable: true

---
timestamp: "2026-01-20T16:29:47.532670"
type: architecture
summary: Use typed structs for field overrides, not maps
detail: |
  When designing field override/update patterns (like merge field resolution or enhanced import), use typed structs with optional fields (e.g., `FieldOverrides struct { FullName *string; Location *string }`) instead of map-based approaches (`map[string]*string`). This matches the existing codebase pattern (UpdateContactRequest) and provides compile-time type safety. The architecture review identified this as critical - map-based approaches don't align with Go best practices in this codebase.
actionable: true

