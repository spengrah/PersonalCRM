timestamp: "2026-01-20T16:29:47.532670"
type: documentation_gap
summary: Soft-delete FK cascade behavior needs explicit documentation
detail: |
  The core.md rules mention using accelerated.GetCurrentTime() and soft-delete patterns but don't explicitly warn that soft-delete (UPDATE deleted_at = NOW()) does NOT trigger ON DELETE CASCADE for foreign keys. This caused the initial merge spec to miss explicit contact_method deletion. Add to core.md under 'Common Gotchas': 'Soft-deleting contacts does NOT cascade to contact_methods - must explicitly delete related records'. Strengthen the soft-delete section to call out FK behavior.
actionable: true

