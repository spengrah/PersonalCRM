timestamp: "2026-01-20T16:29:47.532670"
type: gotcha
summary: Single-view modal pattern over multi-step wizards
detail: |
  The ImportLinkModal uses a single scrollable view with all steps visible (select contact, resolve conflicts, review, action) rather than a multi-step wizard. When building similar flows like Contact Merge, match this pattern - don't create 3-step wizards. Users prefer seeing all decisions in one view. The initial multi-step merge prototype was rejected; the single-view version matching ImportLinkModal was approved. This is a UX consistency requirement specific to this project.
actionable: true

