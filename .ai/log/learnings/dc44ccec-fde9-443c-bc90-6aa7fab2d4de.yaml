timestamp: "2026-02-04T00:55:42.765801"
type: gotcha
summary: Integration/E2E tests require database in CI but not local sandbox
detail: |
  make test runs unit tests + integration tests. Integration tests skip with 'Skipping integration test in short mode' when DATABASE_URL not set. E2E tests (make test-e2e-diff) require PostgreSQL running and fail with 'Docker is not installed; falling back to native PostgreSQL... PostgreSQL is not installed' in sandcastle. Gotcha: Don't expect integration/E2E to pass locally in sandbox - these are CI-only. Unit tests are the only reliable pre-commit verification in sandbox environments.
actionable: true

