timestamp: "2026-02-04T01:27:45.907240"
type: rule
summary: Use getByRole with timeout for E2E heading assertions instead of getByText
detail: |
  When asserting that a contact name appears on a detail page, use `page.getByRole('heading', { name: contactName })` with explicit timeout rather than checking h1 text content. This is more robust and follows the pattern established in contacts.spec.ts. Example: `await expect(page.getByRole('heading', { name: 'Task Test Contact' })).toBeVisible({ timeout: 15000 })`
