timestamp: "2026-02-04T01:23:00.403832"
type: gotcha
summary: E2E tests must use @playwright/test, not custom test-fixtures
detail: |
  The E2E test file contact-tasks.spec.ts was created importing from './helpers/test-fixtures' which doesn't exist. All E2E tests in this codebase use standard '@playwright/test' imports with the TestAPI pattern from './helpers/test-api'. Pattern: import { test, expect } from '@playwright/test' and create testApi via createTestAPI(request, testInfo) in beforeEach. The test-fixtures pattern exists in some Playwright projects for custom fixtures, but this codebase doesn't use it.
actionable: true

