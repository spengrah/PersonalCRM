timestamp: "2026-02-04T15:45:00.718141"
type: rule
summary: Use dynamic GOPATH in Makefile, never hardcode ~/go/bin
detail: |
  Makefile sqlc target used ~/go/bin/sqlc which breaks in non-standard environments (Sprites.dev uses /.sprite/languages/go/workspace/bin). Pattern: Always use `$(shell go env GOPATH)/bin/<tool>` or add GOPATH/bin to PATH dynamically. This applies to all Go tools (sqlc, golangci-lint, etc.). The gotcha was documented but not applied to Makefile - documentation alone insufficient.
