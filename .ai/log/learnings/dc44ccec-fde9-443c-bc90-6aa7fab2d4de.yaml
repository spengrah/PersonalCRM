timestamp: "2026-02-04T00:55:42.765801"
type: gotcha
summary: Git remote HTTPS fails in sandcastle, must use SSH
detail: |
  Sandbox environment repos clone with HTTPS remote (`https://github.com/...`) which fails on push with 'could not read Username for https://github.com: No such device or address'. Fix: `git remote set-url origin git@github.com:user/repo.git` to switch to SSH. This happens because sandcastle has SSH keys configured but no credential helper for HTTPS. Always verify `git remote -v` and switch to SSH before first push in new sandcastle sessions.
actionable: true

