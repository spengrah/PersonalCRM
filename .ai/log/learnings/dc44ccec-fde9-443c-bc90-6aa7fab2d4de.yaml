timestamp: "2026-02-04T01:18:34.077021"
type: rule
summary: Use sentinel errors with errors.Is() instead of string comparison
detail: |
  The initial implementation used `err.Error() == "string"` to check for specific error conditions (no todoist account, settings not configured). This is fragile and anti-pattern in Go. Instead: (1) Define sentinel errors in service layer: `var ErrNoTodoistAccount = errors.New("...")`, (2) Return sentinel errors from service methods, (3) Use `errors.Is(err, service.ErrXxx)` in handlers. This makes error handling type-safe and refactor-friendly.
actionable: true

---
timestamp: "2026-02-04T01:18:34.077021"
type: gotcha
summary: Test-map.json references can create phantom E2E test requirements
detail: |
  When adding a test-map.json entry for E2E tests (e.g., `contact-tasks.spec.ts`), the entry creates an expectation that the file exists even if tests aren't written yet. Code review will flag missing files referenced in test-map.json. Either: (1) create the E2E test file when adding the entry, or (2) don't add the test-map.json entry until the test file exists. Placeholder test files with basic structure are acceptable if full implementation is deferred.
actionable: true

---
timestamp: "2026-02-04T01:18:34.077021"
type: gotcha
summary: Unused queryClient variables in mutation hooks go undetected by TypeScript
detail: |
  When using the invalidateFor pattern for cache invalidation, mutation hooks may still declare `const queryClient = useQueryClient()` but never use it (since invalidateFor handles everything). TypeScript doesn't catch this as an error. Code review will flag these. Pattern: if using invalidateFor in onSuccess, remove both the useQueryClient import and the queryClient variable declaration.
actionable: true

