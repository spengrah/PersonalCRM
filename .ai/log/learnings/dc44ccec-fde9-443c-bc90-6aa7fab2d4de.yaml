detail: |
  The session encountered staticcheck SA9003 errors (empty if blocks) and added this to core.md gotchas table. However, this suggests the gotcha wasn't prominent enough in existing documentation, or agents aren't checking the anti-patterns section before writing code. Consider: (1) moving SA9003 to the Anti-Patterns section with a code example, (2) adding a reference in the Code Quality section, or (3) creating a pre-code-writing checklist that includes 'avoid empty branches'.
