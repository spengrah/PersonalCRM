timestamp: "2026-02-04T01:23:00.403832"
type: gotcha
summary: E2E test structure requires TestAPI pattern with beforeEach/afterEach
detail: |
  All E2E tests follow the same structure: (1) import test/expect from @playwright/test, (2) import createTestAPI and TestAPI from ./helpers/test-api, (3) declare testApi variable, (4) initialize in beforeEach with createTestAPI(request, testInfo), (5) call testApi.cleanup() in afterEach. This pattern ensures proper test isolation and cleanup. Custom fixtures or page objects passed as test parameters are NOT used in this codebase - tests receive standard Playwright fixtures (page, request) only.
actionable: true

