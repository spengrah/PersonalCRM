timestamp: "2026-02-04T00:55:42.765801"
type: rule
summary: test-map.json must include all new frontend files with area tags
detail: |
  When adding new frontend files, ALWAYS update `frontend/tests/e2e/test-map.json` with pattern and tags. Example: new hooks/use-contact-tasks.ts, components/contacts/tasks-section.tsx, lib/contact-tasks-api.ts all need entries with appropriate @area tags. Missing entries mean E2E diff detection won't run tests for those files. Tags should cover both specific (@area:tasks) and general (@area:contacts) to ensure proper test coverage triggering.
actionable: true

