timestamp: "2026-02-04T15:33:01.561389"
type: gotcha
summary: Integration tests fail locally without database, pass in CI
detail: |
  In sandcastle environments, integration tests that require PostgreSQL will fail with 'connection refused' because the test database isn't running. This is expected - the CI environment has the database. When testing locally, run `make test-unit` to verify Go logic without needing the database. The pre-push hook and CI will catch integration test failures.
actionable: false

