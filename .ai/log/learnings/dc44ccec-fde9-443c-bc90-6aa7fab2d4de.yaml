timestamp: "2026-02-04T15:45:00.718141"
type: gotcha
summary: lsb_release not available in minimal container environments
detail: |
  Setup script used `lsb_release -cs` to detect Ubuntu codename for PostgreSQL APT repo setup. This command doesn't exist in Sprites.dev sandcastles (Ubuntu 25.04), causing 'lsb_release: not found' error. Portable alternative: parse /etc/os-release which is standard and always present. Extract VERSION_CODENAME field instead of shelling out to lsb_release. This is a common gotcha in container/minimal environments.
actionable: true

