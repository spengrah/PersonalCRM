summary: Auth header pattern not documented in API client creation guide
detail: |
  The codebase uses X-API-Key for all API authentication, but this pattern isn't documented in feature-development.md or patterns/frontend.md. When creating contact-tasks-api.ts, the pattern of `Authorization: Bearer` was used (common in REST APIs) instead of the project standard. Guidance existed implicitly in api-client.ts but wasn't obvious. Should document: 'All API clients must use X-API-Key header (see api-client.ts), never Authorization Bearer' in frontend patterns or create an API client template.
