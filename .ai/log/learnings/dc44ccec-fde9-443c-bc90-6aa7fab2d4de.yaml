timestamp: "2026-02-04T00:55:42.765801"
type: gotcha
summary: Empty if blocks trigger staticcheck SA9003 lint error
detail: |
  Staticcheck SA9003 flags empty if blocks even if they contain only comments explaining why nothing is done. Example: `if condition { // comment explaining why we skip }` will fail lint. Fix by either: (1) removing the empty block and converting to standalone comment, or (2) adding a placeholder statement like `_ = variable`. Option 1 (remove block) is cleaner and preferred.
actionable: true

---
timestamp: "2026-02-04T00:55:42.765801"
type: architecture
summary: "Quick Add API choice: dedicated endpoint vs Sync API command"
detail: |
  Todoist offers two ways to use Quick Add: (1) dedicated `/sync/v9/quick/add` endpoint that returns task directly (~40 lines), or (2) `/sync/v9/sync` with `item_quick_add` command that uses temp_id mapping. For single-task creation (not batch), dedicated endpoint is simpler and more direct. Alternative would require ~200+ lines to manually parse natural language dates, project syntax (#project), labels (@label), priorities (p1-p4). Architectural decision: use dedicated endpoints for simple operations, Sync API for batch operations.
actionable: true

---
timestamp: "2026-02-04T00:55:42.765801"
type: rule
summary: Partial unique constraints for polymorphic behavior in same table
detail: |
  When a table has different 'kinds' of records with different uniqueness rules, use partial unique indexes with WHERE clauses instead of blanket constraints. Example: contact_task allows multiple 'action' tasks but only one 'cadence' task per contact+provider. Implementation: `CREATE UNIQUE INDEX unique_contact_provider_cadence ON contact_task (contact_id, provider, kind) WHERE kind = 'cadence';` This allows flexible constraints per record type in the same table.
actionable: true

---
timestamp: "2026-02-04T00:55:42.765801"
type: distinction
summary: Action task vs cadence task lifecycle differences
detail: |
  Action tasks and cadence tasks use the same contact_task table but have fundamentally different lifecycles. Cadence tasks: on completion → update last_contacted, calculate next contact_by, create new task (perpetual cycle). Action tasks: on completion → update last_contacted, set state='completed', NO new task (one-off). On label removal or deletion: cadence tasks → skip trigger logic, action tasks → simply mark unmanaged. This distinction must be maintained in sync provider processItem logic by branching on task.Kind.
actionable: true

