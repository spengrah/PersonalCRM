timestamp: "2026-02-04T01:18:34.077021"
type: gotcha
summary: Contact-tasks-api.ts used Bearer auth instead of X-API-Key header
detail: |
  When implementing the contact tasks API client (contact-tasks-api.ts), the file was created with `Authorization: Bearer` header instead of using `X-API-Key` like the rest of the codebase (api-client.ts). This inconsistency went undetected until code review. The codebase standardizes on `X-API-Key: <key>` for all API authentication. Before implementing new API clients, check existing API client files for auth patterns.
actionable: true

