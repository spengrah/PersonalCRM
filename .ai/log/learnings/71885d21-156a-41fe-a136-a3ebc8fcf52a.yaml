timestamp: "2026-04-16T10:19:14.200977"
type: architecture
summary: Calendar event publishing requires event end + next sync cycle
detail: |
  publishCalendarAttended only fires for past events (end_time < now) during CalendarSyncProvider.updateLastContactedForPastEvents. Flow: (1) event synced to calendar_event table with last_contacted_updated=false, (2) event ends (real-time), (3) next gcal sync (15-min cadence) sees end_time < now, (4) publisher emits calendar.attended + marks last_contacted_updated=true. Manual sync before event end is a no-op. For testing: create event, wait for end, trigger manual sync OR wait ~15min for auto-sync.
actionable: false

