timestamp: "2026-04-16T10:19:14.200977"
type: distinction
summary: interaction.recorded emissions differ between shadow and cutover modes
detail: |
  In shadow mode (PR 5): direct path is authoritative, consumer runs in parallel and marks observations as replay=true when interaction already exists, emits zero interaction.recorded events (correct). In cutover mode (PR 6): consumer is sole writer, no direct path, all observations are replay=false, consumer emits interaction.recorded for each new interaction (non-zero expected). The emission count is a mode indicator, not a bug signal. Status docs should clarify this distinction to avoid confusion during bake evidence review.
actionable: true

