type: gotcha
summary: Integration tests with wrong DATABASE_URL fail due to shared-DB pollution
detail: |
  TestContactRepository_Integration/ListContacts and TestFollowupFilter failed when run with DATABASE_URL=postgres://...personal_crm (production DB with 1531 contacts) instead of TEST_DATABASE_URL=postgres://...personal_crm_test. The test creates 2 contacts then lists with limit=100, expecting to find them, but production DB overflow masked the new rows. Even the test DB (255 contacts) caused failures until `make e2e-db` reset it. Always use TEST_DATABASE_URL for backend tests; check Makefile default (line 12) if unsure.
actionable: true

