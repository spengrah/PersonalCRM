type: gotcha
summary: Pre-existing test failures should not block dependent PR progress
detail: |
  TestSyncWorker_RescueOnCrash and TestSyncWorker_AbandonedLogOnStartupRecovery failed on both PR 6 branch AND main (verified via git checkout main && rerun). These are LONG_TESTS-gated timing-dependent tests from PR 3 (scheduler rescuer), not regressions from PR 6. CI runs test-integration-fast which skips LONG_TESTS. Workflow: when tests fail, verify against main first. If main also fails, document as pre-existing and proceed with PR if CI-equivalent suite passes.
