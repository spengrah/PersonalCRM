type: documentation_gap
summary: Plan-specified sqlc query names may not exist in actual implementation
detail: |
  PR 5 plan (.ai/log/plan/event-bus-foundation-pr5-interaction-recorder-shadow.md line 411) references 'FindShadowDivergences sqlc template' and session tried to call FindDivergences(). Grep found zero matches; the canonical SQL exists inline in the plan but was never generated as a named query. Agent initially tried `SELECT * FROM FindDivergences(...)` which failed; had to fall back to inline CTEs from plan. Strengthen plan template: if a query is acceptance-critical, verify `make sqlc && grep QueryName backend/internal/db/` before claiming it exists, or mark as 'planned for X, use inline SQL until then'.
actionable: true

