timestamp: "2026-04-16T10:19:14.200977"
type: gotcha
summary: Event-bus PR rebases produce substantial main.go conflicts due to mode transitions
detail: |
  Rebasing PR 6 (cutover) onto merged PR 5 (shadow) creates large conflicts in cmd/crm-api/main.go because PR 5 adds shadow-mode scaffolding (effectiveMode downgrade, pubBus gating, shadow observer wiring) that PR 6 removes. Pattern: keep PR 6's incoming side (removes shadow code), dedupe any AddWorker calls that appear in both HEAD and incoming, and verify riverClient.Start appears only once. Use --onto to skip already-merged commits when rebasing dependent PRs.
actionable: true

