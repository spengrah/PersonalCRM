timestamp: "2026-04-16T10:19:14.200977"
type: architecture
summary: Shadow mode replay detection prevents duplicate event emissions
detail: |
  Shadow mode (PR 5) has both direct path (ContactService.RecordInteraction writes interaction + event_shadow_observation with writer='direct') and consumer path (InteractionRecorder reads event, writes interaction + observation with writer='consumer'). When consumer finds an existing interaction row (by source, source_ref, contact_id), it marks replay=true and early-returns WITHOUT emitting interaction.recorded. This prevents duplicate downstream processing. All 7 consumer observations during PR 5 bake were replay=true, proving the direct path had already written the interactions before consumer processed the event.
actionable: false

