type: rule
summary: Use TEST_DATABASE_URL and reset test DB before integration test runs
detail: |
  Integration tests share personal_crm_test DB across runs, accumulating state (255 contacts observed during session). Tests expecting small result sets (ListContacts with limit=100) break when DB is polluted. Run `make e2e-db` before test sessions to drop/recreate personal_crm_test. Makefile already wires e2e-db as dependency for test-e2e and test-e2e-local, but NOT for test-integration. If integration tests fail with 'Should be true / Contact X should be in list', try `make e2e-db && make test-integration`.
actionable: true

