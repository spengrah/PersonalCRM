timestamp: "2026-04-16T10:19:14.200977"
type: gotcha
summary: Shadow mode correctly emits zero interaction.recorded events during replay
detail: |
  In PR 5's shadow mode, interaction.recorded emission count of 0 is CORRECT behavior, not a bug. When all consumer observations have replay=true, it means the consumer correctly detected pre-existing direct-path writes and skipped re-emission per the idempotency contract. Only in PR 6 cutover mode (where consumer is sole writer, no replay) should interaction.recorded emissions be non-zero. The PR 5 status doc incorrectly claimed non-zero was expected, causing confusion during bake evidence collection.
actionable: true

