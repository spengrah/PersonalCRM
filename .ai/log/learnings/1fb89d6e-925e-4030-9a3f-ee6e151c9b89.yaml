timestamp: "2026-02-10T11:29:32.556689"
type: gotcha
summary: Colima requires delete + restart to recover from fatal VM errors
detail: |
  When colima fails to start with 'error starting vm: error at 'starting': exit status 1', running `colima start` again fails. Must run `colima delete -f && colima start` to fully reset the VM state and recover. Simple restart commands don't clear the corrupted state.
actionable: true

