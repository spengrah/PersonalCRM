timestamp: "2026-02-10T11:48:00.732130"
type: rule
summary: Don't assume CI test failures are related to PR changes
detail: |
  When CI fails, investigate whether the failure is actually caused by the PR changes or is a pre-existing flaky test. Check recent main branch CI runs to see if tests pass consistently there. The initial instinct was to rerun CI hoping for a pass, but the correct approach is to fix the underlying test isolation issue that makes it flaky.
actionable: true

