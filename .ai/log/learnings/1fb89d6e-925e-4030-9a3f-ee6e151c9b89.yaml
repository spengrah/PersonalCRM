timestamp: "2026-02-10T22:36:58.551160"
type: architecture
summary: CRM marker fallback enables orphaned task hijacking without guards
detail: |
  The `tryMatchByCRMMarker` fallback in Todoist sync allows matching tasks by CRM marker JSON in the description field when `external_task_id` lookup fails. Without guards against completed/deleted items, this creates a hijacking vulnerability: when a sync response includes old completed/deleted tasks (which Todoist returns as changed items), the fallback matches them, reassigns `external_task_id` to the orphaned task ID, and processes it as the active task. This triggers completion handlers, spawning new replacement tasks while leaving the original valid task orphaned. The fix requires early returns in `tryMatchByCRMMarker` to skip `item.Checked || item.IsDeleted` items, ensuring fallback matching only applies to genuinely active tasks during API ID migrations.
actionable: true

