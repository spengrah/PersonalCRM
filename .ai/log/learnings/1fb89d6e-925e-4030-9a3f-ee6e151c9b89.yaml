timestamp: "2026-02-10T11:29:32.556689"
type: rule
summary: Fallback ID matching mechanisms must validate item state
detail: |
  When implementing fallback matching for external IDs (like CRM markers in task descriptions), always validate that the external item is in an active/relevant state before migrating the ID. Matching mechanisms designed for ID transitions should not reactivate obsolete/completed/deleted external records. This prevents state machine corruption where old external items hijack current internal records.
actionable: true

