timestamp: "2026-02-10T22:36:58.551160"
type: gotcha
summary: Todoist REST API close endpoint completes tasks, not deletes them
detail: |
  The Todoist REST API `/tasks/{id}/close` endpoint marks tasks as completed (checked), not deleted. This is a critical distinction for CRM cleanup scripts: when orphaned tasks are closed instead of deleted, they appear as `Checked: true` in the next Sync API response. If `tryMatchByCRMMarker` can still match them (e.g., before the fix), it triggers `handleTaskCompletion`, recording spurious interactions and updating `last_contacted` for all matched contacts. For cleanup operations that should truly remove tasks, use the DELETE endpoint or mark as deleted, not the close endpoint.
actionable: true

