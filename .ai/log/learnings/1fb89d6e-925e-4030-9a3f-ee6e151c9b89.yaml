timestamp: "2026-02-10T12:00:16.023330"
type: gotcha
summary: Unit tests for unexported methods must be in the same package
detail: |
  When testing unexported (lowercase) methods like `tryMatchByCRMMarker`, the test file must be in the same package (e.g., `backend/internal/todoist/provider_test.go` with `package todoist`). Tests in `backend/tests/unit/*_test.go` use external package naming (`package todoist_test`) and cannot access unexported symbols. Use `Glob` to check for existing `*_test.go` files in the target package before creating a new one.
actionable: true

