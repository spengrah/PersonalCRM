timestamp: "2026-02-10T11:48:00.732130"
type: documentation_gap
summary: Test isolation gotchas not documented in testing rules
detail: |
  The `.ai/rules/testing.md` file exists but doesn't warn about integration test isolation issues with shared databases. The guidance existed implicitly ("Use integration tests for DB operations") but didn't explain that multiple queries in one test against a shared DB can race with parallel tests. This caused the agent to initially dismiss the CI failure as "pre-existing and unrelated" rather than fixing it. Should add explicit guidance: "Integration tests share a database - avoid assertions that compare results across separate queries; other tests may modify state between calls."
actionable: true

