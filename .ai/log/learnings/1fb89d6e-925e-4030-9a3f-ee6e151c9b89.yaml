timestamp: "2026-02-10T12:00:16.023330"
type: gotcha
summary: Nil struct fields are safe when method guards prevent access
detail: |
  When testing methods with early-return guards, you can construct a struct with nil fields if the guard prevents field access. Example: `tryMatchByCRMMarker` returns nil for completed/deleted items before touching `contactTaskRepo`, so `&CadenceSyncProvider{}` with nil repos is safe for testing the guard logic. This enables true unit tests without DB setup or mocking.
actionable: true

