timestamp: "2026-02-10T22:36:58.551160"
type: gotcha
summary: Integration tests with shared DB can fail on count equality across separate queries
detail: |
  When integration tests run concurrently against a shared database, asserting equality across separate count queries (e.g., `totalAll == totalHas + totalNo`) can fail because other tests may create/delete rows between calls. This manifested in `TestCadenceFilter_Integration/CountContacts_HasCadence` where expected 2 but got 3. The fix: replace cross-query equality assertions with per-query invariants (e.g., `assert.GreaterOrEqual(t, totalHas, 1)`) that tolerate concurrent changes. Already documented in core.md gotchas table.
actionable: false

