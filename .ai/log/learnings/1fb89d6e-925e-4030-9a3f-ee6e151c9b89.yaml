timestamp: "2026-02-10T22:36:58.551160"
type: rule
summary: Disable external sync immediately when corruption is detected
detail: |
  When data corruption from external sync bugs is discovered (e.g., 15K+ spurious interactions), disable the sync source immediately via `UPDATE external_sync_state SET enabled = false` before investigating or planning fixes. This prevents continued damage while diagnosing the issue. The Todoist sync continued running for hours after the cleanup script ran, compounding the corruption with thousands more spurious interactions. Standard incident response for sync bugs should be: (1) disable sync, (2) assess damage, (3) plan recovery, (4) fix code, (5) clean data, (6) re-enable with monitoring.
actionable: true

