timestamp: "2026-02-10T11:29:32.556689"
type: gotcha
summary: CRM marker fallback must skip completed/deleted tasks
detail: |
  The `tryMatchByCRMMarker` fallback mechanism (designed for Todoist API ID migrations) was matching old completed/deleted tasks, causing it to migrate external_task_id back to obsolete task IDs and creating duplicate task accumulation. Completed/deleted items in sync responses are old tasks already replaced - they should never hijack current contact_task records. Add early return: `if item.Checked || item.IsDeleted { return nil }` before CRM marker parsing.
actionable: true

