timestamp: "2026-02-10T22:36:58.551160"
type: gotcha
summary: Todoist Sync API returns completed/deleted items as changed items in incremental sync
detail: |
  The Todoist Sync API with incremental sync tokens returns all items that changed since the last sync, including items marked as completed (`Checked: true`) or deleted (`IsDeleted: true`). This is working as designed for the Sync API to communicate state changes, but creates a processing challenge: downstream handlers must explicitly check for and skip these items if they should only process active tasks. Failing to guard against completed/deleted items in matching logic (like `tryMatchByCRMMarker`) causes those items to be treated as active, potentially triggering duplicate work or hijacking references. The fix pattern: add early returns for `item.Checked || item.IsDeleted` in any matching logic meant for active items only.
actionable: true

