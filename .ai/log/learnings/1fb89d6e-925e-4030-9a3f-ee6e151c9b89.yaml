timestamp: "2026-02-10T22:36:58.551160"
type: documentation_gap
summary: Cleanup script patterns should specify DELETE vs COMPLETE operations
detail: |
  When creating cleanup scripts for external sync sources like Todoist, the distinction between DELETE (permanent removal) and COMPLETE/CLOSE (mark as done) operations must be explicit in both script design and documentation. The cleanup script used Todoist's close endpoint without clearly documenting that this marks tasks as completed rather than deleting them, leading to downstream data corruption when completed orphans triggered interaction recording. Future cleanup script patterns should: (1) default to DELETE for true removal, (2) explicitly document if COMPLETE is used and why, (3) consider sync feedback loops where marked-complete items may trigger handlers in subsequent syncs.
actionable: true

