timestamp: "2026-04-08T19:45:43.979226"
type: documentation_gap
summary: Soft-delete guidance missing index requirement
detail: |
  **Existing guidance:** `.ai/rules/core.md` states 'All queries must filter `WHERE deleted_at IS NULL`' and mentions sqlc enforcement. **What was missed:** No mention that soft-delete tables need a partial index for performance. Agent added index only after CI review flagged it. **Why missed:** The rule focuses on query syntax, not database performance implications. **How to strengthen:** Add to core.md soft-deletes section: 'Tables with deleted_at must include partial index `CREATE INDEX idx_table_not_deleted ON table(id) WHERE deleted_at IS NULL` in the same migration that adds soft-delete support.' Also add to 'When You Change X, Check Y' table: 'New soft-delete table → Add partial index on deleted_at IS NULL'.
actionable: true

