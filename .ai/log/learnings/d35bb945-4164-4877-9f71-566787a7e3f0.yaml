timestamp: "2026-04-08T19:58:51.966456"
type: distinction
summary: Forward-only update semantics must apply to ALL derived fields, not just source timestamps
detail: |
  `contact_by` (cadence due date) is derived from `last_contacted` + cadence window. SQL queries had forward-only guards for `last_contacted` (don't regress to older values), but `contact_by` was always recomputed and applied when non-null. This meant late-arriving automated events would correctly preserve newer `last_contacted` but regress `contact_by` to an older cadence window, breaking the invariant. **Rule:** When timestamp fields have forward-only/manual-override semantics, identify ALL derived fields computed from those timestamps. Apply the same guard: only compute the derived value when the base timestamp update will actually take effect (event is newer than current value OR source is manual). Check at the service layer BEFORE passing to repository - don't rely on SQL guards alone.
actionable: true

