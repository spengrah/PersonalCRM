timestamp: "2026-04-08T19:18:32.204351"
type: documentation_gap
summary: Thread safety requirements for concurrent goroutine patterns not in testing.md
detail: |
  The session found data races on shared state accessed from both HTTP handlers and background goroutines (sess.Step). The fix required mutex protection on ALL accesses, not just reads or writes. **Why missed:** No guidance in testing.md about running tests with race detector (`go test -race`) or patterns for protecting shared state. **How to strengthen:** Add to testing.md: (1) always run `go test -race` for code with goroutines, (2) pattern: shared mutable state needs mutex on ALL accesses (reads + writes), (3) alternative: use channels for state updates instead of shared memory.
actionable: true

