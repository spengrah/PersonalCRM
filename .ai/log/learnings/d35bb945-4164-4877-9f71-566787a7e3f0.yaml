timestamp: "2026-04-08T19:45:43.979226"
type: architecture
summary: Soft-delete tables need partial index on deleted_at IS NULL
detail: |
  Any table with soft-delete (deleted_at column) needs a partial index `CREATE INDEX idx_tablename_not_deleted ON tablename(id) WHERE deleted_at IS NULL` for query performance. All queries filter `deleted_at IS NULL` (enforced in sqlc), and without this index, queries do full table scans. Add the index in the same migration that creates the table with soft-delete support.
actionable: true

