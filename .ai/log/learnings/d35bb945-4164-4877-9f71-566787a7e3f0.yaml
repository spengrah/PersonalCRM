timestamp: "2026-04-08T20:07:55.201000"
type: gotcha
summary: sqlc parameter additions convert simple args to compound structs, breaking all call sites
detail: |
  When adding parameters to sqlc queries (e.g., adding followup_filter to 10+ contact listing queries), sqlc regenerates param structs from simple types to compound structs. This breaks every repository method call site-wide. Pattern: after make sqlc, ALWAYS run go build ./cmd/crm-api to catch signature mismatches before committing. Then systematically fix all call sites by wrapping params in the new struct. Most common in queries with multiple optional filters where sqlc switches from positional args to named structs. Also affects test factories which are easy to miss since they're scattered across tests/*_test.go files.
actionable: true

