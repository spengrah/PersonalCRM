timestamp: "2026-04-08T20:07:55.201000"
type: architecture
summary: Follow-up task lifecycle requires completing old task BEFORE creating new one
detail: |
  When a follow-up task is completed and triggers a new outbound interaction, must mark the current task as completed FIRST, then call RecordInteraction (which calls CreateOrRefreshFollowUp). Otherwise, CreateOrRefreshFollowUp finds the dying task, refreshes it, then the caller marks it completed, leaving no pending follow-up. Sequence matters: (1) mark task completed in local state, (2) RecordInteraction, (3) CreateOrRefreshFollowUp creates successor. This prevents accidentally refreshing the task being completed. Applies to any state machine where completion of one entity should trigger creation of a successor.
actionable: true

