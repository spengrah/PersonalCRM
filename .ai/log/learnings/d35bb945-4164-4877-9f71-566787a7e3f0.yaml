timestamp: "2026-04-08T20:07:55.201000"
type: gotcha
summary: Playwright route() with overlapping URL patterns causes unpredictable handler ordering
detail: |
  When mocking related endpoints (e.g., /api/v1/telegram/auth/status and /api/v1/telegram/auth), using separate page.route() calls creates route matching ambiguity. Solution evolved through three iterations: (1) multiple glob patterns (ordering issues), (2) single regex with internal dispatch (better), (3) function predicate with URL object parsing (best). Use page.route(url => url.pathname.endsWith('/exact/path') && request.method() === 'DELETE', handler) for precise matching. Function predicates receive parsed URL objects, making intent clearer than regex on full URL strings.
