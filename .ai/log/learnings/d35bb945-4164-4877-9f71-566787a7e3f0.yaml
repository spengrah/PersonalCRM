timestamp: "2026-04-07T13:17:32.446151"
type: gotcha
summary: Repository method signature changes require updating all test factories
detail: |
  When adding parameters to repository methods (e.g., `CountContacts(ctx, cadenceFilter)` → `CountContacts(ctx, cadenceFilter, followupFilter)`), must update not just the production call sites but ALL test factory functions and helper methods that construct test services. These are easy to miss because they're scattered across `tests/api/*_test.go` and may use the old signature. Build errors surface these, but grep for `NewContactService` in tests/ upfront saves iteration.
actionable: true

