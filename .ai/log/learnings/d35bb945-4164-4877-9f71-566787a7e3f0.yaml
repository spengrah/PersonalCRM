timestamp: "2026-04-08T20:07:55.201000"
type: architecture
summary: Circular service dependencies resolved with setter injection and interface fields
detail: |
  When ContactService needs FollowUpService but FollowUpService needs ContactService, use post-construction injection: (1) define followUpManager interface in service package, (2) ContactService has followUpManager field (initially nil), (3) add SetFollowUpManager() setter called after both services are constructed in main.go, (4) nil check makes feature optional (no-op if not configured). This avoids constructor cycles while maintaining testability (tests inject mocks). The nil check pattern allows graceful degradation when optional external services aren't configured.
actionable: true

