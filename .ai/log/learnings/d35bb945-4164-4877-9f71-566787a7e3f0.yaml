timestamp: "2026-04-08T20:07:55.201000"
type: architecture
summary: Best-effort external service cleanup prevents stuck state in optional integrations
detail: |
  When external services (like Todoist) are optional, cleanup operations must degrade gracefully. CompleteFollowUp initially hard-errored when getTodoistSettings failed, leaving local records stuck in 'managed' state forever if Todoist was disconnected. Fix: try external cleanup first; if it fails (settings unavailable, API error), warn-log but still complete the local state transition. This prevents optional external services from blocking core state machine progress. Pattern: external_call(); if err != nil { log.Warn().Err(err).Msg('external cleanup failed'); } // proceed with local state update anyway. Applies to any local/remote two-phase operation where local state is source of truth.
actionable: true

