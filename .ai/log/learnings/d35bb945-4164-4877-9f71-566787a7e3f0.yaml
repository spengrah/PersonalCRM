timestamp: "2026-04-08T19:30:34.260870"
type: gotcha
summary: "E2E async component checks: .isVisible().catch() doesn't wait, use expect().toBeVisible()"
detail: |
  When testing async components with loading states, `.isVisible().catch(() => false)` returns an instant snapshot and doesn't wait for state to resolve. This causes flaky tests when components are still loading. Use `expect().toBeVisible()` instead, which polls until the element appears or times out. The Telegram settings test failed in CI because it checked for configRequired/connectButton immediately after the heading was visible, but the component was still in loading state (spinner). The fix: wait for one of the expected final states with `expect(configRequired.or(connectButton)).toBeVisible()` which polls until loading completes.
actionable: true

