timestamp: "2026-04-08T19:18:32.204351"
type: documentation_gap
summary: Error handling patterns (sentinel errors, wrapping) not documented in code-review.md
detail: |
  The code review found 10+ rounds of issues around error handling patterns: distinguishing internal errors from auth errors, wrapping with sentinel errors, using errors.Is instead of string matching. These patterns are critical for correct HTTP status codes and user-facing error messages, but aren't in code-review.md or architecture.md. **Why missed:** No guidance on when to use sentinel errors vs error types vs wrapping. **How to strengthen:** Add an 'Error Handling' section to code-review.md or core.md covering: (1) define sentinel errors for domain boundaries, (2) wrap at error sites with fmt.Errorf("%w"), (3) check with errors.Is in handlers, (4) distinguish infrastructure (500) from domain (4xx) failures.
actionable: true

