timestamp: "2026-04-08T19:21:30.334242"
type: gotcha
summary: gotd/td updates.New() requires non-nil Handler - panics at runtime if nil
detail: |
  The `github.com/gotd/td/telegram/updates.New()` function validates that `Config.Handler` is non-nil and panics immediately if it's nil. This happens inside the library's `setDefaults()` method, not at compile time. Even if you don't need update processing, you must provide at least a no-op handler: `telegram.UpdateHandlerFunc(func(ctx context.Context, u tg.UpdatesClass) error { return nil })`. The panic manifests as a runtime crash in the goroutine that creates the updates manager.
actionable: true

---
timestamp: "2026-04-08T19:21:30.334242"
type: gotcha
summary: Telegram RPC calls hang forever if connection drops - need per-operation timeouts
detail: |
  Telegram MTProto RPC calls (`authClient.SendCode()`, `authClient.SignIn()`, `authClient.Password()`) can hang indefinitely if the Telegram connection drops mid-request, even if the parent context has a timeout. After a failed 2FA attempt or network interruption, subsequent auth calls will never return. Solution: wrap each RPC call with its own `context.WithTimeout()` (e.g., 30 seconds): `sendCtx, cancel := context.WithTimeout(runCtx, 30*time.Second); defer cancel(); authClient.SendCode(sendCtx, ...)`. The parent context timeout alone is insufficient because the connection state may be broken.
actionable: true

---
timestamp: "2026-04-08T19:21:30.334242"
type: rule
summary: E2E tests checking overflow-dependent UI must wait for content render, not just page load
detail: |
  Tests that verify overflow-dependent UI elements (like 'Show more' buttons triggered by CSS line-clamp) fail intermittently in headless browsers if they only wait for page load. The overflow detection useEffect runs after React renders the content, which may happen after navigation completes. Solution: before checking for the overflow button, wait for the actual text content to be visible: `await expect(page.getByText('snippet of long content')).toBeVisible()`. This ensures the element is rendered and the overflow detection effect has fired. Applies to any UI that uses scrollHeight/clientHeight comparisons.
actionable: true

