timestamp: "2026-04-08T20:07:55.201000"
type: rule
summary: "E2E disconnect flows: assert on final connected state instead of mocking waitForResponse"
detail: |
  When testing disconnect flows that trigger state changes, waitForResponse() can be flaky because the response may fire before the listener is set up, especially when the test modifies route mocks mid-test. Instead of waiting for the API response, assert on the final visible UI state: await expect(page.getByRole('button', { name: /Connect/ })).toBeVisible({ timeout: 5000 }). This polls until the component reaches the expected state, regardless of when the API call completes. The pattern: persist state changes, then assert on UI reflecting that state.
actionable: true

