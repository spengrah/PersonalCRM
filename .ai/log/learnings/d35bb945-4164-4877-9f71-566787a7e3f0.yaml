timestamp: "2026-04-07T15:57:56.401468"
type: rule
summary: Handler validation logic requires test for invalid input
detail: |
  InteractionHandler had switch statement validating direction values and correctly returning 400 for invalid inputs, but tests only covered valid values and default behavior. Missing regression test for invalid input (e.g., `{"direction": "invalid_value"}` → 400). When adding handler validation, always test both valid paths AND invalid input that should return 400.
actionable: true

