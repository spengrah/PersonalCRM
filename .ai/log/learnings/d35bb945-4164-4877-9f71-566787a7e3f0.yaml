timestamp: "2026-04-08T20:07:55.201000"
type: distinction
summary: Forward-only timestamp updates apply per-field based on direction, not globally
detail: |
  Direction-conditional fields (last_outreach_at, last_response_at, last_interaction_at) each use forward-only logic independently: outbound interactions use forward-only for last_outreach_at but don't touch last_contacted; inbound/mutual update both with their respective forward-only semantics. Critical: outbound interactions do NOT update last_contacted or contact_by (prevents cadence reset when user reaches out first). The isManual flag overrides forward-only for all three patterns. This prevents automated sources from backdating user corrections while capturing historical data properly.
actionable: true

