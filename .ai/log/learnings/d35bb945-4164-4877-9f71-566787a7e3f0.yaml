timestamp: "2026-04-08T19:53:24.466594"
type: gotcha
summary: Playwright route handlers with overlapping URL patterns cause unpredictable ordering issues
detail: |
  When mocking multiple related endpoints in E2E tests (e.g., `/api/v1/telegram/auth/status` and `/api/v1/telegram/auth`), using separate `page.route()` calls with glob patterns like `**/telegram/auth/status` and `**/telegram/auth` creates route ordering ambiguity. Playwright may match the wrong handler depending on registration order. The fix: use a SINGLE regex route handler matching all paths under the base URL (e.g., `/\/api\/v1\/telegram\/auth/`) and dispatch internally based on URL string matching (`url.includes('/auth/status')`) and HTTP method. This pattern emerged through three commit iterations: (1) polling assertions, (2) exact path scoping with URL parsing, (3) single regex handler with internal dispatch. The internal dispatch pattern is more reliable than relying on Playwright's route matching precedence.
actionable: true

---
timestamp: "2026-04-08T19:58:51.966456"
type: gotcha
summary: Playwright route() function predicates are more reliable than regex for pathname matching
detail: |
  When intercepting API routes in E2E tests, using a function predicate `page.route(url => url.pathname.includes('/api/v1/path'), handler)` is MORE reliable than regex patterns `page.route(/\/api\/v1\/path/, handler)`. The function predicate receives a URL object with parsed pathname, allowing precise URL structure matching. Regex patterns operate on the full URL string (including query params, protocol) which can cause unexpected matches. This pattern evolved through three iterations: (1) multiple glob patterns (ordering issues), (2) single regex with internal dispatch (better), (3) function predicate with URL object (best). The function predicate also makes the intent clearer: pathname-based routing.
actionable: true

---
timestamp: "2026-04-08T19:58:51.966456"
type: architecture
summary: Injectable function fields solve concrete-type testability without introducing interfaces
detail: |
  When a service depends on a concrete type that can't be mocked (e.g., `OAuthService`), extract the problematic method into an injectable function field on the dependent service. Example: `FollowUpService` needed `OAuthService.GetTodoistSettings()` but couldn't mock it for tests. Fix: added `todoistSettingsFunc func(context.Context) (*Settings, string, error)` field, set to real implementation in production, overridden with fake in tests. This avoids creating interfaces for single-method dependencies while maintaining full testability. Pattern: (1) add function field to struct, (2) initialize in constructor to real implementation, (3) optionally add setter for dependency injection, (4) tests inject fake functions.
actionable: true

