timestamp: "2026-04-07T15:25:49.300549"
type: gotcha
summary: Backup script must restart ALL dependent systemd services, not just backend
detail: |
  When stopping personalcrm-backend for database backup, personalcrm-frontend also stops due to systemd service dependencies. The backup script initially only restarted the backend, leaving the production app inaccessible (frontend dead, backend running). **Fix:** Explicitly stop and restart BOTH personalcrm-backend AND personalcrm-frontend to ensure full service recovery. Service dependency chains are opaque from the backup script's perspective.
actionable: true

---
timestamp: "2026-04-07T15:25:49.300549"
type: gotcha
summary: Docker Compose service name is 'postgres' not 'db' in production
detail: |
  The production docker-compose.yml defines the PostgreSQL service as 'postgres' (container name: crm-postgres), but backup script initially used 'db'. This caused 'docker compose stop db' to fail with 'no such service'. **Rule:** When writing automation scripts for production infrastructure, verify actual service names with 'docker compose ps' rather than assuming common conventions. The compose file is the source of truth.
actionable: true

---
timestamp: "2026-04-07T15:25:49.300549"
type: architecture
summary: Reconciliation loop must clean up terminal-state cadence tasks
detail: |
  After direction model implementation, cadence tasks are marked 'completed' (not deleted) when finished to preserve follow-up task ordering. But reconcileContactTasks skips existing rows and only creates new tasks when none exist. This meant completed cadence tasks blocked new cadence task creation indefinitely. **Pattern:** When state machines transition tasks to terminal states ('completed', 'cancelled'), reconciliation loops must either (1) DELETE terminal-state rows before creating replacements, or (2) explicitly filter WHERE state NOT IN ('completed', 'cancelled') when checking for existing tasks. Option 1 was chosen here because historical tracking happens via interactions table, not contact_task rows.
actionable: true

---
timestamp: "2026-04-07T15:25:49.300549"
type: rule
summary: Environment-specific infrastructure scripts must use env vars with defaults
detail: |
  The backup-db.sh script initially hardcoded PI_HOST='raspberry-pi' and PI_DIR='/srv/personalcrm'. User correctly requested these become environment variables to support multiple deployment targets. **Pattern:** Follow deploy.sh precedent: use ${VAR_NAME:-default_value} for convenience defaults (PI_HOST) and ${VAR_NAME:?error message} for required context-specific values (PI_DEPLOY_DIR). This balances usability (works without ceremony for common case) with flexibility (supports non-standard deployments).
actionable: true

---
timestamp: "2026-04-07T15:25:49.300549"
type: documentation_gap
summary: Cadence task lifecycle and reconciliation interaction not documented
detail: |
  The interaction between handleTaskCompletion (which marks cadence tasks 'completed') and reconcileContactTasks (which creates new cadence tasks) is not documented anywhere. This led to the terminal-state cleanup bug going unnoticed during implementation and initial testing. The multi-step lifecycle (completion → follow-up creation → follow-up completion → new cadence task creation) spans multiple files and background jobs with no single place explaining the full flow. **Strengthen:** Add a 'Task Lifecycle State Machine' diagram to .ai/guides/architecture.md showing: cadence task states, follow-up task states, reconciliation cleanup rules, and which components own each transition.
actionable: true

---
timestamp: "2026-04-07T15:28:09.279599"
type: documentation_gap
summary: Bug fix test coverage rule wasn't followed initially
detail: |
  Existing rule says 'Always add comprehensive tests for new/changed code' but wasn't applied when fixing a bug found during code review. The rule exists in `.ai/rules/core.md` but is too general. Future agents need stronger, more explicit guidance: 'When fixing a bug (especially one found by codex/review), add a regression test BEFORE making the fix.' The gap: the rule is buried as a general principle rather than highlighted as a bug-fix-specific requirement. Strengthen by: (1) Add to 'When You Change X, Check Y' table: 'When fixing a bug → Add regression test first', (2) Add to Anti-Patterns with ❌/✅ example.
actionable: true

---
timestamp: "2026-04-07T15:37:54.952136"
type: gotcha
summary: Gin validate tags require explicit validation call
detail: |
  The `validate:"omitempty,oneof=..."` tag on handler request structs is just metadata. Gin's ShouldBindJSON does NOT automatically enforce validation rules. You must call `h.validator.Struct(req)` explicitly after binding, or the validation tag is ignored. Without this, invalid enum values bypass handler validation and hit DB CHECK constraints, returning 500 instead of 400.
actionable: true

---
timestamp: "2026-04-07T15:37:54.952136"
type: rule
summary: Always validate enums at handler layer before service
detail: |
  Invalid enum values (e.g., direction="invalid") that bypass handler validation will hit PostgreSQL CHECK constraints in the database layer, causing 500 Internal Server Error instead of 400 Bad Request. This breaks REST conventions and exposes implementation details. Validate all enum fields explicitly at the handler layer (either with validator.Struct() or inline switch statements) before passing to service layer.
actionable: true

---
timestamp: "2026-04-07T15:37:54.952136"
type: rule
summary: Test comments describing expected behavior must have assertions
detail: |
  Comments like "// Verify: last_response_at should still reflect..." without accompanying assertions create untested assumptions. If a field should NOT be modified, assert it with assert.Nil() or assert.Equal(). If behavior is uncertain, remove the comment. Comments without assertions are code smell indicating incomplete test coverage of edge cases and cross-concern boundaries.
actionable: true

---
timestamp: "2026-04-07T15:44:58.393269"
type: gotcha
summary: Pre-push hook 'FAIL E2E tests' can mean learnings blocked push, not test failure
detail: |
  When pre-push hook output shows 'FAIL E2E tests' followed by 'Appended X new learnings' and 'LEARNINGS EXTRACTED', it means the learnings extraction blocked the push, NOT that the E2E tests actually failed. The tests may have passed. Check for 'WARN New learnings extracted' and the learnings output to distinguish from real test failures. The misleading 'FAIL E2E tests' line appears because tests run in parallel with learnings extraction.
actionable: true

---
timestamp: "2026-04-07T15:44:58.393269"
type: rule
summary: Never discard delete errors before creating replacement with same unique constraint
detail: |
  Silently discarding a delete error (e.g., `_ = DeleteContactTask(ctx, id)`) before creating a new record with the same unique constraint (e.g., same `(contact_id, source, task_type)`) creates a permanent stuck state. If the delete fails, the subsequent create will hit a constraint violation loop. Must handle delete errors and abort/skip the create operation if delete fails. Found in provider.go where completed cadence tasks are cleaned up before creating replacements.
actionable: true

---
timestamp: "2026-04-07T15:57:56.401468"
type: documentation_gap
summary: Contact list filter gotcha didn't prevent incomplete implementation
detail: |
  Existing gotcha documents adding contact list filter requires updating "10 SQL queries + repo params + service count calls + handler query struct + frontend types + API client + contacts page + detail page listContext". Agent followed this for SQL/backend but still missed 4 frontend locations: ContactIDsParams interface, getContacts spread, getContactIDs spread, and buildNavigationUrl. The documentation exists but wasn't specific enough to prevent the error. Needs strengthening with explicit checklist format showing all 12+ locations grouped by layer (Backend: 10 SQL queries, repo params, service, handler | Frontend: TypeScript type, ContactIDsParams, API client getContacts, API client getContactIDs, contacts page, detail page listContext, detail page buildNavigationUrl).
actionable: true

