timestamp: "2026-04-08T19:30:34.260870"
type: gotcha
summary: E2E shared DB state causes flaky tests when seeded data is consumed by other tests
detail: |
  Import candidates test failed with 'No import candidates' despite seeding data. Attributed to shared DB state where other tests consume the seeded data. Tests that depend on specific seeded data being present can fail intermittently when run in parallel or in different orders. The test passed on retry, indicating timing/state dependency rather than a code bug.
actionable: false

