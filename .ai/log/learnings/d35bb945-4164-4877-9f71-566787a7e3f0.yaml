timestamp: "2026-04-07T15:57:56.401468"
type: architecture
summary: Frontend API client wiring follows consistent spread pattern
detail: |
  When adding optional filter parameters to contact list queries, must add to ContactIDsParams interface AND spread into queryParams in both getContacts and getContactIDs using pattern: `...(params.filter_name && { filter_name: params.filter_name })`. Also must add to detail page listContext extraction from searchParams and buildNavigationUrl params.set() calls, including dependency array. This pattern mirrors how cadence_filter was implemented.
actionable: true

