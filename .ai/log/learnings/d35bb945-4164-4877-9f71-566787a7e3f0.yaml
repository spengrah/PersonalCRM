timestamp: "2026-04-08T19:18:32.204351"
type: distinction
summary: "Session cleanup: clearSession (success) vs cleanup (error)"
detail: |
  Auth flows need two distinct cleanup patterns: `clearSession` for successful completion (frees resources, session no longer needed) and `cleanup` for errors (resets state so a new auth attempt can start). The critical distinction: error cleanup must happen when the error is an internal/infrastructure failure (ErrAuthInternal), but NOT when it's an auth rejection (invalid code/password) — auth rejections should allow retry within the same session TTL. This pattern applies to any multi-step flow with retryable vs terminal errors.
actionable: true

---
timestamp: "2026-04-08T19:18:32.204351"
type: gotcha
summary: Persistence before in-memory state commit on teardown
detail: |
  When implementing disconnect/teardown flows with persistent state: persist the change BEFORE updating in-memory flags, not after. In Disconnect(), deleting the DB session must happen before setting `m.running = false`, otherwise on DB failure the method returns an error but the in-memory state already shows disconnected. This creates inconsistency where Status() reads from memory (disconnected) but DB still has the session (will auto-reconnect on restart). The fix: persist first, then commit memory state only on success.
actionable: true

---
timestamp: "2026-04-08T19:18:32.204351"
type: architecture
summary: Sentinel errors to distinguish infrastructure vs domain failures
detail: |
  Use typed sentinel errors (e.g., `ErrAuthInternal`) to distinguish infrastructure failures (DB errors, persistence failures) from domain-level failures (invalid credentials, auth rejections). Wrap all persistence errors with `fmt.Errorf("...: %w", ErrAuthInternal)` so handlers can use `errors.Is(err, ErrAuthInternal)` to return 500 vs 401. Without this, substring matching like `strings.Contains(err.Error(), "persist")` is fragile and breaks when error messages change. The pattern: define sentinel errors in the domain package, wrap at error sites, check with errors.Is in handlers.
actionable: true

---
timestamp: "2026-04-08T19:18:32.204351"
type: gotcha
summary: Shared state across goroutines requires mutex on both read AND write
detail: |
  When implementing state machines with concurrent access (e.g., auth flow Step tracking), ALL accesses to shared state must be synchronized, not just reads OR writes. The sess.Step field was written by the MTProto goroutine (`sess.Step = "awaiting_code"`) but read by HTTP handlers checking state. Initially only reads were under mutex — this created a data race. Fix: wrap ALL Step assignments with `m.mu.Lock(); sess.Step = "..."; m.mu.Unlock()` matching the read-side locking. Data races on state machine fields cause nondeterministic behavior where valid requests get rejected or accepted incorrectly.
actionable: true

---
timestamp: "2026-04-08T19:18:32.204351"
type: rule
summary: Auth flow state machines need explicit step tracking
detail: |
  Multi-step auth flows (phone → code → 2FA) should track the current step explicitly in a Step field, not infer it from other state. Without explicit tracking, VerifyCode can be called when awaiting_password (wrong step) or VerifyPassword when awaiting_code. The pattern: add Step string field to session struct, set it when sending each result ("awaiting_code", "awaiting_password"), check it at the start of each verify method: `if sess.Step != "awaiting_code" { return ErrInvalidState }`. This prevents out-of-order API calls and makes the state machine explicit.
actionable: true

