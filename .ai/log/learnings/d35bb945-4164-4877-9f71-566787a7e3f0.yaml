timestamp: "2026-04-08T19:21:30.334242"
type: gotcha
summary: Telegram RPC calls hang forever if connection drops - need per-operation timeouts
detail: |
  Telegram MTProto RPC calls (`authClient.SendCode()`, `authClient.SignIn()`, `authClient.Password()`) can hang indefinitely if the Telegram connection drops mid-request, even if the parent context has a timeout. After a failed 2FA attempt or network interruption, subsequent auth calls will never return. Solution: wrap each RPC call with its own `context.WithTimeout()` (e.g., 30 seconds): `sendCtx, cancel := context.WithTimeout(runCtx, 30*time.Second); defer cancel(); authClient.SendCode(sendCtx, ...)`. The parent context timeout alone is insufficient because the connection state may be broken.
actionable: true

