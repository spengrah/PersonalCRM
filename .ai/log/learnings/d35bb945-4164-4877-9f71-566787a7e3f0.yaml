timestamp: "2026-04-08T19:45:43.979226"
type: gotcha
summary: E2E async state checks fail in CI with instant isVisible() checks
detail: |
  In E2E tests, `await expect(locator).toBeVisible()` with instant checks like `locator.or(locator)` works locally but can fail in CI where API calls take longer. The component may still be in loading state when the assertion runs. Solution: Use polling assertions with explicit timeout: `await expect(locator.or(locator)).toBeVisible({ timeout: 5000 })`. The `.or()` pattern ensures Playwright polls until one of the states becomes visible rather than checking instantly.
actionable: true

