timestamp: "2026-04-07T15:57:56.401468"
type: gotcha
summary: validate struct tags without validator calls are dead code
detail: |
  Handler had `validate:"omitempty,oneof=outbound inbound mutual"` tag on Direction field but InteractionHandler has no validator field and never calls validator.Struct(). Validation actually happens via switch statement. The tag is misleading - future developers might think Gin enforces it automatically. Rule: either remove validate tags or add validator.Struct() call; don't leave orphaned tags.
actionable: true

