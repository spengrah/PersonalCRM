timestamp: "2026-04-08T19:45:43.979226"
type: rule
summary: Never silently discard errors in critical callbacks
detail: |
  Silent error discards (`_ = callback()`) in async operations can hide critical failures. Example: `onComplete` callback creating sync state and starting connections - if it fails silently, user receives 'connected' status but backend connection never starts. **Why:** Callbacks often perform critical setup that must succeed for the system to work. **How to apply:** At minimum, log callback errors even when you can't return them (e.g., in goroutines or fire-and-forget operations). Use `log.Warn().Err(err).Msg("context about what failed")` for non-fatal but important failures.
actionable: true

