timestamp: "2026-04-08T19:21:30.334242"
type: documentation_gap
summary: No guidance on library-specific runtime validation requirements for third-party integrations
detail: |
  When integrating third-party libraries (especially those with runtime validation like gotd/td), agents had to discover required configuration fields through crash debugging rather than proactive checking. The `updates.Config.Handler` requirement wasn't obvious from reading the code - it only manifested as a panic in a goroutine during startup. **Strengthening**: Add to `.ai/guides/architecture.md` or create `.ai/patterns/third-party-integrations.md` with rule: 'Before adding a new third-party library integration, grep the library source for `panic()` calls in config/setup code to identify required fields that won't be caught at compile time. Test startup paths immediately after adding the integration.'
actionable: true

