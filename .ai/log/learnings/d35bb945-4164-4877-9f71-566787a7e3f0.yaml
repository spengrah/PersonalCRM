timestamp: "2026-04-08T21:01:22.266124"
type: rule
summary: "Auth state machine: track step and validate in handler"
detail: |
  When implementing multi-step auth flows (code → password), add a Step field to the auth session ("awaiting_code", "awaiting_password") and validate it in the HTTP handlers. VerifyCode should check step === "awaiting_code" and return 409 Conflict if not; VerifyPassword should check step === "awaiting_password". This prevents out-of-order calls like calling VerifyPassword before sending a code. Set the step when sending the awaiting_X result, and transition it when SignIn returns ErrPasswordAuthNeeded.
actionable: true

