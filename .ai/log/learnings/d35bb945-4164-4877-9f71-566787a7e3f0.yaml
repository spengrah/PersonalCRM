timestamp: "2026-04-08T19:18:32.204351"
type: gotcha
summary: sqlc UPSERT with selective field updates requires separate queries
detail: |
  When implementing `ON CONFLICT DO UPDATE` in sqlc, you cannot selectively preserve some fields while updating others in a single query. The `UpsertTelegramChannelAccessHash` pattern shows the solution: create separate queries for different update scenarios. One query updates all fields (pts + access_hash), another only updates access_hash and preserves existing pts by using `DO UPDATE SET access_hash = EXCLUDED.access_hash` (omitting pts from the SET clause). Without this, a generic upsert that sets pts=0 on insert will overwrite existing pts values on conflict.
actionable: true

