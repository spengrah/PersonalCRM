timestamp: "2026-04-08T19:58:51.966456"
type: rule
summary: Codex code review caught 4 critical bugs that tests and linters missed
detail: |
  The feature-dev:code-reviewer agent found: (1) CompleteFollowUp hard-error blocking inbound interactions when Todoist unavailable, (2) metadata key mismatch ('deadline' vs 'due_date') hiding follow-up due dates, (3) contact_by regression from late-arriving events despite forward-only timestamp guards, (4) transient Todoist failures creating permanent stuck state. All bugs involved state machine edge cases and failure modes. Tests validated happy paths but missed cross-cutting consistency requirements and error handling gaps. **Lesson:** For state machine changes or multi-path features (e.g., 5 task creation paths), ALWAYS run code review agents before considering work done, even when lint and tests pass. State invariants and error propagation paths are exactly what automated review excels at catching.
actionable: true

