timestamp: "2026-04-08T20:07:55.201000"
type: rule
summary: Date-based deadlines must use date arithmetic (.AddDate), never time.Duration
detail: |
  Todoist deadlines and cadence calculations are date-based ('N days later'), not timestamp-based. Using time.Duration (e.g., 24 * time.Hour * N) introduces DST drift and time-of-day leakage. Correct pattern: use cadence.Today(t).AddDate(0, 0, days) for all date arithmetic. Store watchdog windows as int (day counts) in config, not time.Duration. This matches existing cadence patterns and prevents subtle date drift bugs when crossing DST boundaries.
actionable: true

