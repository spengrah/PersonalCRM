timestamp: "2026-02-06T19:06:08.472935"
type: gotcha
summary: synced_last_contacted requires nil check only when contact.LastContacted might be nil
detail: |
  When storing synced_last_contacted metadata, always check if contact.LastContacted != nil before calling .Format(). However, inside conditional blocks that already guard against nil (like wasContactedSinceSync returning false when nil), the nil check is technically redundant but should still be added for code consistency and clarity - future refactors might remove the guard.
actionable: true

