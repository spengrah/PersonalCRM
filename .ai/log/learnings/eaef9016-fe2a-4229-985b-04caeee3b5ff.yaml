type: distinction
summary: Use timePtr helper from cadence_test.go, not duplicate helpers in test files
detail: |
  The unit test package already has a timePtr helper function in cadence_test.go. When writing tests in todoist_test.go (same package), reuse this existing helper instead of declaring a duplicate. Attempting to redeclare will cause a 'redeclared in this block' compilation error.
actionable: true

