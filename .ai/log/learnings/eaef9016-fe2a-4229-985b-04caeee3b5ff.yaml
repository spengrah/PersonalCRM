timestamp: "2026-02-06T19:17:03.485294"
type: gotcha
summary: Test loop simulation must replicate provider backfill logic
detail: |
  When testing reconciliation logic that includes backfill, the test loop must simulate the backfill by mutating tt.metadata before running the detection logic. Without this, test cases for 'missing synced_last_contacted' scenarios would fail even though the provider code works correctly. The test at line 498-503 adds: if _, hasSyncedLC := tt.metadata['synced_last_contacted'].(string); !hasSyncedLC { tt.metadata['synced_last_contacted'] = tt.lastContacted.Format(time.RFC3339) }. This simulates the backfill that would happen in the provider code before the wasContactedSinceSync check runs.
actionable: true

