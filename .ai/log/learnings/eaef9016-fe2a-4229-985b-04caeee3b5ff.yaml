timestamp: "2026-02-06T19:17:03.485294"
type: architecture
summary: Backfill creates two-cycle delay for legacy task detection
detail: |
  When backfilling metadata for detection logic, the first sync cycle after backfill will NOT trigger detection because the backfilled value equals the current value. Detection only works on the NEXT sync cycle when the monitored field advances beyond the backfilled value. Example: Cycle 1 backfills synced_last_contacted=2026-02-01 (current value), so wasContactedSinceSync returns false. Only in Cycle 2, after a calendar contact updates last_contacted to 2026-02-08, does wasContactedSinceSync return true. This is expected behavior but must be understood when writing tests and verifying fixes in production.
actionable: true

---
timestamp: "2026-02-06T19:17:03.485294"
type: rule
summary: Always add backfill tests showing the two-cycle behavior
detail: |
  When adding backfill logic for detection metadata, always add a test (like TestBackfillSyncedLastContacted) that explicitly demonstrates the two-cycle behavior: Cycle 1 shows backfill occurs but detection returns false (because backfilled value == current value), and Cycle 2 shows detection returns true after the monitored field advances. This prevents confusion about whether the backfill is 'working' and documents the expected delay for legacy tasks.
actionable: true

