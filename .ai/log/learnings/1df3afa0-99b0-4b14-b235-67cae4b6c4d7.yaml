timestamp: "2026-04-06T19:19:08.346707"
type: documentation_gap
summary: "Spec ambiguity: what triggers follow-up task creation"
detail: |
  The initial spec had conflicting signals about what triggers follow-up task creation. This ambiguity would lead to implementation confusion. The resolution: ANY outbound interaction (Telegram message, Todoist task completion, manual entry) creates or refreshes a follow-up Todoist task for contacts with a cadence. This is centralized in RecordInteraction via a followUpManager interface. Specs must be explicit about trigger conditions when behavior could be interpreted multiple ways. Check user stories, architecture diagrams, and implementation sections for consistency.
actionable: true

