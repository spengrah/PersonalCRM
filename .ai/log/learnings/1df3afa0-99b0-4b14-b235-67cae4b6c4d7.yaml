timestamp: "2026-04-06T19:19:08.346707"
type: architecture
summary: Real-time updates change testing and state management
detail: |
  Moving from polling to real-time updates (Telegram UpdateNewMessage, UpdateEditMessage, UpdateDeleteMessages) requires: (1) Update handlers that process events incrementally, (2) State tracking (pts, qts, seq) for gap detection and recovery, (3) Channel state per chat for efficient updates, (4) Soft-delete for message deletions (the interaction still happened even if the message is gone), (5) Edit tracking with edited_at timestamps. Mocking for tests shifts from 'mock HTTP responses' to 'mock update handlers'. Integration tests need to inject update events, not simulate polling cycles.
actionable: true

