timestamp: "2026-04-06T19:19:08.346707"
type: gotcha
summary: Backward compatibility when changing interaction semantics
detail: |
  When adding the `direction` field to interactions, existing sources (gcal, manual) must default to `direction=mutual` to preserve current behavior. The todoist provider needs explicit change from implicit mutual to explicit outbound on task completion. This is a subtle but critical behavior change: completing a Todoist task will NO LONGER reset last_contacted. Must be intentional and documented. When changing data models that affect multiple providers, audit all callers and explicitly set the new field rather than relying on database defaults.
actionable: true

