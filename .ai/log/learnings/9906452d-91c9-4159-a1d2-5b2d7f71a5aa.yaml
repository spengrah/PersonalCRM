timestamp: "2026-01-28T12:19:21.331927"
type: documentation_gap
summary: Core.md gotchas table missed during initial implementation
detail: |
  The Common Gotchas table in .ai/rules/core.md exists to prevent recurring mistakes, but wasn't consulted during the initial implementation. Two gotchas were violated: (1) "Replacing JSONB metadata wholesale on update" - the initial PR replaced metadata maps instead of preserving existing keys; (2) The date format pattern wasn't documented as something to extract. This reveals the gotchas table needs stronger visibility - perhaps a pre-implementation checklist or automated reminder. Future improvement: Add a planning step that explicitly reviews the gotchas table before coding.
actionable: true

