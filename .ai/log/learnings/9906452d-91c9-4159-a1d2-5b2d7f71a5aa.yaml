timestamp: "2026-01-28T12:19:21.331927"
type: rule
summary: Defensive string checks must cover both sides of comparison
detail: |
  When comparing two string values where either could be empty/malformed (e.g., pendingTempID == task.ExternalTaskID), add early returns for BOTH empty string scenarios, not just one side. Even if logically one check suffices, explicit dual checks make the code more obviously correct and prevent future refactoring bugs. Pattern: `if externalTaskID == "" || pendingTempID == "" { return false }` before comparison.
actionable: true

