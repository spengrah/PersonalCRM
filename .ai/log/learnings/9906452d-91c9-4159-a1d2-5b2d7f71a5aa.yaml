timestamp: "2026-01-28T12:19:21.331927"
type: architecture
summary: Sync reconciliation detects drift via stored state snapshots
detail: |
  Poll-based sync providers can't detect CRM-initiated changes through incremental sync responses (external service only reports its own changes). Solution: Store snapshots of synced state in metadata (e.g., synced_deadline) during task creation/updates. Reconciliation compares current CRM state to stored snapshot to detect drift, regardless of change origin. This pattern generalizes to any poll-based sync: track "last known synced value" in metadata for fields that can change in CRM.
actionable: false

