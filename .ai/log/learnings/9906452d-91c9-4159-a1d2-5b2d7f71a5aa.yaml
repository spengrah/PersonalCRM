timestamp: "2026-01-28T12:32:49.723443"
type: architecture
summary: Test unexported reconciliation logic by mimicking behavior
detail: |
  When reconciliation functions are unexported (like reconcileExistingTask), test them by mimicking the logic in unit tests that verify command generation patterns. Create table-driven tests with different metadata states (no synced_deadline, nil metadata, matching deadlines, drift) and assert expected command patterns (no commands, backfill only, close+create, create only). This validates the decision tree without requiring integration tests or exporting internal functions.
actionable: true

