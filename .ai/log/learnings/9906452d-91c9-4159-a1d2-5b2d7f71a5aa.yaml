timestamp: "2026-01-28T12:19:21.331927"
type: gotcha
summary: Test coverage gaps discovered by code review, not tests
detail: |
  The initial implementation had comprehensive tests for the happy path and basic edge cases, but code review identified missing test cases (empty ExternalTaskID with various metadata states). This reveals a pattern: when adding defensive checks to production code, explicitly add corresponding test cases that verify the defensive behavior. Don't assume existing tests cover new defensive logic - add explicit tests that would fail if the defensive check were removed.
actionable: true

