---
timestamp: "2026-01-28T12:04:28.403354"
type: gotcha
summary: Sync reconciliation only creates tasks, doesn't update existing ones
detail: |
  The Todoist sync's reconcileContactTasks() function only creates tasks for contacts without one - it doesn't check if existing tasks need updating when CRM data changes. When contact_by is updated in the CRM (via last_contacted changes), the existing Todoist task keeps its old deadline because it won't appear in incremental sync responses (Todoist didn't change it). Solution: Track synced_deadline in metadata and compare during reconciliation to detect drift.
actionable: true

---
timestamp: "2026-01-28T12:04:28.403354"
type: gotcha
summary: Metadata updates must preserve existing keys, not replace wholesale
detail: |
  When updating contact_task metadata (via UpdateContactTaskMetadata), always read existing metadata first, modify specific keys, then write back. Creating a new map loses other metadata keys. Pattern: metadata := task.Metadata; if metadata == nil { metadata = make(map[string]any) }; metadata[key] = value; UpdateContactTaskMetadata(). This is critical because multiple systems may store different keys in the same metadata field.
actionable: true

---
timestamp: "2026-01-28T12:04:28.403354"
type: distinction
summary: contact_by changes have two origins requiring different handling
detail: |
  contact_by can change from: (1) CRM updates (last_contacted changed) → CRM should win, update Todoist, or (2) Todoist deadline edits → Todoist wins (existing processItem logic). Can't distinguish without tracking. The assumption 'contact_by == todoist.deadline' breaks when CRM changes but sync hasn't run yet. Must track synced_deadline to detect which side changed and handle appropriately.
actionable: true

---
timestamp: "2026-01-28T12:04:28.403354"
type: rule
summary: Poll-based sync can't detect CRM-initiated changes without state tracking
detail: |
  Incremental sync only returns items changed on Todoist's side. When CRM updates contact_by, the Todoist task doesn't appear in sync response. Without tracking previous state (like synced_deadline), there's no way to detect drift. For bidirectional sync, always track what was last synced to each side to detect changes from either direction. Synchronous updates (triggering Todoist immediately on CRM change) were rejected to avoid coupling.
actionable: true

---
timestamp: "2026-01-28T12:04:28.403354"
type: architecture
summary: Date-only metadata should use YYYY-MM-DD format for consistency
detail: |
  When storing dates in contact_task metadata (JSONB), use YYYY-MM-DD string format to match: (1) Todoist's deadline format, (2) PostgreSQL DATE precision (day-level, not timestamp), (3) comparison logic that extracts year/month/day. Parse with time.Parse('2006-01-02', str). Avoids timezone issues and matches domain precision. Storing full RFC3339 timestamps for date-only fields adds unnecessary complexity.
actionable: true

---
timestamp: "2026-01-28T12:04:28.403354"
type: gotcha
summary: Helper functions need defensive empty string checks, not just nil
detail: |
  In isPendingTempID(), checking if pendingTempID (string) == task.ExternalTaskID should include 'if pendingTempID == "" { return false }' before comparison. Empty strings from malformed metadata could incorrectly match empty ExternalTaskID on newly created tasks. Always validate string values aren't empty when they should represent meaningful IDs.
actionable: true

---
timestamp: "2026-01-28T12:19:21.331927"
type: gotcha
summary: Update synced metadata when processing external changes
detail: |
  When sync provider processes external changes (e.g., Todoist deadline edits) that update CRM state, also update any sync-tracking metadata (e.g., synced_deadline). Otherwise reconciliation logic will see the metadata mismatch and incorrectly treat the external-originated change as CRM-initiated drift, triggering unnecessary operations. Pattern: processItem updates contact_by → must also update synced_deadline metadata.
actionable: true

---
timestamp: "2026-01-28T12:19:21.331927"
type: gotcha
summary: Magic date format strings should be extracted as constants
detail: |
  Go's time format string "2006-01-02" appears throughout sync code for parsing/formatting dates. Extract as a named constant (e.g., DateFormat) to ensure consistency, improve readability, and enable easier updates. Using magic strings makes it easy to introduce typos or inconsistencies across the codebase.
actionable: true

---
timestamp: "2026-01-28T12:19:21.331927"
type: documentation_gap
summary: Core.md gotchas table missed during initial implementation
detail: |
  The Common Gotchas table in .ai/rules/core.md exists to prevent recurring mistakes, but wasn't consulted during the initial implementation. Two gotchas were violated: (1) "Replacing JSONB metadata wholesale on update" - the initial PR replaced metadata maps instead of preserving existing keys; (2) The date format pattern wasn't documented as something to extract. This reveals the gotchas table needs stronger visibility - perhaps a pre-implementation checklist or automated reminder. Future improvement: Add a planning step that explicitly reviews the gotchas table before coding.
actionable: true

---
timestamp: "2026-01-28T12:19:21.331927"
type: rule
summary: Defensive string checks must cover both sides of comparison
detail: |
  When comparing two string values where either could be empty/malformed (e.g., pendingTempID == task.ExternalTaskID), add early returns for BOTH empty string scenarios, not just one side. Even if logically one check suffices, explicit dual checks make the code more obviously correct and prevent future refactoring bugs. Pattern: `if externalTaskID == "" || pendingTempID == "" { return false }` before comparison.
actionable: true

---
timestamp: "2026-01-28T12:19:21.331927"
type: architecture
summary: Sync reconciliation detects drift via stored state snapshots
detail: |
  Poll-based sync providers can't detect CRM-initiated changes through incremental sync responses (external service only reports its own changes). Solution: Store snapshots of synced state in metadata (e.g., synced_deadline) during task creation/updates. Reconciliation compares current CRM state to stored snapshot to detect drift, regardless of change origin. This pattern generalizes to any poll-based sync: track "last known synced value" in metadata for fields that can change in CRM.
actionable: false

