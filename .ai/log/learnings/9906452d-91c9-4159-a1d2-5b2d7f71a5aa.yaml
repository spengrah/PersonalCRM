type: gotcha
summary: Code review cycle must be fully resolved before analysis
detail: |
  When a code review identifies multiple issues and some are fixed in a follow-up commit, the agent must address ALL remaining issues that the reviewer explicitly calls out. In this session, the review identified 9 issues, 3 were fixed, and the agent needed to address the remaining 6 (race condition documentation, backfill warning, partial failure handling, test coverage). Don't assume 'most issues fixed' is sufficient - the reviewer expects all issues to be addressed or explicitly discussed as out-of-scope.
