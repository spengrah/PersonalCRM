# Shared path groups for CI, local static checks, and staging reseed decisions.
# Keep flat named groups of quoted globs: the shell consumers use file_in_group
# from scripts/hooks/pre-push. No anchors, aliases, or negation.
#
# Local check selection is configured in .ai/pre-push.json. Backend and frontend
# checks are independent; spec checks use backend, frontend, and spec groups.
# mac_daemon tests run in CI. seed and migrations drive staging reseed decisions.
# infra/langfuse/*.ts triggers frontend CI, but model-prices.json does not.

backend:
  - '.ai/pre-push.json'
  - 'backend/**'
  - 'tests/**'
  - 'go.mod'
  - 'go.sum'
  - 'scripts/**'
  - 'Makefile'
  - '.golangci.yml'
  - '.github/workflows/ci.yml'
  - '.github/workflows/deploy-staging.yml'
  - 'path-filters.yml'
frontend:
  - 'frontend/**'
  - 'infra/langfuse/*.ts'
mac_daemon:
  - 'mac-daemon/**'
  - '.github/workflows/ci.yml'
seed:
  - 'backend/internal/synthetic/**'
migrations:
  - 'backend/migrations/**'
spec:
  - 'spec/**'
