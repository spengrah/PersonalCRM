# Single source of truth for path → which-tests-run mapping.
# Read by BOTH:
#   - CI: .github/workflows/ci.yml `changes` job (dorny/paths-filter@v3, filters: ./path-filters.yml)
#   - Local: scripts/hooks/pre-push (group-aware bash parser, file_in_group)
#
# LCD constraint: flat named groups, each a plain list of 'dir/**' string globs.
# NO YAML anchors/aliases, NO negation patterns — the bash parser is a dumb
# line-scanner and dorny is the other consumer; keep it lowest-common-denominator.
#
# Group → consumer mapping:
#   backend     → CI backend-tests + e2e-tests; local Go/frontend test suite (∪ frontend)
#   frontend    → CI frontend-tests + e2e-tests; local Go/frontend test suite (∪ backend)
#   mac_daemon  → CI mac-daemon-tests. NOTE: the local Swift gate (check_swift) does NOT
#                 use this group; it uses a stricter literal 'mac-daemon/' prefix test, so a
#                 ci.yml-only push runs mac-daemon-tests in CI but NOT swift test locally.
#   seed        → deploy-staging.yml reseed decision (scripts/ci/staging-reseed-decision.sh,
#                 via file_in_group). ORTHOGONAL: synthetic stays in `backend` too, so this
#                 group changes NO CI/pre-push test selection — it only flags the seed surface
#                 the staging auto-reseed diffs against. No CI/pre-push consumer reads it.

backend:
  - 'backend/**'
  - 'tests/**'
  - 'go.mod'
  - 'go.sum'
  - 'scripts/**'
  - 'Makefile'
  - '.github/workflows/ci.yml'
  - '.github/workflows/deploy-staging.yml'
  - 'path-filters.yml'
frontend:
  - 'frontend/**'
mac_daemon:
  - 'mac-daemon/**'
  - '.github/workflows/ci.yml'
seed:
  - 'backend/internal/synthetic/**'
