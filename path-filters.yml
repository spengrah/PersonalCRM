# Shared path groups for CI, local static checks, and staging reseed decisions.
# Keep flat named groups of quoted globs: the shell consumers use file_in_group
# from scripts/hooks/pre-push. No anchors, aliases, or negation (dorny only
# honors negation under predicate-quantifier: every, which breaks multi-glob
# groups, so a markdown file under backend/ still counts as backend).
#
# Local check selection is configured in .agents/pre-push.json. Backend and frontend
# checks are independent; spec checks use backend, frontend, and spec groups.
# scripts gates the shell-test job (deploy-script + hook suites); the few scripts
# the backend lanes execute are listed in backend as well. mac_daemon tests run
# in CI. seed and migrations drive staging reseed decisions. The deploy-script
# suite installs the model's units from name-model/units, so they gate it too.
# infra/langfuse/*.ts triggers frontend CI, but model-prices.json does not.
# name_model gates the name model's endpoint tests; name-model/ is the whole of
# the model image's sources (name-model/image-tag.sh).

backend:
  - 'backend/**'
  - 'go.mod'
  - 'go.sum'
  - 'Makefile'
  - '.golangci.yml'
  - '.golangci.forward.yml'
  - '.github/workflows/ci.yml'
  - '.github/workflows/deploy-staging.yml'
  - 'path-filters.yml'
  - 'scripts/check-*.sh'
  - 'scripts/test-parallelism.sh'
  - 'scripts/worktree-test-pg.sh'
  - 'scripts/lib/docker-answers.sh'
frontend:
  - 'frontend/**'
  - 'infra/langfuse/*.ts'
mac_daemon:
  - 'mac-daemon/**'
  - '.github/workflows/ci.yml'
scripts:
  - 'scripts/**'
  - 'infra/**'
  - 'name-model/units/**'
  - 'Makefile'
  - 'path-filters.yml'
  - '.agents/pre-push.json'
  - '.github/workflows/ci.yml'
seed:
  - 'backend/internal/synthetic/**'
migrations:
  - 'backend/migrations/**'
spec:
  - 'spec/**'
name_model:
  - 'name-model/**'
  - 'Makefile'
  - '.github/workflows/ci.yml'
# Non-frontend files the frontend vitest suite reads (catalog/fixture parity
# tests). Gates only the CI Frontend Tests job, not E2E or local checks.
frontend_inputs:
  - 'spec/*.yaml'
  - 'backend/internal/synthetic/fixtures.go'
