domain: imports-matching
prefix: IMP
maturity: reviewed
settled: [ui, api]
behaviors:
  # --- Matching engine ---

  - id: IMP-001
    title: Identifiers are normalized before any matching
    type: business-logic
    status: current
    surface: none
    given: an external identifier entering the matching engine
    when: it is compared against CRM data
    then:
      - emails are lowercased and trimmed
      - handles are diacritic-folded, lowercased, and stripped of decoration before comparison
      - phones compare loosely by digits with any leading plus preserved (the canonical-form intent is IMP-033)
      - email and canonical phone normalization are shared with the mac daemon via a cross-platform parity fixture
    provenance: [matching/normalize.go, matching/handle_normalize.go, normalization_parity.json]

  - id: IMP-002
    title: Candidate match scores blend name similarity and method overlap
    type: business-logic
    status: current
    surface: none
    given: an external candidate and a CRM contact
    when: a match score is computed
    then:
      - the score weighs trigram name similarity at 0.6 and shared-method fraction at 0.4
      - name candidates are considered only strictly above the minimum similarity (0.3)
      - soft-deleted contacts are never candidates
    provenance: [matching.FuzzyConfig, FindSimilarContactsBatch, countMethodOverlap]

  - id: IMP-003
    title: A suggestion surfaces only above the confidence gate, deterministically
    type: business-logic
    status: current
    surface: none
    given: scored match candidates for an external contact
    when: the suggested match is selected
    then:
      - only candidates at or above the confidence threshold (0.5 for imports) are kept
      - the best score wins, with contact id as the deterministic tie-breaker
    provenance: [ImportMatchService.FindBestMatch, selectBestSuggestion, matching.ImportConfig]

  - id: IMP-004
    title: Username-derived matches must be decisive
    type: business-logic
    status: current
    surface: none
    given: a match whose best evidence is a messaging username
    when: the suggestion is finalized
    then:
      - if a runner-up sits within the collision gap (0.15) of a username-derived top match, no suggestion is made
      - handles shorter than five runes never enter name matching
      - an exact handle-to-name equality earns a score bonus
    provenance: [usernameMatchGap, NormalizeHandleForNameMatch, applyExactHandleBonus]
    notes: Ambiguous common handles must not guess; the collision-gap rule is reused by anarlog title-token matching.

  - id: IMP-041
    title: An identifier matching one contact under several method types is not ambiguous
    type: business-logic
    status: current
    surface: none
    given: an external identifier whose type resolves against more than one kind of contact method (a WhatsApp peer is looked up against both whatsapp and phone methods)
    when: the matching engine decides which contact it belongs to
    then:
      - key: several-methods-on-one-contact-still-match
        text: a contact holding the identifier under several of those method types is matched, because the duplication is about how many ways one person is reachable rather than about which person the identifier belongs to
      - key: distinct-contacts-refuse-to-guess
        text: the identifier is left unmatched only when two or more DISTINCT contacts claim it, since guessing between real people would mis-attribute every message from that peer
    provenance: [resolveContactFromMethods, findContactByMethod, findContactByMethodTx, MapIdentifierTypeToContactMethodTypes, TestResolveContactFromMethods_AmbiguityIsPerContactNotPerRow, TestIdentityService_Integration]
    notes: Counting matched method ROWS instead of distinct contacts refuses a contact that is not in doubt, and reconciliation mints a second method on a peer's first successful match, so a row count strands every peer from its second message onward.

  - id: IMP-005
    title: The import queue only ever suggests
    type: invariant
    status: current
    surface: none
    statement: import-queue matching produces suggestions, never links — resolving a candidate from within the queue requires an explicit user action (import, link, or ignore); candidates can additionally be auto-matched from outside the queue (source sync and rematch housekeeping) when an identifier match is found.
    provenance: [ImportMatchService, ImportSuggestedMatch]

  # --- External-contact lifecycle ---

  - id: IMP-006
    title: External contacts deduplicate per source and address
    type: data
    status: current
    surface: none
    given: an incoming external contact record
    when: it is upserted
    then:
      - uniqueness is per (source, source id, account)
      - a new row starts unmatched
      - the update branch refreshes content but never touches linkage (match status, linked contact, tombstone)
    provenance: [idx_external_contact_unique, ExternalContactRepository.Upsert]

  - id: IMP-007
    title: Match status is a four-state lifecycle with sticky ignore
    type: data
    status: current
    surface: ui
    given: an external contact row
    when: its match status changes
    then:
      - key: unmatched-rows-await-review
        text: unmatched rows await review in the queue
      - key: imported-marks-rows-resolved
        text: imported marks rows resolved with human curation (import-as-new, or a curated link)
      - key: matched-marks-rows-linked
        text: matched marks rows linked without curation (bare link, or source auto-match)
      - key: ignored-terminal-sticky-row
        text: ignored is terminal and sticky; the row never resurfaces in the queue
    provenance: [external_contact match_status CHECK, LinkContact curated signal, Ignore]
    notes: imported-vs-matched is the discriminator that drives auto-propagate vs suggest in reconciliation (IMP-017) — imported means a human curated the method set.
    waivers:
      - then: matched-marks-rows-linked
        reason: the matched (uncurated bare-link) state needs a link with NO curation signal — a zero-method candidate against a cadence-less contact with the name untouched — a degenerate path the modal offers no stable affordance for; the discriminator is owned by the Go integration test TestLinkContact_Bare_LandsMatched

  - id: IMP-008
    title: Tombstoned external contacts revive with their linkage intact
    type: data
    status: current
    surface: none
    given: an external contact deleted at its source
    when: it is tombstoned and later reappears
    then:
      - the tombstone hides the row from queue and matching reads but preserves its linked contact and match status
      - reappearance of the same source id revives the row with its original link intact
      - linkage mutations against a tombstoned row report not-found
    provenance: [SoftDeleteTx, ReviveTx, migration 050]
    notes: The mac-daemon delete/revive event mechanics are mac-host domain; this pins the lifecycle contract on the shared table.

  - id: IMP-009
    title: Suggestion state survives source resyncs
    type: data
    status: current
    surface: none
    given: an external contact carrying pending or dismissed method suggestions
    when: its source resyncs and the producer upsert replaces the row's content
    then:
      - pending and dismissed suggestion state is untouched (excluded from the upsert column set)
    provenance: [migration 060, ExternalContactRepository.Upsert]

  # --- Import queue actions ---

  - id: IMP-010
    title: The candidate list is globally confidence-ranked
    type: api
    status: current
    surface: api
    given: unmatched external contacts
    when: the candidate list is requested
    then:
      - candidates are sorted by suggestion confidence descending before pagination; unsuggested candidates order by name with empty names last
      - unresolved telegram peers are hidden by default, with a count surfaced and an opt-in include flag
      - weak title-derived discovery rows never appear in this list; they surface only through the grouped names section
    provenance: [ListImportCandidates, SuggestionService.BuildSortedCandidates, external_contact.sql unmatched queries]
    notes: Equal-confidence suggested candidates currently have no tie-breaker among themselves.

  - id: IMP-011
    title: Import-as-new is guarded
    type: api
    status: current
    surface: api
    given: an import request for a candidate
    when: the request is validated
    then:
      - key: already-processed-candidate-rejected
        text: an already-processed candidate is rejected (400)
      - key: link-only-source-forbidden
        text: a link-only source is forbidden from importing (403), enforced server-side
      - key: import-without-name-rejected
        text: an import without a name is rejected (400)
      - key: unknown-candidate-not-found
        text: an unknown candidate is not-found (404)
    provenance: [ImportContact guards, IsLinkOnlySource]

  - id: IMP-012
    title: Importing a candidate creates a full CRM contact
    type: business-logic
    status: current
    surface: ui
    given: a valid import of an unmatched candidate
    when: the import runs
    then:
      - key: crm-contact-created-normal-path
        text: a CRM contact is created through the normal creation path (person node, knowledge routing, methods)
      - key: methods-come-from-selection
        text: methods come from the user's selection when provided, else from the external record
      - key: candidate-row-marked-imported
        text: the candidate row is marked imported and linked to the new contact
      - key: response-reports-new-contact
        text: the response reports the new contact and a rematch job id
    provenance: [ImportContact, buildMethodsFromSelection, BuildMethodsFromExternal]

  - id: IMP-013
    title: Curation on link decides imported versus matched
    type: business-logic
    status: current
    surface: ui
    given: a link of a candidate to an existing contact
    when: the link is recorded
    then:
      - key: any-curation-signal-imports
        text: any curation signal (method selection, conflict resolution, cadence, name, or an explicit curated flag) marks the row imported
      - key: bare-link-no-curation
        text: a bare link with no curation marks the row matched
    provenance: [LinkContact curated signal, EnrichContactFromExternalWithSelections]
    notes: Method-value conflicts neither block nor prompt today — a same-type different-value method is simply offered as an addition (IMP-027) — and the server does not reject links over conflicts; conflict resolutions still count as a curation signal at the API level.
    waivers:
      - then: bare-link-no-curation
        reason: a bare link (no method curation, no cadence, no name change) is a degenerate UI path — the modal curates whenever the candidate offers methods or the contact carries a cadence to pre-fill; owned by the Go integration test TestLinkContact_Bare_LandsMatched

  - id: IMP-014
    title: Link-only sources can never create contacts
    type: invariant
    status: current
    surface: api
    statement: candidates from link-only sources (currently gmail correspondence) can only be linked to an existing contact or ignored — never imported as a new contact; the policy is enforced server-side and the allowed actions are declared by the server per candidate.
    provenance: [linkOnlySources, AllowedActionsForSource, 2026-06-02-contact-method-enrichment-suggestions-design.md]

  # --- Enrichment at link/import ---

  - id: IMP-015
    title: Enrichment fills gaps on existing contacts, never creates them
    type: business-logic
    status: current
    surface: none
    given: a contact linked to an external record
    when: enrichment runs
    then:
      - enrichment never creates a contact
      - profile fields are filled only when empty, never overwritten
      - location and birthday enrich via knowledge assertions with agent provenance, not direct column writes
    provenance: [EnrichContactFromExternal, enrichment.go assertInferredKnowledge]
    notes: The assertion mechanics are knowledge-domain scope; the derived-column rule is CON-004.

  - id: IMP-016
    title: User method curation is respected forever
    type: business-logic
    status: current
    surface: none
    given: a link where the user selected a subset of the external record's methods
    when: later reconciliation sees methods missing from the contact
    then:
      - only the user-selected methods were added at link time
      - deselected methods are treated as missing by design and are never auto-added later
    provenance: [EnrichContactFromExternalWithSelections, address_book_reconcile.go]

  - id: IMP-017
    title: Reconciliation auto-propagates for auto-matches and suggests for curated links
    type: business-logic
    status: current
    surface: none
    given: a linked address-book external contact with methods missing from its CRM contact
    when: reconciliation runs
    then:
      - a matched (never-curated) row auto-adds the missing methods
      - an imported (curated) row records the missing set as pending suggestions instead
      - dismissed suggestions are subtracted from the pending set
      - duplicate rows resolve to one effective status with ignored taking precedence over imported over matched
    provenance: [ReconcileLinkedExternalContactMethods, autoPropagate, recordSuggestions]

  - id: IMP-018
    title: Suggestion resolve and dismiss are idempotent set operations
    type: business-logic
    status: current
    surface: api
    given: pending method suggestions on a linked external contact
    when: the user resolves or dismisses them
    then:
      - key: resolve-confirms-requested-methods
        text: resolve confirms the requested methods (or all when unspecified), adds them via enrichment, and clears them from pending
      - key: dismiss-sticky-per-method
        text: dismiss is sticky per method (type and value) and appends to the dismissed set
      - key: stale-entries-pruned-not-dismissed
        text: entries already on the contact or no longer offered by the source are pruned without being dismissed
      - key: actions-re-check-live
        text: actions re-check live state under lock and tolerate repeats; a soft-deleted contact reports gone (410)
    provenance: [ResolveMethodSuggestions, DismissMethodSuggestions, ErrSuggestionContactGone]

  # --- Rematch ---

  - id: IMP-019
    title: Adding contact methods triggers a historical rematch
    type: business-logic
    status: current
    surface: api
    given: new methods appearing on a CRM contact (create, a method operations request, enrichment, or suggestion resolve)
    when: the write commits
    then:
      - key: rematch-event-published-methods
        text: a rematch event is published for the methods that have a registered handler
      - key: caller-receives-rematch-job
        text: the caller receives the rematch job id
      - key: no-job-minted-without-handler
        text: no job is minted when no handler covers any of the methods
    provenance: [rematchRegistry.EligibleMethods, contact_methods.added publishers, RematchDispatcher]

  - id: IMP-020
    title: Rematch fans out per method type and backfills history
    type: business-logic
    status: current
    surface: none
    given: a rematch job for a contact's new methods
    when: the job runs
    then:
      - every handler registered for each method's type runs (email fans out to calendar, gmail, and gchat backfills; telegram and phone link stranded telegram messages)
      - matched historical items are linked to the contact
      - a genuine handler failure fails the job and it is retried as a whole
      - a handler reporting that its own per-run scan budget ran out before finishing is a continue-later signal, not a failure - the job stays running and is rescheduled rather than consuming a retry attempt
      - rescheduling is bounded - once a budget-exhausted job has been rescheduled up to its ceiling without finishing, it is failed and cancelled rather than retried forever
    provenance: [RematchService.Run, CalendarRematchHandler, GmailRematchHandler, UsernameRematchHandler, service.ErrRematchBudgetExhausted, RematchDispatcherWorker.Work]

  - id: IMP-021
    title: Rematch jobs are pollable from the moment they are announced
    type: api
    status: current
    surface: api
    given: a rematch job id returned by a write
    when: the caller polls the job endpoint
    then:
      - the job is visible immediately (registered pending before the worker picks it up)
      - the response reports status, matched count, and the methods being rematched
      - a manual rescan endpoint re-publishes over all of a contact's currently eligible methods, returning a null job id when none are eligible
    provenance: [RematchRegistry.RegisterPending, GetRematchJob, RescanRematch]

  # --- Review surfaces ---

  - id: IMP-022
    title: The suggestions feed unifies method suggestions and candidates
    type: api
    status: current
    surface: api
    given: pending method suggestions and unmatched candidates
    when: the suggestions feed is requested
    then:
      - key: method-suggestions-ride-top
        text: method suggestions ride on top as a group (first page only)
      - key: contact-candidates-follow-confidence
        text: contact candidates follow, confidence-ranked and paginated
      - key: each-candidate-declares-server
        text: each candidate declares its server-decided allowed actions
    provenance: [GET /imports/suggestions, SuggestionItem, buildMethodSuggestionItems]

  - id: IMP-023
    title: Repeated messages from an unknown peer become a discovery candidate
    type: business-logic
    status: current
    surface: none
    given: messages from a sender matched to no contact
    when: the per-peer threshold is crossed
    then:
      - a discovery candidate is upserted into the import queue
      - existing name fields are never overwritten with blanks, and metadata is merged rather than replaced
    provenance: [UpsertTelegramDiscoveryCandidate]
    notes: The message-ingest mechanics are telegram-domain scope; this pins the queue-side contract.

  - id: IMP-024
    title: Weak title-derived name tokens resolve as a group
    type: business-logic
    status: current
    surface: none
    given: name tokens extracted from session titles (low-confidence discovery)
    when: the user resolves a token
    then:
      - candidates are grouped by normalized token with their session-title evidence
      - resolving (import, link, or ignore) applies to all live rows of the group atomically
      - a concurrent import or link of the same group reports not-found rather than double-applying; a raced ignore is an idempotent no-op
      - title tokens never auto-create contacts or interactions on their own
    provenance: [anarlog title group queries, ResolveAnarlogTitle, mac-daemon-phase-2-anarlog-matching.md]
    notes: Title extraction itself is mac-host domain; this pins the review-queue semantics.

  - id: IMP-025
    title: Unmatched meeting sessions surface as conflicts or orphans
    type: business-logic
    status: current
    surface: none
    given: an ingested meeting session needing linkage review
    when: it enters the needs-attention queue
    then:
      - a session with no linkage candidate is an orphan, resolvable by logging an impromptu interaction
      - a session with multiple candidates is a conflict, carrying a persisted snapshot of the candidates and their participant overlap
      - resolving a conflict validates the chosen candidate against that snapshot
    provenance: [meeting_note linkage_state, conflict_candidates migration 056, needs-attention endpoint]
    notes: Session ingest and linkage-state transitions are mac-host domain; this pins the review-surface contract.

  # --- Surfaces ---

  - id: IMP-026
    title: The imports page is one review hub with two tabs
    type: ux
    status: current
    surface: ui
    given: pending imports and interaction reviews
    when: the imports page renders
    then:
      - key: people-tab-default-holds
        text: a People tab (default) holds method suggestions on top, then confidence-ranked candidates with source filters and pagination
      - key: interactions-tab-holds-conflicts
        text: an Interactions tab holds conflicts and orphans, with an attention badge counting only those (discovery items excluded)
      - key: manual-sync-triggers-offered
        text: manual sync triggers are offered for contact and calendar sources
      - key: low-confidence-names-section
        text: a low-confidence names section appears at the bottom only when title-derived tokens exist
    provenance: [imports/page.tsx, SubTabs, NameCandidateSection]

  - id: IMP-027
    title: Candidates resolve in a single-view modal
    type: ux
    status: current
    surface: ui
    given: a candidate opened for resolution
    when: the modal renders
    then:
      - key: everything-one-scrollable-view
        text: everything is one scrollable view — no multi-step wizard
      - key: user-chooses-import-new
        text: the user chooses import-as-new or link-to-existing; link-only sources are locked to link
      - key: name-editable-empty-blocks
        text: the name is editable inline, and an empty name blocks resolution; an unresolved telegram peer requires a name edit before import
      - key: methods-selectable-one-primary
        text: methods are individually selectable with at most one marked primary; link mode distinguishes to-add from already-present methods (already-present ones cannot be re-selected), and a same-type different-value method is offered as an addition alongside the CRM value
      - key: cadence-chosen-or-prefilled
        text: a cadence can be chosen; link mode pre-fills it from the existing contact
    provenance: [suggestion-modal.tsx, method-selector.tsx, detectMethodConflicts]
    notes: A conflict-resolution affordance (keep-CRM vs use-external toggle) exists in the code but is currently unreachable — the detector never emits a conflict state.
    waivers:
      - then: everything-one-scrollable-view
        reason: single-view/no-wizard is a structural-absence property with no deterministic observable; the citing tests for the other then-items all drive one dialog with no step transitions, and visual composition is judge-owned

  - id: IMP-028
    title: The modal pages the whole queue
    type: ux
    status: current
    surface: ui
    given: several candidates in the queue
    when: the modal is open
    then:
      - key: position-pager-arrow-keys
        text: a position pager and arrow keys (inert while typing) move between candidates independent of list pagination (bounded at 1000 candidates)
      - key: modal-advances-to-next
        text: after resolving a candidate the modal advances to the next one, closing only when the queue is exhausted
      - key: suggested-match-when-present
        text: the suggested match, when present, is pre-selected in link mode
      - key: card-opens-that-candidate
        text: opening a candidate from its card opens that candidate — the modal tracks it by id, not list position, so while it remains in the queue a background list refetch or reorder cannot swap in a different candidate (once it is resolved and gone, the modal advances in place as above)
    provenance: [ContactCandidateResolver pager, currentId tracking]

  - id: IMP-029
    title: Suggestion confidence surfaces on the link affordance
    type: ux
    status: current
    surface: ui
    given: a candidate with a suggested match
    when: its card renders
    then:
      - key: link-action-names-suggested
        text: the link action names the suggested contact with its confidence percentage
      - key: without-suggestion-link-action
        text: without a suggestion, the link action asks the user to select a contact
      - key: import-not-offered-link
        text: import is not offered on link-only sources
    provenance: [CandidateCard, sourceAllowsImport]

  - id: IMP-030
    title: Method suggestions resolve against a fixed contact
    type: ux
    status: current
    surface: ui
    given: a pending method suggestion opened for review
    when: the resolver renders
    then:
      - key: target-fixed-no-selection
        text: the target contact is fixed — no contact selection, no import mode
      - key: methods-already-contact-shown
        text: methods already on the contact are shown disabled
      - key: confirm-requires-one-method
        text: confirming requires at least one selected method; dismissing dismisses all pending ones stickily
    provenance: [method-suggestion-resolver.tsx]
    waivers:
      - then: methods-already-contact-shown
        reason: the suggestions feed prunes already-on-contact entries server-side (buildMethodSuggestionItems drift defense), so the disabled already-present row is unreachable and unseedable in E2E; the render-time state is covered by the method-suggestion-resolver component test

  - id: IMP-031
    title: Resolving review items updates every dependent surface without reload
    type: ux
    status: current
    surface: ui
    given: a resolution action on any review surface (import, link, ignore, suggestion, conflict, orphan, name token)
    when: the action succeeds
    then:
      - key: item-leaves-queue-counts-update
        text: the item leaves its queue and dependent counts update immediately
      - key: dependent-surfaces-invalidated
        text: dependent surfaces refresh through query invalidation scoped to the action (queue surfaces always; contact surfaces as affected by the action)
      - key: returned-rematch-job-registered
        text: a returned rematch job is registered for polling
    provenance: [query-invalidation.ts import events, use-imports.ts]

  - id: IMP-036
    title: Telegram candidates surface their @username
    type: ux
    status: current
    surface: ui
    given: a telegram candidate carrying a username
    when: its card renders
    then:
      - key: username-appears-chip-deep
        text: the @username appears as a chip deep-linking to the t.me profile
      - key: no-name-fields-username-used
        text: when the candidate has no name fields the @username becomes the display name and the chip is suppressed
    provenance: [imports/page.tsx CandidateCard telegram chip, getCandidateDisplayName]

  - id: IMP-037
    title: Gmail-correspondence candidates carry co-occurrence evidence
    type: ux
    status: current
    surface: ui
    given: a gmail-correspondence candidate with correspondence metadata
    when: its card renders
    then:
      - key: evidence-badge-names-cooccurring
        text: an evidence badge names the co-occurring contact and shows the message count
    provenance: [imports/page.tsx CandidateCard correspondenceLabel, gmail_correspondence metadata]

  - id: IMP-038
    title: A session deep link lands on its Interactions card
    type: ux
    status: current
    surface: ui
    given: a deep link into the imports page carrying a session id
    when: the Interactions tab loads with the session param
    then:
      - key: session-card-present
        text: the session's card is present on the Interactions tab
      - key: one-time-session-param
        text: the one-time session param is stripped from the URL so a refresh does not re-trigger the highlight
    provenance: [imports/page.tsx sessionParam effect, InteractionsTab highlightedSession]
    notes: The scroll-into-view and highlight styling are judge-owned presentation; the deterministic contract is card-present plus param-strip.

  - id: IMP-039
    title: The resolution modal dismisses without resolving
    type: ux
    status: current
    surface: ui
    given: a candidate open in the resolution modal
    when: the user dismisses it without resolving
    then:
      - key: pressing-escape-closes-modal
        text: pressing Escape closes the modal
      - key: clicking-backdrop-closes-modal
        text: clicking the backdrop closes the modal
      - key: cancel-action-closes-modal
        text: the Cancel action closes the modal
      - key: dismissal-resolves-nothing
        text: dismissal resolves nothing — the candidate stays unmatched in its queue, and an uncommitted name edit is discarded
    provenance: [suggestion-modal.tsx onClose paths, Escape keydown handler, handleCancelNameEdit]

  - id: IMP-040
    title: A linked candidate's new methods appear on the contact without a manual refresh
    type: ux
    status: current
    surface: ui
    given: a contact whose detail view has already been viewed in this session
    when: an import candidate is linked to that contact, adding a method
    then:
      - key: returning-detail-shows-method
        text: returning to the contact's detail view shows the newly added method, with no manual refresh or hard reload
    provenance: ['invalidationRules import:linked', 'useLinkCandidate onSuccess']
    notes: >
      The detail view is cached for five minutes in production, so the linked
      enrichment is only visible if the link invalidates the contact's detail
      entry. The citing E2E must run under the production cache — it imports
      @playwright/test rather than the custom fixture, which sets staleTime to
      0 — must suppress rematch-watcher registration so the assertion cannot
      be satisfied by RematchJobWatcher's own invalidation, and must
      navigate client-side rather than via a hard reload, which would discard
      the cache the behavior is about.

  # --- Proposed ---

  - id: IMP-032
    title: Import marks the candidate processed atomically with contact creation
    type: business-logic
    status: proposed
    surface: none
    given: an import whose contact creation succeeds
    when: the candidate row is marked imported
    then:
      - the candidate cannot remain unmatched once its contact exists (no duplicate-import window)
    provenance: [ImportContact post-create UpdateMatch]
    notes: 'Proposed: today a failure updating the candidate after creation logs a warning and still returns success, leaving the candidate re-importable as a duplicate.'

  - id: IMP-033
    title: Phone overlap scoring uses the canonical phone form
    type: business-logic
    status: proposed
    surface: none
    given: phone methods compared for match-overlap scoring
    when: the overlap is computed
    then:
      - both sides compare in canonical E.164 form, consistent with identity matching
    provenance: [countMethodOverlap, NormalizePhoneLoose, NormalizePhoneE164]
    notes: 'Proposed: today import overlap uses loose digit comparison, so differently shaped stored phones (with and without country code) can silently fail to overlap; flagged as open work in the enrichment design doc.'

  - id: IMP-034
    title: Every method-adding path triggers rematch
    type: business-logic
    status: proposed
    surface: none
    given: any code path that adds methods to a contact from an external source
    when: the methods are added
    then:
      - a rematch event is published so historical data backfills for the new identifiers
    provenance: [SyncMethodsFromExternal, enrichment.go]
    notes: 'Proposed: today the sync-methods path used by source auto-match adds methods without publishing the rematch event — a known divergence — so history is not backfilled until a later enrichment or manual rescan.'

  - id: IMP-035
    title: Duplicate-marked external contacts never surface as candidates
    type: data
    status: current
    surface: none
    given: the same person synced from multiple accounts of a source
    when: a row is marked as a duplicate of a canonical row
    then:
      - the duplicate row carries a pointer to its canonical row
      - every candidate listing and count excludes duplicate-marked rows
      - the person is represented in the queue only by the canonical row
    provenance: [MarkAsDuplicate, external_contact.sql unmatched queries, duplicate_of_id]
    notes: Reconciliation-side duplicate precedence is IMP-017.

  # --- Gmail participant discovery (trusted-sender create candidates) ---

  - id: IMP-042
    title: Trusted-sender participants become create candidates
    type: business-logic
    status: proposed
    surface: none
    given: a fetched Gmail message whose sender is an existing contact or one of the user's own accounts
    when: discovery evaluates the message's To and Cc participants
    then:
      - an unknown participant is upserted as a gmail_participant create candidate on first sighting, with no minimum message count
      - a participant with no display name still qualifies
      - the candidate records the trusted sender's identity and an anchor message subject as evidence, alongside message count
      - known addresses, the user's own addresses, and sticky-ignored addresses are never proposed
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]

  - id: IMP-043
    title: Untrusted senders never produce create candidates
    type: business-logic
    status: proposed
    surface: none
    given: a fetched Gmail message whose sender is neither an existing contact nor one of the user's own accounts
    when: discovery evaluates the message's participants
    then:
      - no gmail_participant candidate is produced, even when known contacts appear among the recipients
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]
    notes: The whole design anchors on sender trust — co-occurrence with a known contact is nearly free by construction of the fetch query and must never qualify on its own.

  - id: IMP-044
    title: The recipient cap suppresses create proposals only
    type: business-logic
    status: proposed
    surface: none
    given: a fetched Gmail message whose To and Cc together exceed 20 recipients
    when: discovery evaluates the message
    then:
      - no gmail_participant candidate is produced from that message
      - link-candidate discovery for the same message is unaffected
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]
    notes: The cap exists so a mass announcement cannot flood the ungated create path; the link path stays uncapped because its trigram gate already filters.

  - id: IMP-045
    title: Link precedence and one card per address across Gmail sources
    type: business-logic
    status: proposed
    surface: none
    given: an unknown address observed by Gmail discovery
    when: both the name-match link gate and the trusted-sender gate could apply
    then:
      - a strong name match to an existing contact takes precedence and yields a gmail_correspondence link candidate
      - otherwise a trust-anchored sighting yields a gmail_participant create candidate
      - an address with an existing candidate row under either Gmail source is never proposed under the other
      - the first classification is sticky until the user resolves the card
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]
    notes: Mutual exclusion is cross-source and therefore not covered by the per-source dedup of IMP-006. No migration machinery — misclassification is cheap, the user picks link or import in the UI.

  - id: IMP-046
    title: The server declares import, link, and ignore for gmail_participant
    type: api
    status: proposed
    surface: api
    given: a gmail_participant candidate
    when: the candidate is served or acted on
    then:
      - the declared allowed actions are import, link, and ignore
      - an import with a user-supplied name succeeds; the link-only rejection never applies to this source
    provenance: ['#789', AllowedActionsForSource, 2026-08-11-gmail-participant-discovery.md]
    notes: Deliberately absent from linkOnlySources — the counterpart of IMP-014.

  - id: IMP-047
    title: Nameless candidates are importable after naming
    type: ux
    status: proposed
    surface: ui
    given: a gmail_participant candidate with no observed display name
    when: the user reviews it in the imports queue
    then:
      - the queue row and the modal identify the candidate by its address, never as a generic unknown label
      - the editable name starts empty
      - import is unavailable until the user supplies a name
      - a name the user has typed survives a background data refresh
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]

  - id: IMP-048
    title: The evidence line renders for every discovery source
    type: ux
    status: proposed
    surface: ui
    given: a discovery candidate whose row carries evidence metadata
    when: the imports queue renders it
    then:
      - message count and recency evidence are visible regardless of the candidate's source
      - the counterpart evidence the source recorded (co-occurring contact, trusted sender, or chat peer identity) is visible
    provenance: ['#803', 2026-08-11-gmail-participant-discovery.md]
    notes: Generalizes the line previously hard-gated to gmail_correspondence; motivated by a real prod mis-link between two rows rendered as bare phone numbers.

  - id: IMP-049
    title: Own-domain addresses count as the user in discovery only
    type: business-logic
    status: proposed
    surface: none
    given: a Gmail account configured with one or more own domains
    when: discovery evaluates fetched messages
    then:
      - a sender address at an own domain anchors trust like a connected account address
      - participant addresses at own domains are never proposed as candidates
      - message storage and inbound-outbound classification are unchanged by the own-domain list
    provenance: ['#789', 2026-08-11-gmail-participant-discovery.md]
    notes: The user operates aliases on a personal domain; the domain list is per-account runtime configuration and is never hardcoded in code, fixtures, or tests (repo PII rule).
