  - id: CON-045
    title: The birthdays page groups contacts by proximity
    type: ux
    status: current
    surface: ui
    given: contacts with birthdays, some with a placeholder year
    when: the birthdays page renders
    then:
      - key: contacts-grouped-into-today
        text: contacts are grouped into today, upcoming, and already-celebrated-this-year sections
      - key: gift-planning-near-year-end
        text: a gift-planning section for early next year appears only near year end
      - key: upcoming-birthdays-sort-soonest
        text: upcoming birthdays sort soonest-first; celebrated ones sink to the end
      - key: placeholder-year-birthdays-no-age
        text: placeholder-year birthdays display without an age
      - key: page-follows-accelerated-time
        text: the page follows the app's accelerated time
      - key: leap-day-next-occurrence
        text: a February 29 birthday is observed on February 29 in a leap year and on March 1 in a common year
    serves: [CON-052]
    provenance: [birthdays/page.tsx, birthdays.spec.ts, isPlaceholderBirthday]
    notes: >-
      Month/day-only birthdays are stored with a placeholder year (1900) — the sentinel drives the age suppression.
      1900 is not a leap year, so February 29 is not representable as a month/day-only birthday at all; a leap-day
      birthday needs a real leap birth year. The page projects a stored birthday onto the current year with
      new Date(year, month, day), which rolls February 29 to March 1 in a common year — that roll is the
      leap-day-next-occurrence behavior, made explicit here rather than left as an emergent property of the
      date arithmetic.

