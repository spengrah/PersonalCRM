domain: interactions
prefix: IXN
maturity: reviewed
settled: [ui, api]
behaviors:
  - id: IXN-001
    title: A contact has one complete, paginated interaction history
    type: ux
    status: current
    surface: ui
    given: a contact has recorded interactions from one or more sources
    when: their interaction history is viewed and additional pages are requested
    then:
      - key: every-source-rendered
        text: every recorded interaction is represented regardless of its source
      - key: reverse-chron-order
        text: interactions are ordered newest first with a deterministic tie-breaker
      - key: load-more-pages
        text: additional pages extend the history without gaps or duplicate rows
      - key: section-replaces-meetings
        text: the unified interaction history takes the place of the separate meetings history
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-002
    title: Every interaction row communicates its source and content shape
    type: ux
    status: current
    surface: ui
    given: an interaction is present in a contact's history
    when: its row is rendered
    then:
      - key: source-badge
        text: the row identifies the interaction source
      - key: direction-shown
        text: the row communicates whether the interaction was inbound or outbound when direction applies
      - key: timestamp-shown
        text: the row shows when the interaction occurred
      - key: row-label
        text: the row has a meaningful label derived from available interaction or content metadata
      - key: content-indicator
        text: the row indicates the kind and amount of content available, including when none exists
      - key: group-marker
        text: the row visibly distinguishes group interactions from direct interactions
      - key: overflow-affordance-reserved
        text: a row of a correctable interaction carries an action affordance for interaction workflows, and a row that is not correctable shows none
      - key: calendar-row-event-details
        text: a calendar row summarizes its event time, place, attendee size, and link when available
      - key: call-row-details
        text: a call row summarizes its service, answer state, voicemail state, and duration
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-003
    title: Venue tags follow constituent content rather than graph pointers
    type: invariant
    status: current
    surface: none
    statement: an interaction's venue tags are derived from the distinct containers of its live constituent content and never from interaction.venue_id, which remains only the graph's primary-container pointer.
    provenance: [.agents/spec/contact-interactions-surface.md, InteractionContentService]

  - id: IXN-004
    title: Message evidence expands in place as a complete plaintext thread window
    type: ux
    status: current
    surface: ui
    given: an interaction contains message content
    when: the interaction is expanded
    then:
      - key: full-plaintext-bodies
        text: every message in the interaction's bounded thread evidence is shown in full as plaintext
      - key: sender-and-timestamp
        text: each message identifies its sender and timestamp, naming the sender's contact where the message is matched to one
      - key: evidence-scope-disclosed
        text: when the evidence shown differs in size from the count recorded against the interaction, both counts are disclosed
      - key: all-speakers-in-group
        text: group evidence includes every speaker represented inside the interaction's thread window
      - key: expand-in-place-no-nav
        text: the evidence opens within the interaction history without navigating away
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-005
    title: Meeting-note evidence preserves the linked notes and their provenance
    type: ux
    status: current
    surface: ui
    given: an interaction has one or more live linked meeting notes
    when: its meeting-note evidence is expanded
    then:
      - key: summary-and-memo-shown
        text: each note exposes its stored summary and memo without inferred rewriting
      - key: all-linked-notes-shown
        text: every live note linked to the interaction is represented
      - key: provenance-footnote
        text: the evidence includes its on-device processing provenance
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-006
    title: Upcoming calendar events share the history without becoming interactions
    type: ux
    status: current
    surface: ui
    given: a contact has current or future calendar events
    when: the unified interaction history is viewed
    then:
      - key: upcoming-badge-at-top
        text: upcoming events carry an upcoming-state badge and appear ahead of past interactions on the shared time axis
      - key: no-interaction-row-for-future
        text: a future event is represented directly and does not create an interaction before it is recorded as one
      - key: event-link-preserved
        text: the event's external link remains available when present
      - key: event-time-place-size
        text: the event communicates its time, place, and attendee size
      - key: all-upcoming-reachable
        text: every event returned by the bounded upcoming read remains reachable
      - key: in-progress-still-upcoming
        text: an event that has started but not ended remains in the upcoming set
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-007
    title: Venue filtering follows content-container membership
    type: ux
    status: current
    surface: ui
    given: a contact has interactions across multiple message venues
    when: a venue filter is applied
    then:
      - key: venue-narrows-list
        text: the history contains only interactions with live constituent content in the selected venue
      - key: expanded-shows-venue-messages
        text: expanded evidence shows the messages relevant to the selected venue
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-008
    title: Date filters bound the history while preserving an all-time view
    type: ux
    status: current
    surface: ui
    given: a contact's unified history spans multiple dates
    when: a date filter is selected
    then:
      - key: preset-30-days
        text: a preset can limit the history to the most recent 30-day window
      - key: preset-90-days
        text: a preset can limit the history to the most recent 90-day window
      - key: custom-range
        text: a custom start and end can bound the history
      - key: all-includes-upcoming
        text: the unbounded view includes upcoming events as well as past interactions
      - key: custom-range-bounds-upcoming
        text: custom bounds apply consistently to upcoming events on the shared time axis
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-009
    title: The interaction history renders recorded state honestly
    type: ux
    status: current
    surface: ui
    given: recorded interaction state may be sparse, duplicated, or absent
    when: the contact's interaction history is rendered
    then:
      - key: contentless-says-none
        text: an interaction without content remains visible and explicitly communicates that no content is available
      - key: duplicates-render-distinct
        text: separately recorded interactions remain distinct even when they appear duplicative
      - key: empty-state-explicit
        text: a contact with no recorded interactions or missed calls receives an explicit empty state
    provenance: [.agents/spec/contact-interactions-surface.md]

  - id: IXN-010
    title: The contact interactions surface is read-only end to end
    type: invariant
    status: retired
    surface: api
    statement: the contact interactions surface exposes only reads, adds no mutation endpoint or interaction writer, and leaves interaction creation to the existing recording paths.
    provenance: [.agents/spec/contact-interactions-surface.md]
    notes: Retired when the user's corrections of interactions became writes on this surface. Merging interactions is IXN-016 and removing participations is IXN-018; their answers and refusals are IXN-029.

  - id: IXN-011
    title: Content assembly is reusable outside HTTP delivery
    type: invariant
    status: current
    surface: none
    statement: interaction content assembly is an independently invocable service seam rather than logic embedded in an HTTP handler.
    provenance: [.agents/spec/contact-interactions-surface.md, InteractionContentService]

  - id: IXN-012
    title: List enrichment performs no per-row content fan-out
    type: invariant
    status: current
    surface: none
    statement: enriching an interaction page uses batched content reads whose statement count stays constant as the number of rows grows for the same source-family mix.
    provenance: [.agents/spec/contact-interactions-surface.md, InteractionContentService]

  - id: IXN-013
    title: The contact interaction list API returns a stable enriched page
    type: api
    status: current
    surface: api
    given: a client requests a contact's interactions with optional venue and date filters
    when: the list request is evaluated
    then:
      - key: enriched-row-fields
        text: every interaction row includes its derived label, content kind, message count, group state, and venue tags
      - key: calendar-event-summary
        text: a resolved calendar interaction includes its title, location, attendee count, times, and external link
      - key: call-summary
        text: a resolved phone-call interaction includes its service, answer state, voicemail state, and duration
      - key: venue-filter-matches-content
        text: a venue filter matches interactions through their live constituent content containers
      - key: date-range-half-open
        text: date filtering includes the lower bound and excludes the upper bound
      - key: filtered-pagination-totals
        text: pagination totals use the same filters as the returned page
      - key: invalid-params-400
        text: invalid pagination, venue, or date parameters receive an HTTP 400 response
      - key: unknown-venue-empty
        text: an unknown venue returns an HTTP 200 response with an empty page
      - key: venue-options-unfiltered
        text: venue options describe all live content containers for the contact independently of active list filters
      - key: stable-order-tiebreaker
        text: rows order by occurrence time descending and interaction id descending
      - key: soft-deleted-excluded
        text: soft-deleted interactions and content do not contribute rows, enrichment, totals, or venue options
    provenance: [.agents/spec/contact-interactions-surface.md, InteractionContentService]

  - id: IXN-014
    title: The per-interaction content API returns bounded, deterministic evidence
    type: api
    status: current
    surface: api
    given: a client requests content by interaction id
    when: the content request is evaluated
    then:
      - key: kind-per-source
        text: message sources return messages; calendar events return meeting_note only with a live linked note and otherwise none; session interactions return meeting_note even without a live note; phone calls return call; and manual or task interactions return none
      - key: full-thread-window
        text: message evidence includes all senders within each constituent container's interaction-bounded thread window
      - key: window-boundary-closed
        text: each message window includes rows exactly at both its minimum and maximum timestamps
      - key: message-order-deterministic
        text: messages order by sent time ascending and message id ascending
      - key: one-row-per-source-message
        text: replicated storage rows for one source message produce exactly one evidence row
      - key: message-field-shape
        text: each message exposes its id, sender, direction, sent time, plaintext body, and venue key
      - key: sender-fallback-precedence
        text: sender labels follow the source-specific metadata precedence and identify outgoing messages as the user
      - key: nullable-body-empty-string
        text: a stored null message body is represented as an empty string without dropping the message
      - key: note-fields-verbatim
        text: meeting-note title, summary, and memo values are returned without inferred rewriting
      - key: not-found-404
        text: an unknown interaction receives an HTTP 404 response
      - key: soft-deleted-404
        text: a soft-deleted interaction receives an HTTP 404 response and its content is inaccessible
      - key: empty-arrays-not-null
        text: absent messages or meeting notes are represented by empty arrays rather than null
    provenance: [.agents/spec/contact-interactions-surface.md, InteractionContentService]

  - id: IXN-015
    title: Every correctable interaction resolves to one interaction node, and message bursts resolve to none
    type: data
    status: current
    surface: none
    given: an observation of a correctable source recorded by any sync, ingest or manual path
    when: the observation is recorded
    then:
      - key: one-node-per-observation
        text: the observation resolves to exactly one interaction node, assigned once when the observation is recorded
      - key: shared-per-source-object
        text: observations of the same calendar event, phone call, task or Anarlog session share one interaction node, whichever contact they belong to and however the participant's observation is keyed
      - key: email-thread-day
        text: observations of the same email thread on the same local day share one interaction node whichever contact they belong to, and the same thread on another day has another node
      - key: manual-own-node
        text: a manual entry has an interaction node of its own, shared with no other observation
      - key: overlapping-events-stay-two
        text: overlapping calendar events with the same attendees remain two interactions with two nodes
      - key: bursts-have-no-node
        text: a message burst from Telegram, iMessage, Google Chat or WhatsApp resolves to no interaction node, however it is extended or promoted to mutual
      - key: assigned-node-kept
        text: a later write to the observation (extension, promotion to mutual, re-link, soft delete, or the transfer to a surviving contact in a contact merge) leaves its interaction node unchanged
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: Merging interactions and removing participations act on interaction nodes in later behaviors of this domain; this behavior fixes only which node each observation belongs to.

  - id: IXN-016
    title: A merge declares one interaction for every attendee
    type: business-logic
    status: current
    surface: api
    given: two or more interactions the user declares to be one, and a contact observed in at least one of them
    when: the user merges them
    then:
      - key: one-participation-per-attendee
        text: every attendee of the merged interactions holds one effective participation in the result, under the interaction the first listed one belongs to
      - key: own-members-only
        text: each contact's participation in the result derives from that contact's own observations of the merged interactions only, so an attendee observed in one of them keeps that one's participation
      - key: no-observation-no-participation
        text: a contact with no observation in any merged interaction gains no participation and no cadence change
      - key: remerge-counts-once
        text: a merged interaction merged again with another gives each attendee one participation across all of them
      - key: merged-away-id-acts-on-merged
        text: naming an interaction that was already merged into another acts on the interaction it was merged into
      - key: answer-is-first-root
        text: the merge answers with the interaction the first listed one belongs to
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: A merge is a judgment of event identity, global across attendees. Unmerge is out of scope.

  - id: IXN-017
    title: A merged interaction counts once per contact, combining only that contact's members
    type: business-logic
    status: current
    surface: api
    given: a merge of interactions in which a contact was observed
    when: the contact's participation in the merged interaction is derived
    then:
      - key: mixed-directions-mutual-at-latest
        text: an inbound and an outbound member of the same contact, in either order, make one mutual participation at the latest of that contact's member times
      - key: shared-direction-kept
        text: members of one shared direction make one participation of that direction at the latest of that contact's member times
      - key: mutual-member-makes-mutual
        text: any mutual member makes the participation mutual
      - key: no-inherited-member
        text: no contact inherits another attendee's member, so a contact present only in an earlier member keeps that member's direction and time
      - key: preview-equals-merge
        text: the merge preview answers exactly what the merge answers for the same request
      - key: preview-writes-nothing
        text: the merge preview changes no interaction, judgment, cadence field or task and publishes nothing
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: Nothing invents a direction or a time. If mutual would be wrong, the interactions are not one interaction and the user does not merge them.

  - id: IXN-018
    title: A removal removes exactly the selected attendees' participations and binds to the observations judged
    type: business-logic
    status: current
    surface: api
    given: an interaction and a removal scope naming some of its attendees or everyone, with a reason of duplicate, did not attend or did not happen
    when: the user removes participations
    then:
      - key: scope-removes-exactly-selected
        text: the selected attendees' participations are removed and every other attendee's participation stays
      - key: everyone-removes-every-attendee
        text: removing everyone removes every attendee's participation
      - key: everyone-covers-later-observed
        text: removing everyone also covers an attendee that a later re-observation of the same source object adds
      - key: re-observation-stays-removed
        text: a later re-observation of a removed source object stays removed
      - key: binds-to-judged-members
        text: a removal covers the source objects of the interaction as it stood when the user judged it and never a source object merged in afterwards
      - key: covers-every-member
        text: a removal on a merged interaction covers every member's source object for the selected attendees, including a member the attendee had no observation of when judged
      - key: reason-independent-of-scope
        text: the reason is recorded and never changes what the scope removes
      - key: merged-away-id-acts-on-merged
        text: naming an interaction that was merged into another acts on the interaction it was merged into
      - key: survives-contact-merge
        text: a removal survives a later merge of the removed contact into another contact
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The removal dialog pre-selects the current contact; the request always names its scope explicitly.

  - id: IXN-019
    title: A merged interaction shows every member's source and content, each content item attributed to its own channel
    type: ux
    status: current
    surface: ui
    given: an interaction the user declared one from several members appears in a contact's history
    when: its row is viewed and then expanded
    then:
      - key: one-row-every-member-source
        text: the merged interaction is one row, no row remains for a member on its own, and the row identifies the source of every member
      - key: member-content-in-own-section
        text: the expanded evidence shows each member's content in a section of its own
      - key: content-attributed-to-own-channel
        text: every content item of the expanded evidence is attributed to its own channel, whichever member it belongs to
      - key: unmerged-shows-its-one-source
        text: an interaction that was not merged is one row with its one source and its content
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The row and its evidence render from a typed identity and a participation context (IXN-022), so the same member sections appear wherever the components are used.

  - id: IXN-022
    title: Every timeline item has a typed identity that decides its actions
    type: invariant
    status: current
    surface: none
    statement: every timeline item has a typed identity whose kind decides which actions it offers, only the kind interaction offering corrections, and the row and drill-down render from that identity plus a participation context, independent of the contact page.
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The kinds are interaction, message burst, upcoming event and missed call. No source decides whether an item is correctable.

  - id: IXN-026
    title: The identity backfill gives every stored live correctable observation its interaction node
    type: data
    status: current
    surface: none
    given: observations stored before interaction nodes existed
    when: the identity backfill runs
    then:
      - key: live-correctable-get-node
        text: every live observation of a correctable source receives its interaction node under the same per-source rule that live recording uses
      - key: shared-per-source-object
        text: observations of the same source object share one node
      - key: bursts-and-soft-deleted-untouched
        text: message bursts and soft-deleted observations are left without a node
      - key: no-other-column-changes
        text: no column of any observation other than its interaction node changes
      - key: idempotent
        text: running the backfill again changes no observation and creates no node
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]

  - id: IXN-029
    title: The correction requests answer with the result or refuse without writing
    type: api
    status: current
    surface: api
    given: a merge, merge preview or removal request
    when: the request is answered
    then:
      - key: merge-answers-participation
        text: a merge or preview answers success with the merged interaction and the requesting contact's resulting direction and time
      - key: removal-answers-no-content
        text: a removal answers success with no content once the correction, the cadence recompute and the local follow-up changes are committed
      - key: fewer-than-two-refused
        text: a merge or preview naming fewer than two distinct interactions is refused as invalid
      - key: unknown-interaction-not-found
        text: a merge or preview naming something that is no interaction, such as a message burst or a contact, is refused as not found
      - key: contact-refused
        text: a merge or preview for a contact that does not exist is refused as not found, and for a contact with no participation in the named interactions as invalid
      - key: removal-body-refused
        text: a removal with no scope, both scopes, an empty contact list or a reason outside duplicate, did not attend and did not happen is refused as invalid
      - key: removal-unknown-interaction-not-found
        text: a removal of something that is no interaction is refused as not found
      - key: non-participant-refused
        text: a removal naming a contact that does not take part in the interaction is refused as invalid
      - key: no-participant-refused
        text: a removal of an interaction in which no contact takes part any longer is refused as invalid
      - key: refusal-writes-nothing
        text: a refused request changes no interaction, judgment, cadence field or task and publishes nothing
      - key: removal-is-only-delete
        text: the removal request is the only way over HTTP to remove a participation; the surface has no request that deletes an interaction
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: No correction answer carries an assertion, predicate or provenance (KNW-038).

  - id: IXN-020
    title: A missed call without voicemail appears as cadence-inert evidence
    type: ux
    status: current
    surface: ui
    given: a contact called and the user missed the call, which left no voicemail
    when: the contact's interaction history is viewed
    then:
      - key: distinct-missed-call-row
        text: the missed call appears at its time as a row distinct from recorded interactions
      - key: cadence-inert-shown
        text: the row visibly states that the missed call did not count toward cadence
      - key: no-row-actions
        text: the row offers no actions
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The missed call stays a call record with no interaction (ING-039); IXN-024 owns its list item and IXN-025 its cadence-inertness at ingest.

  - id: IXN-021
    title: A call the user placed never shows as missed
    type: ux
    status: current
    surface: ui
    given: a contact's history includes calls
    when: the call rows are rendered
    then:
      - key: connected-outbound-not-missed
        text: an outbound call with positive duration shows as connected, never as missed
      - key: unanswered-outbound-not-missed
        text: an outbound call with zero duration shows as an unanswered attempt, never as missed
      - key: missed-inbound-shows-missed
        text: an inbound call the user did not answer shows as missed, including one that left a voicemail
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: Missed names an inbound call the user did not answer. The call record's direction and duration decide the state; the recorded interaction direction is unchanged (ING-039).

  - id: IXN-024
    title: The contact interaction list includes missed calls without voicemail as their own items
    type: api
    status: current
    surface: api
    given: a contact missed an inbound call that left no voicemail
    when: the contact's interactions are listed
    then:
      - key: missed-call-item
        text: the missed call is an item of kind missed_call identified by the call record's id, while recorded interactions are items of kind interaction
      - key: cadence-inert-marked
        text: the missed-call item is marked cadence-inert and interaction items are not
      - key: missed-call-summary
        text: the missed-call item carries the call summary that call interactions carry, including the call's direction
      - key: ordered-among-items
        text: missed-call items order, paginate, and count by the call's time among the contact's interactions
      - key: voicemail-stays-interaction
        text: a missed call that left a voicemail remains an interaction item
      - key: own-calls-only
        text: another contact's missed calls are absent
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, InteractionContentService.ListTimeline]
    notes: A missed call has no content container, so a venue filter excludes it; date filters apply to the call's time.

  - id: IXN-025
    title: A missed call without voicemail never bears cadence
    type: business-logic
    status: current
    surface: none
    given: a contact with cadence fields, an awaiting-reply window, an active skip and a live follow-up task
    when: an inbound call the user missed, which left no voicemail, is ingested for that contact
    then:
      - no interaction is recorded for the contact
      - the contact's cadence fields, awaiting-reply window and skip state are unchanged
      - the contact's follow-up tasks are unchanged and no follow-up operation is enqueued
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, decideCallInteraction]

  - id: IXN-033
    title: The contact interaction list carries one typed item per effective participation
    type: api
    status: current
    surface: api
    given: a contact with recorded interactions, some merged, some removed and some duplicative, and with missed calls
    when: the contact's interactions are listed
    then:
      - key: typed-identity
        text: each item carries a typed identity naming its kind and its own id, and no other field of an item or member names an item identity; a recorded interaction is identified by its interaction, a message burst by its observation and a missed call by its call record
      - key: merged-once-combined
        text: an interaction merged from several interactions is one item for the contact, whose direction combines the contact's own members' directions and whose time is the latest of those members' times
      - key: members-listed
        text: an interaction item lists its members, including a member only another attendee took part in, each with the source, label, content kind, message count, group marker, venue tags and event or call summary of its own, ordered by time; every other item is its own one member
      - key: removed-absent
        text: a participation the user removed is absent from the contact's list
      - key: unmerged-distinct
        text: interactions that were not merged stay separate items, even when they look duplicative
      - key: effective-time-order-and-filters
        text: items order newest first by their effective time with a deterministic tie-breaker, and date bounds, pagination totals and the venue filter apply to items, the venue filter keeping an item when any of its members would be kept and dropping missed calls
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, InteractionContentService.ListTimeline]
    notes: Missed-call items are IXN-024's; the requests that produce merged and removed participations are IXN-029's.

  - id: IXN-034
    title: A timeline item's content is read by its typed identity, each content item attributed to its own container
    type: api
    status: current
    surface: api
    given: a timeline item of a contact, which may be a merged interaction
    when: its content is read in the participation context of that contact
    then:
      - key: members-grouped
        text: the answer names the item's identity and groups each member's messages and meeting notes under that member, in the order the list gives the members
      - key: item-attribution
        text: every message and meeting note carries its own source, the kind of its own container and that container
      - key: no-alias-container
        text: a content item's container is never resolved through a merge, so each item keeps the container of its own source object inside a merged interaction
      - key: stable-content-ref
        text: every content item carries an opaque reference that is the same for the same source message or note in every read, whichever contact's copy the read selected
      - key: merged-away-id
        text: naming an interaction that was merged into another reads the interaction it was merged into
      - key: other-kinds
        text: a message burst reads as one member, a missed call as one call member with no content, and an upcoming event as one member holding its linked meeting notes
      - key: invalid-400
        text: an unknown kind, a malformed id, and a missing or malformed contact are refused as invalid
      - key: not-found-404
        text: an id that names no item of its kind, and a contact that does not exist, are refused as not found
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, InteractionContentService.GetTimelineContent]
    notes: The content a member holds is what the per-interaction content read of IXN-014 gives for that member.

  - id: IXN-036
    title: An interaction's effective participants are readable, the contacts a removal can name
    type: api
    status: current
    surface: api
    given: an interaction whose participations may have been merged or removed
    when: its participants are read
    then:
      - key: lists-effective-participants
        text: the answer lists every contact with an effective participation in the interaction, each by contact id and display name
      - key: removed-absent
        text: a contact whose participation was removed is absent
      - key: merged-reads-merged
        text: naming an interaction that was merged into another, or the one it was merged into, reads the participants of the merged interaction
      - key: no-interaction-not-found
        text: an id that names no interaction, such as a message burst or a contact, is refused as not found
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, InteractionCorrectionService.Participants]
    notes: The read derives nothing of its own; it reads the effective participation the correction requests (IXN-029) act on.

  - id: IXN-037
    title: The user removes participations of an interaction from its row
    type: ux
    status: current
    surface: ui
    given: a contact's history holds a correctable interaction that the contact and another attendee took part in
    when: the user removes it from its row's action menu
    then:
      - key: menu-offers-remove
        text: a correctable interaction's row offers Remove, and a message burst, upcoming event or missed call offers no correction
      - key: names-interaction
        text: the removal names the interaction it acts on
      - key: attendees-current-preselected
        text: the removal lists the interaction's attendees with the current contact pre-selected, and offers everyone
      - key: reason-required
        text: the removal asks for a reason of duplicate, did not attend or did not happen, and cannot be submitted without one
      - key: default-removes-current-only
        text: submitting the default removes the interaction from the current contact's history only, and the other attendee keeps it
      - key: everyone-removes-every-attendee
        text: choosing everyone removes the interaction from every attendee's history
      - key: cadence-refreshes-without-reload
        text: after submitting, the row leaves the history and the contact's recent activity shows the recomputed values without a reload
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The removal is the request of IXN-018; the attendees it lists are IXN-036's.

  - id: IXN-038
    title: The user merges interactions selected on a contact's history
    type: ux
    status: current
    surface: ui
    given: a contact's history holds two correctable interactions, one of them shared with another attendee, beside items that are not correctable
    when: the user selects interactions and confirms a merge
    then:
      - key: menu-offers-merge
        text: a correctable interaction's row offers Merge, which starts selecting interactions with that one selected
      - key: only-correctable-selectable
        text: only correctable interactions can be selected; a message burst or missed call cannot
      - key: two-needed
        text: the merge cannot be confirmed with fewer than two interactions selected
      - key: confirmation-side-by-side
        text: the confirmation shows the selected interactions side by side and says the merge applies to every attendee
      - key: states-preview-result
        text: the confirmation states the current contact's resulting direction and time as the merge preview answers them
      - key: one-row-as-stated
        text: after confirming, the history shows one row in place of the selected interactions, with the direction and time the confirmation stated
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The merge is the request of IXN-016 and IXN-017; the frontend computes no merged direction or time of its own.

  - id: IXN-023
    title: The drill-down shows, read-only, the assertions that cite its content
    type: ux
    status: current
    surface: ui
    given: a timeline item whose displayed content an assertion's provenance cites
    when: its row is expanded on the contact page
    then:
      - key: assertion-beside-cited-content
        text: each such assertion appears beside the content item it cites, stating its subject, predicate, value and recorded review status
      - key: read-only-no-review-controls
        text: the assertions offer no accept or reject control, no baseline, no verdict and no way into the knowledge graph
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, InteractionDrillDown]
    notes: Which assertions appear is IXN-039. Reviewing them belongs to a later claim-review surface.

  - id: IXN-039
    title: A timeline item's assertions are those whose provenance cites its displayed content
    type: api
    status: current
    surface: api
    given: a timeline item of a contact, and assertions whose provenance cites content rows
    when: the item's assertions are read in the participation context of that contact
    then:
      - key: cites-displayed-content
        text: every assertion whose provenance cites a content item the item's content read displays is returned once for that item, keyed by the item's content reference and carrying its predicate, subject, value and recorded review status; provenance citing any contact's copy of a displayed message cites that message
      - key: undisplayed-content-omitted
        text: an assertion citing only content the item's content read does not display is not returned
      - key: merged-any-member
        text: on a merged interaction, an assertion citing any member's displayed content is returned
      - key: corrections-never-returned
        text: an assertion under a correction predicate of the catalog is never returned, whatever its provenance cites
      - key: no-cited-content-empty
        text: an item with no cited content answers an empty list
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md, TimelineAssertionService.ListTimelineAssertions]
    notes: The displayed content is IXN-034's content read for the same identity and contact. This read is the one HTTP read of the assertion store (KNW-038).

  - id: IXN-041
    title: The all-interactions view lists every interaction across contacts, one row per interaction
    type: ux
    status: current
    surface: ui
    given: interactions are recorded for several contacts, some of them shared between contacts
    when: the all-interactions view is opened and further pages are requested
    then:
      - key: every-interaction-represented
        text: every interaction of every contact is represented, whatever its source
      - key: shared-interaction-one-row
        text: an interaction several contacts take part in, including a group chat's messages held once per member, is one row that names each of those contacts
      - key: renders-with-history-row
        text: each row renders with the contact history's row and drill-down, keeping its typed identity and the actions its kind offers
      - key: row-sets-out-columns
        text: each row sets out, across the view's full width, the interaction's direction and source, its participant contacts, a preview of its content that takes the width the others leave, its date, and its review indicator
      - key: newest-first-tie-breaker
        text: rows order newest first with a deterministic tie-breaker
      - key: drill-down-full-width
        text: a row's drill-down spans the view's full width
      - key: paginated-without-gaps
        text: the view is paginated, and further pages extend it without gaps or duplicate rows
      - key: main-navigation-leads
        text: the main navigation leads to the view
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9, designs/bench.md]
    notes: The bench of the decision-model extraction spec. The row and drill-down are IXN-002, IXN-004 and IXN-022's.

  - id: IXN-042
    title: The all-interactions view filters by contact, interaction type and run, and by nothing else
    type: ux
    status: current
    surface: ui
    given: the all-interactions view lists interactions of several contacts and types, from threads judged in several runs
    when: filters are applied
    then:
      - key: contact-filter
        text: a contact filter keeps the rows that contact takes part in
      - key: type-filter
        text: a type filter keeps the rows of that interaction type
      - key: run-filter-includes-reused
        text: a run filter keeps the rows of threads with a judgment appearing in that run, including a judgment the run reused
      - key: filters-combine
        text: filters combine, and pagination totals count the filtered rows
      - key: filters-in-address
        text: the filters are part of the view's address, so a link opens the view filtered
      - key: no-other-filter
        text: the view offers no other filter
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9 NG4, designs/bench.md]

  - id: IXN-043
    title: A view narrowed to a run states the run and lists its incomplete threads
    type: ux
    status: current
    surface: ui
    given: a judgment run, some of whose threads are incomplete
    when: the all-interactions view is narrowed to the run
    then:
      - key: run-chosen-from-list
        text: the run is chosen from a list that names each run's kind, method, method version and content window
      - key: run-stated
        text: the view states the run's kind, method, method version, content window, whether it finished, and how many threads it judged
      - key: incomplete-listed
        text: every incomplete thread of the run is listed with its cut-off and the reason it is incomplete
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9 G11 SC1, designs/bench.md]

  - id: IXN-044
    title: A thread judgment appears for review once, on the row holding the latest content it read
    type: ux
    status: current
    surface: ui
    given: a thread judgment whose thread spans several rows and several participant contacts
    when: the all-interactions view lists the thread's rows
    then:
      - key: one-row-latest-content
        text: the judgment appears on exactly one row, the row holding the thread's latest content at or before the judgment's cut-off
      - key: collapsed-indicator
        text: that row shows, collapsed, one review indicator, either how many items of its proposals await review or that all are reviewed
      - key: names-no-outcomes
        text: the row names none of the judgment's outcomes; the proposal appears only when the row is expanded
      - key: several-methods-production-first
        text: judgments of several methods on the same content appear together on that row, the production method's first
      - key: run-shows-its-judgments
        text: a view narrowed to a run shows only the judgments appearing in that run
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9 SC1, designs/bench.md]

  - id: IXN-045
    title: A judgment's proposal sits beneath the content it read, as of its cut-off
    type: ux
    status: current
    surface: ui
    given: a judged row whose thread gained content after the judgment's cut-off
    when: the row is expanded
    then:
      - key: content-cutoff-proposal-together
        text: the content the judgment read, its cut-off and its proposal are shown together, the proposal directly beneath that content
      - key: cutoff-marked
        text: the cut-off is marked across the thread, pointing at the content the judgment read, and states the cut-off's date and time
      - key: after-content-marked
        text: content after the cut-off is set apart from that content, subdued, and marked as after the judgment
      - key: proposal-names-method
        text: the proposal names its method, its method version and whether that method is the production method
      - key: other-method-collapsed
        text: a proposal of another method on the same content is set apart, collapsed, and marked as not acting
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9 SC1 HC7, designs/bench.md]

  - id: IXN-046
    title: A proposal lists the judgment's answers, never its questions, each item with its state
    type: ux
    status: current
    surface: ui
    given: a judgment of a thread with several participant contacts, as the bench read compiles it
    when: its proposal is shown
    then:
      - key: lists-answers
        text: the proposal lists the participant contacts the user owes a reply, the participant contacts who owe the user a reply, the open commitments in one list each naming its debtor and its creditor, and the thread's big-moment flag
      - key: reply-list-limits
        text: a reply list holds at most one contact for a one-to-one thread, and a meeting's proposal has no reply lists
      - key: commitment-date-and-stand-in
        text: a commitment shows the due date its judgment selected, or that it has no stated date, and a party's commitment stands in for that party's reply owed in the same direction
      - key: source-quote-leads
        text: a commitment whose judgment names the message that states it quotes that message and leads to it in the thread; a commitment whose judgment names none shows no quote
      - key: flag-belongs-to-thread
        text: the big-moment flag belongs to the thread, not to a contact, and shows the same whether the moment is a participant's own or another person's
      - key: questions-not-shown
        text: the questions put to the decision model are not shown
      - key: confidence-shown
        text: each item the judgment produced shows its confidence, a live item with a suggested change shows the suggestion's confidence, and a live item the judgment did not produce, such as the timestamp rule's wait, shows none of its own
      - key: states-told-apart
        text: each item not yet reviewed shows one state of live, suggested, not acting, or live with a suggested removal or later date, and the four are told apart; an item the user removed shows its removal mark in place of a state
      - key: no-item-hidden
        text: no item is hidden because of its confidence
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G3 G3b G3c G6 G9 HC7 NG3 SC4, designs/bench.md]

  - id: IXN-047
    title: The user corrects a proposal inline, each act recorded as one outcome's review
    type: ux
    status: current
    surface: ui
    given: a proposal with items the user has not reviewed
    when: the user corrects it
    then:
      - key: confirm-by-judged
        text: the user confirms an item, or accepts a suggested change, by stating the judged outcome as the right one
      - key: remove-by-no-effect
        text: the user removes an item from a reply list or from the commitments, or removes the flag, by stating the outcome's no-effect value as the right one
      - key: add-by-outcome
        text: the user adds a participant contact to a reply list, which moves that contact out of the other reply list, adds a commitment in either direction, or adds the flag, by stating that outcome as the right one
      - key: keep-live-against-removal
        text: the user keeps a live item against a suggested removal by stating the live outcome as the right one
      - key: keep-date-against-later
        text: the user keeps a commitment's date against a suggested later date, and the obligation keeps its current date
      - key: added-commitment-fallback
        text: a commitment the user adds has no stated date and takes the timing of a commitment without one
      - key: added-flag-own-moment
        text: a flag the user adds is recorded as a participant's own moment
      - key: additions-participants-unreviewed
        text: an addition offers only participant contacts, and only outcomes not yet reviewed
      - key: inline-no-verdict
        text: every correction happens on the proposal itself, with no modal or separate form, and the client never sends a verdict
      - key: shows-without-reload-or-error
        text: each correction shows on its item without a reload, and a failed correction leaves the item's controls in place with an error
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G3c G5 G7d G8 SC5 SC7, designs/bench.md]

  - id: IXN-048
    title: Each reviewed item shows its review in place after a reload
    type: ux
    status: current
    surface: ui
    given: items of a proposal the user reviewed
    when: the view is reloaded and the proposal is shown again
    then:
      - key: confirmed-in-place
        text: a confirmed item, a live item kept against a suggested removal, and a commitment whose date the user kept show as confirmed, in place, beside their state
      - key: removed-stays-struck
        text: an item the user removed, or whose suggested removal the user accepted, stays in its list shown as removed by the user, never hidden
      - key: added-shown
        text: an item the user added shows as added by the user
      - key: no-control-after-review
        text: a reviewed item offers no review control
      - key: counts-exclude-reviewed
        text: the proposal's and its row's counts of items awaiting review leave out the reviewed items
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G5 G8 HC6, designs/bench.md]

  - id: IXN-049
    title: An accepted big-moment flag shows on its thread, beneath the content it was judged on
    type: ux
    status: current
    surface: ui
    given: a thread judgment whose big-moment outcome is in effect, applied or confirmed
    when: the row holding the judgment is viewed and expanded
    then:
      - key: flag-beneath-content
        text: the flag shows in the proposal directly beneath the content the judgment read
      - key: both-moments-same
        text: a participant's own moment and another person's moment mentioned in passing show as the same flag
      - key: no-summary
        text: the flag carries no summary of the moment
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G3c G7f SC10 NG3, designs/bench.md]

  - id: IXN-050
    title: A contact's interaction history links out to the all-interactions view filtered to that contact
    type: ux
    status: current
    surface: ui
    given: a contact with recorded interactions
    when: the contact's interaction history is viewed
    then:
      - key: history-links-out
        text: the history offers a link to the all-interactions view filtered to that contact
      - key: link-opens-filtered
        text: following the link opens the view listing only the rows that contact takes part in
      - key: history-no-review
        text: the contact's history offers no judgment review of its own
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9, designs/bench.md]

  - id: IXN-051
    title: The all-interactions list route returns every interaction across contacts, filtered and paginated
    type: api
    status: current
    surface: api
    given: interactions of several contacts, some shared, on threads judged in several runs
    when: the all-interactions list is read, optionally by contact, interaction type, run and page
    then:
      - key: every-interaction-one-row
        text: every interaction across contacts is one row naming each of its participant contacts
      - key: pages-without-gaps
        text: rows order newest first with a deterministic tie-breaker, and pages cover them without gaps or duplicates, the total counting the rows the filters keep
      - key: filters-combine
        text: the contact filter keeps the rows a contact takes part in, the type filter the rows of one interaction type, and the two combine
      - key: run-keeps-judged-threads
        text: the run filter keeps the rows of threads with a judgment appearing in the run, including a judgment the run reused, and excludes a thread judged only in another run
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G9, designs/bench.md]
    notes: The bench's list (IXN-041, IXN-042) reads this route.

  - id: IXN-052
    title: The all-interactions list carries each thread judgment compiled into the answers the user reviews
    type: api
    status: current
    surface: api
    given: judgments of a thread by the production method and by another method, some outcomes landed as claims
    when: the all-interactions list returns the row holding the thread's latest content the judgments read
    then:
      - key: answers-not-questions
        text: each judgment's proposal lists the participants the user owes a reply, the participants who owe the user one, the open commitments with their debtor and creditor, and the big-moment flag
      - key: commitment-absorbs-reply
        text: a party's open commitment stands in for that party's reply owed in the same direction
      - key: commitment-source-message
        text: a commitment whose judgment names the message stating it carries that message's reference, time and text
      - key: state-and-acts
        text: each item carries its state (live, suggested, not acting, or live with a suggested change), its confidence where the judgment produced it, and the review each of its controls sends, so the client applies no judgment rule
      - key: removal-keeps-its-target
        text: a suggested removal sits in the list of the live obligation or wait it would take away, and keeping it states that live outcome, whatever obligations the thread held before
      - key: state-is-live-effect
        text: an item whose live effect no longer holds, its obligation closed or its flag withdrawn, is not acting even when another obligation of the same party is open, whatever judgment, method or review opened it, and a review restating that effect reopens nothing and leaves that other obligation as it is; an obligation a commitment superseded or a contact merge combined stays the item's
    provenance: [.agents/spec/2026-10-14-decision-model-extraction.md G3b G6 G9 HC7, designs/bench.md]
    notes: The bench's proposals (IXN-046) read these lists.
