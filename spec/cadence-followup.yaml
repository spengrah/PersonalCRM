domain: cadence-followup
prefix: CAD
maturity: reviewed
settled: [ui, api]
behaviors:
  # --- Cadence computation ---

  - id: CAD-001
    title: A contact without a cadence is outside the engine
    type: business-logic
    status: current
    surface: none
    given: a contact with an empty or absent cadence
    when: cadence-driven behavior is evaluated
    then:
      - the contact is never overdue
      - no new cadence-due task is created for it
      - no follow-up loop opens on its interactions
    provenance: [cadence.ParseCadence, FollowUpManager, CadenceSyncProvider.reconcileContactTasks]
    notes: The cadence vocabulary itself is CON-002/CON-047. Clearing a cadence does not retire tasks that already exist; those resolve through their own lifecycle triggers.

  - id: CAD-002
    title: The next-contact date derives from the last contact plus the cadence interval
    type: business-logic
    status: current
    surface: none
    given: a contact with a cadence
    when: contact_by is computed
    then:
      - the base date is last_contacted when set, else created_at
      - the interval is fixed-length per cadence (7, 14, 30, 90, 180, 365 days in production)
      - in production the result is a date (day precision, timezone-safe)
    provenance: [cadence.CalculateContactBy, cadence.GetCadenceDuration, .ai/guides/architecture.md]

  - id: CAD-003
    title: Cadence intervals scale with the environment for accelerated testing
    type: business-logic
    status: current
    surface: none
    given: the app running in a testing or accelerated environment
    when: cadence intervals are resolved
    then:
      - production resolves real-day intervals
      - testing and accelerated environments compress the same cadences to minutes or hours
      - all cadence math reads the app's accelerated clock, never the wall clock
    provenance: [cadence.GetCadenceConfig, accelerated.GetCurrentTime, .ai/rules/core.md]

  - id: CAD-004
    title: A contact is overdue only strictly past its next-contact date
    type: business-logic
    status: current
    surface: none
    given: a contact with a cadence and a next-contact date
    when: overdue status is evaluated
    then:
      - in production the contact is overdue when contact_by is strictly before today (due today is not overdue)
      - in testing mode the comparison is timestamp-based and recomputed in memory, since day precision cannot express sub-day cadences
    provenance: [cadence.IsContactByOverdue, ContactService.listOverdueContactsInMemory]

  - id: CAD-005
    title: The cadence engine is the sole writer of cadence timestamps
    type: invariant
    status: current
    surface: none
    statement: outside contact creation (which seeds last_contacted and contact_by, CON-001), last_contacted, last_interaction_at, last_outreach_at, last_response_at, and contact_by are written only by the cadence engine's apply paths (interaction consumer, merge bulk-apply, cadence override, and delete rollback); contact_by is kept in sync on every write path that changes the cadence or the base timestamps.
    provenance: [CadenceUpdater, .ai/guides/architecture.md sole-writer map, scripts/ci sole-writer guard, reject_unauthorized_derived_contact_write trigger (migration 079)]

  # --- Direction and write semantics ---

  - id: CAD-006
    title: Interaction direction determines which timestamps move
    type: business-logic
    status: current
    surface: none
    given: a contact with a recorded interaction
    when: the interaction's direction is applied
    then:
      - outbound bumps last_outreach_at only
      - inbound bumps last_contacted, last_interaction_at, and last_response_at, and reschedules contact_by
      - mutual bumps all four timestamps and reschedules contact_by
      - an interaction recorded without a direction defaults to mutual; an unrecognized direction reaching the consumer moves nothing
    provenance: [CadenceApplyFlagsByDirection, interaction direction CHECK migration 031, contact-direction.spec.ts]

  - id: CAD-007
    title: Automated sources move timestamps forward only; manual entries always win
    type: business-logic
    status: current
    surface: none
    given: an incoming timestamp update for a cadence column
    when: the update source is considered
    then:
      - an automated source (synced providers) advances a column only when the incoming value is strictly newer
      - a manual entry writes unconditionally, allowing backdating as user correction
    provenance: [cadence_branch.go, CadenceUpdater.buildInteractionWrite, .ai/rules/core.md forward-only row]

  - id: CAD-008
    title: Rescheduling gates on cadence and recency
    type: business-logic
    status: current
    surface: none
    given: an inbound or mutual interaction
    when: contact_by rescheduling is considered
    then:
      - contact_by is rescheduled only when the contact has a cadence
      - automated interactions reschedule only on first contact or when the interaction is newer than the previous last_contacted
      - the new contact_by is the interaction time plus the cadence interval
    provenance: [ShouldApplyContactBy, cadence.CalculateContactBy]

  - id: CAD-009
    title: Cadence overrides never touch interaction history
    type: business-logic
    status: current
    surface: none
    given: a user-driven cadence change (set, change, or clear)
    when: the override is applied
    then:
      - the override applies unconditionally, and may move contact_by backward or clear it
      - the interaction timestamps (last_contacted, last_outreach_at, last_response_at) are untouched
    provenance: [CadenceUpdater.ApplyContactByOverride]
    notes: How the update request derives the new contact_by is CON-007; this pins the engine-side properties of the override path.

  - id: CAD-010
    title: Deleting an interaction rolls back only the timestamps it sourced
    type: data
    status: current
    surface: none
    given: a contact whose cadence timestamps were driven by an interaction that is being deleted
    when: the deletion is processed
    then:
      - a timestamp column is rolled back only if the deleted interaction was its source
      - the column is recomputed to the newest remaining live interaction of the matching direction, or cleared
      - contact_by is re-derived only when the contact has a cadence, the recompute actually moved last_contacted, and no user or provider override is in effect; otherwise it is preserved
      - the recompute runs under a row lock in a single transaction
    provenance: [RecomputeContactDatesAfterDeleteTx, CalendarDeclineHandler]

  # --- Follow-up loop ---

  - id: CAD-011
    title: An outbound interaction opens a follow-up with a cadence-scaled deadline
    type: business-logic
    status: current
    surface: none
    given: a contact with a cadence and no live follow-up, and an outbound that passes the creation guards (CAD-012)
    when: the outbound interaction is recorded
    then:
      - a follow-up task is created to track the awaited reply
      - its deadline is the interaction day plus a cadence-scaled window (defaults weekly 3, biweekly 5, monthly 7, quarterly 14, biannual 21, annual 21 days; environment-configurable)
    provenance: [FollowUpManager, config.WatchdogConfig.DaysForCadence]

  - id: CAD-012
    title: Follow-up creation is guarded so only genuinely awaited replies open loops
    type: business-logic
    status: current
    surface: none
    given: an outbound interaction that would open a follow-up
    when: the creation guards run
    then:
      - a one-shot outbound (send-kind completion) is suppressed
      - a contact without a cadence gets no follow-up
      - an automated outbound older than the follow-up window is skipped as backdated; manual outbounds are exempt
      - an outbound that already has a later response is skipped as out of order
      - an existing live follow-up is refreshed instead of duplicated — the remote deadline is updated and any user-set remote due date is cleared, so a previously postponed task stops surfacing once the reply window restarts
      - if the remote task provider is unconfigured, the interaction still records and the follow-up is skipped with a warning
    provenance: [FollowUpManager creation guards, HasResponseAfterTx, FindPendingFollowUpTx, deadlineUpdateVerb]

  - id: CAD-013
    title: At most one live follow-up per contact and provider
    type: invariant
    status: current
    surface: none
    statement: a contact can have at most one live follow-up task per provider (states managed or pending_remote_create), enforced by a partial unique index; terminal-state follow-ups (completed, dismissed) accumulate freely.
    provenance: [idx_contact_task_followup_unique_live, migrations 041/046]

  - id: CAD-014
    title: Follow-up creation is crash-safe and idempotent
    type: data
    status: current
    surface: none
    given: a follow-up being created against a remote task provider
    when: the two-step create runs
    then:
      - a local row is inserted first in state pending_remote_create with a deterministic idempotency key
      - the remote task is created second by a durable background job (retried on failure), which atomically finalizes the row to managed with the remote id
      - retries and concurrent creates cannot produce duplicates (idempotency index; a uniqueness collision is recovered via savepoint and routed to refresh)
      - a reply arriving mid-create closes the pending row rather than leaving it live
    provenance: [FollowUpManager.applyCreate, idx_contact_task_followup_idempotency, event-bus-foundation.md]

  - id: CAD-015
    title: A reply closes the live follow-up
    type: business-logic
    status: current
    surface: none
    given: a contact with a live follow-up
    when: an inbound or mutual interaction is recorded
    then:
      - the follow-up is completed (the awaited reply arrived)
      - the close is propagated to the remote task only when a real remote id exists; otherwise the in-flight create handles it
    provenance: [FollowUpManager.applyInboundMutual]

  - id: CAD-016
    title: Dismissing a follow-up stops the loop silently
    type: business-logic
    status: current
    surface: none
    given: a live follow-up task
    when: the user dismisses it in the remote task app
    then:
      - the follow-up state becomes dismissed
      - no interaction is recorded
      - no successor follow-up is created
      - no cadence-family column on the contact changes, and whether the contact is awaiting a reply (CAD-040) does not change
    provenance: [handleFollowUpDismissal, task-direction-taxonomy.md]

  - id: CAD-017
    title: Task kind determines what completing a task records
    type: business-logic
    status: current
    surface: none
    given: a live task linked to a contact
    when: the task is completed
    then:
      - completing a reach-out records an outbound interaction, which opens the follow-up loop when the creation guards pass (CAD-011, CAD-012)
      - completing a send records a one-shot outbound interaction that suppresses the follow-up loop
      - completing a reminder records no interaction
      - completing a legacy meet or action task records a mutual interaction
    provenance: [handleTaskCompletion, task-direction-taxonomy.md]

  # --- Cadence-due and manual tasks ---

  - id: CAD-018
    title: A cadence-bearing contact is represented by one live cadence-due task
    type: business-logic
    status: current
    surface: none
    given: a contact with a cadence and a next-contact date
    when: task reconciliation runs
    then:
      - a cadence-due reach-out task exists for the contact
      - at most one cadence-due task row exists per contact and provider regardless of state; completed rows are removed to make room for the next cycle
      - while a live follow-up exists, cadence-due creation is deferred (the follow-up already covers the contact)
    provenance: [CadenceSyncProvider.reconcileContactTasks, unique_contact_provider_cadence]
    notes: Reconciliation rides the provider sync tick; there is no dedicated cron job. Provider mechanics are todoist-domain scope. The follow-up deferral item is one of two deferral rules; CAD-042 states the awaiting-reply window, which is checked first.

  - id: CAD-019
    title: Skipping a cadence task advances the schedule without recording contact
    type: business-logic
    status: current
    surface: none
    given: a live cadence-due task
    when: the user skips it in the remote task app
    then:
      - contact_by advances by one cadence interval from today or the old date, whichever lands later
      - no interaction is recorded
      - a replacement cadence task is created for the new date
    provenance: [handleSkipTrigger, cadence.NextAfterSkip]
    notes: The CRM entry point is CAD-044, a separate behavior because its then-set is strictly larger. The interval is the shared environment-scaled duration (CAD-034), so under CRM_ENV=test a monthly skip advances ten minutes; in production, calendar-day and absolute-hour addition can differ by a day across a DST boundary, which the charter accepts.

  - id: CAD-020
    title: Outreach closes the open cadence task
    type: business-logic
    status: current
    surface: none
    given: a contact with a live cadence-due task
    when: an outreach interaction is detected from any source
    then:
      - the cadence task is completed (the nudge served its purpose)
    provenance: [closeOnOutreach]
    notes: This pins the CRM-side task-state intent; the provider-side close propagation and watermark mechanics are todoist-domain scope.

  - id: CAD-021
    title: Manual task dismissal is terminal, with a legacy carve-out
    type: business-logic
    status: current
    surface: none
    given: a live manual task
    when: the user dismisses it in the remote task app
    then:
      - reach-out, send, reminder, and legacy meet tasks become dismissed, recording no interaction
      - legacy action tasks become unmanaged instead, preserving the user's content
    provenance: [handleManualDismissal, handleActionTaskTriggers, task-direction-taxonomy.md]

  - id: CAD-022
    title: Task kind and lifecycle are orthogonal axes with constrained combinations
    type: invariant
    status: current
    surface: none
    statement: task kinds are reach_out, send, and reminder (plus legacy meet and action); lifecycles are manual, cadence_due, and followup_loop; only reach_out may take all three lifecycles (every other kind is manual-only, enforced by a composite CHECK); kind determines the interaction recorded on completion, while lifecycle determines origin, scheduling, and dismissal routing — with one legacy exception, action tasks, which are routed by kind (CAD-021).
    provenance: [contact_task_kind_lifecycle_check migration 046, internal/contacttask/kinds.go, task-direction-taxonomy.md]

  # --- Overdue surface ---

  - id: CAD-023
    title: The overdue endpoint reports who needs attention and how urgently
    type: api
    status: current
    surface: ui
    given: contacts past their next-contact date
    when: the overdue list is requested
    then:
      - key: each-entry-carries-contact
        text: each entry carries the contact plus days overdue, the next due date, and a suggested action
      - key: each-entry-carries-pending-followup
        text: "each entry's awaiting_reply is true exactly when the contact is awaiting a reply (CAD-040: last outreach strictly later than last response and the waiting period not yet expired), so the dashboard can tell awaited replies from neglected contacts"
      - key: entries-ordered-most-overdue
        text: entries are ordered most-overdue first
      - key: list-bounded-1000-truncation
        text: the list is bounded (1000), and truncation retains the most overdue contacts
    waivers:
      - then: list-bounded-1000-truncation
        reason: the 1000-entry bound and most-overdue-retained truncation cannot be deterministically seeded in an E2E run; the bound is applied in ContactService.ListOverdueContacts and ordering-under-limit is proven by TestContactBy_ListOverdueContacts
    provenance: [ContactHandler.ListOverdueContacts, ContactService.ListOverdueContacts]

  - id: CAD-024
    title: Suggested actions escalate with how overdue a contact is
    type: business-logic
    status: current
    surface: none
    given: an overdue contact
    when: the suggested action is computed
    then:
      - up to 2 days overdue suggests a quick check-in
      - up to 7 days suggests a call or coffee
      - up to 30 days suggests a meaningful update
      - beyond that suggests reconnecting with something specific and personal
    provenance: [suggestedActionForOverdueDays]

  # --- Surfaces ---

  - id: CAD-026
    title: The dashboard is an action-required list of overdue contacts
    type: ux
    status: current
    surface: ui
    given: contacts past their next-contact date
    when: the dashboard renders
    then:
      - key: overdue-contacts-appear-cards
        text: overdue contacts appear as cards with the count in the header
      - key: each-card-shows-urgency
        text: each card shows urgency (tiers at up to 2, up to 7, and more days overdue), cadence, how long since the last connection — or how long since the contact was added, when there has never been one — reachable contact methods, and the suggested action
      - key: awaiting-reply-cards-demoted
        text: "a contact that is awaiting a reply (CAD-040: the user reached out and the waiting period is open) renders as a demoted awaiting-reply card: muted, marked Awaiting reply, showing when the user reached out, placed after every needs-attention card under the urgency ordering, and counted separately in the header"
      - key: nothing-overdue-all-caught
        text: with nothing overdue, an all-caught-up state is shown instead
    serves: [DSH-010, DSH-011]
    provenance: [dashboard/page.tsx, OverdueContactCard, dashboard.spec.ts]

  - id: CAD-027
    title: The overdue list offers urgency, name, and recency orderings
    type: ux
    status: current
    surface: ui
    given: an overdue list with several contacts
    when: the user switches the sort
    then:
      - key: urgency-default-orders-most
        text: urgency (default) orders needs-attention cards before awaiting-reply cards, most-overdue first within each group
      - key: name-orders-alphabetically
        text: name orders alphabetically
      - key: recency-orders-longest-waiting
        text: recency orders longest-waiting first, ranking never-connected contacts by when they were added
    serves: [DSH-010]
    provenance: [dashboard/page.tsx sort controls]

  - id: CAD-028
    title: Marking contacted from the dashboard clears the contact immediately
    type: ux
    status: retired
    surface: ui
    given: an overdue contact card
    when: the user marks the contact as contacted
    then:
      - key: mutual-interaction-logged-timestamped
        text: a mutual interaction is logged, timestamped by the server's accelerated clock
      - key: contact-leaves-overdue-list
        text: the contact leaves the overdue list without a page reload, and the count updates
      - key: change-consistent-across-dashboard
        text: the change is consistent across dashboard, contact list, and contact detail
    provenance: [OverdueContactCard, overdue-contact-updates.spec.ts, dashboard.spec.ts]
    notes: 'Retired 2026-09-15: PR 2 of the awaiting-reply arc removed the one-click mark-as-contacted action from the dashboard card. The card''s action set is CAD-046 and the list-row action is CON-044.'

  - id: CAD-029
    title: Recent activity summarizes the direction timestamps and pending reply
    type: ux
    status: current
    surface: ui
    given: a contact detail page
    when: the recent-activity summary renders
    then:
      - key: last-outreach-time-shown
        text: the last outreach time is shown when one exists
      - key: last-response-time-shown
        text: the last response time is shown when one exists
      - key: awaiting-reply-indicator-shown
        text: an awaiting-reply indicator is shown while the contact is awaiting a reply (CAD-040)
      - key: explicit-no-recent-activity
        text: with none of these, an explicit no-recent-activity state is shown
    serves: [CAD-036]
    provenance: ['contacts/[id]/page.tsx recent activity block', contact-direction.spec.ts]

  - id: CAD-030
    title: The tasks section shows live work first and history on demand
    type: ux
    status: current
    surface: ui
    given: a contact with follow-up, manual, and completed tasks
    when: the tasks section renders
    then:
      - key: managed-tasks-appear-first
        text: managed follow-up tasks appear first with a distinct pending indicator, then live manual tasks
      - key: each-task-carries-badge
        text: each task carries a badge derived from its kind and lifecycle
      - key: completed-tasks-collapsed-behind
        text: completed tasks are collapsed behind a toggle with a count
      - key: no-tasks-empty-state
        text: with no tasks, an empty state invites adding one
    serves: [CAD-036]
    provenance: [tasks-section.tsx, contact detail task queries]
    notes: A follow-up still in pending_remote_create is not listed in the section; during that window it surfaces only via the awaiting-reply indicator (CAD-029).

  - id: CAD-031
    title: Users can add manual tasks of three kinds
    type: ux
    status: current
    surface: ui
    given: the add-task flow on a contact
    when: the user creates a task
    then:
      - key: kind-chosen-reach-out
        text: the kind is chosen from reach-out, send, and reminder
      - key: task-text-required-notes
        text: task text is required; notes are optional
      - key: created-task-appears-contact
        text: the created task appears in the contact's live tasks
    serves: [CAD-036]
    provenance: [add-task-modal.tsx, ContactTaskService.CreateManualTask]

  - id: CAD-032
    title: Contact task endpoints validate their vocabulary
    type: api
    status: current
    surface: api
    given: the contact task endpoints
    when: requests are handled
    then:
      - key: task-listing-filters-state
        text: task listing filters by state, kind, and lifecycle from their closed sets; invalid values are rejected (400) and an unknown contact is not-found (404)
      - key: task-creation-requires-kind-text
        text: task creation requires a user-pickable kind and text (1-1000 chars, notes up to 5000), returning the created task (201)
      - key: unlinking-removes-only-crm
        text: unlinking removes only the CRM link, returning no content (204), and is not-found (404) when the task does not belong to the contact
    provenance: [contact_task_routes.go, ContactTaskHandler]

  - id: CAD-033
    title: Unlinking is the only in-CRM mutation of a linked task
    type: ux
    status: current
    surface: ui
    given: a task linked to a contact
    when: the user manages it from the CRM
    then:
      - key: unlink-behind-confirmation
        text: the CRM offers unlink behind a confirmation prompt; confirming removes the task from the CRM
      - key: no-in-crm-complete-or-dismiss
        text: the linked task row offers no in-CRM complete or dismiss control — those happen in the remote task app
    provenance: [tasks-section.tsx TaskRow, useDeleteTaskLink]

  - id: CAD-034
    title: Cadence interval arithmetic is uniform across recompute paths
    type: business-logic
    status: current
    surface: none
    given: any path that recomputes a next-contact date
    when: the cadence interval is applied
    then:
      - every recompute path uses the same environment-scaled interval definition
    provenance: [cadence.NextAfterSkip, cadence.CalculateContactBy, cadence.GetCadenceDuration]
    notes: 'Unified 2026-09-15: the skip path resolves its interval through cadence.CalculateContactBy like every other recompute path, and cadence.CadenceDays is deleted. cadence.CalculateNextDueDate and its three callers in cadence.go (calendar-month arithmetic) still exist with test-only callers; deleting them is outside this claim.'

  - id: CAD-035
    title: A remote deadline edit on a cadence task reschedules the contact
    type: business-logic
    status: current
    surface: none
    given: a live cadence-due task whose deadline the user edits in the remote task app
    when: the edit is detected
    then:
      - contact_by is overridden to the edited deadline (the remote edit wins)
      - a deadline matching what the CRM last pushed is recognized as stale and does not override
      - follow-up task deadlines never touch contact_by
    provenance: [todoist provider deadline-edit handling, CadenceUpdater.ApplyContactByOverride, MetadataKeySyncedDeadline]
    notes: The last-pushed watermark mechanics live in the todoist domain; this pins the cadence-side outcome.

  - id: CAD-039
    title: Unlinking a task issues no outbound call to the remote provider
    type: business-logic
    status: current
    surface: none
    given: a task linked to a contact
    when: the user unlinks it from the CRM
    then:
      - key: crm-deletes-only-own
        text: the CRM deletes only its own tracking row for the task
      - key: no-outbound-call-made
        text: no outbound call is made to the remote task provider — the remote task is untouched
    provenance: [service/contact_task.go DeleteTaskLink]
    notes: The safe-remote-state guarantee formerly expressed as the judged intent CAD-037; moved to deterministic coverage (a backend integration test asserts zero outbound calls) per the QA-program rule that deterministic guarantees belong in tests, not the judge.

  # --- Intents (judged experience goals — Track B agentic judge only) ---

  - id: CAD-036
    title: A contact page answers where the relationship stands
    type: intent
    status: current
    statement: a contact's detail page answers where things stand with this person — when we last talked in each direction, whether a reply is pending, and what work is queued — without the user digging through raw history
    provenance: ['.ai/spec/2026-07-10-ssot-intent-layer-and-judged-ux-goals-design.md']

  - id: CAD-037
    title: CRM task actions are safe for remote task state
    type: intent
    status: retired
    statement: managing a linked task from the CRM never silently mutates or destroys the user's task in the remote app — remote state changes only where the user expects them to happen
    provenance: ['.ai/spec/2026-07-10-ssot-intent-layer-and-judged-ux-goals-design.md']
    notes: Superseded by CAD-039 (the backend invariant that unlinking issues no outbound call) and the CAD-033 UI affordance; retired from the judged intent set because the guarantee is deterministic and belongs in tests, not the agentic judge.

  - id: CAD-038
    title: The relationship loop closes — notice, act, and the app remembers
    type: intent
    status: current
    statement: a user who opens the app to find out who they are losing touch with can go from that signal to having acted, in one continuous pass — the contact they are sent to answers where the relationship stands, the action they take is acknowledged where they take it, and the surface that sent them reflects it when they come back; at no point do they lose their place, have to re-derive context the app already showed them, or have to guess whether the action landed
    notes: The app's core value loop, judged end to end as one journey rather than as three independent surfaces. Evidence comes from relationship-loop.tour.ts, which walks dashboard → contact detail → log-interaction → back in a SINGLE tour (entity identity is only coherent within one tour, so a journey split across tours would show the judge the same contact under two pseudonyms). This intent carries NO serving behaviors on purpose — a journey binds its evidence by direct capture tag, because serves edges would also pull in the per-surface tours' captures and evict the journey's own under the capture cap. Frontend-surface scope only; the integration/sync half of the loop is deliberately out of scope.
    provenance: ['.ai/spec/2026-07-12-qa-architecture-restructuring.md']

  - id: CAD-040
    title: Awaiting a reply is derived from the contact's own interaction timestamps
    type: business-logic
    status: current
    surface: none
    given: a contact with a cadence
    when: awaiting-reply is evaluated (contact payloads, the contact-list filter, cadence-task reconciliation)
    then:
      - key: awaiting-when-outreach-after-response
        text: the contact is awaiting a reply when last_outreach_at is strictly later than last_response_at and the waiting period has not expired
      - key: equal-instants-not-awaiting
        text: an outreach and a response at the same instant are not awaiting
      - key: window-expires-at-outreach-date-plus-watchdog
        text: the waiting period expires at the outreach's calendar date plus the watchdog days for the contact's cadence — the same window that sets the follow-up reminder's deadline
      - key: expiry-day-inside-window
        text: the expiry date itself is still inside the window; the comparison is calendar-date, never instant
      - key: no-todoist-action-changes-state
        text: no Todoist-side action — deleting, dismissing, or completing a reminder — changes whether the contact is awaiting a reply
    provenance: [cadence.IsAwaitingReply, contact_list.sql.tmpl awaiting fragment, awaiting_reply_derivation_integration_test.go]

  - id: CAD-041
    title: The awaiting-reply expiry is a cadence-owned derived column
    type: data
    status: current
    surface: none
    given: a cadence-bearing contact
    when: its interaction timestamps change
    then:
      - key: set-by-outbound-forward-only
        text: an outbound interaction sets awaiting_reply_until to the outbound's calendar date plus the cadence's watchdog days, forward-only — a later-ingested older outbound leaves it alone
      - key: never-touched-by-response
        text: an inbound or mutual interaction never writes it
      - key: recomputed-on-interaction-delete
        text: deleting an interaction re-derives it from the recomputed last_outreach_at, NULL when no outreach remains
      - key: merge-takes-forward-max
        text: a contact merge keeps the later of the two contacts' values
      - key: written-only-under-cadence-owner
        text: "it is a cadence-owned derived column: written only by CadenceUpdater and the delete-rollback recompute under crm.derived_writer=cadence, and rejected by the derived-writer trigger otherwise"
    provenance: [CadenceUpdater.buildInteractionWrite, UpdateContactCadenceForward, WriteContactDatesAfterDelete, migration 082]
    notes: The skip (CAD-044) is the one CRM action that ends the window without a reply.

  - id: CAD-042
    title: Cadence-task creation waits out the awaiting-reply window
    type: business-logic
    status: current
    surface: none
    given: a cadence-bearing contact with a next-contact date
    when: task reconciliation runs
    then:
      - key: open-window-blocks-cadence-task
        text: while the contact is awaiting a reply (CAD-040), no cadence-due task is created, whatever exists in the remote task app
      - key: lapsed-window-creates-only-without-live-followup
        text: once the waiting period has lapsed, a cadence-due task is created only if no live follow-up reminder already covers the contact
      - key: resurrected-deadline-today-or-later
        text: a cadence-due task created or re-dated by reconciliation carries a deadline of today or later, never a stale past date
    provenance: [CadenceSyncProvider.reconcileContactTasks, cadenceTaskDeadline, provider_dismissal_no_crm_state_test.go]

  - id: CAD-044
    title: Skipping a cycle advances the schedule and ends the follow-up thread
    type: business-logic
    status: current
    surface: none
    given: a cadence-bearing contact
    when: the user skips this cycle from the CRM
    then:
      - key: advances-one-cycle-later-of
        text: contact_by advances by exactly one cadence cycle from today or from the current next-contact date, whichever lands later, through the same environment-scaled interval every other recompute path uses (CAD-034)
      - key: ends-follow-up-thread
        text: the awaiting-reply window is ended (awaiting_reply_until becomes NULL) and any live follow-up reminder is completed exactly once, whether or not its remote create had finished
      - key: records-no-interaction
        text: no interaction is recorded; last_contacted, last_interaction_at, last_outreach_at and last_response_at are untouched
      - key: records-skip-state
        text: the skip records when it happened, the next-contact date it replaced, and the reason ui
      - key: cadence-task-follows
        text: the cadence task is re-dated to the skipped-to date by reconciliation rather than suppressed (CAD-018), clamped to today or later (CAD-042)
    provenance: [ContactService.SkipCycle, CadenceUpdater.ApplySkip, cadence.NextAfterSkip, skip_clock_integration_test.go]
    notes: The remote-gesture skip is CAD-019; this is the CRM entry point, whose then-set is strictly larger. No Todoist-side action changes CRM state (CAD-040). Skipping a contact without a cadence is refused (409).

  - id: CAD-045
    title: Undoing a skip restores the pre-skip date while the skip is in effect
    type: business-logic
    status: current
    surface: ui
    given: a contact whose cycle was skipped from the CRM
    when: the user views the contact or undoes the skip
    then:
      - key: undo-control-offered-while-skip-in-effect
        text: while skip state is present and today is before the skipped-to date, the contact cadence row shows when the skip happened, the skipped-to date and the date it replaced, with an Undo control
      - key: undo-restores-pre-skip-date
        text: undo restores the recorded pre-skip next-contact date exactly, even when that date is already past; the cadence task follows to that date or today, whichever is later; the awaiting-reply window stays ended and the follow-up reminder stays closed
      - key: undo-withdrawn-when-skip-ends
        text: once today reaches the skipped-to date, or any other writer moves the clock (an inbound or mutual interaction, a cadence edit, a remote skip, an interaction deletion, a merge), undo is no longer offered and the page shows no trace of the skip
    waivers:
      - then: undo-control-offered-while-skip-in-effect
        reason: "not observable in the accelerated E2E lane (#645): contact_by is DATE-typed and a compressed-cadence skip writes today, so today is never before the skipped-to date and the control never renders there; proven in Go under production durations by TestSkipClock_* and TestUndoSkipClock_* (backend/tests) and at the API by TestContactAPI_SkipAndUndo"
      - then: undo-restores-pre-skip-date
        reason: "not observable in the accelerated E2E lane (#645): undo is never offered there; the restore, the max(restored, today) task date, the window staying ended and the reminder staying closed are proven in Go by TestUndoSkipClock_* and TestReconcile_AfterUndoPastDate_ClampsToToday"
      - then: undo-withdrawn-when-skip-ends
        reason: "not observable in the accelerated E2E lane (#645): withdrawal by date needs a skipped-to date after today, which a compressed-cadence skip cannot write; proven in Go per clearing path by TestUndoSkipClock_* under production durations"
    provenance: [ContactService.UndoSkip, CadenceUpdater.ApplyUndoSkip, cadence.UndoSkipAvailable, 'contacts/[id]/page.tsx cadence row', undo_skip_clock_integration_test.go]
    notes: Overrides #212's rule that undo is suppressed once the restored date has passed (charter 2026-09-15) — restoring an overdue contact to overdue is the state they were in. Skip state has one setter (the skip) and is cleared by every other writer of the clock; undo is offered while skip state is present and today is before contact_by. #645 stays open and out of scope.

  - id: CAD-046
    title: The dashboard card offers exactly two actions in both states
    type: ux
    status: current
    surface: ui
    given: an overdue contact card, needs-attention or awaiting-reply
    when: the dashboard renders
    then:
      - key: two-actions-both-states
        text: both card states offer exactly two actions, log an interaction as the primary action and skip this cycle beneath it at equal width
      - key: mark-as-contacted-removed
        text: the one-click mark-as-contacted action is not offered on the card
      - key: name-is-the-link
        text: the contact's name is the link to the contact; there is no separate details link
      - key: skip-ends-awaiting-reply
        text: skipping an awaiting-reply card ends the wait — the card no longer reads Awaiting reply and the contact's awaiting_reply flag is false — without a page reload
      - key: skipped-contact-leaves-dashboard
        text: a skipped contact leaves the overdue list without a page reload; its cadence task is re-dated, not suppressed (CAD-044)
    waivers:
      - then: skipped-contact-leaves-dashboard
        reason: "not observable in the accelerated E2E lane (#645): contact_by is DATE-typed, a compressed-cadence skip writes today, and the testing overdue path ignores contact_by by design; proven in Go under production durations by TestSkipClock_LeavesOverdueSet"
    serves: [DSH-010, DSH-012]
    provenance: [OverdueContactCard, cadence-skip.spec.ts, dashboard.tour.ts]
    notes: Retires CAD-028 (mark-as-contacted from the dashboard). The list-row mark-as-contacted is CON-044 and is unchanged; the modal behind Log Interaction is CON-053.
