domain: whatsapp
prefix: WHA
maturity: reviewed
settled: [ui, api]
behaviors:
  # --- Scope fence ---

  - id: WHA-001
    title: The WhatsApp integration never acts on the account beyond session maintenance
    type: invariant
    status: current
    surface: none
    statement: The WhatsApp integration never sends a message, marks a chat read, signals presence, or requests history. The only account-state mutations it makes are unlinking its own device on disconnect and the protocol-level acknowledgements the linked-device session itself requires — delivery acknowledgements, retry receipts, and retrieval and cleanup of its own history payload.
    provenance: [whatsapp package scope fence, TestManagerNeverCallsOutboundAPI]
    notes: Delivery receipts go out as inactive because presence is never signalled, so a conversation partner sees no read marks and no online status. The library's own protocol traffic is enumerated in the arc plan and is out of the guard's scope because it is not our code.

  # --- Connection lifecycle ---

  - id: WHA-002
    title: The client connects on startup only when a device is already linked
    type: business-logic
    status: current
    surface: none
    given: the WhatsApp integration is enabled and ready to ingest (WHA-013)
    when: the backend starts
    then:
      - a stored linked device is resumed without any user action
      - with no stored device the integration stays idle and reports that it is not paired, rather than opening a connection
      - a connection is attempted only when the stored state can be read back; a status row the integration cannot read is treated as a reason not to connect, never as an absent one
      - a first connection that fails for a transient reason keeps retrying in the background and is reported as still connecting, rather than being left down until the backend is restarted
    provenance: [Manager.Start, resolveLinkedDevice, Manager.ensureSyncState, InitialAutoReconnect]

  - id: WHA-003
    title: The linked session survives a backend restart without re-pairing
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp account that has been linked
    when: the backend is restarted
    then:
      - the linked device is found again and the session resumes without the user scanning a code
      - re-linking replaces the stored device rather than adding to it, so a restart always resumes the account most recently linked
      - if the replaced device cannot be removed, the removal is retried, the leftover is reported as a degraded state rather than passed off as a clean replacement, and the restart still resumes the account that was actually linked
      - when more than one set of stored credentials survives and none of them is the account the integration recorded as linked, it refuses to resume any of them and reports the ambiguity, rather than resuming an arbitrary one
      - a single surviving set of credentials is always resumed, even when the record of which account was linked is missing or stale, and that record is repaired at the same time
      - credentials left behind by a pairing or unlink that a restart interrupted are the next startup's to reckon with rather than the shutdown's, because shutdown ends connections only — what it leaves is reported by the same degraded-store rules above instead of being chased down by a dying process
    provenance: [whatsmeow device store on the shared database, resolveLinkedDevice, TestWhatsAppDeviceStore_PairedDeviceSurvivesNewManager, TestWhatsAppRePair_LeavesExactlyOneStoredDevice, TestWhatsAppRePair_RetainedDeviceStillResumesTheLinkedOne, TestResolveLinkedDevice_RefusesToGuess]

  - id: WHA-004
    title: A permanent disconnect is recorded, surfaced, and not retried
    type: business-logic
    status: current
    surface: none
    given: a linked WhatsApp session
    when: it ends permanently — unlinked from the phone, session replaced by another client, client too old, or temporarily banned
    then:
      - the reason is recorded durably before the connection is torn down, and the write is retried rather than abandoned on a single failure
      - the recorded reason and the error state the staleness watchdog reads are written as one operation, so a permanent disconnect can never end up recorded but invisible to the watchdog
      - the integration reports a disconnected status carrying that reason
      - when the reason could not be recorded durably, the status says so, because the decision will then not survive a restart
      - reconnect attempts stop, and no other sync source is affected
    provenance: [Manager.onTerminal, Manager.markTerminal, MarkSyncStateTerminal, external_sync_state metadata]

  - id: WHA-005
    title: Transient disconnects reconnect by themselves; terminal ones stay terminal across restarts
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp session that has dropped
    when: the cause is transient rather than permanent
    then:
      - the connection is re-established automatically, with no user action and no change to the linked device
      - a permanently ended session is not reconnected, including after a restart, because the terminal decision is read back from storage rather than held only in memory
      - an expired temporary ban is no longer treated as terminal
    provenance: [Manager.Start terminal gate, TestStart_DoesNotReconnectAfterPersistedTerminalReason]

  - id: WHA-017
    title: Connection events only ever speak for the connection that emitted them
    type: business-logic
    status: current
    surface: none
    given: the integration has held more than one connection over its lifetime — a cancelled pairing, an attempt superseded by a newer one, or a session that was replaced
    when: a connection event arrives from one of them
    then:
      - only events from the connection the integration currently owns change the reported state, the durable record, or which device is linked
      - deciding whose event it is and acting on that decision are one indivisible step, because all connection state is owned by a single sequencer and an event or operation is handled to completion before the next is started
      - a connection that has been replaced or has already ended permanently is retired, and stays ignored for good — including for events it had already queued
      - an event from an abandoned connection is ignored and that connection is closed, rather than being applied to the live one or left holding a socket
      - a failed pairing attempt ends that attempt only, and never records a permanent-disconnect decision against the linked device
      - a linked device that ends permanently ends only itself, and does not cancel a pairing the user is in the middle of
      - a completed pairing is adopted but reported as still connecting until the source confirms the connection, because linking is followed by a reconnection
      - adopting a newly linked account drops the ban and the permanent-disconnect record that belonged to the account it replaced, rather than reporting them against the new one
      - the same rule governs user-initiated operations and not only events — an unlink whose session is replaced while it is in flight abandons its own outcome and reports a conflict, rather than applying it to the session that replaced it
    provenance: [Manager actor loop, actorState, session retirement, fence, Manager.onTerminal, Manager.onConnected, Manager.onPairSuccess, Manager.Disconnect]
    notes: >-
      The source dispatches most connection events asynchronously, so an event queued by a
      connection that has since been abandoned can arrive at any later moment — including after
      its credentials were deleted and a different connection installed.

  # --- Pairing and status API ---

  - id: WHA-006
    title: WhatsApp pairing endpoints map outcomes to status codes
    type: api
    status: current
    surface: api
    given: requests to the WhatsApp pairing endpoints
    when: they are handled
    then:
      - key: start-refused-until-ingest-wired
        text: starting a pairing before the parts that store incoming messages and history are in place is a conflict (409) whose body names both a stable machine-readable code and the missing dependency
      - key: phone-start-requires-e164
        text: a phone pairing with a number that is not E.164, or an unrecognised pairing method, is a validation error (400) that never reaches the integration
      - key: cancel-is-idempotent
        text: cancelling a pairing always succeeds with no content (204), whether or not one was in flight
      - key: disconnect-when-not-paired-conflicts
        text: disconnecting with no linked device is a conflict (409), and a successful disconnect returns 200 with a body reporting how the unlink resolved
      - key: force-disconnect-clears-local-state-with-warning
        text: a forced disconnect returns 200 with a body warning that the device must still be unlinked from the phone
    provenance: [WhatsAppHandler.StartPairing, WhatsAppHandler.CancelPairing, WhatsAppHandler.Disconnect]
    notes: Scoped to the outcomes the shipped wiring can produce without a linkable account. Everything that needs one is WHA-015.

  - id: WHA-015
    title: Pairing outcomes once an account can be linked
    type: api
    status: current
    surface: api
    given: requests to the WhatsApp pairing endpoints, once the integration is wired end to end
    when: they are handled
    then:
      - key: qr-start-returns-code
        text: starting a QR pairing is accepted (202) and the response carries the first scannable code
      - key: qr-start-times-out-without-code
        text: a pairing whose websocket produces no code within the bounded wait is a gateway timeout (504) naming the timeout, and no pairing code is requested on a connection that never established
      - key: start-when-connected-conflicts
        text: starting a pairing while an account is already linked is a conflict (409)
      - key: start-when-pairing-conflicts
        text: starting a second pairing while one is in flight is a conflict (409)
      - key: disconnect-reports-failure-when-remote-logout-fails
        text: a disconnect whose remote unlink fails is a bad gateway (502), the local credentials are kept, and the status reports that the unlink failed so the user can retry
      - key: disconnect-while-unlink-in-flight-conflicts
        text: a second unlink requested while one is in flight is a conflict (409) rather than a second remote unlink of the same device
      - key: link-and-unlink-are-mutually-exclusive
        text: unlinking while a pairing is in flight, and starting a pairing while an unlink is in flight, are both conflicts (409) naming the operation to finish or cancel first — the two operations are never interleaved
    provenance: [WhatsAppHandler.StartPairing, WhatsAppHandler.Disconnect, Manager.StartPairing, Manager.opDisconnect]
    notes: >-
      Every outcome here needs a pairing the readiness gate lets proceed, which the citing tests wire
      explicitly. The gate is what a deployment without the history drainer hits first (WHA-013), so
      what the PR registering the drainer changes is which of these a user can reach, not whether the
      contract holds.

  - id: WHA-007
    title: The WhatsApp status endpoint reports connection, identity, pairing and backfill
    type: api
    status: current
    surface: api
    given: a request for WhatsApp status
    when: it is handled
    then:
      - key: status-reports-state
        text: status returns 200 with the current connection state
      - key: status-reports-not-ready-reason
        text: when the integration is not ready to link an account, the state says so and names the missing piece
      - key: status-reports-backfill-counts
        text: the status carries the history-backfill counts, including how many chunks were dropped un-projected and how far back the delivered history actually reached
      - key: status-absent-when-feature-disabled
        text: with the feature disabled the WhatsApp endpoints do not exist (404), which is how the settings surface recognises an unconfigured integration
      - key: status-always-carries-terminal-reason-persisted
        text: the status body always carries whether the permanent-disconnect reason was durably recorded, including when it was NOT — a client that cannot tell "absent" from "false" cannot tell a restart-safe decision from one that will be lost
      - key: status-reports-unresolved-lid-peers
        text: the status carries how many peers the integration has seen but could not resolve to a phone number — counted up to a cap, above which it reports "at least this many" — since a message from such a peer cannot be matched to a contact automatically and can reach one only through the import queue
    provenance: [WhatsAppHandler.GetStatus, RegisterWhatsAppRoutes]
    notes: Scoped to what the status reports without a linked account. The fields that need one, or a live pairing, are WHA-016.

  - id: WHA-016
    title: Status fields that require a linked account or a live pairing
    type: api
    status: current
    surface: api
    given: a request for WhatsApp status, once the integration is wired end to end
    when: it is handled
    then:
      - key: status-reports-account-identity
        text: when an account is linked, the status carries its identity — account id, phone number, display name, and when it connected
      - key: status-carries-live-pairing-code
        text: during a pairing the status carries the live code and its expiry, so a client can poll for a refreshed code, and a phone-code pairing reports only the code the user types
    provenance: [WhatsAppHandler.GetStatus, Manager.Status]
    notes: Both require a linked account or a live pairing, which the citing tests set up explicitly. Which of them a user can reach in a given deployment is governed by the readiness gate (WHA-013).

  # --- History capture ---

  - id: WHA-008
    title: The history window is fixed when the device is linked and cannot be widened afterwards
    type: data
    status: current
    surface: none
    given: a WhatsApp device about to be linked
    when: the pairing registration is built
    then:
      - the maximum history window is requested, as a fixed value rather than a configurable one
      - the request asks for history as a media payload rather than embedded in the protocol message
      - the window is baked into the registration, so changing it requires unlinking and re-pairing
    provenance: [applyDeviceProps, HistorySyncDaysLimit]

  - id: WHA-009
    title: A delivered history chunk is recorded durably before it is acknowledged
    type: data
    status: current
    surface: none
    given: WhatsApp delivers a chunk of conversation history
    when: the integration receives it
    then:
      - the chunk is recorded durably before the integration acknowledges receipt, and nothing is downloaded, projected, acknowledged or deleted at that point
      - a failure to record withholds the acknowledgement, so WhatsApp redelivers the chunk rather than the history being lost
      - a redelivered chunk collapses onto the existing record rather than creating a duplicate
      - a bootstrap chunk the server delivers with its history embedded inline, against the explicit request not to, is dropped without being stored — because storing it would retain message content older than the history horizon allows — and the drop is counted so the gap is visible
    provenance: [Manager.handleHistoryNotification, HistoryRecorder, whatsapp_history_notification]
    notes: The dropped-inline case is a spec exception the user ratified on 2026-08-03, recorded in the design spec's success criteria.

  - id: WHA-010
    title: An unprocessable incoming message is redelivered rather than dropped
    type: business-logic
    status: current
    surface: none
    given: an incoming WhatsApp message
    when: it cannot be stored
    then:
      - the message is not acknowledged, so WhatsApp redelivers it
      - acknowledgements are withheld until processing has actually completed, so a crash mid-processing also produces a redelivery
    provenance: [Manager.handleEvent, SynchronousAck]

  # --- Unlinking ---

  - id: WHA-011
    title: Unlinking keeps local credentials unless the remote unlink is confirmed
    type: business-logic
    status: current
    surface: none
    given: a request to unlink the WhatsApp device
    when: the remote unlink cannot be confirmed
    then:
      - local credentials are kept and the failure is reported, so the user can retry rather than being left with a linked device and no way to reach it
      - a failure to connect is never treated as proof that the device was already unlinked
      - a device the server has already reported as unlinked is cleared without a further remote call
      - a forced local-only clear is available and states that the device must be unlinked from the phone
      - an unlink that succeeded remotely but could not clear the local credentials is reported as such, and the remedy offered is completing the local clear rather than retrying an unlink that already worked
      - any path that clears local credentials without a remote call reports a failure to delete them, instead of reporting the integration as unlinked while the device is still stored
      - a forced clear that failed is never later read as proof that the device was unlinked, because forcing makes no remote call and so learns nothing about it
      - a clear that could not reach the stored credentials at all is reported as a failure, not as a completed unlink
      - the failure a forced clear reports says the device may still be linked and must be removed from the phone, because forcing contacted the source not at all
      - clearing local credentials removes every set of credentials the clear found when it started, not only the one in use, so a device left behind by a failed replacement cannot be resumed afterwards; credentials created after the clear began are left alone and the clear reports that it was superseded
      - an unlink that failed still ends the client it used, so a retry or a restart cannot leave two clients contending for one device
    provenance: [Manager.Disconnect, Manager.contPurgeFenced, Manager.contDisconnect, serverConfirmedUnlinked, WhatsAppHandler.Disconnect]

  # --- Enablement ---

  - id: WHA-012
    title: Enabling WhatsApp without external sync is a rejected configuration
    type: business-logic
    status: current
    surface: none
    given: WhatsApp sync is enabled but external sync is not
    when: configuration is validated at startup
    then:
      - startup fails and names the missing setting, rather than running without discovery, import, or contact-method enrichment
    provenance: [config.Validate]

  - id: WHA-013
    title: An account cannot be linked until incoming messages and history have somewhere to go
    type: business-logic
    status: current
    surface: none
    given: the WhatsApp integration is enabled
    when: the parts that store incoming messages and historical conversations are not both in place
    then:
      - the integration reports that it is not ready and names the missing piece
      - it declines to connect, and declines to start a pairing, rather than linking an account whose messages would be acknowledged and discarded
    provenance: [Manager.Ready, Manager.Start, Manager.StartPairing]
    notes: This is what makes the integration shippable in pieces — the client can land before the ingest and backfill paths without any risk of silently discarding a one-shot message or history chunk.

  - id: WHA-014
    title: WhatsApp connection failures reach the sync-staleness watchdog
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp connection in an error state
    when: sync staleness is evaluated
    then:
      - the error is evaluated even when external sync is disabled, because the connection is owned by a long-lived manager rather than by the polling scheduler
      - the error is evaluated even though the status row is not scheduler-enabled, since a manager-driven row is deliberately kept out of the polling scheduler's work queue
      - WhatsApp is not evaluated for sync staleness, because it has no periodic sync to fall behind on
    provenance: [managerDrivenSources, evaluateSyncStateBreaches]

  # --- History backfill ---

  - id: WHA-060
    title: A recorded history chunk is downloaded, projected, acknowledged and its payload deleted, in that order
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp history chunk recorded in the durable inbox
    when: the backfill drain runs
    then:
      - key: order-is-project-ack-delete
        text: the chunk's messages are stored before WhatsApp is told the chunk was handled, and the payload on WhatsApp's servers is removed only after that, so a chunk whose payload the integration actually holds is never acknowledged before it has tried to store it (a chunk dropped for arriving inline is acknowledged without projection, WHA-066)
      - key: whole-backlog-drains
        text: one drain run works through every chunk waiting for it rather than one per tick, so a link-time backfill completes in minutes rather than over an hour
      - key: fresh-chunk-completes-in-one-pass
        text: a chunk that has just been recorded runs the whole sequence in a single pass, rather than advancing one step per pass and leaving the rest waiting behind a lease
      - key: chunk-with-no-conversations-completes
        text: a chunk that carries no conversations at all -- several kinds do -- still completes its acknowledgement and cleanup, and storing nothing from it is the correct outcome rather than a failure
    provenance: [HistoryDrainer.Drain, HistoryDrainWorker, TestHistoryDrainer_DeletesMediaOnlyAfterAck, TestHistoryDrainer_StagesAChunkEndToEnd]

  - id: WHA-061
    title: History older than the CRM's horizon is discarded rather than stored
    type: data
    status: current
    surface: none
    given: a history chunk carrying messages from before the CRM's history horizon
    when: it is projected
    then:
      - key: pre-horizon-messages-are-not-stored
        text: no message older than the horizon is stored, and its text never reaches the message store at all -- it is discarded before it is even read, rather than stored and later filtered
      - key: post-horizon-messages-are-kept
        text: newer messages in the same conversation are stored normally, so a conversation that straddles the horizon is truncated rather than dropped
    provenance: [HistoryDrainer.project, BackfillFloorTime, TestHistoryDrainer_ClampDropsPreHorizonMessages, TestHistoryDrainer_PreClampContentAbsentFromCommsMessage]

  - id: WHA-062
    title: A backfill interrupted mid-chunk resumes where it stopped and stores nothing twice
    type: business-logic
    status: current
    surface: none
    given: a backfill interrupted partway through a chunk -- a restart, a timeout, or a lease that expired
    when: the drain runs again
    then:
      - key: resumes-after-the-last-completed-conversation
        text: it resumes after the last conversation it finished rather than starting the chunk over, and re-storing a message it already stored changes nothing
      - key: resume-point-is-verified-not-trusted
        text: the resume point is checked against the re-read chunk before it is used, and a chunk that no longer matches is re-read from the beginning rather than silently skipping conversations
      - key: a-superseded-worker-writes-nothing
        text: once another run has taken the chunk over, the superseded one can no longer record progress, complete it, or fail it, so it cannot undo what its successor did
      - key: no-step-is-repeated-after-completion
        text: a run that resumes past a step does not repeat it -- no second download, no second acknowledgement, no second deletion
    provenance: [HistoryDrainer.project, resumePoint, TestHistoryDrainer_ResumesAfterLostLease, TestHistoryDrainer_StaleWorkerCannotClobberSuccessor]

  - id: WHA-063
    title: A chunk that cannot be projected is surfaced and re-drainable by hand, never silently lost
    type: business-logic
    status: current
    surface: none
    given: a history chunk that repeatedly fails to drain
    when: the failure is permanent, or the chunk has been retried too many times
    then:
      - key: permanent-failures-become-visible
        text: the chunk is recorded as failed with the reason, so it shows up in the backfill counts and in the operator listing rather than retrying invisibly forever
      - key: retries-are-bounded
        text: a chunk that keeps failing for a temporary reason is eventually given up on rather than re-downloading its whole payload on a fixed cycle for the life of the deployment
      - key: operator-can-requeue
        text: an operator can list the failed chunks and put one back in the queue by hand, and the listing never prints the stored payload or the projection bookkeeping
      - key: a-requeue-does-not-erase-the-attempt-history
        text: requeueing does not reset how many times the chunk has been tried, because that count is what tells an operator whether to keep trying
      - key: a-partly-stored-chunk-whose-payload-vanished-is-completed-not-discarded
        text: when the payload disappears from WhatsApp's servers after part of a chunk was already stored, the chunk is completed and acknowledged rather than failed — the stored part is real and no retry can recover the rest — and the conversations it never reached are lost, which is reported rather than hidden; a chunk that had stored NOTHING is failed instead, so an acknowledgement is never sent for a chunk with nothing to show for it
    provenance: [HistoryDrainer.terminalFailure, HistoryDrainer.classifyDownloadFailure, runListWhatsAppHistory, runRequeueWhatsAppHistory, TestHistoryDrainer_TransientFailuresAreCappedAndBecomeRequeueable, TestHistoryDrainer_MediaMissingAtDownloadedWithACheckpointCompletesSuccessfully, TestHistoryDrainer_MediaMissingAtDownloadedWithAnEmptyCheckpointFails, TestCrmAdmin_ListWhatsAppHistoryNeverPrintsThePayload]

  - id: WHA-064
    title: Group tracking is decided for a whole chunk before any of it is stored
    type: business-logic
    status: current
    surface: none
    given: a history chunk containing group conversations
    when: it is projected
    then:
      - key: gates-are-decided-before-the-first-message-is-stored
        text: every group in the chunk is decided before the first message from any of it is stored, so a chunk is never left half-stored because a decision could not be reached partway through
      - key: an-undecidable-group-stores-nothing-from-the-chunk
        text: when a group's size cannot be determined right now, nothing from the whole chunk is stored and the chunk is retried later, rather than storing the part that was decidable
      - key: a-left-group-can-be-sized-from-the-chunk-itself
        text: a group the account is no longer in can be sized from the participant list the history itself carried, which is the only way its conversation can be backfilled at all
      - key: a-live-group-is-never-sized-from-history
        text: a group the account is still in is sized only by asking WhatsApp; a historical participant count is never adopted for it, because that number would then decide every future live message from that group
    provenance: [HistoryDrainer.resolveChunkGates, ChatGate.ShouldTrackHistoryChat, TestChatGate_SizeUnknownGroupIsNotTrackedEvenWithAChunkSnapshot, TestHistoryDrainer_GroupChunkIsGatedBeforeAnythingIsStored]

  - id: WHA-065
    title: Backfilled and live messages converge on the same stored result
    type: business-logic
    status: current
    surface: none
    given: the same conversation reaching the CRM both live and through the history backfill
    when: both have been stored
    then:
      - key: one-row-per-message
        text: a message that arrives by both routes is stored once, with the same sender, direction, account and text, because backfill goes through the same storing path live messages do
      - key: one-thread-per-chat
        text: a one-to-one chat that history records under an internal identifier is stored under the same conversation the live messages use, so one conversation does not appear as two
      - key: records-of-events-are-not-conversation
        text: the envelopes WhatsApp uses for things that happened rather than things that were said -- a deleted message, an undecryptable one, a missed call, a change to a group's membership or to a security code -- are not stored, so they cannot fabricate contact history
    provenance: [Ingestor.IngestMessage, HistoryDrainer.project, TestHistoryDrainer_MatchesLivePathEndState, TestHistoryDrainer_StubAndSystemEntriesAreNeverStaged, TestHistoryDrainer_LIDDMIsKeyedOnThePhoneNumberThread]

  - id: WHA-066
    title: A chunk dropped for arriving inline still completes its acknowledgement without being projected
    type: business-logic
    status: current
    surface: none
    given: a bootstrap chunk WhatsApp delivered with its history embedded, against the integration's explicit request not to
    when: the backfill drain reaches it
    then:
      - key: dropped-chunk-is-never-stored
        text: nothing from it is stored, because its content was discarded when it arrived rather than kept and filtered later
      - key: dropped-chunk-still-acknowledges
        text: it is still acknowledged, so WhatsApp stops redelivering it, and nothing is downloaded or deleted for a payload the integration never held
      - key: dropped-chunk-requeue-retries-only-the-receipt
        text: requeueing such a chunk can only retry the acknowledgement; it can never project content that was never kept
    provenance: [HistoryDrainer.drainOne, handleHistoryNotification, TestHistoryDrainer_DroppedInlineChunkIsNeverProjected, TestHistoryDrainer_DroppedInlineRequeueRetriesOnlyTheReceipt]

  - id: WHA-067
    title: A chunk is projected only once the peer identities it carried are known to be stored
    type: business-logic
    status: current
    surface: none
    given: a history chunk carrying mappings between peers' internal identifiers and their phone numbers
    when: it has been downloaded, before any of it is projected
    then:
      - key: mappings-are-read-back-not-assumed
        text: the mappings are read back out of the device store and checked as an exact pair before anything from the chunk is stored, because the library reports the download as a success even when it failed to persist them, and projecting on that assumption would attribute every otherwise-resolvable peer as permanently unmatched
      - key: only-storable-mappings-are-expected-back
        text: only the mappings the library actually keeps are expected back — it discards ones it treats as malformed, and the store holds one identifier per phone number, so where a chunk carries two identifiers for the same number only the later one survives — because demanding the rest back would stall a one-shot backfill forever on a chunk that was handled correctly, with no retry able to change the outcome
      - key: a-surviving-mapping-that-disagrees-still-fails
        text: a mapping that did survive but points at a different phone number than the chunk claimed still fails the check, because a stale pair would silently mis-attribute every message from that peer
    provenance: [VerifyHistoryLIDMappings, expectedStoredLIDMappings, clientHistoryFetcher.DownloadHistorySync, TestWhatsAppLIDStore_VerificationExpectsOnlyWhatTheLibraryKeeps, TestWhatsAppLIDStore_VerificationMatchesOnNormalizedPair]

  # --- Message ingest ---

  - id: WHA-020
    title: Only person-to-person chats are ingested
    type: business-logic
    status: current
    surface: none
    given: an incoming WhatsApp message
    when: the integration decides whether it belongs in the CRM
    then:
      - direct conversations and group conversations are ingested
      - status updates, broadcast lists, channels and automated senders are not ingested, and a chat on a kind of address the integration does not recognise is refused rather than guessed at
      - a note to self is not ingested, in whichever of the account's own forms it is addressed
      - the same person reached through a different device domain is treated as the same person, not as an unrecognised address to discard
      - a chat that is not ingested is treated as handled rather than as a failure, so it is not delivered again forever
      - key: null-user-envelope-refused
        text: an envelope addressed to a user part that could never belong to a subscriber — the protocol's null user, or an empty user part — describes no person and is refused, whether that user part is the chat itself or a sender inside a group
    provenance: [classifyChat, normalizeServer, parseMessage, resolvePeer]
    notes: The account's own identity is required before any of this can be decided; without it the message is left undelivered rather than guessed at, since an acknowledged message is never sent again.

  - id: WHA-021
    title: Each WhatsApp message is stored once, attributed to its counterpart
    type: data
    status: current
    surface: none
    given: a WhatsApp message the integration will ingest
    when: it is stored
    then:
      - a direct message is attributed to the other party, whether the user sent it or received it
      - a message in a group is attributed to whoever sent it, and one the user sent to a group is stored with no counterpart because it has none
      - the same message delivered twice results in one stored message, not two, and its content is not rewritten by the second delivery
      - a message that was first stored without a contact and later recognised as a known contact ends up as a single stored message bound to that contact
      - the reverse case — a message already bound to a contact, redelivered while the contact could not be recognised — also ends up as a single stored message still bound to that contact
      - the sender's display name is recorded only for messages the user received, never for messages the user sent, so the user's own name can never end up labelling somebody else
      - each stored message records which linked account observed it, in a form that survives re-linking the same account
    provenance: [Ingestor.IngestMessage, parseMessage, SoftDeleteUnmatchedTwin, HasMatchedChatMessage]

  - id: WHA-022
    title: A peer's phone number is recovered where WhatsApp exposes it, and its absence degrades rather than fails
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp message from a peer
    when: the integration tries to identify who the peer is
    then:
      - the peer's phone number is taken from the message when it carries one, and otherwise recovered from what the linked device already knows about that peer
      - a peer whose phone number cannot be recovered is still stored, without a contact, rather than the message being dropped
      - recovering the number is time-bounded, so a slow or unavailable lookup degrades to an unidentified peer instead of stalling incoming messages
      - an address that is not a phone number is never treated as one
    provenance: [resolvePeerPhone, phoneCandidate, PeerMatcher.MatchPeer]

  - id: WHA-023
    title: Group tracking is decided by a persisted size gate that fails closed, and an undecided group is retried rather than skipped
    type: business-logic
    status: current
    surface: none
    given: a message in a WhatsApp group
    when: the integration decides whether to store it
    then:
      - a group at or below the configured size limit is tracked, and a larger one is not
      - a group whose size cannot be established is not tracked, rather than being assumed small
      - when the size could not be established because the answer could not be obtained right now, the message is also not treated as handled, so it is delivered again and the size can be established on the next attempt
      - when the size could not be established because the answer will never come — the user is not in the group, or the group does not exist, or it reports no size at all — the message IS treated as handled, so one unanswerable group cannot be delivered forever
      - a size once established survives a restart, so the same question is not asked again for every message
      - a group the user has explicitly chosen to track or ignore honours that choice without establishing its size at all
    provenance: [ChatGate.ShouldTrack, EffectiveTracked, whatsapp_chat_config]
    notes: >-
      Failing closed is a STORAGE rule, not an acknowledgement rule — the two are deliberately separate,
      because acknowledging a message that could not be assessed would discard it irrecoverably, while an
      unbounded retry of a permanently unanswerable question would degrade message handling indefinitely.
      The explicit track/ignore choice is written by the settings surface (WHA-076), which is the only
      writer of that column — every automatic re-observation preserves it. One limit of the current
      implementation, recorded rather than hidden: a size once established is never re-resolved, so a group
      that later grows past the limit keeps being tracked. That is remedied rather than settled — the user
      turns the grown group off from the settings surface — because no automatic re-resolution exists, and
      adding one would put a network round trip back on the message path.

  - id: WHA-024
    title: A frequent unknown peer becomes a labelled import candidate
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp peer with no matching contact
    when: they have exchanged enough messages to cross the discovery threshold
    then:
      - the peer surfaces as an import candidate, keyed by the same identifier their stored messages carry
      - the candidate always carries a label the user can act on — the peer's display name, else their phone number, else a recognisable placeholder — so a candidate is never presented as an unreadable identifier
      - a display name learnt later replaces an earlier placeholder, and a blank one never erases a name already captured
      - the candidate carries how many messages were exchanged and when the last one was, so the user can judge whether the peer is worth adding
      - a peer already bound to a contact does not surface as a candidate
    provenance: [PeerMatcher.UpdateDiscoveryCandidates, UpsertDiscoveryCandidate]

  - id: WHA-025
    title: Linking a peer retroactively attaches their stored messages
    type: business-logic
    status: current
    surface: none
    given: WhatsApp messages stored without a contact
    when: the user imports or links that peer to a contact
    then:
      - every stored message for that peer is bound to the contact
      - a peer stored before their phone number was known is still found, by either the identifier the messages carry or the recovered number
      - a message already stored against the contact is reconciled rather than duplicated
      - a failure to attach is reported rather than silently swallowed, because attaching is the visible effect of linking
      - key: interactions-derived-in-the-same-pass
        text: the attached messages are aggregated in the same pass rather than being left to the next periodic sweep
      - key: aggregation-failure-does-not-fail-the-link
        text: a failure to aggregate does not fail or undo the link, because the periodic sweep retries the aggregation
    provenance: [PeerMatcher.OnPeerLinked, AttachUnmatchedByPeer]

  - id: WHA-026
    title: An imported peer with a known phone number gains a WhatsApp contact method
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp import candidate
    when: it is imported or linked to a contact
    then:
      - a candidate whose phone number is known gains a WhatsApp contact method carrying that number
      - a candidate whose phone number was never recovered gains no WhatsApp method, rather than one holding an internal identifier the user cannot use
    provenance: [BuildMethodsFromExternal, EnrichmentService.SyncMethodsFromExternal]

  - id: WHA-027
    title: Media messages are recorded by type without downloading their content
    type: data
    status: current
    surface: none
    given: an incoming WhatsApp message carrying media
    when: it is stored
    then:
      - the message is recorded with the kind of media it carried — photo, video, voice or audio, document, sticker — derived from the message itself, with no media content ever downloaded
      - any caption is kept as the message's text, and a message with no text is stored without one rather than with an invented placeholder
      - a reply records which message it replied to
      - message edits, deletions, reactions and poll votes are not stored as conversation, because they are not turns in one; creating a poll is
      - records of things that happened rather than things that were said — a deleted message, an undecryptable one, a missed call, a change to a group's membership or to a security code — are not stored as conversation either, on the live path or in backfilled history
    provenance: [classifyMessage, buildSourceMetadata, HistoryDrainer.project]

  - id: WHA-028
    title: Post-import back-fill is routed by the source that produced the candidate
    type: business-logic
    status: current
    surface: none
    given: import candidates from more than one messaging source
    when: one of them is imported or linked
    then:
      - the back-fill that binds stored messages runs for the source that produced the candidate, and only that one
      - a candidate from a source with no back-fill is imported normally, without error
      - a back-fill failure does not fail the import, which has already succeeded
    provenance: [ImportHandler.RegisterPostImportHook, triggerPostImportHook, telegram.PostImportHook, whatsapp.PostImportHook]

  # --- Aggregation ---

  - id: WHA-040
    title: Stored WhatsApp messages become interactions through the shared aggregation pipeline
    type: business-logic
    status: current
    surface: none
    given: WhatsApp messages stored against a contact
    when: aggregation runs for that contact
    then:
      - key: interaction-per-burst
        text: consecutive messages in one chat collapse into a single interaction per burst rather than one interaction per message, and a later message inside the same burst extends that interaction instead of adding another
      - key: source-is-whatsapp
        text: the interaction is attributed to WhatsApp, so it is distinguishable from the other messaging sources on the same shared store
      - key: source-ref-is-chat-scoped
        text: the interaction's reference identifies the chat and the burst's first message, so re-running aggregation recognises the same burst rather than duplicating it
      - key: description-names-whatsapp
        text: the description names WhatsApp and whether the burst was outreach, a response, or an exchange, together with how many messages it covered
      - key: rows-marked-processed
        text: every message the interaction covers is marked processed and linked to it, so no message is aggregated twice
      - key: last-contacted-moves
        text: an inbound or mutual WhatsApp interaction moves the contact's last-contacted, so WhatsApp counts toward cadence like any other conversation
    provenance: [whatsapp.NewAggregationEngine, commsadapter.NewEngine, CommsSessionStagingProcessor, TestWhatsAppPipeline_StagedRowBecomesInteraction, TestWhatsAppWiring_ProductionRegistriesDispatchWhatsApp]
    notes: The engine, the burst/session/bridge machinery and the interaction recorder are the shared ones every comms-backed source uses; WhatsApp supplies only its source name, product label, and its two operator-tunable windows.

  - id: WHA-041
    title: WhatsApp messages with no contact never become interactions
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp message stored without a contact, which is a normal outcome for an unrecognised peer
    when: aggregation runs
    then:
      - key: unmatched-row-never-aggregated
        text: the message is never aggregated and stays unprocessed, so an unrecognised peer can never produce an interaction attributed to the wrong person or to nobody
      - key: attach-makes-it-eligible
        text: once the message is attached to a contact it becomes eligible on the next aggregation pass, with no further intervention
    provenance: [ListUnprocessedCommsContactIDsForSource, ClaimCommsMessages, TestWhatsAppAggregation_UnmatchedRowIsNeverAggregated]

  - id: WHA-042
    title: Adding a phone or WhatsApp contact method attaches that number's stored WhatsApp messages
    type: business-logic
    status: current
    surface: none
    given: WhatsApp messages stored for a peer whose phone number is known but who has no contact
    when: a contact gains a phone or WhatsApp contact method carrying that number
    then:
      - key: attach-by-recovered-number
        text: every stored WhatsApp message for that number is attached to the contact, including messages the same person sent under more than one WhatsApp identifier that both resolved to it
      - key: interactions-appear-without-waiting-for-a-sweep
        text: the attached messages are aggregated in the same pass, so the interactions appear immediately rather than after the next periodic sweep
      - key: attach-failure-is-reported
        text: a failure to attach is reported rather than swallowed, so the retry can run and the user is not left with messages that silently never arrived
      - key: no-attachment-means-no-aggregation
        text: when nothing was attached, no aggregation is driven, so adding an unrelated number costs nothing
    provenance: [whatsapp.NewWhatsAppMethodRematchHandler, whatsapp.NewPhoneRematchHandler, AttachUnmatchedByPeer, TestWhatsAppRematch_AttachesByNormalizedPhoneOnly, TestWhatsAppRematch_OnPhoneMethodAdded]
    notes: >-
      These handlers are registered only while the WhatsApp integration is enabled, so a deployment with WhatsApp
      off does not make a bare phone number rematch-eligible where it was not before. A peer whose phone number was
      never recovered is not reachable this way — that population is reached through the import path, which carries
      the peer's WhatsApp identifier (WHA-025).

  - id: WHA-043
    title: A WhatsApp interaction's venue reflects whether the conversation was one-to-one or a group
    type: business-logic
    status: current
    surface: none
    given: a WhatsApp interaction being recorded
    when: its venue is resolved
    then:
      - key: direct-chat-is-a-dm
        text: an interaction from a one-to-one chat is placed in a direct-message venue
      - key: group-chat-is-a-group-chat
        text: an interaction from a group chat is placed in a group-chat venue
    provenance: [WhatsAppVenueContainerReader, VenueResolverRegistry, TestWhatsAppVenue_DirectJIDIsDM, TestWhatsAppVenue_GroupJIDIsGroupChat]
    notes: Unlike Google Chat, whose spaces are always group containers, WhatsApp carries both kinds, so the kind is derived per chat rather than fixed for the source.

  # --- Settings surface (UI) ---

  - id: WHA-070
    title: Linking offers both pairing methods and shows the live code
    type: ux
    status: current
    surface: ui
    given: the settings page with a WhatsApp integration that has no account linked
    when: the user links an account
    then:
      - key: link-offers-qr-and-phone
        text: linking offers both a scannable code and a phone pairing code, rather than only one
      - key: qr-pairing-shows-scannable-code
        text: a QR pairing renders the code the backend reported as a scannable image, and a refreshed code replaces the displayed one
      - key: phone-pairing-shows-typed-code
        text: a phone pairing sends the number the user entered and shows the code to type on the phone
      - key: pairing-can-be-cancelled
        text: an in-flight pairing can be cancelled, and the section returns to offering a fresh link rather than to the middle of the abandoned attempt
    provenance: [whatsapp-section.tsx pairing branches, use-whatsapp.ts pairing mutations]
    notes: The browser half of WHA-015 and WHA-016 (the pairing endpoints). The code refresh is what the poll exists for — WhatsApp expires codes — so the rendered code following the polled status is the mechanism under test; no test can scan a code with a real phone.

  - id: WHA-071
    title: Before the integration can link, it says what it is waiting on
    type: ux
    status: current
    surface: ui
    given: the settings page with a WhatsApp integration whose readiness gate is unsatisfied
    when: the section renders
    then:
      - key: not-ready-names-the-missing-piece
        text: the section names the dependency the integration is waiting on, rather than only reporting that something is missing
      - key: not-ready-offers-no-link-affordance
        text: no link affordance is offered at all, because the backend would refuse it
    provenance: [whatsapp-section.tsx not_ready branch, WhatsAppStatusResponse.missing]
    notes: The browser half of WHA-013, the readiness gate. The affordance is absent rather than disabled — a disabled control invites the user to guess what unlocks it.

  - id: WHA-072
    title: The linked section reports the account and its history import
    type: ux
    status: current
    surface: ui
    given: the settings page with a linked WhatsApp account
    when: the section renders
    then:
      - key: account-identity-shown
        text: the linked account is identified by its display name, phone number, device address and when it connected
      - key: history-import-progress-shown
        text: an in-flight one-shot history import reports how many chunks remain, and a chunk that could not be imported is reported rather than hidden
      - key: history-floor-shown-once-known
        text: once the depth the history reached is known, it is shown
      - key: unresolved-peers-count-shown
        text: the number of observed peers whose identity could not be recovered is shown, since those messages cannot be attributed automatically
      - key: unrefreshed-counts-are-marked-stale
        text: counts that could not be refreshed are marked as possibly out of date rather than presented as fresh
    provenance: [whatsapp-section.tsx connected branch, use-whatsapp.ts useWhatsAppStatus]
    notes: The browser half of WHA-007 (the status contract) and WHA-016. Marking stale counts matters because the status endpoint answers during an outage rather than hanging on it, so a zero it could not verify must not read as a verified zero.

  - id: WHA-073
    title: An accepted gap in the one-shot history is visible, not silent
    type: ux
    status: current
    surface: ui
    given: the settings page with a linked WhatsApp account
    when: part of the one-shot history arrived in a form the integration could not import
    then:
      - key: dropped-history-warned-when-present
        text: the section warns how many chunks of history were dropped
      - key: dropped-history-named-unrecoverable-without-relink
        text: the warning states that those messages cannot be recovered without unlinking and pairing again
      - key: dropped-history-warning-absent-when-none
        text: no such warning appears when nothing was dropped
    provenance: [whatsapp-section.tsx dropped-history warning, WhatsAppBackfillResponse.dropped_inline_chunks]
    notes: The browser half of WHA-066. The gap is accepted by design — those chunks carry history inline against an explicit non-inline request and are dropped un-projected — so the surface states it rather than presenting an incomplete import as complete.

  - id: WHA-074
    title: Unlinking is confirmed, and a failed unlink offers retry and a forced clear
    type: ux
    status: current
    surface: ui
    given: the settings page with a linked WhatsApp account
    when: the user unlinks it
    then:
      - key: disconnect-offered-and-confirmed
        text: unlinking is offered, asks for confirmation, and the section reports the account as no longer linked once it succeeds
      - key: failed-unlink-keeps-credentials-and-offers-retry
        text: an unlink WhatsApp did not confirm reports that the stored credentials were deliberately kept, and offers a retry
      - key: forced-clear-warns-device-must-be-unlinked-from-phone
        text: a forced local-only clear warns that WhatsApp was not contacted, so the device must also be removed from the phone's linked-devices screen
    provenance: [whatsapp-section.tsx disconnect + disconnect_failed branches, use-whatsapp.ts useDisconnectWhatsApp]
    notes: The browser half of WHA-011. Keeping the credentials on a failed unlink is deliberate — a failed unlink is not evidence the remote device is gone — and the surface says so rather than presenting the failure as an ordinary error.

  - id: WHA-075
    title: A device store that could not record its own state is surfaced with its remedy
    type: ux
    status: current
    surface: ui
    given: the settings page with a linked WhatsApp account whose device store is degraded
    when: the section renders
    then:
      - key: degraded-store-surfaced
        text: the section reports the degraded condition, naming which symptoms apply — a device that could not be replaced, an unrecorded terminal reason, or an unwritten record of which device is linked
      - key: remedy-is-force-disconnect-and-relink
        text: the report names forcing a disconnect and linking again as the remedy
    provenance: [whatsapp-section.tsx degraded device store advisory, WhatsAppStatusResponse.replaced_device_retained, WhatsAppStatusResponse.terminal_reason_persisted, WhatsAppStatusResponse.link_selector_persisted]
    notes: Three symptoms of one condition sharing one remedy, so one advisory rather than three banners. Two of the three flags are deliberately tri-state on the wire, because "no decision has been taken" and "a decision was taken and could not be recorded" are different things and only the second is worth surfacing.

  - id: WHA-076
    title: Discovered groups are listed with their tracking decision, and the decision can be overridden
    type: ux
    status: current
    surface: ui
    given: the settings page with a linked WhatsApp account
    when: the group chat list renders
    then:
      - key: groups-listed-with-size-and-decision
        text: each discovered group is listed with its size and the tracking decision currently in force, and a group whose size was never established says so rather than showing a number
      - key: group-without-a-title-is-identified-by-its-address
        text: a group with no title is identified by its address, so two unnamed groups stay distinguishable
      - key: tracking-choice-persists
        text: choosing to track or ignore a group records that choice, and the next read reflects it
      - key: untracked-history-is-not-recoverable
        text: the list states that messages received while a group was untracked were never stored and cannot be recovered
      - key: empty-state-before-any-group
        text: before any group has been discovered the list shows an empty state rather than nothing
    provenance: [whatsapp-section.tsx WhatsAppChatList, use-whatsapp.ts useWhatsAppChats, ChatSettingsService]
    notes: >-
      The browser half of WHA-023 — this is the surface that finally writes the per-chat override, and it
      is also the remedy for a group that grew past the size limit, since a size once established is never
      re-resolved. Turning a group on triggers no retroactive backfill: WhatsApp history is delivered once,
      at link time, so the copy says so rather than implying a recovery the source cannot perform.

  - id: WHA-077
    title: A connection the integration gave up on is reported with its reason
    type: ux
    status: current
    surface: ui
    given: the settings page with a WhatsApp integration that is not connected
    when: the section renders
    then:
      - key: disconnected-shows-the-reason
        text: a terminated connection reports why it ended, in words rather than as a machine code
      - key: temporary-ban-shows-when-it-lifts
        text: a temporary restriction also reports when it lifts, which is its only actionable half
      - key: startup-failure-shows-its-reason
        text: a stack that could not be brought up at all reports its reason too, rather than rendering as an empty section
      - key: terminal-disconnect-offers-a-fresh-link
        text: a connection that ended terminally offers linking again, and taking that offer reaches the same choice of pairing methods a first-time link does
    provenance: [whatsapp-section.tsx disconnected + error branches, whatsapp terminal reason constants]
    notes: The browser half of WHA-004 and WHA-005 (the terminal-disconnect contract). An unmapped future reason falls back to the raw value, so a newer backend still shows something true rather than nothing.

  - id: WHA-078
    title: The group tracking endpoints list observed chats and record an override
    type: api
    status: current
    surface: api
    given: the WhatsApp group tracking endpoints
    when: a chat list is read or an override is written
    then:
      - key: list-returns-observed-chats-with-effective-decision
        text: the list returns every observed chat with its stored override and the decision the ingest gate would take for it, computed by the same predicate the live path uses
      - key: override-persists-and-is-echoed-back
        text: writing an override echoes the updated chat back with the decision recomputed from the new value, so no second read is needed
      - key: override-rejects-an-unknown-status
        text: an override that is not one of the accepted values is rejected before it reaches the store
      - key: override-of-an-unobserved-chat-is-not-found
        text: an override for a chat the integration has never observed is not found, and no row is created for it
    provenance: [WhatsAppHandler.ListChats, WhatsAppHandler.UpdateChatStatus, ChatSettingsService, ListWhatsAppChatConfigs, UpdateWhatsAppChatConfigStatus]
    notes: The override is the only writer of the per-chat status column — every automatic re-observation preserves it — so this is the write path WHA-023 records as the one a surface finally provides. Turning a chat on deliberately triggers no backfill, unlike the Telegram analogue, because WhatsApp history is one-shot.
