  # --- Flag scorecard and Langfuse metrics ---

  - id: KNW-085
    title: The scorecard reports flag precision and recall per method and kind over labeled flag decisions
    type: business-logic
    status: current
    surface: none
    given: flag decisions the user labeled, by a control, a close or Confirm Nones
    when: crm-admin --scorecard reruns a method and reports it
    then:
      - key: rerun-covers-labeled-decisions
        text: the rerun replays, as it replays a reviewed example (KNW-053), each example whose judgment answered a labeled flag or clearing decision, whichever method's judgment it was
      - key: shown-at-threshold
        text: a flag decision counts as flagged when its probability reaches the method's display threshold, a probability equal to the threshold included
      - key: precision-recall-over-labels
        text: per flag kind, precision is the share of the rerun's flagged labeled decisions whose message holds the kind, and recall the share of its labeled decisions whose message holds the kind that are flagged; a label a close or Confirm Nones wrote counts as any other
      - key: unlabeled-counted-in-neither
        text: a flag decision without a label counts in neither
      - key: only-flag-labels-count
        text: only flag and clearing labels count toward a flag metric; a review of an earlier method version's whole-thread commitment or big-moment outcome counts toward none
      - key: rate-without-labels-none
        text: a rate with no labeled decision behind it reports none, never 0
    provenance: [scorecard.Scorecard.labeledTargets, scorecard.Reader.scoreFlags, judgment.Store.Labels, judgment.Shows, crm-admin --scorecard, .agents/spec/2026-10-18-message-flags-and-threads.md G13 SC7 NG4]

  - id: KNW-086
    title: The scorecard reports clearing accuracy per method over labeled clearing decisions
    type: business-logic
    status: current
    surface: none
    given: clearing decisions the user labeled
    when: crm-admin --scorecard reruns a method and reports it
    then:
      - key: accuracy-over-labeled-clearings
        text: clearing accuracy is the share of the rerun's labeled clearing decisions the method answered as the label says, beside the count of each answer against each label
      - key: unlabeled-clearing-counted-in-neither
        text: a clearing decision without a label counts in neither
      - key: rejected-commitment-clearings-skipped
        text: a labeled clearing decision of a commitment the user rejected (its message holding a commitment label saying it holds none) counts in neither, in the scorecard and in the export that reads the same metrics, so a run whose only labeled clearing decisions are of rejected commitments has no clearing accuracy
    provenance: [scorecard.Reader.scoreFlags, crm-admin --scorecard, crm-admin --langfuse-export, .agents/spec/2026-10-18-message-flags-and-threads.md G13, .agents/spec/2026-10-21-threads-review-fixes.md G2 SC2]

  - id: KNW-087
    title: The scorecard counts the new messages a method judged, left unjudged and flagged, and never counts an unjudged message as a no
    type: business-logic
    status: current
    surface: none
    given: a scorecard rerun of a method, or a stored rerun the export reads
    when: the scorecard counts its new messages
    then:
      - key: judged-unjudged-flagged-counted
        text: per method, the scorecard reports how many new messages the rerun's judgments answered, how many it left unjudged by reason, and per flag kind how many it flagged
      - key: unjudged-never-a-no
        text: an unjudged message, whatever its label, is counted unjudged and not judged, and lies outside every precision and recall
      - key: stage-1-before-window-read
        text: a stored stage-1 rerun's before_window record is counted unjudged with that reason
    provenance: [scorecard.Reader.scoreFlags, crm-admin --scorecard, crm-admin --langfuse-export, .agents/spec/2026-10-18-message-flags-and-threads.md G13 SC10, coordinator ruling PR3-R1]

  - id: KNW-091
    title: The name model container turns texts into person spans, on demand, and holds nothing else
    type: api
    status: current
    surface: none
    given: a request to the name model's socket, POST /v1/spans with a model, a label, a threshold and texts
    when: the container answers it
    then:
      - for each text, in the order sent, it returns the ranges the model labels with the label at a score of the threshold or more, as half-open UTF-8 byte ranges into the text exactly as sent, covering the whole text whatever its length, a name that a division of a long text splits included
      - an empty text has no spans, and the response carries no text
      - a request for any model other than the one its image holds, a threshold outside (0, 1], an empty label, or texts that are missing or not all strings is refused with 422 and no spans, and an unknown path is never answered with spans
      - a connection while the model is down starts it and is answered once the model has loaded; the model exits after an idle period, and with its units stopped a request fails at once
      - it runs under its memory cap with no network, no database and no credentials, its weights in its image, and writes no text to its logs or its disk
    provenance: [name-model/name_model/server.py, name-model/units, scripts/deploy-artifact.sh swap_model, name-model/tests/test_endpoint.py, .agents/spec/2026-10-21-masking-fixes.md G6 G9 HC2 D2]
    notes: The coverage scanner reads no Python, so the endpoint tests in name-model/tests reference this behavior in prose. The on-demand start, idle exit and memory cap are shown by a live capture on the Pi, not by a test.

  - id: KNW-088
    title: The Langfuse export sends each scorecard metric as its own numeric score
    type: data
    status: current
    surface: none
    given: a finished rerun run and the labels and reviews its scorecard metrics count
    when: crm-admin --langfuse-export sends it
    then:
      - key: each-metric-own-score
        text: each metric of the rerun's scorecard, flag and ball-in-court alike (per-outcome recall and precision, confusion counts, i_owe_missed, corrections_caused, each flag kind's precision, recall and counts, clearing accuracy and counts, and the message counts), is its own numeric score on the run's trace, carrying the method key and versions; every run carries one fixed set of metrics, named from each question's outcome values, the flag kinds and the unjudged reasons
      - key: later-export-replaces
        text: each export replaces the run's earlier value of each metric, and deletes the value Langfuse holds for each metric the latest labels and reviews leave without one, the single scorecard score earlier exports sent among them
      - key: absent-metric-not-sent
        text: after an export Langfuse holds no value, never 0, for a rate with no labeled decision behind it, nor for i_owe_missed and corrections_caused when the run covered no review; a count, each confusion cell among them, is sent on every export, zero included
      - key: scores-content-free
        text: the scores carry no message text, sender or contact identity
    provenance: [langfuseexport.scorecardScores, langfuseexport.Exporter.Export, langfuseexport.client.deleteScores, crm-admin --langfuse-export, .agents/spec/2026-10-18-message-flags-and-threads.md G14 HC3 SC7]

  # --- Masking ---

  - id: KNW-089
    title: The masker hides every known name and the user's own names, and keeps ordinary words
    type: business-logic
    status: current
    surface: none
    given: a thread context and its questions for a masked decision-model method, and the masker's dictionary of the user's own names (OWN_NAMES), the CRM's contact names and the display names stored messages give their senders and recipients
    when: the masker masks them before they leave the Pi
    then:
      - key: identifiers-masked
        text: email addresses and phone numbers of seven or more digits are masked, a phone number shaped like a date and an email address holding one included
      - URLs and @handles are masked too, and every formatted identifier no participant owns becomes a numbered placeholder (EMAIL_n, PHONE_n, URL_n, HANDLE_n), one per distinct value within the request
      - key: role-labels-and-placeholders
        text: a participant's names become its role label, and every other name a numbered placeholder, one per distinct identity within the request
      - a participant's own handles, email addresses and phone numbers become its role label (ME, THEM, PERSON_n) too
      - key: calendar-words-survive
        text: weekday, month and relative-time words and calendar dates survive, and no phone match takes a calendar date or any part of one
      - question IDs and option keys pass through unchanged
      - key: own-names-me
        text: each of the user's own names from OWN_NAMES, each full name and each of its words, is masked as ME wherever it appears, at the start of a sentence included, even where another identity's name shares the word
      - key: display-names-masked
        text: a display name a stored message gives a sender or recipient, of any source that stores one, is masked in every message, as a numbered placeholder in a thread its owner takes no part in
      - key: contractions-stay-whole
        text: a contraction that does not end in 's, is a common word and is no known name ("I'll", "don't") stays whole, and no part of it is masked as a name; a lower-case word ending in 's whose head is a common word ("it's", "let's") stays whole too
      - key: known-apostrophized-name-masked
        text: a known name written with an apostrophe ("Teal'c") is masked like any other name, even where the word list holds it as a contraction, unless a personal pronoun heads it
      - key: pronouns-never-names
        text: a personal pronoun (I, me, you, he, she, it, we, they, us, them), in any case, and a contraction headed by one ("I'll", "I'd", "It's", "we're") is never masked as a name and stays whole, even where a known name holds the word or the contraction
      - key: lowercase-common-words-kept
        text: a common English word written in lower case is never masked as a name, even when a contact's name holds it
      - key: capitalized-known-name-masked
        text: a known name that is also a common word is masked when capitalized, at the start of a sentence too
      - key: possessive-suffix-kept
        text: a word ending in 's is its head word and a suffix, and the head is masked by the rule every word is, so a possessive of a known name ("Emily's") and a capitalized contraction whose head is a known name ("Mine's" with a contact named Mine) are masked with the suffix kept beside the placeholder, and a possessive of a word that is no name stays intact
      - key: unknown-capitalized-kept
        text: no rule masks a word for being capitalized and unknown, so a capitalized word no known name holds ("Happy New Year", "Rose", an invented word) survives the dictionary; the name model finds unknown names
      - key: address-header-words-masked
        text: every word of a from header outside a formatted identifier is masked
      - every word of the other address headers (to, cc, bcc, reply-to, sender) outside a formatted identifier is masked too
      - key: refused-without-own-names
        text: the masker refuses to build when OWN_NAMES holds no name, so a run that would mask fails before any call
      - every masked method's version derives from the masking version, which the masking rules, the common-word list's content and the name model's version (KNW-090) make and no dictionary name feeds, so a masking change makes a rerun judge again
    provenance: [threadctx.Masker, threadctx.LoadMasker, threadctx.MaskingVersion, decision.NewMaskedMethod, cmd/gen-mask-words, .agents/spec/2026-10-21-masking-fixes.md G1 G2 G3 G5 HC1 SC1 SC2 SC3 SC4]
    notes: The common-word list is generated by backend/cmd/gen-mask-words from vendored sources that the file's header names with their licenses. A common name written in lower case ("talked to will") passes, by the user's ruling (decision 20261021T190726Z-a4122783cf5c).
  - id: KNW-090
    title: The masker masks the name model's spans with the dictionary's matches, and sends nothing the model has not covered
    type: business-logic
    status: current
    surface: none
    given: a thread context for a masked decision-model method, the span store, the name model (GLiNER urchade/gliner_multi_pii-v1, label person) at the socket NAME_MODEL_SOCKET names, and the score cutoff NAME_MODEL_THRESHOLD
    when: the masker covers and masks the context before a run sends it
    then:
      - key: spans-ensured-and-stored
        text: before masking, the masker ensures every text of every entry (its text and each header that is not an address header) has name spans for its message, a digest of the text and the model version, asking the name model only for the texts the span store lacks and storing what it answers, so a run whose texts are all stored, or a second run over the same range, asks the model nothing, and a changed text or model version is asked again
      - the span store holds message keys, text digests, the model version and offsets, never text, and the backend is its only writer
      - key: union-masked
        text: the masker masks the union of the dictionary's matches and the name spans, every masked range taking its placeholder from the one per-request placeholder map, so a span over an unknown name becomes a numbered placeholder shared across entries, a span over a participant's alias its role label and a span over the user's own name ME; overlapping ranges are masked whole, a span is widened to every word it touches, and a known name the model misses is still masked
      - key: lowercase-common-spans-kept
        text: a name span every word of which is a common English word written in lower case, judged by the masker's common-word list and its 's split, masks nothing, and any other span masks every word it touches, whole
      - key: pronoun-spans-kept
        text: a personal pronoun or a contraction headed by one ("I", "I'll", "You're"), in any case, counts as an ordinary word in a name span, so a span made only of such words and lower-case common words masks nothing
      - key: no-spans-no-send
        text: a request with a text the name model has not covered is not sent, and the run records its cut-off as it records a failed call (call_failed), whether the socket has no listener, the model answers a non-success status or refuses the model identity, the deadline expires, or the answer does not align with the texts asked or holds a span that is not a range of whole characters of its text; a rerun once the model answers sends it, and a run with NAME_MODEL_SOCKET unset fails before any call
      - key: abandoned-request-stops
        text: a request whose caller has given up, by its deadline or a cancellation, stops the name model's work on it, so a request sent after it is answered within its own deadline
      - key: deadline-covers-length
        text: a request's deadline grows with the length of the texts it carries, allowing at least twice what the model needs on the production host (about 1.5 s per 128-word window, measured 2026-10-23, after a cold start of about 30 s), so a long text the model can read is not cut off by a deadline counted in texts
      - key: threshold-setting
        text: the run asks the model at the cutoff NAME_MODEL_THRESHOLD sets, 0.5 when unset; the cutoff is part of the model version, which every masked method's version and every stored span's key derive from, so a change to it makes a rerun judge again and ask the model again, and equal values written differently ("0.5", "0.50") are one version; a value that is not a number or lies outside (0, 1] is refused when the configuration loads, before any call
    provenance: [threadctx.Masker.Cover, threadctx.NameSpans, threadctx.ModelVersion, namemodel.Client, repository.NameSpanRepository, decision.NewMaskedMethod, config.DecisionConfig, migrations/104_message_name_span, .agents/spec/2026-10-21-masking-fixes.md G6 G7 G8 HC2 HC3 SC6 SC7]
    notes: A lower-case word the common-word list lacks is masked when a span covers it ("mom" is not on the list), by the spec's tradeoff rule (hide the name). The cutoff is the user's ruling (decision 20261022T002648Z-a01b4678d1a9); the lower-case rule for spans is decision 20261022T021159Z-25b0429017f3.
