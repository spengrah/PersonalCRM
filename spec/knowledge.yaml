domain: knowledge
prefix: KNW
maturity: reviewed
settled: [ui, api]
behaviors:
  # --- Assertion write path ---

  - id: KNW-001
    title: All assertion-store writes go through one validated write path
    type: invariant
    status: current
    surface: none
    statement: every producer of knowledge (user profile edits, contact merges, enrichment inference, operator backfills) writes to the assertion store through the single validated assert path — which owns proposition identity, cardinality and supersession, the bi-temporal clocks, provenance dedup, and event emission in one transaction — and a validation failure rejects the write (rolling back the transaction) rather than silently dropping the assertion.
    provenance: [AssertService, ErrAssertValidation, knowledgeWriter, ContactKnowledgeMigrationService, TagMigrationService]
    notes: There is no raw-INSERT side door; even the tag/column data migrations route through this path so dedup and events apply uniformly.

  - id: KNW-002
    title: Assertion writes are validated against the catalog and the live graph
    type: business-logic
    status: current
    surface: none
    given: an assert request naming a subject, predicate, and payload
    when: the write is validated
    then:
      - the predicate must exist in the predicate catalog
      - the subject node must exist, not be soft-deleted, and match the predicate's subject type (person, venue, or a specific entity subtype)
      - an edge predicate requires a live, type-matched object node and no scalar value
      - a fact predicate requires exactly one scalar value matching the predicate's value type, and text values must be non-empty after trimming
      - confidence must be within 0-100, and any salience override within 0-100 (salience defaults from the predicate)
      - a validity range whose end does not fall after its effective start is rejected as degenerate, even when an existing row would otherwise have matched
    provenance: [AssertService.validate, validateFactValue, matchNodeType]
    notes: The salience range check runs on the new-row path; a write that corroborates an existing live proposition never touches salience, so an out-of-range override there is ignored rather than rejected.

  - id: KNW-003
    title: Provenance locators are validated per source kind
    type: business-logic
    status: current
    surface: none
    given: an assert request carrying provenance locators
    when: the locators are validated
    then:
      - at least one locator is required on every assertion
      - producer kind and source kind must come from their closed vocabularies
      - metadata-only sources (phone calls, calendar events) may not back a fact assertion
      - a locator referencing a content row must point at an existing (non-deleted) row at write time
      - locators without a content row (user, agent session, transcript kinds) still require a stable non-empty source id, since it keys idempotent re-runs
    provenance: [AssertService.validateLocators, SourceKindRequiresExistenceCheck, assertion_provenance.sql]

  - id: KNW-004
    title: Landing status follows the predicate's review policy
    type: business-logic
    status: current
    surface: none
    given: a valid assert request for a predicate with a default review policy
    when: the new assertion lands
    then:
      - an auto-if-confident predicate lands the assertion as accepted
      - an always-confirm predicate lands it as proposed, awaiting review
      - a caller may force an otherwise auto-applied write of a predicate that is not a judgment predicate to land proposed
      - a judgment predicate lands by its catalog row alone — an auto-if-confident one with a confidence threshold lands accepted only at or above it — and no request field changes that (KNW-044)
    provenance: [AssertService.AssertTx landingAccepted, predicate.default_review_policy, 066_seed_predicate_catalog.up.sql, 093_judgment_predicates.up.sql]

  - id: KNW-005
    title: Relationship edges are stored in one canonical form
    type: data
    status: current
    surface: none
    given: an edge assertion whose predicate is symmetric or has an inverse
    when: the edge is written
    then:
      - a symmetric edge stores its pair in a deterministic participant order, so both statements of the relationship are one row
      - an inverse pair rewrites to the canonical predicate with subject and object swapped, so the relationship stated from either side collapses to one row
    provenance: [canonicalEdge, 066_seed_predicate_catalog.up.sql inverse seeding]

  - id: KNW-006
    title: Re-asserting an existing proposition corroborates instead of duplicating
    type: data
    status: current
    surface: none
    given: a live assertion whose proposition identity (canonical subject, predicate, normalized value, valid-time bucket) matches an incoming write
    when: the write is applied
    then:
      - no new assertion row is created
      - the incoming provenance locators are appended, with already-known locators deduplicated on their full locator identity
      - confidence re-aggregates to the maximum across old and new evidence
      - the trust tier re-aggregates to the strongest producer across all locators (user over agent over extractor)
      - a proposed row that is corroborated by an accepted-landing write is upgraded to accepted, including accept-time conflict resolution
    provenance: [computePropositionKey, AssertService.corroborate, appendProvenance, computeLocatorHash]
    notes: Value normalization for identity is case/whitespace-insensitive for text, calendar-day for dates, canonical float form for numbers; valid-time bucketing granularity is per-predicate (day/month/year/none).

  - id: KNW-007
    title: At most one live assertion exists per proposition
    type: invariant
    status: current
    surface: none
    statement: the database enforces at most one live (proposed or accepted, knowledge-open) assertion per proposition key via a partial unique index, and a concurrent identical write that loses the race is recovered inside the transaction (savepoint rollback, re-read, corroborate the winner) rather than failing the caller.
    provenance: [idx_assertion_live_proposition, insertAssertionWithRecover, isLivePropositionViolation]

  - id: KNW-008
    title: A different value written to a single-cardinality slot supersedes the current one
    type: business-logic
    status: current
    surface: none
    given: a single-cardinality slot (e.g. a person's current location) holding an accepted value
    when: a different value is asserted as accepted with an overlapping validity window
    then:
      - the new row is inserted and becomes the current value
      - the prior row is closed as superseded with a pointer to its successor and its knowledge window closed
      - exactly one accepted row remains current for the slot
    provenance: [AssertService.writeNew, closeConflicts, FindAcceptedForSlot]
    notes: Concurrent writers to the same slot serialize on a per-slot advisory lock taken before any row lock; symmetric predicates lock per participant in sorted order to stay deadlock-free.

  - id: KNW-009
    title: Reaffirming the same value widens the existing stint instead of superseding it
    type: business-logic
    status: current
    surface: none
    given: an accepted assertion and an incoming accepted write carrying the same value for the same slot with an overlapping window
    when: the write is applied
    then:
      - no new row is created and nothing is superseded as a value change
      - the surviving row's validity window widens to the union of the windows
      - a window that bridges several non-contiguous same-value stints merges them all into one survivor (provenance moved, losers closed pointing at the survivor)
      - the survivor is deterministic — the earliest stint by validity start (an open start sorts earliest, row id as the tie-break)
      - a pending future successor's bound on any merged stint caps the widened window at the earliest such bound, and the survivor inherits that successor linkage so the rollover still terminalizes it at the bound (only the backward extension applies)
    provenance: [widenReaffirmation, sameValueConflicts, mergeSameValue, FindAcceptedForSlot]

  - id: KNW-010
    title: Past-bounded history coexists with the current value
    type: business-logic
    status: current
    surface: none
    given: a slot with a current accepted value
    when: a different value is asserted with a validity window that ended in the past
    then:
      - the historical row is inserted alongside the current one without superseding it
      - the current value is unchanged
      - a same-value past stint still merges into the existing row for that value rather than duplicating it
    provenance: [AssertService.writeNew pastBounded branch]

  - id: KNW-011
    title: A future-dated successor bounds the current value until its date arrives
    type: business-logic
    status: current
    surface: none
    given: a slot with a current accepted value
    when: a different value is asserted with a validity start in the future
    then:
      - the prior stays accepted (still the current value) but its validity end is bounded at the successor's start and it records the successor
      - a prior that would never be current under the new timeline is terminalized immediately, keeping its own validity end
    provenance: [closeConflicts, closeBoundary, BoundPendingSuccessor]

  - id: KNW-012
    title: A scheduled rollover terminalizes bounded values whose date has passed
    type: business-logic
    status: current
    surface: none
    given: accepted assertions bounded by a pending successor whose validity end has been reached
    when: the periodic rollover sweep runs
    then:
      - each due row flips to superseded with its knowledge window closed, and a superseded event is emitted per row in the same transaction
      - an event-publish failure rolls the flip back so the next run retries
      - the sweep is stateless and idempotent, runs daily, and catches up overdue rollovers on startup
      - a bounded-past row with no successor is never touched (it remains legitimate accepted history)
    provenance: [AssertService.RunRollover, RolloverDueBoundedSuccessors, AssertionRolloverWorker]

  - id: KNW-013
    title: Clearing a slot closes the current value with no successor
    type: business-logic
    status: current
    surface: none
    given: a single-cardinality slot
    when: a closure is requested for the slot
    then:
      - the current accepted row, if any, is closed as ended at the current time with no successor, and the slot becomes a gap
      - with no current row the closure is an idempotent no-op
    provenance: [AssertService.AssertClosure, ClosureReasonEnded]
    notes: This is what a user clearing the location or birthday field on the contact form invokes (see KNW-028 and CON-006) — history is closed, never deleted.

  - id: KNW-014
    title: Accepting a proposed assertion applies full slot conflict resolution
    type: business-logic
    status: current
    surface: none
    given: a proposed assertion under review
    when: it is accepted
    then:
      - only a proposed assertion may be accepted; any other status is rejected as a validation error
      - the acceptance runs single-cardinality conflict resolution as if the value were being written now, superseding different-value priors
      - an acceptance that reaffirms an existing accepted value is absorbed into that survivor (provenance and confidence folded in, the accepting row closed) and the survivor is returned
      - a past-bounded row is accepted as coexisting history without superseding anything
      - concurrent lifecycle transitions on the same row are serialized so only one succeeds
    provenance: [AssertService.Accept, resolveAcceptConflicts, GetAssertionForUpdate]

  - id: KNW-015
    title: Reject and retract are status-guarded terminal transitions
    type: business-logic
    status: current
    surface: none
    given: an assertion under review or correction
    when: a reject or retract transition is applied
    then:
      - only a proposed assertion may be rejected; only an accepted assertion may be retracted
      - the row becomes terminal with its closure reason recorded and its knowledge window closed
      - a rejected proposal never becomes a current value
      - a retraction removes the value from current knowledge and is announced as a supersession (there is no separate retract event kind); the closure reason distinguishes it
    provenance: [AssertService.Reject, AssertService.Retract, terminalTransition]

  - id: KNW-016
    title: The assertion row enforces its shape and clocks at the schema level
    type: data
    status: current
    surface: none
    given: any attempt to persist an assertion row
    when: the row is written
    then:
      - exactly one payload is set (an object node reference, or one typed scalar)
      - the knowledge window is closed if and only if the status is terminal (rejected, superseded, retracted)
      - when both validity bounds are present the end is strictly after the start
      - the knowledge end is never before the knowledge start
      - numeric values must be finite (NaN and infinities are rejected)
      - status, confidence, and salience are constrained to their closed sets and 0-100 ranges
      - node and predicate references restrict hard deletes rather than cascading
    provenance: [067_assertion_store.up.sql CHECK constraints]

  - id: KNW-017
    title: Every assertion state change emits a durable event inside the write transaction
    type: invariant
    status: current
    surface: none
    statement: assertion lifecycle changes (proposed, accepted, superseded, rejected) and provenance additions publish events on the transactional event bus within the same transaction as the state change, keyed idempotently (one-shot per lifecycle transition, per-locator for provenance, per merge-destination for merge moves) so retries never double-publish; the event bus is mandatory wiring — the write path does not operate without it.
    provenance: [emitAssertionEvent, emitProvenanceAddedEvent, emitMergeMoveEvent, busPublisher]

  - id: KNW-018
    title: Only accepted and superseded events drive downstream recomputation
    type: business-logic
    status: current
    surface: none
    given: a published assertion event
    when: consumer jobs are routed
    then:
      - accepted and superseded events enqueue the knowledge-cache refresh worker (with bounded retries)
      - proposed, rejected, and provenance-added events deliberately have no consumer — they never change a current value and land durably for audit only
    provenance: [events/bus.go consumerJobsForKind, KnowledgeCacheUpdaterJobArgs]

  # --- Graph nodes and entities ---

  - id: KNW-019
    title: Node tombstones gate all live graph reads
    type: invariant
    status: current
    surface: none
    statement: a node's single tombstone (deleted-at, set by contact deletion or a contact merge) removes it from every live graph read — an assertion is only current/live when its subject node is live and, for an edge, its object node is live — and entity, venue and interaction subtype rows carry no tombstone of their own, inheriting liveness from their parent node; assertion rows themselves are retained as history. An interaction-node merge sets the merged-away node's merge alias without a tombstone and moves no assertion, so the merged-away node and every assertion naming it stay live.
    provenance: [GetCurrentAccepted, ListLiveEdgesForNode, node.deleted_at, entity.sql]
    notes: This is why a deleted or merged-away contact's knowledge never resurfaces (see KNW-026); node soft-deletion itself is contact-domain scope (CON-010, CON-033).

  - id: KNW-020
    title: Place entities deduplicate on their normalized name
    type: data
    status: current
    surface: none
    given: a location label to resolve to a place node
    when: the place is ensured
    then:
      - the place is found or created by its case- and whitespace-insensitive normalized name, so the same place asserted across contacts or edits resolves to one node
      - the node's display label preserves the original casing and spacing of its first write
      - an empty label is rejected as a validation error
      - two concurrent first-writes of the same new place resolve to a single node (the loser recovers from the uniqueness collision and adopts the winner's node)
    provenance: [EnsurePlaceTx, idx_entity_subtype_name, isPlaceNameViolation]

  # --- Node merge mechanics (invoked by contact merge — CON-033) ---

  - id: KNW-021
    title: Merging nodes re-canonicalizes repointed assertions and resolves winner-side collisions
    type: business-logic
    status: current
    surface: none
    given: a loser node being merged into a winner (the loser already tombstoned with a merge alias)
    when: the assertion merge runs
    then:
      - every assertion touching the loser (as subject or object) is rewritten onto the winner, re-canonicalized, and its proposition identity recomputed
      - terminal rows are repointed silently as history
      - a live row whose recomputed identity collides with a live winner-side row merges into it, and the accepted row always survives a collision with a proposed one — a merge never demotes accepted knowledge
      - repointed live rows announce their move with an event keyed per merge destination, so retrying the same merge is idempotent while a chained merge announces again
      - all implied single-cardinality slot locks are collected up front and acquired in sorted order
    provenance: [MergeAssertionsTx, planRepoint, applyRepoint, emitMergeMoveEvent]
    notes: The domain boundary is intentional. CON-033 owns the merge-level contract (loser assertions repoint onto the winner node, before the field-selection apply so the user's choices win); this behavior owns the knowledge-side mechanics that bare repointing elides — re-canonicalization, proposition-identity recompute, winner-side collision resolution (accepted always survives), self-loop closure (KNW-022), slot re-competition (KNW-023), and per-destination merge events. When the graph merge runs relative to the field-selection apply is contact-domain scope — CON-033. An interaction-node merge never runs this assertion merge; it only aliases the merged-away node, which keeps no tombstone, and every assertion stays on the node it names (KNW-019, KNW-036, KNW-037).

  - id: KNW-022
    title: Edges between the merging pair collapse and close
    type: business-logic
    status: current
    surface: none
    given: an edge connecting the loser and winner of a node merge
    when: the merge rewrite would turn it into a self-referencing edge
    then:
      - a live self-collapsed edge is closed as ended (a node cannot relate to itself), with its validity end stamped only if the edge was genuinely open at that moment
      - a terminal self-collapsed edge is left untouched as dead history
    provenance: [closeSelfLoop, repointedAssertion.selfLoop]

  - id: KNW-023
    title: A repointed current value competes in the winner's slot
    type: business-logic
    status: current
    surface: none
    given: an accepted single-cardinality assertion repointed onto the winner during a node merge
    when: it lands in the winner's slot
    then:
      - same-value priors on the winner widen into the repointed row (windows unioned, provenance folded)
      - the widened survivor inherits the tightest pending-future-successor bound among the rows folded in, so the scheduled rollover still terminalizes it on time
      - different-value overlapping priors are superseded exactly as on the normal write path
      - a past-bounded repointed row coexists as history and supersedes nothing
    provenance: [applyRepoint slot resolution, widenMergedSurvivor]

  # --- Derived cache columns (contact location / birthday / how-met) ---

  - id: KNW-024
    title: Contact knowledge columns are derived from current-accepted assertions
    type: data
    status: current
    surface: none
    given: a contact's location, birthday, and how-met cache columns
    when: a cache refresh recomputes a column
    then:
      - the value is recomputed from scratch from the current-accepted assertion for that contact and predicate (never patched incrementally), which makes supersession, closure, and retraction all land correctly
      - when no current-accepted assertion exists, the column is cleared to NULL
      - the location column carries the linked place node's display label
      - a current location edge with no place node is surfaced as a hard error, never a silently blank cache
    provenance: [KnowledgeCacheUpdater.RefreshTx, resolveLivesInLabel, GetCurrentAccepted, reject_unauthorized_derived_contact_write trigger (migration 079)]
    notes: The contact-side rule that contact writes never touch these columns directly is CON-004; this behavior owns the derivation itself.

  - id: KNW-025
    title: Cache refresh is inline for the writer and event-driven for everyone else
    type: business-logic
    status: current
    surface: none
    given: an assertion write that affects a contact knowledge column
    when: the cache is refreshed
    then:
      - writes made inside a contact create/update/merge/enrichment transaction refresh the columns inline in that transaction, so the returned contact already reflects the new values on commit
      - accepted and superseded assertion events from any other producer refresh the column asynchronously via a queued worker with bounded retries
      - the event path ignores predicates that do not back a cache column, while a direct refresh call with an unsupported predicate is rejected as a programming error
    provenance: [knowledgeWriter.refreshAll, KnowledgeCacheUpdater.HandleEvent, KnowledgeCacheUpdaterWorker]

  - id: KNW-026
    title: Cache maintenance is bookkeeping, not a profile edit
    type: data
    status: current
    surface: none
    given: a contact whose knowledge cache column is being refreshed
    when: the column update is applied
    then:
      - the contact's updated-at timestamp is not bumped
      - a soft-deleted contact row is never written
      - a deleted or merged-away contact has no current-accepted values (node liveness gating), so its cached knowledge never resurrects
    provenance: [UpdateContactLocationCache, contact.sql cache queries, GetCurrentAccepted node join, reject_unauthorized_derived_contact_write trigger (migration 079)]

  # --- Contact profile fields as knowledge (the cutover write path) ---

  - id: KNW-027
    title: Contact profile knowledge fields are written as assertions
    type: business-logic
    status: current
    surface: none
    given: a contact create, update, or merge carrying location, birthday, or how-met values
    when: the profile write is applied
    then:
      - each field value becomes an accepted assertion (location as an edge to a deduplicated place, birthday as a date fact, how-met as a text fact) in the same transaction as the contact write
      - a direct user edit carries user provenance at full confidence
      - the provenance locator is deterministic per source, contact, and field, so a retry or re-run corroborates the same assertion instead of duplicating it
      - the services refuse to run without the knowledge writer wired, rather than silently dropping a value
    provenance: [knowledgeWriter.assertCreate, knowledgeWriter.locator, knowledgeAssertConfidence, ContactService.SetKnowledgeWriter]
    notes: The contact-domain statements of this seam are CON-004 (columns never written directly) and CON-006 (clear semantics); this behavior owns the assertion-side mechanics.

  - id: KNW-028
    title: Blank knowledge values mean no value, and clears close slots
    type: business-logic
    status: current
    surface: none
    given: a contact write whose location or how-met value is blank or whitespace-only, or whose location/birthday was cleared
    when: the knowledge fields are reconciled
    then:
      - a whitespace-only location or how-met normalizes to no-value; a blank location never mints a place node
      - on update, a cleared location or birthday closes that slot (KNW-013), preserving the assertion history
      - an absent how-met on update is a no-op rather than a clear, because the contact form carries no how-met input and its absence must not wipe history
    provenance: [knowledgeFieldValues.normalized, knowledgeWriter.applyUpdate, reconcileClearable]

  # --- Enrichment-inferred knowledge ---

  - id: KNW-029
    title: Enrichment infers knowledge only into empty fields, as agent-provenance assertions
    type: business-logic
    status: current
    surface: none
    given: a contact being enriched from a linked external contact
    when: the enrichment computes inferred fields
    then:
      - an inferred birthday or location is taken only when the contact's corresponding field is currently empty; existing values are never overwritten
      - inferred values land as assertions with agent provenance at reduced (non-certain) confidence, in the same transaction as the profile update
      - the enrichment provenance locator is deterministic, so re-running the enrichment corroborates rather than duplicates
    provenance: [EnrichmentService.EnrichContactFromExternal, assertInferredKnowledge, knowledgeAssertConfidence]
    notes: The enrichment trigger and method-enrichment mechanics are imports-domain scope (IMP-015 cross-references this seam).

  - id: KNW-030
    title: Losing an inferred knowledge value is an error, not a warning
    type: business-logic
    status: current
    surface: none
    given: an enrichment that inferred a location or birthday
    when: the transaction persisting the inferred assertions fails, or the knowledge writer is not wired
    then:
      - the enrichment surfaces an error instead of reporting success, because the assertion store is the value's only home
      - an enrichment carrying no inferred knowledge (photo, cadence, or name only) keeps best-effort warn-and-continue semantics for profile-write failures
    provenance: [EnrichmentService inferred-knowledge error branches]

  # --- Operator backfills ---

  - id: KNW-031
    title: The knowledge-column backfill is an idempotent mirror into the graph
    type: business-logic
    status: current
    surface: none
    given: legacy contact rows with location, birthday, or how-met column values
    when: the operator runs the knowledge-column migration command
    then:
      - each populated column of every live contact becomes an accepted assertion through the standard write path (location via the deduplicated place entity)
      - migrated assertions carry user provenance at full confidence, with the contact's creation time preserved as the knowledge time
      - soft-deleted contacts and blank values are skipped
      - re-running the command corroborates existing assertions instead of duplicating them (deterministic per-contact-per-column locators)
    provenance: [ContactKnowledgeMigrationService, ListContactsWithKnowledgeColumns, crm-admin --migrate-contact-knowledge-columns]
    notes: Preserving historical knowledge time (the override) is reserved for migrations/backfills; live producers always get the current time as knowledge time.

  - id: KNW-032
    title: The tag migration mirrors legacy tags into the graph, failing loudly on ambiguity
    type: business-logic
    status: current
    surface: none
    given: legacy tags and contact-tag links
    when: the operator runs the tag migration command
    then:
      - each distinct case-insensitive tag name becomes one tag entity node, preserving the original display casing and carrying the tag color in the entity detail
      - each tag link of a live contact becomes an accepted tagged-as assertion with user provenance, using the link's creation time as knowledge time when known (otherwise the current time)
      - tags whose names differ only by case abort the whole run before any node is created, listing the collisions for the operator to resolve
      - a link referencing an unknown tag, or a contact missing its person node, fails the run loudly rather than skipping silently
      - links of soft-deleted contacts are skipped and counted
      - a re-run is idempotent (deterministic locators corroborate)
    provenance: [TagMigrationService, ErrTagCaseCollision, assertTaggedAs, crm-admin --migrate-tags]
    notes: Live tag CRUD does not currently dual-write tagged-as assertions — the graph mirror exists only via this migration. Deliberate phasing, with the graph consuming tags in a later phase.

  # --- Surfaces ---

  - id: KNW-033
    title: Knowledge reaches the user only through the contact's derived fields
    type: invariant
    status: retired
    surface: api
    statement: no HTTP endpoint exposes assertions, graph nodes, edges, predicates, or provenance — the assertion store is invisible to clients, and the only client-visible projection of the knowledge graph is the contact payload's derived location, birthday, and how-met fields.
    provenance: [cmd/crm-api/main.go SP1 no-handler comment, contact_dto.go]
    notes: Retired when the drill-down began showing the assertions that cite its content. KNW-038 replaces it, naming the one HTTP read of the assertion store.

  - id: KNW-034
    title: Contact detail shows knowledge fields only when known
    type: ux
    status: current
    surface: ui
    given: a contact detail page
    when: the profile section renders
    then:
      - key: known-location-appears-labeled
        text: a known location appears as a labeled row; an unknown location renders no row at all
      - key: known-birthday-appears-labeled
        text: a known birthday appears as a labeled, human-readable date row; an unknown birthday renders no row
    provenance: ["contacts/[id]/page.tsx knowledge rows"]

  - id: KNW-035
    title: Year-less birthdays display without a year or age
    type: ux
    status: current
    surface: ui
    given: a contact whose birthday was stored with the placeholder year that marks a year-less (imported) birthday
    when: the birthday is displayed on any surface
    then:
      - key: date-renders-month-day
        text: the date renders as month and day only, with the placeholder year never shown
      - key: no-age-computed-displayed
        text: no age is computed or displayed for it
    provenance: [formatBirthday, isPlaceholderBirthday, birthdays.spec.ts placeholder assertions]
    notes: The placeholder-year sentinel convention and the year-less rendering (formatBirthday drops the year on every surface — contact detail per KNW-034, the birthdays page, etc.) are the knowledge-domain derived-data concern owned here. Because no real year is stored there is no year to derive an age from; the landed CON-045 owns the birthdays-page display of that age-suppression outcome. The two are consistent, not competing — this row does not claim authority over CON-045.

  - id: KNW-036
    title: Interaction nodes are structural nodes in the registry
    type: data
    status: current
    surface: none
    given: an observation of a correctable source is recorded
    when: its interaction node is resolved
    then:
      - key: structural-registry-type
        text: the node is a registry node of type interaction with its own subtype record carrying its source and persisted identity key
      - key: written-by-recording-path
        text: the recording path writes the node itself, never through the assertion store, the predicate catalog, or provenance
      - key: one-node-per-identity
        text: at most one node exists for a persisted source and identity key, while a node with no key belongs to one observation
      - key: observation-names-only-interaction-node
        text: an observation can name only an interaction node, never a person, venue, or entity node
      - key: merge-alias
        text: an interaction node merged into another aliases its winner through the registry's merge alias, keeps no tombstone, and moves no assertion; an alias, once set, never changes
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: Interaction nodes join the structural tier beside venues and entities. Corrections and claims about an interaction attach to the node in later behaviors of this domain.

  - id: KNW-037
    title: Corrections of interactions are user assertions and interaction-node merges
    type: business-logic
    status: current
    surface: none
    given: the user corrects interactions, by removing participants or merging interactions
    when: the correction is recorded
    then:
      - key: removal-of-named-attendees-is-edge
        text: removing a contact from a judged interaction node is an accepted assertion from the contact's person node to that node that the contact did not take part
      - key: removal-for-everyone-is-fact
        text: removing everyone from a judged interaction node is an accepted assertion on that node that it is removed for every participant, present and later-observed
      - key: merge-is-alias-plus-declaration
        text: merging one interaction into another aliases the merged-away root node to the winning root node and adds an accepted assertion that the merged-away root is the same interaction as the winner
      - key: user-provenance-per-act
        text: each correction assertion carries one user provenance locator naming the correction act, shared by every assertion that act writes
      - key: reason-readable-per-removal
        text: each removal assertion's provenance records the user's reason (duplicate, did not attend, did not happen) as a value a read can filter by
      - key: judged-members-and-scope-stay-readable
        text: the judged nodes, members and scope stay readable after any later merge, because a correction stays bound to the node it judged and a merge never rewrites an alias or an assertion
      - key: raw-evidence-survives
        text: no correction changes or removes an observation or a content row
    provenance: [.agents/spec/2026-10-13-interaction-review-readiness.md]
    notes: The correction predicates are marked in the predicate catalog, the one source of that set. Effective participation derives from observations, merge aliases and these accepted assertions alone (IXN-016, IXN-017, IXN-018); a proposed, rejected or retracted correction excludes nothing.

  - id: KNW-038
    title: HTTP reads the assertion store only beside the content a timeline drill-down displays
    type: invariant
    status: current
    surface: api
    statement: the only HTTP endpoints that expose assertions, graph nodes, edges, predicates, or provenance are the read-only timeline item assertions read, which returns the non-correction assertions whose provenance cites content a timeline item's drill-down displays, and the bench's judgment routes (KNW-049, KNW-050), which read decision-model judgments and record the user's reviews; the contact payload's derived location, birthday, and how-met fields remain a client-visible projection of the store.
    provenance: [TimelineAssertionService, RegisterContactRoutes, contact_dto.go, RegisterJudgmentRoutes]
    notes: Supersedes KNW-033. What the read returns is IXN-039; its rendering beside the content is IXN-023.

  # --- Decision-model judgments ---

  - id: KNW-043
    title: A judgment is recorded as SP1 assertions with extractor provenance, once per method version, input and what it read
    type: data
    status: current
    surface: none
    given: a decision-model method's judgment of one thread at one cut-off
    when: a run records it
    then:
      - key: answer-per-outcome-node
        text: each outcome the method chose is an assertion about its own outcome node, with extractor provenance naming the method version and the input hash
      - key: record-reads-back
        text: the judgment reads back with its method key, version and wording version, run, cut-off, execution time, usage, input hash, every option's probability, the model's original answer and the question ID each outcome answers
      - key: unreported-usage-absent
        text: billed tokens and cost the source did not report read back absent, not zero
      - key: agreeing-methods-stay-two
        text: two methods agreeing on one input stay two judgments, and the accepted fact (an obligation's task, a flag) is a record apart from the judgments behind it
      - key: one-per-method-version-and-input
        text: a method version holds at most one judgment per thread, input hash and what it read (KNW-062); a run that meets it again records it at its own cut-off and lists it among its threads, sending nothing
    provenance: [judgment.Store.RecordJudgment, judgment.Store.ReuseJudgment, 092_judgment_store.up.sql, .agents/spec/2026-10-14-decision-model-extraction.md G4 HC4 HC10]

  - id: KNW-044
    title: The apply rule is catalog data the shared assertion write path enforces
    type: business-logic
    status: current
    surface: none
    given: a judgment that can change live state (KNW-045)
    when: each of its outcomes lands
    then:
      - key: addition-at-threshold-applies
        text: an addition (it opens an obligation, raises a big-moment flag or moves a date earlier) at or above the catalog's confidence threshold, 0.5, takes effect at once
      - key: addition-below-threshold-claim
        text: an addition below the threshold lands as a claim, with no task and no flag
      - key: removal-always-claim
        text: a removal (it would close an obligation, end an awaiting-reply wait or move a date later) always lands as a claim and leaves the obligation, the wait and the date as they were
      - key: omission-is-claim
        text: a judgment that omits a party's open obligation whose evidence lies inside the judgment's window (CAD-061) raises a claim for it and leaves it open
      - key: no-effect-applied
        text: an outcome that changes nothing reads applied at any confidence
      - key: big-moment-flags-distinguishable
        text: an applied big-moment outcome raises a flag on the thread, a participant's moment and another person's moment read apart
      - key: catalog-alone-decides
        text: the landing comes from the judgment predicates' catalog rows alone; no request field, forced confirmation included, changes it, so loosening the rule is a catalog edit
    provenance: [AssertService landsAccepted, 093_judgment_predicates.up.sql, judgment.Store.landTx, .agents/spec/2026-10-14-decision-model-extraction.md G6 HC5 NG9 SC6 SC8 SC10]

  - id: KNW-045
    title: Only the production method's current judgments in scheduled and historical runs change live state
    type: business-logic
    status: current
    surface: none
    given: a judgment appearing in a run
    when: the appearance is recorded
    then:
      - key: designation-from-setting
        text: the production method is the key DECISION_PRODUCTION_METHOD names; unset or empty designates none
      - key: others-are-evidence
        text: another method's judgments, rerun runs and every judgment recorded while no method is designated are evidence, opening, raising and closing nothing
      - key: not-current-is-evidence
        text: a judgment whose cut-off precedes the thread's latest content is evidence
      - key: effect-decided-by-appearing-run
        text: whether an appearance changes live state is decided by the run it appears in, and an effect applied once is never applied again
    provenance: [judgment.Store.changesLiveState, config.DecisionConfig, .agents/spec/2026-10-14-decision-model-extraction.md HC7 "only a current judgment opens an obligation"]

  - id: KNW-046
    title: A review states the right outcome and the verdict is derived from it
    type: business-logic
    status: current
    surface: none
    given: a judgment outcome in any state
    when: the user reviews it with a right outcome
    then:
      - key: review-is-user-assertion
        text: the review is an assertion with user provenance holding the right outcome
      - key: verdict-derived
        text: the verdict is confirmed when the right outcome equals the judged one, rejected when it differs and has no effect, corrected when it differs and has an effect
      - key: live-review-gives-right-effect
        text: reviewing an applied or claim outcome gives the thread the right outcome's live effect, so confirming a claim applies it and rejecting an applied addition withdraws it; that effect acts on the contact the outcome's contact became through any contact merge, and closes no obligation other than the one the outcome's live effect is
      - key: evidence-review-labels-only
        text: reviewing an evidence outcome records the label and changes no live state
      - key: invalid-right-outcome-refused
        text: an empty right outcome, or one not among the question's outcome values, is refused and nothing is recorded
    provenance: [judgment.Store.ReviewOutcome, .agents/spec/2026-10-14-decision-model-extraction.md G5 G8]

  - id: KNW-047
    title: The user's verdict wins over a later judgment of the same input
    type: business-logic
    status: current
    surface: none
    given: an input the user reviewed
    when: a later judgment of the same thread and input hash lands
    then:
      - key: rejected-answer-not-reproposed
        text: an answer the user rejected is never proposed again
      - key: correction-not-overwritten
        text: another method's or version's outcome on the reviewed question is evidence and never overwrites the user's correction
      - key: changed-content-reopens
        text: changed content, a new input hash, reopens the question
    provenance: [judgment.Store.landTx, .agents/spec/2026-10-14-decision-model-extraction.md HC6 SC9]

  - id: KNW-048
    title: Example IDs are opaque and the export reads carry no content or identities
    type: data
    status: current
    surface: none
    given: judgments, runs and reviews in the store
    when: the scorecard and export reads run
    then:
      - key: one-opaque-example-id
        text: the store issues one example ID per thread and input hash, random, so it carries no thread or contact ID and only the store maps it back
      - key: reviewed-examples-label-every-method
        text: each reviewed example lists the user's latest right outcome per question and contact, labelling that input for every method; a method's outcomes are read by example, and an example the method did not judge is absent
      - key: export-records-content-free
        text: finished runs, the judgments appearing in a run (reused ones included) and the reviews are keyed by example ID and question ID, with no thread content, thread ID or contact ID
    provenance: [judgment.Store.ReviewedExamples, judgment.Store.OutcomesFor, judgment.Store.FinishedRuns, judgment.Store.JudgmentRecords, judgment.Store.ReviewRecords, .agents/spec/2026-10-14-decision-model-extraction.md G12 G15]

  - id: KNW-049
    title: The review route records a right outcome and returns the derived verdict
    type: api
    status: current
    surface: api
    given: a judgment outcome
    when: POST /api/v1/judgment-outcomes/:id/review is called with a right_outcome
    then:
      - key: review-returns-derived-verdict
        text: the response is the updated outcome with the verdict the server derived from the right outcome
      - key: invalid-right-outcome-refused
        text: a missing or empty right_outcome, or one not among the question's outcome values, is refused with 400 and nothing is recorded
      - key: unknown-outcome-not-found
        text: an unknown outcome is 404
      - key: client-verdict-ignored
        text: a verdict the client sends is never stored; the server derives it
    provenance: [JudgmentHandler.ReviewJudgmentOutcome, judgment_routes.go]

  - id: KNW-050
    title: The bench reads list runs and the judgments of a thread or run
    type: api
    status: current
    surface: api
    given: judgments recorded in runs
    when: GET /api/v1/judgment-runs or GET /api/v1/judgments is called
    then:
      - key: runs-listed
        text: the runs read returns every run with its kind, method, window, start and finish, judged count (reused judgments included) and incomplete threads with cut-off and reason
      - key: judgments-by-thread-or-run
        text: the judgments read returns the judgments for thread_id, run_id or both, each with its first appearance's cut-off, every run it appears in at that run's cut-off, its method and context kind
      - key: outcome-state-and-review
        text: each outcome carries its question, contact (none for a big moment), outcome, confidence, due date, state (applied, claim or evidence) and review
      - key: unbounded-or-malformed-refused
        text: a judgments request with neither parameter, or a malformed ID, is refused with 400
    provenance: [JudgmentHandler.ListJudgmentRuns, JudgmentHandler.ListJudgments, judgment_dto.go]

  # --- Judgment runs ---

  - id: KNW-051
    title: A historical run judges, at each simulated nightly cut-off, the threads that gained content since the previous one
    type: business-logic
    status: current
    surface: none
    given: a historical run of one method over a chosen range of days, its first and last day included
    when: the run executes
    then:
      - key: nightly-cut-offs
        text: the run's cut-offs are the midnights, in the server's timezone, that close each day of the range, and no others
      - key: gained-content-eligible
        text: a thread is judged at a cut-off exactly when it has content after the previous cut-off and up to and including this one, the first window opening at the range's first midnight, so a thread with content on two nights is judged at both and a thread whose only content precedes or follows the range is not judged
      - key: whole-content-context
        text: each judgment reads its window of the thread's content up to its cut-off (KNW-055), content from before the range included
      - key: writes-as-production
        text: each judgment and incomplete report is recorded through the judgment store as a production run's would be, so the production method's current judgments change live state
    provenance: [judgerun.Runner.Historical, judgerun.eachEligible, judgerun.Days.CutOffs, crm-admin --judge-start-day --judge-end-day, .agents/spec/2026-10-14-decision-model-extraction.md G10 SC1 "historical runs simulate the production schedule"]

  - id: KNW-052
    title: Every eligible thread of a run ends with a recorded judgment or an incomplete report
    type: business-logic
    status: current
    surface: none
    given: a thread a run must judge at a cut-off
    when: the run judges it
    then:
      - key: judged-or-incomplete
        text: the thread ends with a recorded judgment or an incomplete report naming its reason; none is skipped, and a failure the run cannot report stops the run with an error
      - key: failed-calls-retried
        text: a failed call is asked again, three attempts in all, before the thread is reported call_failed
      - key: over-limit-context-windowed
        text: a context over the method's limits is judged over its window (KNW-055) and is not reported incomplete for its size
      - key: message-over-limit-unsent
        text: a context whose newest message alone exceeds the method's limits is reported message_over_limit without being sent
      - key: summary-counts-both
        text: the run's summary counts the eligible thread contexts and how each ended, judged, reused or incomplete by reason
    provenance: [judgerun.Runner.judge, judgerun.judgeWithRetries, .agents/spec/2026-10-14-decision-model-extraction.md G11 HC11 SC1]

  - id: KNW-053
    title: A run sends each thread context at most once per method version and input
    type: business-logic
    status: current
    surface: none
    given: a thread context a run would send to its method
    when: the run's method version already holds a judgment of that thread and input hash that read the same (KNW-062)
    then:
      - key: reused-not-sent
        text: the run reuses that judgment through the store and sends nothing, so repeating a run over the same days sends nothing
      - key: group-once-per-cut-off
        text: a group thread is sent once per cut-off per method, never once per member
      - key: rerun-reviewed-examples
        text: a rerun replays each reviewed example's thread, as an evidence-only run, from the start of the run the reviewed judgment appeared in (KNW-062), in place of judging it at the example's cut-off alone, reusing any judgment that read the same, and reports an example whose rebuilt input differs as input_changed
    provenance: [judgerun.Runner.judge, judgerun.Runner.Rerun, judgment.Store.ReuseJudgment, .agents/spec/2026-10-14-decision-model-extraction.md HC10 SC9]

  - id: KNW-054
    title: Runs check the production designation before any call and report content-free without blocking
    type: business-logic
    status: current
    surface: none
    given: a historical or measuring run started from crm-admin --judge-start-day and --judge-end-day
    when: the run starts and finishes
    then:
      - key: unknown-designation-fails
        text: a production designation naming a key the method registry lacks fails before any call, and a run with no designation proceeds and changes no live state
      - key: malformed-range-refused
        text: the month flag the day flags replaced is refused as an unknown flag, and a range naming only one of the two day flags, a malformed day or a last day before its first, or a range without --method, is refused before any call
      - key: measuring-run-sends-nothing
        text: a measuring run builds every context a historical run of the range would judge, with the method's question tree, sends nothing, writes no judgment, run or live state, and reports how many contexts it built, the distribution of their token and question counts against the method's limits and how many exceed a limit
      - key: summary-reports-live-effects
        text: a historical run's summary reports the obligations it opened, the flags it raised and the claims it raised
      - key: summary-counts-unjudged
        text: a historical run's summary counts the new messages left unjudged, by reason (KNW-058)
      - key: content-free-never-blocking
        text: run output holds only IDs, counts, probabilities and reasons, and no run refuses or stops on a size or a count
    provenance: [judgerun.New, judgerun.Runner.Measure, judgerun.Summary, crm-admin --judge-start-day --judge-end-day --measure, .agents/spec/2026-10-14-decision-model-extraction.md HC1 HC7 G15 "Assumptions & deferred questions"]

  # --- Message flags and windows ---

  - id: KNW-055
    title: A thread context over a method's limits is judged over its window
    type: business-logic
    status: current
    surface: none
    given: a thread context built for a method at a cut-off
    when: the method judges it
    then:
      - key: fits-whole-sent-whole
        text: a context that fits the method's limits is its own window and is sent whole
      - key: over-limit-judged-over-window
        text: a context over the limits is judged over its window, the newest whole messages ending at the cut-off whose text and every question fit the method's limits, when that window holds every message new at the cut-off; a night whose new messages it cannot hold is judged in chunks (KNW-068)
      - key: no-message-split
        text: no message is split, so a window starts at a message boundary
      - key: newest-message-over-limit-incomplete
        text: a context whose newest message alone exceeds the limits is reported incomplete with reason message_over_limit and nothing is sent
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G1 T1]

  - id: KNW-056
    title: A cut-off's content leaves once per thread context per method
    type: business-logic
    status: current
    surface: none
    given: a thread context a method judges at a cut-off
    when: the method asks its questions
    then:
      - key: one-call-carries-every-question
        text: the cut-off's content leaves in one call that carries every flag, clearing and ball-in-court question
      - key: over-question-limit-fewest-further-calls
        text: when the questions exceed the method's question limit, the fewest further calls over the same window carry the rest
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G1 HC1]

  - id: KNW-057
    title: A judgment flags each new message once per flag kind
    type: business-logic
    status: current
    surface: none
    given: a method judging a thread context at a cut-off
    when: the judgment is recorded
    then:
      - key: decision-per-kind-per-new-message
        text: the judgment holds one flag decision per flag kind (commitment, big moment, claim) for each new message in its window, with its probability whatever the display threshold
      - key: none-for-earlier-new-message
        text: the judgment holds no flag decision for a message that was new at an earlier cut-off
      - key: first-judged-cut-off-all-new
        text: at a thread's first judged cut-off in the method version's history, a cut-off with no judgment of the thread by that version, judged or reused, at an earlier cut-off, every message in the window is new
      - key: failed-first-cut-off-carries-forward
        text: a cut-off reported incomplete records no judgment, so when a thread's first cut-off fails, every message in the window of the next cut-off judged is new there
      - key: later-cut-off-new-since-previous-scheduled
        text: at any later cut-off the new messages are those after the previous scheduled cut-off (the nightly cut-off immediately before) and at or before this one
      - key: meeting-notes-flagged-no-ball-in-court
        text: meeting notes are flagged and asked no ball-in-court question
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G2 T2 T3 T4 A1]

  - id: KNW-058
    title: A new message no judgment answered is recorded unjudged, never as a no
    type: business-logic
    status: current
    surface: none
    given: a new message that no judgment of a method answered
    when: the cut-off's run ends
    then:
      - key: recorded-unjudged-with-reason
        text: the message is recorded unjudged with its reason, call_failed or message_over_limit; a new method version records none before_window (KNW-071), and a record of an earlier version carrying before_window still reads as unjudged
      - key: counted-unjudged-never-no
        text: the message is counted as unjudged and never as a no
      - key: rerun-judges-it
        text: rerunning its cut-off judges it
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G2 T5b SC10]

  - id: KNW-059
    title: A method re-checks its own earlier commitments and clears the done ones
    type: business-logic
    status: current
    surface: none
    given: a commitment flag decision of the method's own, above the method's clearing floor, whose message lies inside the window of a later cut-off's judgment and which the method has not cleared
    when: the method judges that later cut-off
    then:
      - key: rechecked-and-recorded
        text: the method re-checks the commitment and records its answer as a clearing decision
      - key: cleared-once-answered-done
        text: a commitment is cleared once one of its clearing decisions answers done
      - key: outside-window-neither-cleared-nor-kept
        text: a commitment whose message lies before the window is not re-checked, and that judgment neither clears nor keeps it
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G3 T5a A2]

  - id: KNW-060
    title: Flag decisions, clearing decisions and unjudged messages change no live state
    type: business-logic
    status: current
    surface: none
    given: a flag decision, a clearing decision or an unjudged message, whatever its probability
    when: it is recorded
    then:
      - key: opens-nothing
        text: it opens no task or obligation and raises no flag or claim on live state
      - key: closes-and-changes-nothing
        text: it closes or changes no task, obligation or live flag
      - key: reply-obligations-keep-apply-rule
        text: ball-in-court's reply obligations still follow the apply rule (KNW-044) within the window rules (CAD-061)
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G5 HC2]

  - id: KNW-061
    title: A new method version asks only flag, clearing and ball-in-court questions
    type: business-logic
    status: current
    surface: none
    given: a new method version
    when: it judges a thread context
    then:
      - key: asks-only-flag-clearing-ball-in-court
        text: it asks only flag, clearing and ball-in-court questions
      - key: no-whole-thread-questions
        text: it asks no whole-thread commitment, date, source-message or big-moment question
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G7]

  - id: KNW-062
    title: A run replays cut-offs in order and reuses a judgment only when what it read is the same
    type: business-logic
    status: current
    surface: none
    given: a run of a method, the scorecard's rerun included
    when: the run judges its cut-offs
    then:
      - key: cut-offs-in-order-from-start
        text: the run judges its cut-offs in order from the run's start
      - key: reuse-only-when-read-same
        text: the run reuses a recorded judgment only when what it read is the same, meaning its window, its new messages and the earlier judgments it re-checked
      - key: different-read-judged-anew
        text: a context whose recorded judgments all read something different is judged anew
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md AD4]

  - id: KNW-063
    title: The store's reads return window starts, new messages, flag decisions, clearing decisions and unjudged counts
    type: data
    status: current
    surface: none
    given: judgments and runs recorded in the store
    when: the judgment reads and the run read run
    then:
      - key: judgment-reads-carry-window-and-decisions
        text: the judgment reads return each judgment's window start, new messages, flag decisions and clearing decisions
      - key: earlier-version-reads-back-empty
        text: a judgment of a method version from before windows and flags reads back with no new messages, flag decisions or clearing decisions, and its window starting at its context's first message
      - key: run-read-counts-unjudged-by-reason
        text: the run read returns each run's unjudged messages, counted by reason
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md AD1 G6 S1]

  - id: KNW-064
    title: The display threshold and the clearing floor are stored data with one source each
    type: data
    status: current
    surface: none
    given: the display threshold per method and flag kind and the clearing floor per method
    when: a threshold or a floor is read or changed
    then:
      - key: stored-with-one-source
        text: each is stored data with one source, and nothing else holds a copy
      - key: threshold-strictly-above-floor
        text: a method's display threshold is strictly above its clearing floor
      - key: threshold-change-needs-no-rerun
        text: changing a display threshold needs no rerun, since every probability is stored
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md AD3 S2]

  - id: KNW-065
    title: Every method's judgment of one thread context records the same example
    type: data
    status: current
    surface: none
    given: methods judging one thread context at one cut-off
    when: each records its judgment
    then:
      - key: one-example-per-context
        text: every method's judgment records one example, naming the thread and the full context's input hash
      - key: hash-of-full-context-whatever-window
        text: the input hash is that of the full context, whatever window the method read
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G1]

  - id: KNW-066
    title: The Langfuse export of window starts, flag decisions, clearing decisions and unjudged messages is content-free
    type: data
    status: current
    surface: none
    given: window starts, flag decisions, clearing decisions and unjudged messages recorded in the store
    when: the export sends them to Langfuse
    then:
      - key: new-records-exported
        text: the export sends window starts, flag decisions, clearing decisions and unjudged messages
      - key: no-text-sender-or-contact-identity
        text: they carry no message text, sender or contact identity
      - key: message-keys-opaque-candidates
        text: message keys travel as opaque candidates
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md G6 HC3]

  - id: KNW-067
    title: A method reads only its window and its own earlier judgments
    type: business-logic
    status: current
    surface: none
    given: a method judging a thread context at a cut-off
    when: its inputs are built
    then:
      - key: inputs-are-window-and-own-earlier-judgments
        text: its inputs are its window and its own earlier judgments
      - key: reads-no-review-or-label
        text: no method reads a review or a label, so methods stay comparable
    provenance: [.agents/spec/2026-10-18-message-flags-and-threads.md HC4 A2]

  # --- Chunked nights and the compared methods ---

  - id: KNW-068
    title: A night whose new messages overflow a window is judged in chunks
    type: business-logic
    status: current
    surface: none
    given: a thread at a cut-off after its first judged one, whose new messages no one window of the method holds
    when: the method judges the cut-off
    then:
      - key: fewest-chunks-earliest-first
        text: the night is judged in the fewest chunks that fit, in order from earliest to latest; a number of chunks is passed over only when no division of the new messages into that many, spread evenly, fits
      - key: window-is-chunk-and-older-context
        text: each chunk's window is its new messages preceded by as many older messages as fit beside the questions it asks, the commitments it re-checks among them, so a later chunk reads the earlier chunks' messages as context and its window is sized once the chunks before it have answered
      - key: spread-evenly
        text: the new messages are spread evenly over the chunks, their counts differing by at most one
      - key: flagged-once-in-its-chunk
        text: each new message is flagged once per flag kind, in its chunk
    provenance: [decision.method.Plan, decision.method.chunk, decision.method.spread, decision.method.window, .agents/spec/2026-10-18-message-flags-and-threads.md G15 SC11, decision 20261019T142354Z-73bbb941ef65]

