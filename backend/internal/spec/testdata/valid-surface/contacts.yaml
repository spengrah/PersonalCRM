domain: contacts
prefix: CON
maturity: reviewed
settled: [ui]
behaviors:
  - id: CON-001
    title: a ui-surface behavior with a waived then item
    type: ux
    status: current
    surface: ui
    when: an action elsewhere changes who is overdue
    then:
      - the list refreshes without a manual reload
      - key: refocus-rechecks-freshness
        text: refocusing the window re-checks freshness
    waivers:
      - then: refocus-rechecks-freshness
        reason: focus-driven freshness is not deterministically provable
  - id: CON-002
    title: a retired behavior needs no surface
    type: business-logic
    status: retired
    when: x
    then:
      - y
    notes: superseded by CON-001
  - id: CON-003
    title: an api-surface behavior
    type: api
    status: current
    surface: api
    when: x
    then:
      - y
  - id: CON-004
    title: an intent takes no surface
    type: intent
    status: current
    statement: the surface communicates who needs attention
  - id: CON-005
    title: an api-surface behavior with a waived then item
    type: api
    status: current
    surface: api
    when: the endpoint streams a large export
    then:
      - key: body-is-chunked
        text: the body is chunked
    waivers:
      - then: body-is-chunked
        reason: streaming chunk boundaries are not deterministically assertable
