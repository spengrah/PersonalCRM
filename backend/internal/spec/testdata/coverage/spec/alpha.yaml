domain: alpha
prefix: ALP
maturity: reviewed
behaviors:
  - id: ALP-001
    title: item-level citations and a waiver
    type: ux
    status: current
    surface: ui
    when: the list changes
    then:
      - key: list-refreshes
        text: the list refreshes
      - key: refocus-rechecks-freshness
        text: refocusing re-checks freshness
    waivers:
      - then: refocus-rechecks-freshness
        reason: focus-driven freshness is not deterministically provable
  - id: ALP-002
    title: a bare E2E citation covers every then item
    type: ux
    status: current
    surface: ui
    when: a row is opened
    then:
      - the detail route is reached
  - id: ALP-003
    title: an uncited ui behavior is an orphan
    type: ux
    status: current
    surface: ui
    when: a filter is applied
    then:
      - the request carries the filter param
  - id: ALP-004
    title: a ui invariant has one implicit item
    type: invariant
    status: current
    surface: ui
    statement: every list surface renders soft-deleted rows nowhere
  - id: ALP-005
    title: an api behavior tracks no ui coverage
    type: api
    status: current
    surface: api
    when: the endpoint is called
    then:
      - a 404 names the missing resource
  - id: ALP-006
    title: an intent is judge-only
    type: intent
    status: current
    statement: the surface communicates who needs attention
  - id: ALP-007
    title: a retired behavior
    type: ux
    status: retired
    when: x
    then:
      - y
  - id: ALP-008
    title: a proposed behavior is excluded from coverage
    type: ux
    status: proposed
    surface: ui
    when: x
    then:
      - y
  - id: ALP-009
    title: a waived item that is also cited is a stale waiver
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - key: stale-waiver-item
        text: y
    waivers:
      - then: stale-waiver-item
        reason: was thought unprovable
  - id: ALP-010
    title: a waived ui invariant has one implicit waivable item
    type: invariant
    status: current
    surface: ui
    statement: no surface ever renders a soft-deleted row
    waivers:
      - then: statement
        reason: a universally-quantified absence is not provable by one browser test
  - id: ALP-011
    title: a bare Go citation covers every api then item
    type: api
    status: current
    surface: api
    when: the endpoint is called with a valid body
    then:
      - a 200 carries the created resource
      - the location header names the new row
  - id: ALP-012
    title: an uncited api behavior is an orphan
    type: api
    status: current
    surface: api
    when: the endpoint rejects an unknown id
    then:
      - a 404 names the missing resource
  - id: ALP-013
    title: an api then item can be waived
    type: api
    status: current
    surface: api
    when: the endpoint streams a large export
    then:
      - key: body-is-chunked
        text: the body is chunked
    waivers:
      - then: body-is-chunked
        reason: streaming chunk boundaries are not deterministically assertable
  - id: ALP-014
    title: an api invariant is covered by a bare Go cite
    type: invariant
    status: current
    surface: api
    statement: every list endpoint filters soft-deleted rows
  - id: ALP-015
    title: a keyed Go citation covers only that api then item
    type: api
    status: current
    surface: api
    when: the endpoint validates the payload
    then:
      - a missing field yields a 400
      - key: error-body-names-field
        text: the error body names the field
  - id: ALP-016
    title: an api invariant can be waived by the reserved statement token
    type: invariant
    status: current
    surface: api
    statement: every endpoint enforces the api key
    waivers:
      - then: statement
        reason: blanket auth enforcement is owned by middleware tests, not per-endpoint
  - id: ALP-017
    title: a waived api item that is also cited is a stale waiver
    type: api
    status: current
    surface: api
    when: the endpoint returns a conflict
    then:
      - key: conflict-409-named
        text: a 409 names the conflicting row
    waivers:
      - then: conflict-409-named
        reason: was thought unassertable
  - id: ALP-018
    title: a none-surface behavior mints no coverage item
    type: business-logic
    status: current
    surface: none
    when: the reconciler runs
    then:
      - stale rows are pruned
