domain: contacts
prefix: CON
maturity: reviewed
behaviors:
  - id: CON-001
    title: waivers not a sequence
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - y
    waivers: nope
  - id: CON-002
    title: waiver item not a mapping
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - y
    waivers:
      - just a string
  # `then` must be a then-item key (a string), so this case is a node that is
  # not a scalar at all — a sequence, not a mistyped scalar.
  - id: CON-003
    title: waiver then is not a then-item key
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - y
    waivers:
      - then: [1]
        reason: r
  - id: CON-004
    title: waiver without a reason
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - key: outcome-y
        text: y
    waivers:
      - then: outcome-y
  - id: CON-005
    title: waiver reason not a string
    type: ux
    status: current
    surface: ui
    when: x
    then:
      - key: outcome-y
        text: y
    waivers:
      - then: outcome-y
        reason: 7
