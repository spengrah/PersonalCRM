    properties:
      is_group:
        type: boolean
      key:
        type: string
      kind:
        type: string
      label:
        type: string
    type: object
  handlers.WhatsAppBackfillResponse:
    properties:
      dropped_inline_chunks:
        description: |-
          DroppedInlineChunks counts bootstrap chunks the server delivered with
          history embedded inline against our explicit non-inline request. Those
          are dropped un-projected rather than persisted, so a non-zero count is a
          visible, accepted gap in backfill.
        type: integer
      failed:
        type: integer
      observed_floor_at:
        format: date-time
        type: string
      pending:
        type: integer
      processing:
        type: integer
      stale:
        description: |-
          Stale reports that these counts could not be refreshed and are the last
          good values (or zeros, when there has never been a good read). The status
          endpoint answers during an outage rather than hanging on it, so it says so
          instead of presenting a fabricated zero as fresh.
        type: boolean
    type: object
  handlers.WhatsAppChatResponse:
    properties:
      chat_jid:
        type: string
      chat_title:
        type: string
      chat_type:
        type: string
      effective_tracked:
        description: |-
          EffectiveTracked is what the gate would decide right now, override and
          member count together — the same predicate the live ingest path uses.
        type: boolean
      member_count:
        description: |-
          MemberCount is absent when WhatsApp never reported a size. The gate fails
          CLOSED on that, so such a chat is not tracked unless it is overridden.
        type: integer
      status:
        description: 'Status is the user''s override: auto, tracked, or ignored.'
        type: string
    type: object
  handlers.WhatsAppChatStatusRequest:
    properties:
      status:
        enum:
        - auto
        - tracked
        - ignored
        type: string
    required:
    - status
    type: object
  handlers.WhatsAppDisconnectResponse:
    properties:
      already_unlinked:
        description: |-
          AlreadyUnlinked is true when the device was confirmed gone server-side
          before the call, so no remote unlink was attempted.
        type: boolean
      forced:
        description: |-
          Forced is true when local credentials were cleared without server
          confirmation.
        type: boolean
      remote_unlinked:
        description: RemoteUnlinked is true when this call logged the device out server-side.
        type: boolean
      warning:
        description: Warning is set when the user must finish the unlink from their
          phone.
        type: string
    type: object
  handlers.WhatsAppIngestResponse:
    properties:
      unresolved_lid_peers:
        description: |-
          UnresolvedLIDPeers counts distinct peers OBSERVED whose phone number the
          integration could not recover from their WhatsApp-internal id. Such a
          peer cannot be matched to a contact automatically, so any message of
          theirs that is stored is stored without one and can reach a contact only
          through the import queue.

          It counts peers observed, not peers whose messages were stored — a sender
          in a group the size gate declines to track is counted too — so it is a
          measure of how much of the conversation graph cannot be attributed
          automatically, not a count of unattributed records or of messages.

          The count SATURATES at an internal cap (5000) rather than growing without
          bound, so a value at the cap means "at least this many" rather than
          exactly this many. The cap is far above any plausible personal address
          book, so in practice the number is exact.
        type: integer
    type: object
  handlers.WhatsAppPairRequest:
    properties:
      method:
        description: Method is "qr" or "phone".
        enum:
        - qr
        - phone
        type: string
      phone:
        description: Phone is required when Method is "phone", in E.164 form (+15551234567).
        type: string
    required:
    - method
    type: object
  handlers.WhatsAppPairingResponse:
    properties:
      expires_at:
        format: date-time
        type: string
      method:
        type: string
      pair_code:
        description: PairCode is the 8-character code the user types on their phone.
        type: string
      qr_code:
        description: QRCode is the raw whatsmeow code string; the client renders the
          image.
        type: string
    type: object
  handlers.WhatsAppStatusResponse:
    properties:
      backfill:
        $ref: '#/definitions/handlers.WhatsAppBackfillResponse'
      banned_until:
        format: date-time
        type: string
      configured:
        type: boolean
      connected_at:
        format: date-time
        type: string
      ingest:
        $ref: '#/definitions/handlers.WhatsAppIngestResponse'
      jid:
        type: string
      link_selector_persisted:
        description: |-
          LinkSelectorPersisted is present only once an account has been linked.
          False then means the record of WHICH device is linked could not be
          written, so a restart may not resolve it deterministically. The link
          itself is real and is deliberately not torn down.
        type: boolean
      missing:
        description: |-
          Missing names the dependency the integration is waiting on when State is
          not_ready, so the settings surface can say what is absent rather than
          only that something is.
        type: string
      pairing:
        $ref: '#/definitions/handlers.WhatsAppPairingResponse'
      phone_number:
        type: string
      push_name:
        type: string
      reason:
        description: |-
          Reason carries the machine-readable detail for not_ready, disconnected,
          disconnect_failed and error.
        type: string
      replaced_device_retained:
        description: |-
          ReplacedDeviceRetained reports a degraded device store: a re-link could not
          delete the device it replaced, so a stale session is still stored. The
          linked account is still resolved deterministically; the flag exists so the
          condition is visible rather than silent.
        type: boolean
      state:
        description: |-
          State is one of not_ready, not_paired, pairing, connecting, connected,
          reconnecting, disconnected, disconnect_failed, error.
        type: string
      terminal_reason_persisted:
        description: |-
          TerminalReasonPersisted is present only once a terminal disconnect has
          been taken. False then means the reason could NOT be durably recorded, so
          the decision will not survive a restart — which is precisely when a client
          needs to see it. Hence a pointer: a plain bool with omitempty would drop
          the field in exactly that case, and could not distinguish it from "no
          terminal decision has been taken".
        type: boolean
    type: object
