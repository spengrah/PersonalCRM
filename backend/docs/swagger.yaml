                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "500":
          description: Internal Server Error
          schema:
