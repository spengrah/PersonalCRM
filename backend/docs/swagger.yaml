  handlers.CreateContactRequest:
    type: object
  handlers.CreateInteractionRequest:
    properties:
      description:
        type: string
      direction:
        type: string
      occurred_at:
        type: string
    type: object
  handlers.CreateManualTaskRequest:
    properties:
