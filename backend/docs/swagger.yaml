  /whatsapp/auth:
    delete:
      description: Unlink the WhatsApp device. Local credentials are kept when the
        remote unlink fails, so the user can retry; ?force=true clears them locally
        without contacting WhatsApp and returns a warning that the device must be
        unlinked from the phone.
      parameters:
      - description: Clear local credentials without contacting WhatsApp
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.WhatsAppDisconnectResponse'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "499":
          description: ""
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "502":
          description: Bad Gateway
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
      summary: Disconnect WhatsApp
      tags:
      - whatsapp
  /whatsapp/auth/cancel:
