  /whatsapp/chats/{chat_jid}:
    patch:
      consumes:
      - application/json
      description: 'Set one chat''s tracking override to auto, tracked or ignored.
        The chat must already have been observed — an override is a decision about
        a discovered chat, never a way to create one — so an unknown chat is a 404.
        Flipping a chat to tracked does NOT backfill it: WhatsApp history is delivered
        once, at link time, and messages the gate declined were never stored.'
      parameters:
      - description: Chat JID
        in: path
        name: chat_jid
        required: true
        type: string
      - description: Tracking override
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.WhatsAppChatStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
