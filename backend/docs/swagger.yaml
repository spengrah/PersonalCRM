  /whatsapp/auth/start:
    post:
      consumes:
      - application/json
      description: Begin linking a WhatsApp account by QR code or phone pairing code.
        The first code is returned in the status body; poll GET /whatsapp/auth/status
        for refreshed codes.
      parameters:
