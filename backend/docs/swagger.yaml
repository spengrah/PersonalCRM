  /contacts:
    get:
      description: Get a paginated list of contacts with optional search and sorting.
        Use ids_only=true to get just IDs for navigation.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Search term (name or contact methods)
        in: query
        maxLength: 255
        name: search
        type: string
      - default: '""'
        description: Sort by field
        enum:
        - name
        - location
        - birthday
        - last_contacted
        - last_response_at
        - contact_by
        - cadence
        in: query
        name: sort
        type: string
      - default: '"asc"'
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - default: false
        description: Return only contact IDs (for navigation)
        in: query
        name: ids_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Contacts retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handlers.ContactResponse'
                  type: array
                meta:
                  $ref: '#/definitions/api.Meta'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/api.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/api.APIError'
              type: object
      summary: List contacts
      tags:
      - contacts
    post:
      consumes:
      - application/json
      description: Create a new contact with the provided information
      parameters:
      - description: Contact information
        in: body
        name: contact
        required: true
