  handlers.SeedDeclaredFailure:
    properties:
      cleaned:
        type: boolean
      namespace:
        type: string
    type: object
  handlers.SeedDeclaredRequest:
    properties:
      behavior_id:
        description: BehaviorID is a spec behavior id (e.g. "CAD-026").
        maxLength: 64
        minLength: 1
        type: string
      namespace:
        description: |-
          Namespace isolates this fixture's rows. It may not end in the reserved
          -sN re-salt suffix, and it stops short of the 60-character token limit so
          that a re-salted EFFECTIVE namespace still fits — see
          declare.maxRequestedNamespaceLen, which this bound mirrors and
          TestSeedDeclaredEndpoint_MaxLengthNamespaceResalts holds it to.
        maxLength: 57
        minLength: 1
        type: string
      seed:
        description: Seed overrides the generator seed; 0 or absent uses the default.
        type: integer
    required:
    - behavior_id
    - namespace
    type: object
  handlers.SeedDeclaredResponse:
    properties:
      anchor:
        description: Anchor is the generator anchor the world was built against.
        type: string
      entities:
        additionalProperties:
          $ref: '#/definitions/handlers.SeededEntityResponse'
        description: Entities maps declaration handle → created row.
        type: object
      namespace:
        description: |-
          Namespace is the EFFECTIVE namespace, which may carry a -sN suffix the
          caller never asked for. Assertions must key off this, never the request.
        type: string
    type: object
  handlers.SeededEntityResponse:
