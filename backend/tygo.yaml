# Generates frontend TypeScript API types from the Go structs that actually
# serialize the wire payloads (the swagger docs are stale Swagger 2.0 and not
# a viable source of truth). Regenerate with `make api-types`; CI fails on
# drift between these Go structs and the committed generated files.
#
# Incremental adoption: currently covers the api envelope + the contact
# domain. Migrate further domains by widening the handlers include_files
# list and re-pointing the corresponding frontend/src/types/* file at the
# generated output.
packages:
  - path: 'personal-crm/backend/internal/api'
    output_path: '../frontend/src/types/generated/api-envelope.ts'
    include_files:
      - 'response.go'
    fallback_type: 'unknown'
    type_mappings:
      time.Time: 'string'
  - path: 'personal-crm/backend/internal/api/handlers'
    output_path: '../frontend/src/types/generated/contact.ts'
    include_files:
      - 'contact_dto.go'
      - 'interaction_dto.go'
      - 'judgment_dto.go'
    type_mappings:
      time.Time: 'string'
    frontmatter: |
      import type { AssertionStatus } from './assertion'
      import type { BallInCourt, BigMoment, CommitmentState, IncompleteReason, OutcomeState, Question, RunKind, Verdict } from './judgment'
      // ContactMethodType mirrors the `oneof` validation on
      // ContactMethodRequest.Type (backend/internal/api/handlers/contact.go);
      // referenced from Go via tstype tags.
      export type ContactMethodType =
        | 'email'
        | 'phone'
        | 'telegram'
        | 'signal'
        | 'discord'
        | 'twitter'
        | 'gchat'
        | 'whatsapp'
      export type InteractionDirection = 'outbound' | 'inbound' | 'mutual';
      export type InteractionContentKind = 'messages' | 'meeting_note' | 'call' | 'none';
      export type InteractionVenueKind = 'group_chat' | 'dm' | 'email_thread';
      export type CallService = 'voice' | 'facetime_audio' | 'facetime_video';
      export type CallDirection = 'inbound' | 'outbound';
      export type TimelineItemKind = 'interaction' | 'message_burst' | 'upcoming_event' | 'missed_call';
  - path: 'personal-crm/backend/internal/repository'
    output_path: '../frontend/src/types/generated/assertion.ts'
    include_files:
      - 'assertion_status.go'
    enum_style: 'union'
  - path: 'personal-crm/backend/internal/judgment'
    output_path: '../frontend/src/types/generated/judgment.ts'
    include_files:
      - 'values.go'
    enum_style: 'union'
