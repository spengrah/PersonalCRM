name: Deploy Mac Daemon

# Promotion-triggered Mac daemon deploy. Fires ONLY on push to main (the
# coordinator fast-forwards main to a reviewed develop SHA). It sits INERT on
# develop and on every PR — no develop or pull_request trigger — so fork code
# never reaches the self-hosted Mac runner.
#
# A separate workflow from deploy-prod.yml (NOT a job there) on purpose: a Mac
# job in deploy-prod.yml would inherit its `concurrency: deploy-pi` group, so a
# queued/slow Mac run could stall or supersede a Pi deploy. This workflow gets
# its OWN concurrency group instead.
#
# A thin TRIGGER — it does NOT build, sign, or install. A GitHub Actions
# self-hosted-runner job runs inside an isolated security session
# (SessionCreate=true on the runner's LaunchAgent) that cannot reach the user's
# login Keychain, so `codesign` against the local self-signed identity fails.
# Instead the job runs the installed trigger-mac-deploy.sh, which
# `launchctl kickstart`s the login-session reconcile TIMER. The design's central
# bet is that launchd then runs the timer's reconcile in the TIMER's LOGIN
# session (not the runner's isolated session), where codesign is EXPECTED to
# work — that crossing is validated by the Bucket-B supervised dry-run, not
# proven by this workflow. The timer's reconcile does the real work (fetch +
# CI gate + relevance gate + build + codesign + install + health + ntfy).
# The runner makes NO gh calls (the CI gate now runs only inside the timer-fired
# reconcile, using the user's gh keyring auth), needs NO checkout, NO marketplace
# actions, and NO sudo — the whole step is userland, run as the logged-in user.
#
# Fire-and-forget: kickstart returns as soon as launchd accepts the start, so a
# GREEN run here means "the trigger was sent", NOT "the deploy succeeded". The
# real deploy result is on ntfy + the timer's reconcile-stderr.log. The timer
# MUST be loaded (make setup-mac-deploy) for kickstart to have a target — it is
# now load-bearing for on-promote deploys, not just the offline catch-up.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-mac             # its OWN group — never shares deploy-pi
  cancel-in-progress: false     # a new promote queues behind a running deploy;
                                # reconcile-to-main makes the queued run converge to latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, mac]
    environment: production       # the production Environment enforces the main-only rule
    steps:
      - name: Kickstart the login-session reconcile timer
        # The installed trigger path contains a space ("Application Support").
        # In a YAML `run:` the outer quotes are YAML string syntax and are
        # STRIPPED before the shell sees the command — a single-line
        # `run: "$HOME/.../trigger-mac-deploy.sh"` would leave the shell an
        # unquoted, space-bearing path that it word-splits ("no such file"). The
        # `run: |` block scalar below preserves the literal shell quotes so the
        # shell receives a properly-quoted path. The path is the stable install
        # location written by `make setup-mac-deploy` (scripts/setup-mac-deploy.sh).
        #
        # The `[ -x ]` guard fails RED with an actionable message if the trigger
        # script is not installed yet (the expected, benign bootstrap artifact on
        # the FIRST promote after this redesign lands — see the runbook's
        # promote-first rollout sequence: run `make setup-mac-deploy` on the Mac,
        # which installs it).
        run: |
          TRIGGER="$HOME/Library/Application Support/crm-mac-deploy/bin/trigger-mac-deploy.sh"
          [ -x "$TRIGGER" ] || { echo "trigger script not installed — run make setup-mac-deploy on the Mac"; exit 1; }
          "$TRIGGER"
