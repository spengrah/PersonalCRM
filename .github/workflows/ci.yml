name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Detect which paths changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mac_daemon: ${{ steps.filter.outputs.mac_daemon }}
      spec: ${{ steps.filter.outputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ./path-filters.yml
      - name: Check path-filters parity
        run: bash scripts/ci/path-filters-parity-guard.sh
      # The local promote pre-flight and this repo's prod deploy gate must agree
      # on "green"; they cannot share code (deploy-prod.yml runs with no checkout).
      - name: Check promote gate parity
        run: bash scripts/ci/promote-gate-parity-guard.sh

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # Rolling Go module download cache. Per-job primary key (trailing token)
      # so the three parallel Go jobs never race to save the same key, with a
      # shared restore-keys prefix so they still restore each other's identical
      # module set (on subsequent runs; saves land post-job, so this warms a
      # sibling job on a LATER run, not the others running concurrently here).
      # go.sum-keyed: rolls only when dependencies change.
      - name: Cache Go module download cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-quality
          restore-keys: |
            go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-
            go-mod-${{ runner.os }}-go1.23-

      # Rolling Go build cache. SHA-keyed so every run misses its exact key and
      # saves a fresh entry; restore-keys brings the most recent prior build
      # cache forward so warmth compounds across CI runs. Namespaced per job
      # because each job has a distinct build config (arm64 cross-compile plus
      # amd64 lint/analysis here).
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-quality-${{ runner.os }}-go1.23-${{ github.sha }}
          restore-keys: |
            go-build-quality-${{ runner.os }}-go1.23-

      # The Makefile defaults GOCACHE to a workspace-local dir via `?=`, which
      # would bypass the restored ~/.cache/go-build for every make-driven Go
      # build. Pin GOCACHE to that warm dir so make-invoked builds reuse the
      # cache restored by the explicit actions/cache step above (setup-go's
      # built-in cache is disabled via `cache: false`). `go env GOCACHE`
      # returns the default ~/.cache/go-build here because GOCACHE is not set
      # in the shell env (the Makefile only exports it inside make).
      - name: Pin GOCACHE to the restored go-build cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          # No --timeout flag: inherit the single source in .golangci.yml (10m).

      - name: Check cadence sole-writer invariant
        run: ./scripts/check-cadence-sole-writer.sh

      - name: Check follow-up sole-writer invariant
        run: ./scripts/ci/followup-sole-writer-guard.sh

      - name: Check rematch sole-dispatcher invariant
        run: ./scripts/ci/rematch-sole-dispatcher-guard.sh

      - name: Check CRM-marker construction invariant
        run: ./scripts/ci/crm-marker-construction-guard.sh

      - name: Check sqlc SELECT-list duplication invariant
        run: ./scripts/ci/sqlc-select-list-guard.sh

      - name: Check ingest-registry descriptor invariant
        run: ./scripts/check-ingest-registry.sh

      - name: Cross-compile for ARM64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o bin/crm-api-arm64 ./cmd/crm-api

      - name: Cross-compile crm-admin for ARM64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        # crm-admin is built into the backend image at release time, not in
        # this CI job, so a compile error in the crm-admin package (e.g. a new
        # --seed subcommand type) would otherwise ship uncaught. This
        # cross-compile builds the package and guards it.
        run: go build -o bin/crm-admin-arm64 ./cmd/crm-admin

  # Lints the behavior SSOT corpus (spec/*.yaml). Gated on spec OR backend:
  # spec/** changes must lint the corpus, and the backend OR closes the drift
  # window where a linter-rule change (under backend/**, not touching spec/**)
  # invalidates the existing corpus and lands green. Deliberately minimal (no
  # module/build caches, no go mod download): `go run ./cmd/spec-lint` compiles
  # only the spec package's dependency closure (yaml.v3 + stdlib), so the cold
  # path is seconds.
  spec-lint:
    name: Spec Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.spec == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: spec-drift computes merge-base(HEAD, origin/develop),
          # which the default depth-1 checkout cannot resolve.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Run spec linter
        run: make spec-lint
      # Coverage scanner: citations live in backend tests AND frontend/tests/e2e,
      # so the frontend gate above matters — an E2E-only change can orphan or
      # dead-reference a behavior. Every domain lists ui in settled, so ui
      # orphans block; api orphans warn until a domain adds api to its settled
      # list; invalid citations always block.
      - name: Run spec coverage scanner
        run: make spec-coverage
      # Ensure origin/develop exists for spec-drift's merge-base. No `|| true`:
      # hiding a fetch failure would fail-open the drift check (it exits 2 when
      # it cannot resolve its base, which must surface as a red job).
      - name: Fetch develop for drift base
        run: git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
      # Behavior-drift advisory: warns (::warning:: annotations) when a
      # behavior's assertions changed but no citing test was touched. Warn-only
      # (green on drift); exit 2 only if the base cannot be resolved.
      - name: Run spec drift check
        run: make spec-drift

  # Guards drift between Go source and the two committed generated artifacts:
  #   - frontend types  (backend/tygo.yaml → frontend/src/types/generated/)
  #   - the Swagger spec (Go annotations   → backend/docs/)
  # Both share one job on purpose: each check takes ~2s, so a second job would
  # spend ~45s of runner setup to save nothing. Gated on backend OR frontend —
  # a backend DTO change regenerates differently, and a frontend hand-edit of a
  # generated file diverges from the source. The docs check does not need the
  # frontend trigger, but running it there costs ~2s and keeps one gate.
  # Deliberately minimal (no caches): both generators' dependency closures are
  # small, so the cold path is seconds.
  generated-artifacts-drift:
    name: Generated Artifacts Drift
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Check generated API types are in sync
        run: make api-types-check
      # Fails on stale output AND on outright generation failure — the latter is
      # how the spec silently rotted for three months (a type swag could not
      # resolve aborted the run, and nothing was watching the exit code).
      - name: Check generated API docs are in sync
        run: make api-docs-check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # Rolling Go module download cache. Per-job primary key (trailing token)
      # so the three parallel Go jobs never race to save the same key, with a
      # shared restore-keys prefix so they still restore each other's identical
      # module set (on subsequent runs; saves land post-job, so this warms a
      # sibling job on a LATER run, not the others running concurrently here).
      # go.sum-keyed: rolls only when dependencies change.
      - name: Cache Go module download cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-tests
          restore-keys: |
            go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-
            go-mod-${{ runner.os }}-go1.23-

      # Rolling Go build cache. SHA-keyed so every run misses its exact key and
      # saves a fresh entry; restore-keys brings the most recent prior build
      # cache forward so warmth compounds across pushes. Namespaced per job
      # because each job has a distinct build config (amd64 with the
      # integration_testdb build tag here).
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-tests-${{ runner.os }}-go1.23-${{ github.sha }}
          restore-keys: |
            go-build-tests-${{ runner.os }}-go1.23-

      # See backend-quality: pin GOCACHE so make-invoked builds (the
      # integration step calls `make test-integration-fast`) reuse the
      # ~/.cache/go-build restored by the explicit actions/cache step above
      # instead of the Makefile's workspace-local default.
      - name: Pin GOCACHE to the restored go-build cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # Disposable CI Postgres: max_connections raised from the stock 100 to
      # 200 (#424) to clear the measured ~92-conn peak with headroom for the
      # #428/#429 per-test-clone scaling; durability disabled (fsync /
      # synchronous_commit / full_page_writes off) for wall-clock since the
      # data is thrown away at job end. services: can't pass server args
      # (the -c flags below sit after the image name), so we run it explicitly.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=personal_crm_test \
            -e POSTGRES_USER=crm_user_test \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16 \
            -c max_connections=200 \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Run unit tests
        working-directory: backend
        run: go test -short ./...

      - name: Run deploy-script shell tests
        # Pure-bash mocked suites (PATH-shadow stubs for git/gh/podman/plutil/
        # crm-mac/curl/launchctl) — no DB, no podman, no network, no macOS-only
        # binary reached outside a stub — so they run on the standard Ubuntu
        # runner. Gated by the same backend path-filter (scripts/**, Makefile).
        run: make test-deploy-scripts

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Verify Postgres config applied
        env:
          # PGPASSWORD set for parity with the e2e job; harmless under the
          # trust auth this job uses. Values are the existing non-secret CI
          # test credentials already present in this workflow.
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: crm_user_test
          PGDATABASE: personal_crm_test
          PGPASSWORD: test_password
        run: |
          got=$(psql -tAc 'SHOW max_connections;')
          echo "max_connections=$got"
          test "$got" = "200" || { echo "FAIL: max_connections is $got, expected 200"; exit 1; }
          for kv in "fsync:off" "synchronous_commit:off" "full_page_writes:off"; do
            name=${kv%%:*}; want=${kv##*:}
            val=$(psql -tAc "SHOW $name;")
            echo "$name=$val"
            test "$val" = "$want" || { echo "FAIL: $name is $val, expected $want"; exit 1; }
          done

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://crm_user_test:test_password@localhost:5432/personal_crm_test?sslmode=disable
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
          GOTEST_VERBOSE: ""
        run: make test-integration-fast

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Run linter
        working-directory: frontend
        run: bun run lint

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci-build
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          export NEXT_PUBLIC_BUILD_VERSION=$(date +"%Y.%-m.%-d")
          bun run build

  mac-daemon-tests:
    name: Mac Daemon Tests
    # Pin to a specific macOS major to avoid silent runner-image
    # migration (macos-latest moves on a 1-2 month cadence and we don't
    # want spec surprises). When Apple deprecates this image we will
    # deliberately bump in a follow-up PR. As of 2026 macos-15 maps to
    # Xcode 16 / Swift 6.0 on GitHub Actions; the package targets
    # Swift 5.9 minimum so this is forward-compatible.
    runs-on: macos-15
    needs: changes
    if: ${{ needs.changes.outputs.mac_daemon == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        working-directory: mac-daemon
        run: swift package resolve

      - name: Build (release)
        working-directory: mac-daemon
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        working-directory: mac-daemon
        # NOT --parallel: tests inject per-test URLSession instances to
        # avoid global URLProtocol races, so we don't need process-level
        # isolation. Process-spawn overhead is measurable on macOS
        # runners and our suite is small.
        run: swift test

      - name: Smoke — subcommand --help
        working-directory: mac-daemon
        # Verifies the released binary's swift-argument-parser wiring.
        # Runs each subcommand's --help; asserts exit 0. Implemented as
        # a CI step rather than an XCTest target because executable
        # test-target dependencies are brittle under SPM.
        run: |
          ./.build/release/crm-mac --help
          for cmd in daemon install uninstall doctor status configure messages stop start; do
            ./.build/release/crm-mac $cmd --help
          done

      - name: Smoke — async subcommand dispatch
        working-directory: mac-daemon
        # Regression guard for the @main / AsyncParsableCommand wiring.
        # Without @main on an AsyncParsableCommand root, async
        # subcommands silently fall through to printing help with
        # exit 0. The --help smoke above can't catch this — help is
        # intercepted by ArgumentParser before dispatch.
        #
        # `doctor` is async and fails fast on clean state (no install).
        # If async dispatch is broken, it prints the help banner
        # ("OVERVIEW: …") instead of the doctor body.
        run: |
          output=$(./.build/release/crm-mac doctor 2>&1 || true)
          echo "--- doctor output ---"
          echo "$output"
          echo "--- end ---"
          if echo "$output" | grep -q "^OVERVIEW:"; then
            echo "FAIL: doctor short-circuited to help — async dispatch regression"
            exit 1
          fi

      - name: Smoke — NSContactsUsageDescription embedded in __info_plist
        working-directory: mac-daemon
        # SPM has no first-class Info.plist support for command-line
        # executables. We embed via linker -sectcreate; if the flag
        # silently drops out (Package.swift rewrite, SPM behavior
        # change, etc.) the Contacts framework has no usage description
        # and the consent prompt fails to appear on first
        # requestAccess. Catch the regression here.
        run: |
          if ! otool -s __TEXT __info_plist .build/release/crm-mac | grep -q .; then
            echo "FAIL: __TEXT,__info_plist section is empty"
            exit 1
          fi
          if ! strings .build/release/crm-mac | grep -q NSContactsUsageDescription; then
            echo "FAIL: NSContactsUsageDescription key missing from binary"
            exit 1
          fi

      - name: Smoke — bundle assembly under CLT-compatible tools
        working-directory: mac-daemon
        # Drives Scripts/assemble_bundle.sh against the release Mach-O.
        # Asserts bundle structure, plist validity, codesign identifier
        # parity on both inner Mach-O and outer bundle, and per-key
        # equality between the source-tree Info.plist and the
        # assembled bundle's Info.plist (NOT byte-identity — the
        # install-path code-path uses PropertyListSerialization which
        # may reorder keys; only key/value equality matters per the
        # plan's D22).
        run: |
          bash Scripts/assemble_bundle.sh \
            .build/release/crm-mac \
            .build/release/crm-mac.app \
            Sources/crm-mac/Info.plist
          # Bundle structure exists.
          test -f .build/release/crm-mac.app/Contents/Info.plist
          test -f .build/release/crm-mac.app/Contents/MacOS/crm-mac
          test -f .build/release/crm-mac.app/Contents/Library/LaunchAgents/xyz.spengrah.crm-mac.plist
          # Plists parse.
          plutil -lint .build/release/crm-mac.app/Contents/Info.plist
          plutil -lint .build/release/crm-mac.app/Contents/Library/LaunchAgents/xyz.spengrah.crm-mac.plist
          # Per-key value match between source-tree Info.plist and the
          # assembled bundle's Info.plist.
          for key in CFBundleIdentifier CFBundleName CFBundleExecutable CFBundleVersion CFBundleShortVersionString CFBundlePackageType CFBundleInfoDictionaryVersion LSUIElement LSMinimumSystemVersion NSContactsUsageDescription; do
            src=$(plutil -extract "$key" raw Sources/crm-mac/Info.plist)
            dst=$(plutil -extract "$key" raw .build/release/crm-mac.app/Contents/Info.plist)
            if [ "$src" != "$dst" ]; then
              echo "FAIL: Info.plist key $key differs between source ($src) and bundle ($dst)"
              exit 1
            fi
          done
          # CFBundleIdentifier in the bundle matches the daemon label.
          test "$(plutil -extract CFBundleIdentifier raw .build/release/crm-mac.app/Contents/Info.plist)" = "xyz.spengrah.crm-mac"
          # Outer bundle codesign valid.
          codesign --verify --strict --deep .build/release/crm-mac.app
          # Inner Mach-O identifier matches (D5 two-pass sign).
          codesign --display --verbose=2 .build/release/crm-mac.app/Contents/MacOS/crm-mac 2>&1 \
            | grep -qE "^Identifier=xyz\.spengrah\.crm-mac$"
          # Outer bundle identifier matches.
          codesign --display --verbose=2 .build/release/crm-mac.app 2>&1 \
            | grep -qE "^Identifier=xyz\.spengrah\.crm-mac$"

      - name: Integration tests — bundle assembly parity + atomic swap
        working-directory: mac-daemon
        # Real-Foundation integration tests gated by env var. Covers:
        #   - BundleAssemblyParityTests: shell + Swift assembly produce
        #     byte-identical bundles given the same source-tree inputs.
        #   - BundleSwapAtomicityTests: upgrade-path backup-rename-swap
        #     uses only empty/absent destinations (no ENOTEMPTY trap).
        # These tests aren't safe under the default --parallel test
        # runner because they shell out + write to a tmp dir; opt-in
        # via env var keeps them out of normal `swift test` runs.
        env:
          CRM_MAC_INTEGRATION_TESTS: "1"
        run: swift test --filter 'BundleAssemblyParityTests|BundleSwapAtomicityTests'

  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # Rolling Go module download cache. Per-job primary key (trailing token)
      # so the three parallel Go jobs never race to save the same key, with a
      # shared restore-keys prefix so they still restore each other's identical
      # module set (on subsequent runs; saves land post-job, so this warms a
      # sibling job on a LATER run, not the others running concurrently here).
      # go.sum-keyed: rolls only when dependencies change. The trailing
      # ${{ matrix.shard }} makes the two concurrent E2E shards save
      # collision-free; the shared restore-keys prefix still lets a shard
      # restore the other shard's most-recent entry (identical module set).
      - name: Cache Go module download cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-e2e-${{ matrix.shard }}
          restore-keys: |
            go-mod-${{ runner.os }}-go1.23-${{ hashFiles('backend/go.sum') }}-
            go-mod-${{ runner.os }}-go1.23-

      # Rolling Go build cache. SHA-keyed so every run misses its exact key and
      # saves a fresh entry; restore-keys brings the most recent prior build
      # cache forward so warmth compounds across pushes. Namespaced per job
      # because each job has a distinct build config (plain amd64 `go run` here).
      # The trailing ${{ matrix.shard }} makes the two concurrent E2E shards
      # save collision-free (same SHA otherwise collides); the shared
      # restore-keys prefix lets a shard restore the other shard's most-recent
      # entry (the backend binary is identical across shards, so the cross-shard
      # restore is content-addressed-safe and genuinely warm).
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-${{ runner.os }}-go1.23-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: |
            go-build-e2e-${{ runner.os }}-go1.23-

      # The Playwright webServer launches the backend via `go run`; pin GOCACHE
      # to the ~/.cache/go-build restored by the explicit actions/cache step
      # above for consistency with the backend jobs (and to cover any future
      # make-driven build added here). setup-go's built-in cache is disabled
      # via `cache: false`.
      - name: Pin GOCACHE to the restored go-build cache
        run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # Disposable CI Postgres: max_connections raised from the stock 100 to
      # 200 (#424) to clear the measured ~92-conn peak with headroom for the
      # #428/#429 per-test-clone scaling; durability disabled (fsync /
      # synchronous_commit / full_page_writes off) for wall-clock since the
      # data is thrown away at job end. services: can't pass server args
      # (the -c flags below sit after the image name), so we run it explicitly.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_DB=personal_crm \
            -e POSTGRES_USER=crm_user \
            -e POSTGRES_PASSWORD=crm_password \
            -p 5432:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16 \
            -c max_connections=200 \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      # Rolling Next.js webpack build cache (`frontend/.next/cache`, tens of MB).
      # SHA-keyed so every run misses its exact key and saves a fresh entry;
      # restore-keys brings the most recent prior cache forward so an
      # incremental `next build` compounds warmth across pushes. bun.lock-pinned
      # prefix rolls on a deps change; the looser runner.os fallback still
      # restores something warm-ish on a deps bump. The trailing
      # ${{ matrix.shard }} makes the two concurrent shards save collision-free;
      # the shared restore-keys prefix omits the shard suffix so a shard
      # restores the most-recent entry from EITHER shard (both build the
      # identical app, so the webpack cache is content-addressed-safe to share).
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}-${{ matrix.shard }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-
            next-build-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: bunx playwright install chromium --with-deps

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Verify Postgres config applied
        env:
          # PGPASSWORD covers the e2e password-auth path; harmless for the
          # backend-tests trust path. Values are the existing non-secret CI
          # test credentials already present in this workflow.
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: crm_user
          PGDATABASE: personal_crm
          PGPASSWORD: crm_password
        run: |
          got=$(psql -tAc 'SHOW max_connections;')
          echo "max_connections=$got"
          test "$got" = "200" || { echo "FAIL: max_connections is $got, expected 200"; exit 1; }
          for kv in "fsync:off" "synchronous_commit:off" "full_page_writes:off"; do
            name=${kv%%:*}; want=${kv##*:}
            val=$(psql -tAc "SHOW $name;")
            echo "$name=$val"
            test "$val" = "$want" || { echo "FAIL: $name is $val, expected $want"; exit 1; }
          done

      # Build the frontend as a production standalone artifact ahead of the
      # timed test run, so Playwright's webServer just boots `server.js` instead
      # of paying next dev's on-demand route compilation during the suite. Kept
      # as its own visible step (not folded into the webServer command) so the
      # build duration is measurable in the step timings. The standalone server
      # bundles neither `.next/static` nor `public`, so we copy both alongside
      # `server.js`, mirroring infra/images/frontend.Dockerfile. NEXT_PUBLIC_* are inlined at
      # build time, so the values the suite needs are set HERE. We deliberately
      # OMIT NEXT_PUBLIC_BUILD_VERSION/COMMIT_HASH/GITHUB_REPO: the settings spec
      # asserts the Version field reads "Personal CRM (dev)", which only holds
      # when NEXT_PUBLIC_BUILD_VERSION is unset.
      - name: Build frontend (prod)
        working-directory: frontend
        env:
          CI: true
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          bun run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          DATABASE_URL: postgres://crm_user:crm_password@localhost:5432/personal_crm?sslmode=disable
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:8080
          MIGRATIONS_PATH: migrations
          NODE_ENV: test
          GIN_MODE: test
          CORS_ALLOW_ALL: true
          FRONTEND_URL: http://localhost:3000
          CRM_ENV: testing
          ENABLE_EXTERNAL_SYNC: true
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  # Stable required-check surface over the E2E shard matrix. The matrix legs
  # report as "E2E Tests (shard 1)" / "E2E Tests (shard 2)"; this aggregator
  # owns the bare "E2E Tests" name so any branch-protection rule pinning it
  # stays satisfied with no admin change. needs:[e2e-tests] collapses the
  # matrix into one result that is success only if every leg passed; always()
  # lets it run and fail loudly when a shard failed (instead of being skipped).
  # The changes guard mirrors the matrix trigger so the aggregator is SKIPPED
  # (treated as satisfied by branch protection) on a docs-only PR.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, e2e-tests]
    if: ${{ always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    steps:
      - name: Assert all E2E shards passed
        env:
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          echo "e2e-tests matrix result: $E2E_RESULT"
          test "$E2E_RESULT" = "success" || { echo "FAIL: one or more E2E shards did not pass"; exit 1; }
