name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect which paths changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mac_daemon: ${{ steps.filter.outputs.mac_daemon }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ./path-filters.yml
      - name: Check path-filters parity
        run: bash scripts/ci/path-filters-parity-guard.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personal_crm_test
          POSTGRES_USER: crm_user_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

      - name: Check cadence sole-writer invariant
        run: ./scripts/check-cadence-sole-writer.sh

      - name: Check follow-up sole-writer invariant
        run: ./scripts/ci/followup-sole-writer-guard.sh

      - name: Check rematch sole-dispatcher invariant
        run: ./scripts/ci/rematch-sole-dispatcher-guard.sh

      - name: Check CRM-marker construction invariant
        run: ./scripts/ci/crm-marker-construction-guard.sh

      - name: Check sqlc SELECT-list duplication invariant
        run: ./scripts/ci/sqlc-select-list-guard.sh

      - name: Check ingest-registry descriptor invariant
        run: ./scripts/check-ingest-registry.sh

      - name: Run unit tests
        working-directory: backend
        run: go test -short -v ./...

      - name: Cross-compile for ARM64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o bin/crm-api-arm64 cmd/crm-api/main.go

      - name: Cross-compile crm-admin for ARM64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        # crm-admin is built only at deploy time (scripts/deploy.sh), so a
        # compile error in its single-file main.go (e.g. a new --seed subcommand
        # type not defined there) would otherwise ship uncaught. This guards it.
        run: go build -o bin/crm-admin-arm64 cmd/crm-admin/main.go

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://crm_user_test:test_password@localhost:5432/personal_crm_test?sslmode=disable
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
        run: make test-integration-fast

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Run linter (non-blocking)
        working-directory: frontend
        run: bun run lint || echo "Linting issues found - will be fixed in follow-up PR"

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci-build
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          export NEXT_PUBLIC_BUILD_VERSION=$(date +"%Y.%-m.%-d")
          bun run build

  mac-daemon-tests:
    name: Mac Daemon Tests
    # Pin to a specific macOS major to avoid silent runner-image
    # migration (macos-latest moves on a 1-2 month cadence and we don't
    # want spec surprises). When Apple deprecates this image we will
    # deliberately bump in a follow-up PR. As of 2026 macos-15 maps to
    # Xcode 16 / Swift 6.0 on GitHub Actions; the package targets
    # Swift 5.9 minimum so this is forward-compatible.
    runs-on: macos-15
    needs: changes
    if: ${{ needs.changes.outputs.mac_daemon == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        working-directory: mac-daemon
        run: swift package resolve

      - name: Build (release)
        working-directory: mac-daemon
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        working-directory: mac-daemon
        # NOT --parallel: tests inject per-test URLSession instances to
        # avoid global URLProtocol races, so we don't need process-level
        # isolation. Process-spawn overhead is measurable on macOS
        # runners and our suite is small.
        run: swift test

      - name: Smoke — subcommand --help
        working-directory: mac-daemon
        # Verifies the released binary's swift-argument-parser wiring.
        # Runs each subcommand's --help; asserts exit 0. Implemented as
        # a CI step rather than an XCTest target because executable
        # test-target dependencies are brittle under SPM.
        run: |
          ./.build/release/crm-mac --help
          for cmd in daemon install uninstall doctor status configure messages stop start; do
            ./.build/release/crm-mac $cmd --help
          done

      - name: Smoke — async subcommand dispatch
        working-directory: mac-daemon
        # Regression guard for the @main / AsyncParsableCommand wiring.
        # Without @main on an AsyncParsableCommand root, async
        # subcommands silently fall through to printing help with
        # exit 0. The --help smoke above can't catch this — help is
        # intercepted by ArgumentParser before dispatch.
        #
        # `doctor` is async and fails fast on clean state (no install).
        # If async dispatch is broken, it prints the help banner
        # ("OVERVIEW: …") instead of the doctor body.
        run: |
          output=$(./.build/release/crm-mac doctor 2>&1 || true)
          echo "--- doctor output ---"
          echo "$output"
          echo "--- end ---"
          if echo "$output" | grep -q "^OVERVIEW:"; then
            echo "FAIL: doctor short-circuited to help — async dispatch regression"
            exit 1
          fi

      - name: Smoke — NSContactsUsageDescription embedded in __info_plist
        working-directory: mac-daemon
        # SPM has no first-class Info.plist support for command-line
        # executables. We embed via linker -sectcreate; if the flag
        # silently drops out (Package.swift rewrite, SPM behavior
        # change, etc.) the Contacts framework has no usage description
        # and the consent prompt fails to appear on first
        # requestAccess. Catch the regression here.
        run: |
          if ! otool -s __TEXT __info_plist .build/release/crm-mac | grep -q .; then
            echo "FAIL: __TEXT,__info_plist section is empty"
            exit 1
          fi
          if ! strings .build/release/crm-mac | grep -q NSContactsUsageDescription; then
            echo "FAIL: NSContactsUsageDescription key missing from binary"
            exit 1
          fi

      - name: Smoke — bundle assembly under CLT-compatible tools
        working-directory: mac-daemon
        # Drives Scripts/assemble_bundle.sh against the release Mach-O.
        # Asserts bundle structure, plist validity, codesign identifier
        # parity on both inner Mach-O and outer bundle, and per-key
        # equality between the source-tree Info.plist and the
        # assembled bundle's Info.plist (NOT byte-identity — the
        # install-path code-path uses PropertyListSerialization which
        # may reorder keys; only key/value equality matters per the
        # plan's D22).
        run: |
          bash Scripts/assemble_bundle.sh \
            .build/release/crm-mac \
            .build/release/crm-mac.app \
            Sources/crm-mac/Info.plist
          # Bundle structure exists.
          test -f .build/release/crm-mac.app/Contents/Info.plist
          test -f .build/release/crm-mac.app/Contents/MacOS/crm-mac
          test -f .build/release/crm-mac.app/Contents/Library/LaunchAgents/xyz.spengrah.crm-mac.plist
          # Plists parse.
          plutil -lint .build/release/crm-mac.app/Contents/Info.plist
          plutil -lint .build/release/crm-mac.app/Contents/Library/LaunchAgents/xyz.spengrah.crm-mac.plist
          # Per-key value match between source-tree Info.plist and the
          # assembled bundle's Info.plist.
          for key in CFBundleIdentifier CFBundleName CFBundleExecutable CFBundleVersion CFBundleShortVersionString CFBundlePackageType CFBundleInfoDictionaryVersion LSUIElement LSMinimumSystemVersion NSContactsUsageDescription; do
            src=$(plutil -extract "$key" raw Sources/crm-mac/Info.plist)
            dst=$(plutil -extract "$key" raw .build/release/crm-mac.app/Contents/Info.plist)
            if [ "$src" != "$dst" ]; then
              echo "FAIL: Info.plist key $key differs between source ($src) and bundle ($dst)"
              exit 1
            fi
          done
          # CFBundleIdentifier in the bundle matches the daemon label.
          test "$(plutil -extract CFBundleIdentifier raw .build/release/crm-mac.app/Contents/Info.plist)" = "xyz.spengrah.crm-mac"
          # Outer bundle codesign valid.
          codesign --verify --strict --deep .build/release/crm-mac.app
          # Inner Mach-O identifier matches (D5 two-pass sign).
          codesign --display --verbose=2 .build/release/crm-mac.app/Contents/MacOS/crm-mac 2>&1 \
            | grep -qE "^Identifier=xyz\.spengrah\.crm-mac$"
          # Outer bundle identifier matches.
          codesign --display --verbose=2 .build/release/crm-mac.app 2>&1 \
            | grep -qE "^Identifier=xyz\.spengrah\.crm-mac$"

      - name: Integration tests — bundle assembly parity + atomic swap
        working-directory: mac-daemon
        # Real-Foundation integration tests gated by env var. Covers:
        #   - BundleAssemblyParityTests: shell + Swift assembly produce
        #     byte-identical bundles given the same source-tree inputs.
        #   - BundleSwapAtomicityTests: upgrade-path backup-rename-swap
        #     uses only empty/absent destinations (no ENOTEMPTY trap).
        # These tests aren't safe under the default --parallel test
        # runner because they shell out + write to a tmp dir; opt-in
        # via env var keeps them out of normal `swift test` runs.
        env:
          CRM_MAC_INTEGRATION_TESTS: "1"
        run: swift test --filter 'BundleAssemblyParityTests|BundleSwapAtomicityTests'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personal_crm
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install chromium --with-deps

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 4
          DATABASE_URL: postgres://crm_user:crm_password@localhost:5432/personal_crm?sslmode=disable
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:8080
          MIGRATIONS_PATH: migrations
          NODE_ENV: test
          GIN_MODE: test
          CORS_ALLOW_ALL: true
          FRONTEND_URL: http://localhost:3000
          CRM_ENV: testing
          ENABLE_EXTERNAL_SYNC: true
        run: bunx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
