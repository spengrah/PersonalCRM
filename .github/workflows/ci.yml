name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect which paths changed to conditionally run jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/**'
              - 'go.mod'
            frontend:
              - 'frontend/**'

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personal_crm_test
          POSTGRES_USER: crm_user_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

      - name: Run unit tests
        working-directory: backend
        run: go test -short -v ./...

      - name: Cross-compile for ARM64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o bin/crm-api-arm64 cmd/crm-api/main.go

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://crm_user_test:test_password@localhost:5432/personal_crm_test?sslmode=disable
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
        run: go test -v ./tests/...

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        working-directory: frontend
        run: bun install

      - name: Run linter (non-blocking)
        working-directory: frontend
        run: bun run lint || echo "Linting issues found - will be fixed in follow-up PR"

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci-build
        run: bun run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: personal_crm
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install chromium --with-deps

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: true
          DATABASE_URL: postgres://crm_user:crm_password@localhost:5432/personal_crm?sslmode=disable
          SESSION_SECRET: test-session-secret-for-ci
          API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_KEY: test-api-key-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:8080
          MIGRATIONS_PATH: migrations
          NODE_ENV: test
          GIN_MODE: test
          CORS_ALLOW_ALL: true
          FRONTEND_URL: http://localhost:3000
          CRM_ENV: testing
          ENABLE_EXTERNAL_SYNC: true
        run: bunx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  claude-review:
    name: Claude Code Review
    needs: [changes, backend-tests, frontend-tests, e2e-tests]
    # Run on PRs when tests pass/skip, but skip if ALL tests were skipped (docs/workflow-only changes)
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.backend-tests.result == 'success' || needs.frontend-tests.result == 'success' || needs.e2e-tests.result == 'success')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## Full Review

            CI tests have passed. Please conduct a comprehensive code review of this pull request.

            Use `gh pr diff ${{ github.event.pull_request.number }}` to see the changes.

            IMPORTANT: First check for previous review comments using `gh pr view ${{ github.event.pull_request.number }} --comments`. If you previously left a review, reference it in your new comment.

            ## Review Standards

            Follow the strict code review standards in @.ai/reviewers.md

            ## How to Submit Review

            After reviewing per @.ai/reviewers.md, submit exactly ONE GitHub review:

            ```bash
            # If ALL criteria pass:
            gh pr review ${{ github.event.pull_request.number }} --approve -b "Your review here"

            # If ANY issues found (default):
            gh pr review ${{ github.event.pull_request.number }} --request-changes -b "Your review here"
            ```

            CRITICAL: Submit ONE review only. Do not use gh api for inline comments - include file paths and line numbers in the review body.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*)"'

      - name: Check Claude review result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.sha }}"

          # Get Claude's review for this specific commit
          REVIEW=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$COMMIT_SHA\")] | last")

          if [[ -z "$REVIEW" || "$REVIEW" == "null" ]]; then
            echo "No Claude review found for commit $COMMIT_SHA - passing (fail-open)"
            exit 0
          fi

          STATE=$(echo "$REVIEW" | jq -r '.state')
          BODY=$(echo "$REVIEW" | jq -r '.body')

          echo "Review state: $STATE"
          echo "Review commit: $COMMIT_SHA"

          # Fail if CHANGES_REQUESTED or RESULT=FAIL
          if [[ "$STATE" == "CHANGES_REQUESTED" ]]; then
            echo "Claude requested changes - failing workflow"
            exit 1
          fi

          if echo "$BODY" | grep -qi "RESULT=FAIL"; then
            echo "Claude indicated RESULT=FAIL - failing workflow"
            exit 1
          fi

          echo "Claude review passed"
