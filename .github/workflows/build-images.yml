name: Build & Push Images

# Builds the A0 arm64 container images and pushes them to GHCR. A's deploy job
# consumes these (podman pull + Quadlet tag swap). The Dockerfiles are COPY-only
# (no in-image build), so cross-compiling the binaries here means buildx assembles
# the arm64 image without QEMU emulation.
#
# First run creates the packages PRIVATE; flip both to PUBLIC once in the repo's
# package settings (public packages, no host pull credential).
#
# This job builds on every push to develop, independent of CI results, and
# publishes both :<sha> (immutable, the promote/rollback handle) and :latest
# (convenience). EVERY develop SHA must produce a :<sha> image so any commit is
# promotable to main and deployable (no paths filter — a scripts/docs-only push
# must still build, or its SHA would 404 on pull at promotion time). The green-CI
# deploy gate + SHA-pinned promotion is the deploy job (umbrella security model).
#
# The name model image is the exception to "one image per SHA": its tag is
# name-model/image-tag.sh's, a function of name-model/ alone, so it is built and
# pushed only when the registry lacks that tag, i.e. when the model's sources
# changed. Every backend :<sha> image carries the tag its revision names as the
# label org.personalcrm.name-model.tag, which deploy-artifact.sh reads; the
# backend image is pushed only after the model image it names exists.
# The first push creates personalcrm-name-model PRIVATE too; flip it to PUBLIC.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/${{ github.repository_owner }}

jobs:
  name-model-image:
    name: Build & Push name model image (when its sources changed)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the name model image tag
        id: tag
        run: |
          tag="$(name-model/image-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name model image tag: $tag"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the registry has this tag
        id: exists
        env:
          IMAGE: ${{ env.IMAGE_NS }}/personalcrm-name-model:${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE exists; the model's sources are unchanged, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is not in the registry; building it."
          fi

      # torch and GLiNER install from arm64 wheels and the image fetches and
      # test-loads the weights, so this build runs under QEMU emulation, unlike
      # the COPY-only backend and frontend images. It runs only when the
      # model's sources change.
      - name: Set up QEMU
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push name model image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: name-model
          file: name-model/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NS }}/personalcrm-name-model:${{ steps.tag.outputs.tag }}

  build-images:
    name: Build & Push arm64 images
    runs-on: ubuntu-latest
    needs: name-model-image
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Cross-compile backend binaries (static arm64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STAMP="-X personal-crm/backend/internal/health.Version=${GITHUB_SHA::7} -X personal-crm/backend/internal/health.GitCommit=${GITHUB_SHA} -X personal-crm/backend/internal/health.BuildTime=${BUILD_TIME}"
          go build -trimpath -ldflags="-s -w ${STAMP}" -o bin/crm-api-arm64 ./cmd/crm-api
          go build -trimpath -ldflags="-s -w ${STAMP}" -o bin/crm-admin-arm64 ./cmd/crm-admin
          grep -a -q "${GITHUB_SHA}" bin/crm-api-arm64 || { echo "build stamp missing from crm-api binary" >&2; exit 1; }

      - name: Build frontend standalone (key-less, same-origin)
        working-directory: frontend
        env:
          # Public image bakes NO secret; X-API-Key is injected at the Caddy edge.
          NEXT_PUBLIC_API_KEY: ''
          NEXT_PUBLIC_API_URL: ''
          NEXT_TELEMETRY_DISABLED: '1'
          # Version stamp, mirroring the backend ldflags stamp above so Settings →
          # System Information shows the build date + commit instead of "(dev)".
          # NEXT_PUBLIC_* are inlined at build time, so they must be set HERE.
          # Full 40-char SHA: the UI validates /^[0-9a-f]{40}$/ before linking it.
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: |
          export NEXT_PUBLIC_BUILD_VERSION=$(date -u +"%Y.%-m.%-d")
          bun install --frozen-lockfile
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/backend.Dockerfile
          platforms: linux/arm64
          push: true
          # The name model image this revision names (deploy-artifact.sh).
          labels: org.personalcrm.name-model.tag=${{ needs.name-model-image.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NS }}/personalcrm-backend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/personalcrm-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NS }}/personalcrm-frontend:${{ github.sha }}
            ${{ env.IMAGE_NS }}/personalcrm-frontend:latest
