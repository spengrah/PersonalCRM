name: Deploy to Staging

# develop -> staging deploy. Unlike deploy-prod.yml (push: main, deploying an
# already-CI'd SHA), staging deploys a develop SHA that is still being CI'd and
# image-built, so the trigger is `on: workflow_run` keyed to CI + image-build
# COMPLETION on develop — NOT `push: develop` (which would fire before either
# upstream starts). workflow_run fires once per named-workflow completion; the
# gate re-evaluates BOTH upstreams for the SHA and only deploys when both are
# completed+success. The common case (the other upstream still in-flight) defers
# quietly (green, no deploy); the last upstream to finish re-triggers and deploys.
#
# Two jobs so `environment: staging` attaches only to a real staging mutation (a
# code deploy or a manual reseed) — never to a green-skip: a single job carrying
# the environment that green-skips would record a phantom "successful staging
# deployment" for a SHA that was never deployed. The gate runs on ubuntu-latest
# (jq+curl preinstalled); only the deploy job touches the box.
#
# workflow_run always runs this file + context from the default branch (develop)
# and never fork code; the repo is private + solo, so no pull_request trigger.
#
# A second trigger, `workflow_dispatch` (force_reseed), is a manual, reseed-only
# path: no code deploy, no CI/build gate. It reseeds against the image already live
# on the host (deploy/checkout/decision steps are skipped) and still honors the
# oauth guard in the reseed wrapper. It is develop-ref-only (gate if: below), and
# an unchecked force_reseed box is a true no-op (deploy job never starts).

on:
  workflow_run:
    workflows: ["CI", "Build & Push Images"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_reseed:
        description: "Force a staging reseed regardless of path changes (still skipped if a sync account is connected — oauth_credential non-empty). No code is deployed; reseeds against the currently-deployed image."
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Job filter is BRANCH-ONLY — it must never gate on the upstream conclusion. A
    # success-only prefilter would skip this job when the TRIGGERING upstream
    # failed, so a late-failing upstream would produce no red signal. All
    # conclusion handling lives in the gate step's three-way logic below.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || github.event.workflow_run.head_branch == 'develop'
    permissions:
      actions: read     # query ci.yml / build-images.yml run conclusions
      contents: read    # read the current develop tip (stale-SHA guard)
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      deploy_ready: ${{ steps.gate.outputs.deploy_ready }}
    steps:
      - name: Gate on CI + image build for this SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual reseed: no code deploy, no CI/build gate needed (the reseed runs
            # against the image already live on the host). The job-level if: already
            # restricted this to the develop ref. deploy_ready follows force_reseed:
            # an unchecked box does NOTHING (the deploy job never runs, so no Environment
            # deployment is recorded). A checked box runs the deploy job for its reseed
            # step only (deploy/checkout/decision steps are skipped on this event).
            echo "sha=" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.force_reseed }}" = "true" ]; then
              echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "force_reseed=false; nothing to do (no deploy, no reseed)."
              echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          # Deploy ONLY the current develop tip. A stale SHA — an older push whose
          # upstreams finish AFTER a newer push already deployed — must never roll
          # staging back to older code/schema (its image would swap in behind the
          # already-applied newer migrations). If head_sha is no longer the develop
          # tip, green-skip; the newer push's trigger deploys the newer SHA.
          tip_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/develop"
          tip_sha=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$tip_api" | jq -r '.sha // "missing"')
          if [ "$tip_sha" != "$SHA" ]; then
            echo "SHA ${SHA} is no longer the develop tip (${tip_sha}); skipping (a newer push deploys)."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Query each upstream's latest run for the SHA WITHOUT a status filter.
          # Staging's first trigger usually fires while the OTHER upstream is still
          # running, so a deploy-prod-style completed-only REST filter -> exit 1
          # gate would turn that NORMAL "not ready yet" state into a spurious red.
          #
          # CI: ci.yml runs on BOTH push and pull_request, so the same SHA can
          # have a completed pull_request run AND an in-flight develop-push run
          # (whenever develop's tip equals a PR head SHA). event=push&branch=develop
          # picks the authoritative develop-push run — without it the gate could
          # green-light off the earlier PR run while develop-push CI still runs.
          ci_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=develop&per_page=1"
          ci_json=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ci_api")
          ci_status=$(printf '%s' "$ci_json" | jq -r '.workflow_runs[0].status // "missing"')
          ci_conclusion=$(printf '%s' "$ci_json" | jq -r '.workflow_runs[0].conclusion // "missing"')

          # build-images: never runs on pull_request; no event filter (event=push
          # would wrongly exclude a workflow_dispatch rebuild).
          bi_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs?head_sha=${SHA}&per_page=1"
          bi_json=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$bi_api")
          bi_status=$(printf '%s' "$bi_json" | jq -r '.workflow_runs[0].status // "missing"')
          bi_conclusion=$(printf '%s' "$bi_json" | jq -r '.workflow_runs[0].conclusion // "missing"')

          echo "CI: status=${ci_status} conclusion=${ci_conclusion}; image-build: status=${bi_status} conclusion=${bi_conclusion} (sha ${SHA})"

          # Decision precedence — COMPLETENESS FIRST, then success (eventual-red,
          # never skip-forever). (1) If either run is missing or not yet completed,
          # defer: end GREEN with deploy_ready=false (a later trigger re-evaluates).
          if [ "$ci_status" != "completed" ] || [ "$bi_status" != "completed" ]; then
            echo "An upstream is not completed yet; deferring (no deploy)."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # (2) Both completed: deploy only if BOTH succeeded; any non-success is a
          # genuine red. Because every run always reaches completed, a failed
          # upstream is caught as soon as the other completes.
          if [ "$ci_conclusion" = "success" ] && [ "$bi_conclusion" = "success" ]; then
            echo "Both upstreams succeeded; proceeding to deploy."
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "An upstream did not succeed (CI=${ci_conclusion}, image-build=${bi_conclusion}); aborting."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy_ready == 'true'
    runs-on: [self-hosted, staging]
    environment: staging
    concurrency:
      group: deploy-staging        # serialize deploys; never overlap
      cancel-in-progress: false    # never cancel a deploy mid-migrate/rollback
    permissions:
      contents: read
    # Auto-reseed staging when (and only when) the seed surface changed, all as
    # ordered steps in THIS single serialized job (no separate decision job -> no
    # cross-job needs: coupling that could block the deploy). Step ORDER is
    # load-bearing and locked by a grep-guard line-number assertion in
    # scripts/deploy-staging.test.sh:
    #   capture (host-pinned base, BEFORE the swap) -> deploy -> checkout
    #   (post-deploy, continue-on-error) -> decide -> reseed -> breadcrumb/nudges.
    # The deploy depends ONLY on gate.outputs.sha + the host: capture + deploy run
    # BEFORE any checkout, so a checkout/decision flake can cost only the reseed
    # (degrades to no-reseed + a nudge), NEVER the already-completed deploy. Tenant
    # identity + reseed flags are pinned in the root-owned /usr/local/sbin wrappers
    # (sudo resets the env; nothing is passed from here). The diff base is the live
    # backend unit's pinned 40-hex Image= git sha; a failed/skipped reseed advances
    # it, so the next deploy does NOT auto-retry — recover with `make staging-reset`
    # (the on-host escape hatch) or the GitHub Actions UI `workflow_dispatch`
    # (force_reseed), the from-UI on-demand reseed. On a workflow_dispatch the
    # deploy/checkout/decision steps below are skipped (reseed-only, no code deploy).
    steps:
      - name: Capture live staging SHA (host-pinned reseed base, before the swap)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          prev_sha=$(sudo /usr/local/sbin/staging-deployed-sha.sh || true)
          echo "prev_sha=${prev_sha}" >> "$GITHUB_ENV"

      - name: Deploy
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: sudo /usr/local/sbin/deploy-staging.sh "${{ needs.gate.outputs.sha }}"

      - name: Checkout (post-deploy; for the reseed decision only)
        id: checkout
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - name: Decide reseed (seed/migration diff vs the live base)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          # Fail-closed on a non-success checkout, NOT merely a missing script: a
          # failed continue-on-error checkout on a persistent self-hosted runner can
          # leave a STALE older checkout in the workspace (the script + path-filters.yml
          # are still present, just stale), so script-existence alone would decide from
          # stale contents. Only a CLEAN checkout (outcome == success) AND the script
          # present runs the real decision; anything else degrades to no-reseed
          # (persistence wins on any uncertainty after the already-completed deploy).
          if [ "$CHECKOUT_OUTCOME" = "success" ] && [ -x scripts/ci/staging-reseed-decision.sh ]; then
            scripts/ci/staging-reseed-decision.sh "$prev_sha" "${{ needs.gate.outputs.sha }}"
          else
            echo "reseed-decision: checkout outcome='$CHECKOUT_OUTCOME' or script missing; defaulting to no-reseed (fail-closed)" >&2
            { echo "seed_changed=false"; echo "migrations_changed=false"; echo "base_known=false"; } >> "$GITHUB_ENV"
          fi

      - name: Auto-reseed staging (seed surface changed)
        if: ${{ env.seed_changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_reseed == 'true') }}
        run: |
          sudo /usr/local/sbin/staging-reseed.sh 2>&1 | tee "$RUNNER_TEMP/reseed.out"
          exit "${PIPESTATUS[0]}"

      - name: Note OAuth-skip (sync account connected -> reseed skipped)
        if: ${{ always() && (env.seed_changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_reseed == 'true')) }}
        run: |
          if [ -f "$RUNNER_TEMP/reseed.out" ] && grep -q 'skipping auto-reseed' "$RUNNER_TEMP/reseed.out"; then
            {
              echo "### Staging auto-reseed SKIPPED (sync account connected)"
              echo ""
              echo "A sync account is connected to staging (\`oauth_credential\` non-empty), so the auto-reseed was skipped and staging kept its existing seed. The live seed may now be stale — disconnect the account and run \`make staging-reset\` to refresh."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nudge — migrations changed, seed did not
        if: ${{ env.migrations_changed == 'true' && env.seed_changed != 'true' }}
        run: |
          {
            echo "### Staging: schema changed, seed code did not"
            echo ""
            echo "Migrations changed but the seed surface (\`backend/internal/synthetic/**\`) did not, so staging kept its accumulated world (migrations transform it in place; an auto-wipe would rob us of the migration canary). Run \`make staging-reset\` to exercise the new model with a fresh \`standard\` seed world."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nudge — reseed base unknown (no auto-reseed attempted)
        if: ${{ env.base_known == 'false' }}
        run: |
          {
            echo "### Staging: reseed base could not be determined"
            echo ""
            echo "The live staging image was not pinned to a 40-hex git sha (first deploy / digest pin / unreadable), so the seed-change diff base was unknown and NO auto-reseed was attempted. If the seed surface changed, run \`make staging-reset\` manually."
          } >> "$GITHUB_STEP_SUMMARY"
